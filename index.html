<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ardatir</title>
    <meta name="description" content="A watch over Arda: an isometric, animated journey through the events of Tolkien's world. A non-commercial fan project." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <aside id="sidebar" class="sidebar"></aside>
    <div id="scrim" class="scrim"></div>

    <div id="viewport"></div>
    <div id="flash"></div>
    <!-- Pages shown instead of the stage: an event read as text (main.ts) -->
    <main id="page" class="page"></main>

    <div class="stage-top">
      <button id="menu" class="menu-btn" type="button"></button>
      <nav id="crumbs" class="crumbs"></nav>
      <div id="zoom" class="zoom" role="group">
        <button type="button" data-zoom="cosmos"></button>
        <button type="button" data-zoom="world" aria-disabled="true"></button>
        <button type="button" data-zoom="event"></button>
      </div>
    </div>

    <section id="event-panel" class="panel">
      <button type="button" id="event-fold" class="card-fold" aria-expanded="true"></button>
      <h1 id="event-title"></h1>
      <p id="event-say" class="event-say" hidden></p>
      <p id="event-date" class="muted"></p>
      <p id="event-sides" class="event-sides" hidden></p>
      <p id="event-summary"></p>
    </section>

    <section id="selection-panel" class="panel" hidden>
      <h2 id="sel-title"></h2>
      <p id="sel-say" class="sel-say" hidden></p>
      <p id="sel-subtitle" class="muted"></p>
      <p id="sel-body"></p>
      <blockquote id="sel-thought"></blockquote>
      <a id="sel-life" class="sel-link" hidden></a>
    </section>

    <div id="caption" class="caption"></div>

    <section id="meanwhile-panel" class="panel meanwhile" hidden></section>
    <!-- About this scene: who, where, before and after, the books (learn.ts) -->
    <section id="learn-panel" class="panel meanwhile learn" hidden></section>

    <footer class="timeline">
      <button id="prev" class="icon-btn" type="button"></button>
      <button id="play" class="play-btn" type="button"></button>
      <button id="next" class="icon-btn" type="button"></button>
      <div class="track">
        <input id="scrubber" type="range" min="0" max="1000" value="0" step="1" />
        <div id="beats" class="beats"></div>
      </div>
      <span id="time-label" class="time"></span>
      <button id="learn" class="text-btn" type="button" aria-expanded="false" aria-controls="learn-panel"></button>
      <button id="meanwhile" class="text-btn" type="button" aria-expanded="false"></button>
      <button id="audio-lang" class="text-btn audio-lang" type="button" hidden></button>
      <button id="mute" class="icon-btn" type="button" hidden></button>
    </footer>

    <p id="disclaimer" class="disclaimer"></p>

    <!-- The opening: a first visit's welcome over the cosmos, or #/start (opening.ts) -->
    <div id="opening" class="opening" role="dialog" aria-modal="true" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
