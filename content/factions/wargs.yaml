id: wargs
name: { en: The Wargs, es: Los wargos }
color: "#7a726b"
kind: wolf
summary:
  en: The great wolves beyond the Misty Mountains, allies of the goblins, who run with their hosts and carry some of them as riders.
  es: Los grandes lobos del otro lado de las Montañas Nubladas, aliados de los trasgos, que corren con sus huestes y llevan a algunos como jinetes.
