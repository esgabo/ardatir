id: cerin-amroth
name: { en: "Cerin Amroth", es: "Cerin Amroth" }
summary:
  en: "The green mound at the heart of Lothlórien, crowned with white niphredil and golden elanor, where Aragorn and Arwen gave each other their troth."
  es: "El túmulo verde en el corazón de Lothlórien, coronado de niphredil blanca y elanor dorada, donde Aragorn y Arwen se dieron palabra."
pronounce: { en: KER-in AM-roth, es: KE-rin AM-rot }
