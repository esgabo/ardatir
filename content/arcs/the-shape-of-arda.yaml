id: the-shape-of-arda
title: { en: "The Shape of Arda", es: "La forma de Arda" }
summary:
  en: "The world seen from beyond its shells: how it was sung, lit, broken and remade, from the Music to the Change of the World."
  es: "El mundo visto desde fuera de sus capas: cómo fue cantado, iluminado, quebrado y rehecho, desde la Música hasta el Cambio del Mundo."
