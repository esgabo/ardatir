id: the-siege-of-angband
title: { en: "The Siege of Angband", es: "El Sitio de Angband" }
summary:
  en: "Four centuries in which the Elves and Edain held Morgoth within his fortress, until the Battle of Sudden Flame broke the siege."
  es: "Cuatro siglos en que Elfos y Edain mantuvieron a Morgoth encerrado en su fortaleza, hasta que la Batalla de la Llama Súbita rompió el cerco."
