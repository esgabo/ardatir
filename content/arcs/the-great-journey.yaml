id: the-great-journey
title: { en: "The Great Journey", es: "La Gran Marcha" }
summary:
  en: "The Elves wake at Cuiviénen, are found by Oromë, and some set out west toward the light of Valinor."
  es: "Los Elfos despiertan en Cuiviénen, Oromë los encuentra y algunos parten hacia el oeste, tras la luz de Valinor."
