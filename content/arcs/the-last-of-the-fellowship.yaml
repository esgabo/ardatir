id: the-last-of-the-fellowship
title: { en: "The Last of the Fellowship", es: "Los últimos de la Compañía" }
summary:
  en: "How the nine walkers and those who loved them left Middle-earth, one by one, until the memory of the Elder Days went with them."
  es: "Cómo los nueve caminantes y quienes los amaron dejaron la Tierra Media, uno a uno, hasta que con ellos se fue la memoria de los Días Antiguos."
