id: the-age-of-men
title: { en: "The Age of Men", es: "La Edad de los Hombres" }
summary:
  en: "The Shire and the Reunited Kingdom in the long peace after the Ring: a free country, a king who keeps his word, and children growing up who never saw a Nazgûl."
  es: "La Comarca y el Reino Reunificado en la larga paz tras el Anillo: un país libre, un rey que cumple su palabra, y niños que crecen sin haber visto nunca un Nazgûl."
