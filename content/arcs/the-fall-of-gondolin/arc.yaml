# No `narratedBy`: every event of this arc is in the First Age, so the telling is read by the
# First Age's narrator (a voice belongs to an age, never to a story: §5).
id: the-fall-of-gondolin
title: { en: The Fall of Gondolin, es: La Caída de Gondolin }
