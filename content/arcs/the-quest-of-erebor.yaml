id: the-quest-of-erebor
title: { en: The Quest of Erebor, es: La Búsqueda de Erebor }
summary:
  en: Thorin's company, with Bilbo as their burglar, sets out to win back the Lonely Mountain from the dragon Smaug.
  es: La compañía de Thorin, con Bilbo como saqueador, parte para recuperar la Montaña Solitaria del dragón Smaug.
