id: the-downfall-of-numenor
title: { en: "The Downfall of Númenor", es: "La Caída de Númenor" }
summary:
  en: "The Kings of Númenor turn from the Valar, Sauron comes to the island, and the sea swallows it."
  es: "Los reyes de Númenor se apartan de los Valar, Sauron llega a la isla y el mar la engulle."
