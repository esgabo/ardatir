- id: shaping
  en: When the world was new, the Valar came down into it and began to shape its lands and seas. Melkor undid their work wherever he could, until mighty Tulkas came and drove him away.
  es: Cuando el mundo era nuevo, los Valar descendieron a él y empezaron a dar forma a sus tierras y mares. Melkor deshacía su obra siempre que podía, hasta que llegó el poderoso Tulkas y lo ahuyentó.
- id: lamps
  en: Then Aulë made two great Lamps to light the world. Varda filled them with light, Manwë blessed them, and they were set high on pillars taller than any mountain.
  es: Entonces Aulë hizo dos grandes Lámparas para alumbrar el mundo. Varda las llenó de luz, Manwë las bendijo, y las alzaron sobre pilares más altos que cualquier montaña.
- id: illuin-ormal
  en: Illuin stood in the north and Ormal in the south, and their light lay over every land, bright as a day without end.
  es: Illuin se alzaba en el norte y Ormal en el sur, y su luz cubría todas las tierras, clara como un día sin fin.
- id: spring
  en: The seeds Yavanna had sown woke and grew. Grass and trees spread across the land, and the first beasts walked in the forests. This was the Spring of Arda.
  es: Las semillas que Yavanna había sembrado despertaron y crecieron. La hierba y los árboles se extendieron por la tierra, y las primeras bestias caminaron por los bosques. Era la Primavera de Arda.
- id: almaren
  en: In the middle of the world, where the two lights met and mingled, the Valar made their home on an isle in a wide lake. They called it Almaren, and there they rested and were glad.
  es: En el centro del mundo, donde las dos luces se encontraban y se mezclaban, los Valar hicieron su morada en una isla de un ancho lago. La llamaron Almaren, y allí descansaron y fueron felices.
- id: utumno
  en: But far in the north, where the light grew faint, Melkor had come back in secret. He delved a great fortress under the mountains, Utumno, and from it his shadow crept south.
  es: Pero lejos, en el norte, donde la luz se volvía débil, Melkor había vuelto en secreto. Excavó una gran fortaleza bajo las montañas, Utumno, y desde allí su sombra se arrastró hacia el sur.
- id: fall
  en: He struck before the Valar were ready. He threw down the pillars, and the two Lamps fell and broke.
  es: Atacó antes de que los Valar estuvieran preparados. Derribó los pilares, y las dos Lámparas cayeron y se rompieron.
- id: ruin
  en: Their fire poured out over the earth. The seas rose and the land was torn, and the even, balanced shape the Valar had planned for the world was lost.
  es: Su fuego se derramó sobre la tierra. Los mares se alzaron y la tierra se desgarró, y la forma armoniosa y equilibrada que los Valar habían pensado para el mundo se perdió.
- id: west
  en: Almaren was gone. Melkor hid in the dark, and the Valar went far into the West to make a new home. Middle-earth was left in shadow, under the stars.
  es: Almaren había desaparecido. Melkor se ocultó en la oscuridad, y los Valar se marcharon lejos, al Oeste, a hacerse un nuevo hogar. La Tierra Media quedó en sombras, bajo las estrellas.
