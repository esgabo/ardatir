id: turin-slays-morgoth
age: foretold
place: valinor
characters: [ turin, melkor, tulkas, eonwe ]
arcs: [ the-end-of-days ]
tags: [ silmarillion, prophecy, battle ]
status: scripted
# The Second Prophecy of Mandos (1937 Quenta Silmarillion, The Lost Road), as already in the Quenta
# (The Shaping of Middle-earth): Túrin's black sword gives Morgoth his death, and the
# children of Húrin and all Men are avenged. The published Silmarillion has none of this. The
# sword is Gurthang, named in the published "Of Túrin Turambar"; the prophecy says only that it
# is black.
source: { book: the-lost-road, chapter: "Quenta Silmarillion" }
foretoldBy: mandos
title: { en: "Túrin slays Morgoth", es: "Túrin mata a Morgoth" }
summary:
  en: "With his black sword Túrin deals Morgoth his death and final end. So the children of Húrin, and all Men, are avenged for the curse Morgoth laid on them."
  es: "Con su espada negra, Túrin da a Morgoth la muerte y el fin definitivo. Así quedan vengados los hijos de Húrin, y todos los Hombres, por la maldición que Morgoth lanzó sobre ellos."
links:
  - to: morgoth-curses-hurin-and-his-kin
    type: caused-by
    note:
      en: "The curse on Húrin's house is answered: the son Morgoth hunted all his life deals the last blow."
      es: "La maldición sobre la casa de Húrin recibe respuesta: el hijo al que Morgoth persiguió toda su vida da el último golpe."
  - to: turins-end
    type: enabled-by
    note:
      en: "Túrin died at Cabed-en-Aras; it is from the Halls of Mandos that he comes back to fight."
      es: "Túrin murió en Cabed-en-Aras; vuelve a luchar desde las Estancias de Mandos."
beats:
  - { id: the-blow, label: { en: The black sword, es: La espada negra } }
  - { id: avenged, label: { en: Avenged, es: Vengados } }
