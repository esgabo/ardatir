- id: the-blow
  en: In the end it will not be one of the Valar who strikes the last blow, but Túrin, a mortal Man whose whole life Morgoth's curse had darkened.
  es: Al final no será uno de los Valar quien dé el último golpe, sino Túrin, un Hombre mortal cuya vida entera había ensombrecido la maldición de Morgoth.
- id: the-end
  en: His black sword will pierce the Enemy, and this time there will be no prison and no return. It will be Morgoth's death and his final end.
  es: Su espada negra atravesará al Enemigo, y esta vez no habrá prisión ni regreso. Será la muerte de Morgoth y su fin definitivo.
- id: avenged
  en: So Húrin's children will be avenged, Túrin and Nienor both, and with them every Man who suffered under Morgoth's shadow.
  es: Así quedarán vengados los hijos de Húrin, Túrin y Nienor, y con ellos todos los Hombres que sufrieron bajo la sombra de Morgoth.
