- id: levelled
  en: The Pelóri, the towering wall the Valar raised to hide their land, will be brought down to the plain.
  es: Las Pelóri, la altísima muralla que los Valar alzaron para ocultar su tierra, serán abatidas hasta la llanura.
- id: light
  en: With nothing left to hold it back, the light of the Trees will flow out over the whole world, to every shore, as it never did before.
  es: Sin nada que la contenga, la luz de los Árboles fluirá sobre el mundo entero, hasta todas las orillas, como nunca antes.
- id: young
  en: In that light the Valar will grow young again. The Elves will wake, and all their dead will rise, and Ilúvatar's purpose for them will be fulfilled.
  es: En esa luz los Valar volverán a ser jóvenes. Los Elfos despertarán, y se alzarán todos sus muertos, y se cumplirá el propósito de Ilúvatar para ellos.
- id: men
  en: Of Men, the prophecy says nothing. Only one is named, Túrin, and he is counted among the sons of the Valar.
  es: De los Hombres, la profecía no dice nada. Solo nombra a uno, Túrin, y lo cuenta entre los hijos de los Valar.
