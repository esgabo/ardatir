- id: levelled
  en: The Pelóri, the towering wall the Valar raised to hide their land, will be brought down to the plain.
  es: Las Pelóri, la altísima muralla que los Valar alzaron para ocultar su tierra, serán abatidas hasta la llanura.
- id: light
  en: With nothing left to hold it back, the light of the Trees will flow out over the whole world, to every shore, as it never did before.
  es: Sin nada que la contenga, la luz de los Árboles fluirá sobre el mundo entero, hasta todas las orillas, como nunca antes.
- id: young
  en: In that light the Valar will be young again. The Elves will rise from sleep, their dead with them, and all Ilúvatar meant for them will come to pass.
  es: En esa luz los Valar volverán a ser jóvenes. Los Elfos despertarán, y sus muertos con ellos, y se cumplirá todo lo que Ilúvatar quiso para ellos.
- id: men
  en: Of Men the prophecy is silent. It names a single one, Túrin, and gives him a place among the Valar's own.
  es: De los Hombres la profecía calla. Solo nombra a uno, Túrin, y le da un lugar entre los propios Valar.
