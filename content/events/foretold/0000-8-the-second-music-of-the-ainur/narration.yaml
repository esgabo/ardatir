- id: said
  en: Long before the world was made, the Ainur sang a great Music, and the world came out of it. It is said that one day there will be another.
  es: Mucho antes de que se hiciera el mundo, los Ainur cantaron una gran Música, y de ella nació el mundo. Se dice que un día habrá otra.
- id: choirs
  en: After the end of days, the Ainur will sing again before Ilúvatar, and this time the Children of Ilúvatar will sing with them.
  es: Después del fin de los días, los Ainur volverán a cantar ante Ilúvatar, y esta vez los Hijos de Ilúvatar cantarán con ellos.
- id: men
  en: The Valar told the Elves that Men will join that song. What Ilúvatar means for the Elves after the end, he has not told anyone.
  es: Los Valar dijeron a los Elfos que los Hombres se unirán a ese canto. Lo que Ilúvatar quiere para los Elfos después del fin, no se lo ha dicho a nadie.
- id: aright
  en: It will be greater than the first. Every theme will be played the way Ilúvatar meant it, with no discord left in it, and whatever is sung will become real as it is sung.
  es: Será mayor que la primera. Cada tema sonará como Ilúvatar lo pensó, sin discordia alguna, y todo lo que se cante se hará real mientras se canta.
