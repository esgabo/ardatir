- id: remade
  en: When the battle is over, the Earth itself will be broken apart and made again.
  es: Cuando acabe la batalla, la propia Tierra se quebrará y será hecha de nuevo.
- id: sea-and-earth
  en: Out of it will rise the jewels that were lost at the end of the First Age. One from the bottom of the sea, where Maglor threw it. One from the fire under the earth, where Maedhros fell with it.
  es: De ella surgirán las joyas que se perdieron al final de la Primera Edad. Una del fondo del mar, donde la arrojó Maglor. Otra del fuego bajo la tierra, donde cayó Maedhros con ella.
- id: air
  en: And the third from the air. Eärendil will come down from his long voyage across the sky and give up the light he has kept there for so long.
  es: Y la tercera, del aire. Eärendil bajará de su largo viaje por el cielo y entregará la luz que ha guardado allí durante tanto tiempo.
