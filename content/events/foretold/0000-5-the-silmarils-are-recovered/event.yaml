# The Second Prophecy of Mandos in the 1937 Quenta Silmarillion (The Lost Road): after the battle
# the Earth is broken and made again, and the Silmarils are recovered from sea, earth and air,
# Eärendil coming down to give up the one he keeps. The Quenta (The Shaping of Middle-earth) has the
# recovery too. Where they lie comes from the end of the First Age: one in the sea (Maglor's), one in
# the fires of the earth (Maedhros's), one in the sky (Eärendil's).
source: { book: the-lost-road, chapter: "Quenta Silmarillion" }
foretoldBy: mandos
title: { en: "The Silmarils are recovered", es: "Los Silmarils son recuperados" }
summary:
  en: "After the battle the Earth is broken and made anew, and the three Silmarils come back out of the sea, the deep earth and the air. Eärendil comes down and gives up the jewel he has carried across the sky."
  es: "Tras la batalla, la Tierra se quiebra y se hace de nuevo, y los tres Silmarils vuelven del mar, de la tierra profunda y del aire. Eärendil desciende y entrega la joya que ha llevado por el cielo."
# The world's shape after the end (#59): the prophecy says the Earth is broken and made again, but
# not what shape it takes, and Tolkien never reconciled it with the round world after Númenor. We
# show it remade round here (cosmosJewels.ts, ROUND_WORLD), then the Trees and the Pelóri on the
# flat map of the Elder Days (cosmosRekindled.ts, cosmosLevelled.ts, ELDER), and say so in `note`.
note:
  en: "The prophecy says the Earth is broken and made again, but never says what shape it takes. Here it is made again round, as it has been since Númenor fell. The next two scenes go back to the flat world of the Elder Days, because they bring back the Trees and the mountains of Valinor; Tolkien never settled how the two pictures fit together."
  es: "La profecía dice que la Tierra se quiebra y se hace de nuevo, pero nunca dice qué forma tiene. Aquí se rehace redonda, como lo es desde la caída de Númenor. Las dos escenas siguientes vuelven al mundo plano de los Días Antiguos, porque traen de vuelta los Árboles y las montañas de Valinor; Tolkien nunca decidió cómo encajan las dos imágenes."
