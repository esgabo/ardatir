    note:
      en: "The Trees Melkor and Ungoliant killed are healed, with the jewels Fëanor once refused to give up for them."
      es: "Se sanan los Árboles que mataron Melkor y Ungoliant, con las joyas que Fëanor se negó una vez a entregar por ellos."
  - to: the-making-of-the-silmarils
    type: enabled-by
    note:
      en: "The light of the Trees lives on in the jewels Fëanor made."
      es: "La luz de los Árboles sigue viva en las joyas que hizo Fëanor."
