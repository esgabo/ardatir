- id: the-gift
  en: Then Fëanor, who made the Silmarils and swore the oath that stained them with so much blood, will take all three and carry them to Yavanna.
  es: Entonces Fëanor, que hizo los Silmarils y juró el juramento que los manchó con tanta sangre, tomará los tres y se los llevará a Yavanna.
- id: refused
  en: Once, in the dark after the Trees died, the Valar asked him for the jewels so that Yavanna could heal them, and he would not give them up. This time he will bring them to her himself.
  es: Una vez, en la oscuridad tras la muerte de los Árboles, los Valar le pidieron las joyas para que Yavanna pudiera sanarlos, y él no quiso entregarlas. Esta vez será él quien se las lleve.
- id: broken
  en: Yavanna will break the jewels open, and the light of the Trees, kept alive inside them through all the ages, will pour out.
  es: Yavanna romperá las joyas, y la luz de los Árboles, guardada viva en ellas a lo largo de todas las edades, se derramará.
- id: rekindled
  en: With that fire she will kindle Telperion and Laurelin again, silver and gold, as they shone when the world was young.
  es: Con ese fuego volverá a encender a Telperion y Laurelin, plata y oro, como brillaban cuando el mundo era joven.
