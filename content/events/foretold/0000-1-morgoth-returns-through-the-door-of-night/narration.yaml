- id: foretold
  en: This has not happened. It is a prophecy that Mandos spoke long ago in Valinor, of how the world will end.
  es: Esto no ha sucedido. Es una profecía que Mandos pronunció hace mucho en Valinor, sobre cómo acabará el mundo.
- id: old-world
  en: Ages will pass. The world will grow old, and even the Valar will grow tired of guarding it.
  es: Pasarán las edades. El mundo envejecerá, y hasta los Valar se cansarán de guardarlo.
- id: the-door
  en: Far out beyond the Walls of the World, in the empty dark, Morgoth waits. One day the watch at the Door of Night will drift into sleep.
  es: Lejos, más allá de los Muros del Mundo, en la oscuridad vacía, Morgoth espera. Un día la guardia de la Puerta de la Noche se dejará vencer por el sueño.
- id: return
  en: Then he will find the Door unwatched, and slip through it, back into the world he was cast out of.
  es: Entonces hallará la Puerta sin vigilancia y se deslizará por ella, de vuelta al mundo del que fue expulsado.
