title: { en: "The Last Battle is gathered", es: "Se reúne la Última Batalla" }
summary:
  en: "The Last Battle is joined on the fields of Valinor. Tulkas wrestles with Morgoth; at his right hand stands Eönwë, and at his left Túrin Turambar, son of Húrin, come back from the Halls of Mandos."
  es: "La Última Batalla se libra en los campos de Valinor. Tulkas lucha cuerpo a cuerpo con Morgoth; a su derecha está Eönwë, y a su izquierda Túrin Turambar, hijo de Húrin, que vuelve de las Estancias de Mandos."
