# The Second Prophecy of Mandos (1937 Quenta Silmarillion, The Lost Road); the Quenta (The Shaping
# of Middle-earth) tells it the same way. The drafts name the herald Fionwë: our Eönwë (see
# characters/eonwe.yaml). Later writing names this battle the Dagor Dagorath; the drafts call it
# the Last Battle.
source: { book: the-lost-road, chapter: "Quenta Silmarillion" }
