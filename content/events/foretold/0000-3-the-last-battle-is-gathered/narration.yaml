- id: fields
  en: The last of all battles will not be fought in Middle-earth, but on the wide fields of Valinor, under a sky with no Sun and no Moon.
  es: La última de todas las batallas no se librará en la Tierra Media, sino en los anchos campos de Valinor, bajo un cielo sin Sol ni Luna.
- id: tulkas
  en: Tulkas the Strong, who once laughed as he wrestled Melkor in the young world, will grapple with him again.
  es: Tulkas el Fuerte, que una vez reía mientras luchaba con Melkor en el mundo joven, volverá a trabarse con él.
- id: eonwe
  en: At his right hand will stand Eönwë, herald of Manwë, who led the host of the Valar in the War of Wrath.
  es: A su derecha estará Eönwë, heraldo de Manwë, que guio la hueste de los Valar en la Guerra de la Cólera.
- id: turin
  en: And at his left, a Man. Túrin, son of Húrin, will come out of the Halls of Mandos, his black sword in his hand.
  es: Y a su izquierda, un Hombre. Túrin, hijo de Húrin, saldrá de las Estancias de Mandos con su espada negra en la mano.
