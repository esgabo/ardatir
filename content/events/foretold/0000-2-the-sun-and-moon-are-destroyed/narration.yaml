- id: lights-out
  en: Morgoth's first blow will fall on the lights of heaven. The Sun and the Moon, made from the last fruit and flower of the Two Trees, will be put out.
  es: El primer golpe de Morgoth caerá sobre las luces del cielo. El Sol y la Luna, hechos del último fruto y la última flor de los Dos Árboles, se apagarán.
- id: dark
  en: Darkness will cover everything, as it did before the first sunrise.
  es: La oscuridad lo cubrirá todo, como antes del primer amanecer.
- id: earendil
  en: But one light will remain. Eärendil, sailing the sky with a Silmaril on his brow, will dive down upon Morgoth like a blazing white fire.
  es: Pero quedará una luz. Eärendil, que navega el cielo con un Silmaril en la frente, se lanzará sobre Morgoth como un fuego blanco y ardiente.
- id: driven-out
  en: He will drive the Enemy out of the airs and down to the earth, where the last battle waits.
  es: Expulsará al Enemigo de los aires y lo hará bajar a la tierra, donde aguarda la última batalla.
