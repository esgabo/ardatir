- id: turgon
  en: With Turgon dead in the ruins of Gondolin, the Noldor of Middle-earth had lost their High King.
  es: Con Turgon muerto entre las ruinas de Gondolin, los Noldor de la Tierra Media habían perdido a su Rey Supremo.
- id: gilgalad
  en: The crown passed to Gil-galad, a young prince of the house of Finwë. His name means Star of Radiance.
  es: La corona pasó a Gil-galad, un joven príncipe de la casa de Finwë. Su nombre significa Estrella Radiante.
- id: balar
  en: He lived on the Isle of Balar, off the coast, beside Círdan the Shipwright, lord of the Elves of the havens, who watched over him.
  es: Vivía en la isla de Balar, frente a la costa, junto a Círdan el Carpintero de Barcos, señor de los Elfos de los puertos, que velaba por él.
- id: refuge
  en: Balar and the havens of Sirion were now the last refuges of the Elves in Beleriand, and the sea was their only safe road.
  es: Balar y los puertos del Sirion eran ahora los últimos refugios de los Elfos en Beleriand, y el mar era su único camino seguro.
