- id: warning
  en: Messengers came from Ulmo, warning Nargothrond to break its bridge and shut its doors. Túrin would not listen, and Orodreth followed him.
  es: Llegaron mensajeros de Ulmo advirtiendo a Nargothrond que destruyera su puente y cerrara sus puertas. Túrin no quiso escuchar, y Orodreth lo siguió.
- id: march
  en: Morgoth sent a great army south, with Glaurung the dragon at its head. Nargothrond marched out to meet it in the open, on the field of Tumhalad between two rivers.
  es: Morgoth envió al sur un gran ejército, con el dragón Glaurung al frente. Nargothrond salió a su encuentro a campo abierto, en el llano de Tumhalad, entre dos ríos.
- id: dragon
  en: No Elf could stand before the dragon's fire. The host was trapped between the rivers and broken, and King Orodreth was slain.
  es: Ningún Elfo podía resistir el fuego del dragón. La hueste quedó atrapada entre los ríos y fue deshecha, y el rey Orodreth murió.
- id: gwindor
  en: Gwindor fell, badly wounded. Túrin carried him out of the battle, and with his last strength Gwindor begged him to save Finduilas.
  es: Gwindor cayó gravemente herido. Túrin lo sacó de la batalla, y con sus últimas fuerzas Gwindor le rogó que salvara a Finduilas.
- id: hope
  en: She was Túrin's one hope against the shadow that followed him, Gwindor said. Then he died, and Túrin ran for Nargothrond.
  es: Ella era la única esperanza de Túrin contra la sombra que lo seguía, dijo Gwindor. Luego murió, y Túrin corrió hacia Nargothrond.
