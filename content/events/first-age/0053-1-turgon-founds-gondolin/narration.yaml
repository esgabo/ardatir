- id: valley
  en: "Ulmo, lord of waters, guided Turgon in secret to a hidden place: a green valley ringed by steep mountains, with a single hill rising in its middle."
  es: "Ulmo, señor de las aguas, guio a Turgon en secreto hasta un lugar oculto: un valle verde rodeado de montañas escarpadas, con una sola colina en el centro."
- id: work
  en: Turgon told no one. He set his people to work in secret, building a city on the hill in memory of white Tirion, which he had loved.
  es: Turgon no se lo contó a nadie. Puso a su gente a trabajar en secreto, construyendo una ciudad sobre la colina en recuerdo de la blanca Tirion, que tanto había amado.
- id: name
  en: For fifty-two years the work went on. He named the city Gondolin, the Hidden Rock.
  es: Durante cincuenta y dos años siguió el trabajo. Llamó a la ciudad Gondolin, la Roca Escondida.
- id: departure
  en: When it was finished, he led his people out of their old home by the sea, and they vanished from the world without a word.
  es: Cuando estuvo terminada, sacó a su pueblo de su antiguo hogar junto al mar, y desaparecieron del mundo sin decir palabra.
- id: warning
  en: Ulmo told him to leave a sword and armour in his old halls, for a messenger who would one day come. And he warned that the greatest danger to the city might rise from within.
  es: Ulmo le pidió que dejara una espada y una armadura en sus antiguos salones, para un mensajero que llegaría algún día. Y le advirtió que el mayor peligro para la ciudad podía surgir de dentro.
