- id: finduilas
  en: Túrin went south to find Finduilas. In the forest of Brethil he learned that she was dead, slain by her captors near the Crossings of Teiglin, and that the woodmen had buried her there in a mound.
  es: Túrin fue al sur en busca de Finduilas. En el bosque de Brethil supo que había muerto, a manos de sus captores cerca de los Cruces del Teiglin, y que los hombres del bosque la habían enterrado allí en un túmulo.
- id: haladin
  en: Overcome by grief, he fell into a dark stupor. The Men of Brethil, the Haladin, carried him to their homes and cared for him.
  es: Abrumado por la pena, cayó en un sopor oscuro. Los Hombres de Brethil, los Haladin, lo llevaron a sus hogares y lo cuidaron.
- id: brandir
  en: Their lord was Brandir, lame since childhood, gentle and wise. He welcomed Túrin, but feared what his coming might bring.
  es: Su señor era Brandir, cojo desde la infancia, amable y sabio. Acogió a Túrin, pero temía lo que su llegada pudiera traer.
- id: turambar
  en: "Túrin wanted to leave his past and its curse behind. He put away his black sword and took a new name: Turambar, Master of Doom."
  es: "Túrin quería dejar atrás su pasado y su maldición. Guardó su espada negra y tomó un nuevo nombre: Turambar, Señor del Destino."
- id: peace
  en: For a while he lived quietly among the woodmen, and the forest was at peace.
  es: Durante un tiempo vivió tranquilo entre los hombres del bosque, y el bosque estuvo en paz.
