- id: feast
  en: On a festival night at midsummer, the people of Gondolin waited on the walls to greet the sunrise with song. Instead, they saw a red light rising in the north.
  es: Una noche de fiesta en pleno verano, la gente de Gondolin esperaba en las murallas para saludar el amanecer con canciones. En cambio, vieron una luz roja alzarse en el norte.
- id: attack
  en: Morgoth's army came over the mountains, with dragons of iron, orcs and Balrogs. The walls were breached, and fighting filled the streets.
  es: El ejército de Morgoth cruzó las montañas, con dragones de hierro, orcos y Balrogs. Las murallas cedieron, y la lucha llenó las calles.
- id: ecthelion
  en: In the king's square, Ecthelion of the Fountain fought Gothmog, lord of the Balrogs, and both fell together into the great fountain.
  es: En la plaza del rey, Ecthelion de la Fuente luchó contra Gothmog, señor de los Balrogs, y los dos cayeron juntos en la gran fuente.
- id: maeglin
  en: Maeglin seized Idril and her young son, meaning to carry them off. Tuor came upon him, fought him on the wall, and threw him down from it, as Eöl had foretold.
  es: Maeglin se apoderó de Idril y de su hijo pequeño con intención de llevárselos. Tuor lo alcanzó, luchó con él en la muralla y lo arrojó desde ella, como Eöl había anunciado.
- id: turgon
  en: King Turgon would not leave his city. He stood in his high tower until it fell, and died in its ruins.
  es: El rey Turgon no quiso abandonar su ciudad. Permaneció en su alta torre hasta que cayó, y murió entre sus ruinas.
- id: burns
  en: Gondolin burned, and the hidden city was hidden no more.
  es: Gondolin ardió, y la ciudad oculta dejó de estar oculta.
