- id: ivrin
  en: Gwindor led Túrin to the clear pools of Ivrin. There, at last, Túrin wept, and his mind was healed.
  es: Gwindor llevó a Túrin a los lagos claros de Ivrin. Allí, por fin, Túrin lloró, y su mente sanó.
- id: name
  en: In Nargothrond he hid his true name, calling himself Agarwaen, the Bloodstained.
  es: En Nargothrond ocultó su verdadero nombre, y se hizo llamar Agarwaen, el Manchado de Sangre.
- id: sword
  en: Beleg's sword was forged anew for him, black and shining, and people came to call him the Black Sword of Nargothrond.
  es: La espada de Beleg fue forjada de nuevo para él, negra y reluciente, y la gente empezó a llamarlo la Espada Negra de Nargothrond.
- id: counsel
  en: King Orodreth came to trust him. Túrin urged open war instead of hiding, and the Elves of Nargothrond went out and won battles, and built a great bridge over the river at their doors.
  es: El rey Orodreth llegó a confiar en él. Túrin aconsejó la guerra abierta en lugar de esconderse, y los Elfos de Nargothrond salieron y ganaron batallas, y construyeron un gran puente sobre el río ante sus puertas.
- id: finduilas
  en: Finduilas, the king's daughter, had loved Gwindor, but now her heart turned to Túrin. He did not see it, and Gwindor grieved.
  es: Finduilas, la hija del rey, había amado a Gwindor, pero ahora su corazón se volvió hacia Túrin. Él no se dio cuenta, y Gwindor sufrió.
