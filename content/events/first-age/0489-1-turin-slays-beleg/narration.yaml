- id: follow
  en: Beleg recovered from his wounds and followed the orcs north, alone, into the dark pine forest of Taur-nu-Fuin.
  es: Beleg se recuperó de sus heridas y siguió a los orcos hacia el norte, solo, hasta el oscuro pinar de Taur-nu-Fuin.
- id: gwindor
  en: There he met Gwindor of Nargothrond, an Elf who had escaped from slavery in Angband, and together they went on.
  es: Allí conoció a Gwindor de Nargothrond, un Elfo que había escapado de la esclavitud en Angband, y siguieron juntos.
- id: rescue
  en: At night they crept into the orc camp and carried Túrin away, asleep in his chains. Beleg drew his sword, Anglachel, to cut him free.
  es: De noche se colaron en el campamento orco y se llevaron a Túrin, dormido y encadenado. Beleg desenvainó su espada, Anglachel, para liberarlo.
- id: mistake
  en: But the blade slipped and pricked Túrin's foot. He woke in terror, thinking the orcs had come to torment him, seized the sword, and struck. A flash of lightning showed him Beleg's face.
  es: Pero la hoja resbaló y le pinchó el pie. Túrin despertó aterrado, creyendo que los orcos venían a atormentarlo, agarró la espada y golpeó. Un relámpago le mostró el rostro de Beleg.
- id: grief
  en: Túrin sat by his friend as still as stone, unable even to weep. Gwindor buried Beleg with his great bow, and led Túrin out of the Forest under Night.
  es: Túrin se quedó junto a su amigo, inmóvil como una piedra, sin poder siquiera llorar. Gwindor enterró a Beleg con su gran arco, y sacó a Túrin del Bosque bajo la Noche.
