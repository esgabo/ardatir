- id: question
  en: Morgoth knew that Húrin had once been to Gondolin. He wanted to know where it lay, and had him brought before him.
  es: Morgoth sabía que Húrin había estado una vez en Gondolin. Quería saber dónde estaba, y mandó que se lo llevaran.
- id: refuse
  en: Húrin laughed at him and would tell him nothing, though Morgoth threatened every torment.
  es: Húrin se rio de él y no le dijo nada, aunque Morgoth lo amenazó con todos los tormentos.
- id: curse
  en: "So Morgoth laid a curse on Húrin's wife and children: wherever they went, his hatred would follow them, and their lives would end in darkness."
  es: "Así que Morgoth lanzó una maldición sobre la esposa y los hijos de Húrin: allá donde fueran, su odio los seguiría, y sus vidas acabarían en la oscuridad."
- id: seat
  en: He set Húrin on a high stone seat on Thangorodrim, held there by his power, so that he would watch all that befell his family, through Morgoth's own eyes.
  es: Sentó a Húrin en un alto asiento de piedra en Thangorodrim, sujeto allí por su poder, para que viera todo lo que le ocurría a su familia a través de los propios ojos de Morgoth.
- id: silent
  en: Húrin did not ask for mercy, for himself or for them. He sat silent, and endured.
  es: Húrin no pidió clemencia, ni para sí ni para ellos. Se quedó en silencio, y resistió.
