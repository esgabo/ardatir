- id: restless
  en: Aredhel, Turgon's sister, grew weary of Gondolin's walls. She longed to ride in the wide woods again, and at last her brother let her go, with an escort.
  es: Aredhel, la hermana de Turgon, se cansó de los muros de Gondolin. Ansiaba volver a cabalgar por los anchos bosques, y al fin su hermano la dejó marchar, con escolta.
- id: lost
  en: On the dark roads to the east her escort lost her, and she rode on alone, until she strayed into the shadowy forest of Nan Elmoth.
  es: En los caminos oscuros del este su escolta la perdió, y ella siguió sola, hasta que se adentró en el bosque sombrío de Nan Elmoth.
- id: eol
  en: There lived Eöl, the Dark Elf, a skilled smith who shunned the sun and disliked the Noldor. He saw her among the trees and wished to make her his wife.
  es: Allí vivía Eöl, el Elfo Oscuro, un herrero hábil que rehuía el sol y no apreciaba a los Noldor. La vio entre los árboles y quiso hacerla su esposa.
- id: house
  en: He bent the paths of the forest so that she came to his door. She stayed, and became his wife, and did not find the way out again.
  es: Torció los senderos del bosque para que ella llegara hasta su puerta. Se quedó, se convirtió en su esposa, y no volvió a encontrar la salida.
- id: maeglin
  en: In the shade of the trees she bore a son, Maeglin. Eöl forbade them both to walk in the sun, or to seek out her kin.
  es: A la sombra de los árboles dio a luz a un hijo, Maeglin. Eöl les prohibió a los dos caminar bajo el sol o buscar a la familia de ella.
