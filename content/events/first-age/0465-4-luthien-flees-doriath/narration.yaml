- id: news
  en: In Doriath, Lúthien learned from her mother that Beren lay in Sauron's dungeon.
  es: En Doriath, Lúthien supo por su madre que Beren yacía en la mazmorra de Sauron.
- id: tree
  en: Thingol, afraid that she would go to him, had shut her in a little house high in a great beech tree.
  es: Thingol, temiendo que fuera a buscarlo, la había encerrado en una casita en lo alto de una gran haya.
- id: cloak
  en: By her own magic she made her hair grow very long, and wove from it a dark cloak heavy with sleep. She let the rest down from the window like a rope, climbed down, and slipped away.
  es: Con su propia magia hizo crecer mucho su cabello, y con él tejió una capa oscura cargada de sueño. Dejó caer el resto por la ventana como una cuerda, bajó por él y escapó.
- id: captured
  en: In the woods she met Celegorm and Curufin, hunting with their hounds. They spoke kindly, but carried her off to Nargothrond and kept her there, for Celegorm meant to make her his wife.
  es: En los bosques se encontró con Celegorm y Curufin, que cazaban con sus perros. Le hablaron con amabilidad, pero se la llevaron a Nargothrond y la retuvieron allí, pues Celegorm quería hacerla su esposa.
- id: huan
  en: Celegorm's hound was Huan, the great wolfhound of Valinor, who understood speech. He loved Lúthien, and one night he led her out of Nargothrond and ran with her north, toward Beren.
  es: El perro de Celegorm era Huan, el gran lebrel de Valinor, que entendía el habla. Amaba a Lúthien, y una noche la sacó de Nargothrond y corrió con ella hacia el norte, en busca de Beren.
