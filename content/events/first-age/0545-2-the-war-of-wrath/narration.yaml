- id: landing
  en: The host of the Valar landed in the west of Beleriand, shining in arms. Morgoth sent all his armies out to meet them.
  es: La hueste de los Valar desembarcó en el oeste de Beleriand, resplandeciente en armas. Morgoth envió todos sus ejércitos a su encuentro.
- id: battle
  en: It was the greatest battle the world had ever seen. The orcs melted away before the host, and the Balrogs were destroyed, all but a few who fled into the deep places of the earth.
  es: Fue la mayor batalla que el mundo había visto. Los orcos se deshacían ante la hueste, y los Balrogs fueron destruidos, salvo unos pocos que huyeron a las profundidades de la tierra.
- id: men
  en: Many Men fought for Morgoth, but what was left of the three houses of the Elf-friends fought for the West.
  es: Muchos Hombres lucharon por Morgoth, pero lo que quedaba de las tres casas de los Amigos de los Elfos luchó por el Oeste.
- id: elves
  en: Gil-galad and the Elves of Middle-earth were there to see it. And Maedhros and his brother Maglor, the last sons of Fëanor, still lived, their oath not forgotten.
  es: Gil-galad y los Elfos de la Tierra Media estuvieron allí para verlo. Y Maedhros y su hermano Maglor, los últimos hijos de Fëanor, seguían vivos, sin olvidar su juramento.
- id: years
  en: The war went on for years, pressing north across Beleriand, until the host stood before Angband itself, and the land was torn and broken by the fighting.
  es: La guerra duró años, avanzando hacia el norte a través de Beleriand, hasta que la hueste se plantó ante la propia Angband, y la tierra quedó desgarrada y rota por la lucha.
