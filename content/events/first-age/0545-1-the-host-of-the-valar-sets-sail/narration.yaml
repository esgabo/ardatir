- id: answer
  en: Manwë heard Eärendil's plea. At last the Valar would go to war again for the sake of Middle-earth.
  es: Manwë escuchó la súplica de Eärendil. Por fin los Valar irían de nuevo a la guerra por la Tierra Media.
- id: host
  en: "A great host was gathered: the Maiar under Manwë's herald Eönwë, and the Vanyar, clad in white."
  es: "Se reunió una gran hueste: los Maiar al mando de Eönwë, heraldo de Manwë, y los Vanyar, vestidos de blanco."
- id: noldor
  en: With them went the Noldor who had stayed in Aman, under Finarfin. The Teleri would not go to war, but they sailed the ships that carried the host.
  es: Con ellos fueron los Noldor que se habían quedado en Aman, al mando de Finarfin. Los Teleri no quisieron ir a la guerra, pero gobernaron las naves que llevaban a la hueste.
- id: sail
  en: Their fleet filled the sea, bright with banners, and sailed east toward Middle-earth, where Morgoth did not yet know what was coming.
  es: Su flota llenó el mar, resplandeciente de estandartes, y navegó hacia el este, rumbo a la Tierra Media, donde Morgoth aún no sabía lo que se le venía encima.
