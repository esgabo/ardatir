summary:
  en: "The War of Wrath shatters the north and west of Middle-earth. When it ends, the sea pours in and Beleriand goes under the waves; only a strip of it, Lindon, remains west of the Blue Mountains."
  es: "La Guerra de la Cólera destroza el norte y el oeste de la Tierra Media. Cuando termina, el mar irrumpe y Beleriand se hunde bajo las olas; solo queda una franja, Lindon, al oeste de las Montañas Azules."
