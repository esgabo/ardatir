- id: war
  en: For years the host of the Valar fought Morgoth's armies across Beleriand. Their battles were so great that the north of the world was shaken and torn.
  es: Durante años, la hueste de los Valar luchó contra los ejércitos de Morgoth a lo largo de Beleriand. Sus batallas fueron tan grandes que el norte del mundo se estremeció y se desgarró.
- id: broken
  en: Thangorodrim fell, rivers lost their way, and the hills and valleys of the Elves' long wars cracked apart.
  es: Thangorodrim cayó, los ríos perdieron su cauce, y las colinas y los valles de las largas guerras de los Elfos se resquebrajaron.
- id: sea
  en: When Morgoth was overthrown at last, the sea rushed in. Forests, fortresses and graves sank beneath the waves, and Beleriand was gone.
  es: Cuando por fin Morgoth fue derrotado, el mar irrumpió. Bosques, fortalezas y tumbas se hundieron bajo las olas, y Beleriand desapareció.
- id: lindon
  en: "Only a little of it stayed above the water: Lindon, west of the Blue Mountains, where many Elves still lived. And so the First Age came to an end."
  es: "Solo un poco quedó sobre el agua: Lindon, al oeste de las Montañas Azules, donde aún vivían muchos Elfos. Y así llegó a su fin la Primera Edad."
