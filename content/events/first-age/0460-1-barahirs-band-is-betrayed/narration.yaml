- id: outlaws
  en: After the Sudden Flame, Dorthonion fell to Morgoth. Barahir would not leave it. He hid in the highlands with twelve companions, his son Beren among them, and struck at the enemy whenever he could.
  es: Tras la Llama Súbita, Dorthonion cayó en manos de Morgoth. Barahir no quiso abandonarla. Se ocultó en las tierras altas con doce compañeros, entre ellos su hijo Beren, y golpeaba al enemigo siempre que podía.
- id: hunted
  en: Morgoth ordered Sauron to find them. For years they slipped through his nets, and their deeds became songs of hope.
  es: Morgoth ordenó a Sauron que los encontrara. Durante años escaparon de sus redes, y sus hazañas se convirtieron en canciones de esperanza.
- id: gorlim
  en: One of them, Gorlim, longed for his lost wife. Sauron's servants tricked him with a vision of her, and Sauron promised to give her back. In his grief, Gorlim told where the outlaws hid.
  es: Uno de ellos, Gorlim, añoraba a su esposa perdida. Los siervos de Sauron lo engañaron con una visión de ella, y Sauron le prometió devolvérsela. En su pena, Gorlim reveló dónde se escondían los proscritos.
- id: ambush
  en: Orcs crept up on the hidden camp by night, and Barahir and all who were with him were slain.
  es: Los orcos se acercaron de noche al campamento oculto, y Barahir y todos los que estaban con él murieron.
- id: beren
  en: Beren was away on a scouting errand. In a dream he saw what had happened, and hurried back, too late. He buried his father, followed the orcs, and took back Barahir's ring from their captain.
  es: Beren estaba lejos, en una misión de exploración. En un sueño vio lo ocurrido y volvió a toda prisa, demasiado tarde. Enterró a su padre, siguió a los orcos y recuperó el anillo de Barahir de manos de su capitán.
