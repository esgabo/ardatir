- id: moon
  en: Fingolfin's people came off the ice into Middle-earth just as the Moon rose for the first time, and new light fell on them after the long dark.
  es: La gente de Fingolfin salió del hielo a la Tierra Media justo cuando la Luna se alzaba por primera vez, y una luz nueva cayó sobre ellos tras la larga oscuridad.
- id: sun
  en: As they marched into Mithrim, the Sun rose for the first time. They unfurled their blue and silver banners and blew their trumpets.
  es: Mientras entraban en Mithrim, el Sol salió por primera vez. Desplegaron sus estandartes azules y plateados y tocaron sus trompetas.
- id: orcs
  en: Morgoth's orcs fled from the light, and Morgoth hid in his deepest halls, and covered his land with smoke and dark clouds.
  es: Los orcos de Morgoth huyeron de la luz, y Morgoth se escondió en sus estancias más profundas y cubrió su tierra de humo y nubes oscuras.
- id: lake
  en: Fëanor's sons had their camp on the shore of Lake Mithrim. When Fingolfin's host arrived, they moved to the far side, and the lake lay between the two peoples.
  es: Los hijos de Fëanor tenían su campamento a orillas del lago Mithrim. Cuando llegó la hueste de Fingolfin, se trasladaron a la otra orilla, y el lago quedó entre los dos pueblos.
- id: shame
  en: Many of Fëanor's people were ashamed of what had been done at Losgar. But the bitterness between the houses ran deep, and for a time they did not speak.
  es: Muchos de los seguidores de Fëanor se avergonzaban de lo ocurrido en Losgar. Pero el rencor entre las casas era hondo, y durante un tiempo no se hablaron.
