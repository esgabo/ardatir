- id: disguise
  en: Beren meant to go on alone, but Lúthien would not leave him. On Huan's advice, they took the skins of the werewolf Draugluin and of a great bat, and went north in those shapes.
  es: Beren quería seguir solo, pero Lúthien no quiso dejarlo. Por consejo de Huan, tomaron las pieles del licántropo Draugluin y de un gran murciélago, y fueron al norte con esas formas.
- id: gate
  en: At the gate of Angband lay a new guard, Carcharoth, a huge wolf Morgoth had raised to stop Huan. Lúthien cast him into sleep with a word.
  es: A la puerta de Angband yacía un nuevo guardián, Carcharoth, un lobo enorme que Morgoth había criado para detener a Huan. Lúthien lo hizo dormir con una palabra.
- id: hall
  en: They went down to Morgoth's deepest hall. Morgoth saw through Lúthien's disguise, but he let her come near, for he wanted to see what she would do, and meant to keep her in his power.
  es: Bajaron hasta la estancia más profunda de Morgoth. Morgoth vio a través del disfraz de Lúthien, pero la dejó acercarse, pues quería ver qué haría, y pensaba tenerla en su poder.
- id: sleep
  en: She danced and sang before him, and her song wove such a sleep that the whole court fell still. At last Morgoth himself slumped from his throne, and his iron crown rolled to the floor.
  es: Ella bailó y cantó ante él, y su canción tejió un sueño tan hondo que toda la corte quedó inmóvil. Al fin el propio Morgoth se desplomó de su trono, y su corona de hierro rodó por el suelo.
- id: jewel
  en: Beren crept out, and with a knife of dwarf-make cut a Silmaril from the crown. Its light shone through his hand, but it did not burn him.
  es: Beren salió con sigilo, y con un cuchillo de hechura enana arrancó un Silmaril de la corona. Su luz atravesaba su mano, pero no lo quemó.
- id: snap
  en: He wished to take all three, but as he cut at the second, the knife snapped and a shard struck Morgoth's cheek. The sleepers stirred, and the two fled.
  es: Quiso llevarse los tres, pero cuando intentaba arrancar el segundo, el cuchillo se partió y una esquirla golpeó la mejilla de Morgoth. Los durmientes se agitaron, y los dos huyeron.
