- id: grown
  en: Túrin grew up in Doriath strong and brave, and fought on the northern borders beside his friend Beleg.
  es: Túrin creció en Doriath fuerte y valiente, y luchó en las fronteras del norte junto a su amigo Beleg.
- id: saeros
  en: One day, in the king's hall, an Elf named Saeros mocked him and the women of his people. In anger, Túrin threw a cup at him and hurt him.
  es: Un día, en el salón del rey, un Elfo llamado Saeros se burló de él y de las mujeres de su pueblo. Furioso, Túrin le arrojó una copa y lo hirió.
- id: chase
  en: The next day Saeros ambushed him in the woods. Túrin overcame him and chased him, terrified, through the forest, until Saeros tried to leap a ravine, fell, and died.
  es: Al día siguiente Saeros le tendió una emboscada en el bosque. Túrin lo venció y lo persiguió, aterrorizado, por el bosque, hasta que Saeros intentó saltar un barranco, cayó y murió.
- id: flight
  en: Sure that the king would condemn him, Túrin fled from Doriath and became an outlaw.
  es: Convencido de que el rey lo condenaría, Túrin huyó de Doriath y se convirtió en un proscrito.
- id: pardon
  en: But Beleg brought a witness before the king, and Thingol, learning the truth, pardoned him. Beleg set out to bring Túrin home, but Túrin's pride would not let him go back.
  es: Pero Beleg llevó un testigo ante el rey, y Thingol, al conocer la verdad, lo perdonó. Beleg partió para traer a Túrin a casa, pero el orgullo de Túrin no le permitió volver.
