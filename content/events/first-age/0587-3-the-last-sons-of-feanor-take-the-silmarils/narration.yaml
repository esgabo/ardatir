- id: claim
  en: "Maedhros and Maglor, the last sons of Fëanor, sent to Eönwë claiming the two Silmarils. He refused: by their deeds they had lost all right to them, and they must go to Valinor to be judged."
  es: "Maedhros y Maglor, los últimos hijos de Fëanor, enviaron a pedir a Eönwë los dos Silmarils. Él se negó: por sus actos habían perdido todo derecho a ellos, y debían ir a Valinor para ser juzgados."
- id: weary
  en: Maglor was weary, and would have gone. But Maedhros feared that if they broke their oath, it would hold them in darkness for ever.
  es: Maglor estaba cansado y habría aceptado. Pero Maedhros temía que, si rompían su juramento, este los retendría en la oscuridad para siempre.
- id: steal
  en: So they crept into the camp in disguise, struck down the guards, and took the jewels, one each.
  es: Así que entraron disfrazados en el campamento, abatieron a los guardias y se llevaron las joyas, una cada uno.
- id: burn
  en: But the Silmarils burned their hands, for they no longer had any right to them.
  es: Pero los Silmarils les quemaron las manos, pues ya no tenían ningún derecho sobre ellos.
- id: end
  en: In agony and despair, Maedhros cast himself into a chasm full of fire. Maglor threw his Silmaril into the sea, and wandered the shores ever after, singing of his sorrow.
  es: Con dolor y desesperación, Maedhros se arrojó a un abismo lleno de fuego. Maglor lanzó su Silmaril al mar, y desde entonces vagó por las costas, cantando su pena.
- id: three
  en: "So the Silmarils were scattered for ever: Eärendil's sails the sky, Maedhros's lies in the fire beneath the earth, and Maglor's rests at the bottom of the sea."
  es: "Así quedaron dispersos para siempre los Silmarils: el de Eärendil surca el cielo, el de Maedhros yace en el fuego bajo la tierra y el de Maglor descansa en el fondo del mar."
