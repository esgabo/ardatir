- id: years
  en: For twenty-eight years Húrin sat bound on Thangorodrim, watching the ruin of his family through Morgoth's eyes.
  es: Durante veintiocho años Húrin permaneció atado en Thangorodrim, viendo la ruina de su familia a través de los ojos de Morgoth.
- id: release
  en: When his children were gone, Morgoth let him go. He pretended pity for a beaten enemy, but he meant Húrin to carry his hatred out into the world.
  es: Cuando sus hijos ya no estaban, Morgoth lo dejó marchar. Fingió compasión por un enemigo vencido, pero quería que Húrin llevara su odio por el mundo.
- id: lies
  en: Morgoth had shown him only part of the truth, and twisted it. Húrin went out believing that Thingol and Melian had failed his family.
  es: Morgoth solo le había mostrado parte de la verdad, y retorcida. Húrin salió creyendo que Thingol y Melian habían fallado a su familia.
- id: gondolin
  en: Grey and bitter, he wandered south. At the mountains around Gondolin he called out to Turgon, but no answer came. And Morgoth's spies marked where he stood.
  es: Encanecido y amargado, vagó hacia el sur. Ante las montañas que rodean Gondolin llamó a Turgon a gritos, pero no hubo respuesta. Y los espías de Morgoth tomaron nota del lugar donde estaba.
