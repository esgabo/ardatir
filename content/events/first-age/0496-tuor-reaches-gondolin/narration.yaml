- id: way
  en: Voronwë searched for the secret way, and found at last the dry bed of an ancient river, leading deep into the mountains to the Hidden Door.
  es: Voronwë buscó el camino secreto, y encontró al fin el cauce seco de un antiguo río, que se adentraba en las montañas hasta la Puerta Oculta.
- id: gates
  en: Through a long dark tunnel they came to the guards, and then passed gate after gate, each grander than the last, until they reached the seventh, the gate of steel.
  es: Por un largo túnel oscuro llegaron hasta los guardias, y después cruzaron puerta tras puerta, cada una más grandiosa que la anterior, hasta llegar a la séptima, la puerta de acero.
- id: city
  en: Then Tuor saw Gondolin, white upon its hill in the middle of the valley, shining in the snow, and for a moment he forgot everything else.
  es: Entonces Tuor vio Gondolin, blanca sobre su colina en medio del valle, reluciendo en la nieve, y por un momento lo olvidó todo.
- id: warning
  en: "He was brought before King Turgon and gave him Ulmo's warning: the city's doom was near, and he should leave it and go down to the sea."
  es: "Lo llevaron ante el rey Turgon y le transmitió la advertencia de Ulmo: el fin de la ciudad estaba cerca, y debía abandonarla y bajar hacia el mar."
- id: refused
  en: But Turgon was proud of his city and trusted its hidden walls. Maeglin spoke against the warning, and the king would not go.
  es: Pero Turgon estaba orgulloso de su ciudad y confiaba en sus muros ocultos. Maeglin habló en contra de la advertencia, y el rey no quiso marcharse.
