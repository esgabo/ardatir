- id: tuor
  en: Tuor, son of Huor, grew up an orphan, and was held for years as a slave by the Easterlings of Hithlum. At last he escaped, and lived alone as an outlaw in the hills.
  es: Tuor, hijo de Huor, creció huérfano, y durante años los Orientales de Hithlum lo tuvieron como esclavo. Al fin escapó, y vivió solo como un proscrito en las colinas.
- id: gate
  en: Ulmo, who had a purpose for him, led him through a hidden river-gate under the mountains and on to the shore of the Great Sea.
  es: Ulmo, que tenía un propósito para él, lo guio a través de una puerta oculta por donde pasaba un río bajo las montañas, hasta la orilla del Gran Mar.
- id: vinyamar
  en: There he found Vinyamar, Turgon's old house, empty for centuries. On its wall still hung a shield, a helm, a sword and a coat of mail, left long ago.
  es: Allí encontró Vinyamar, la antigua casa de Turgon, vacía desde hacía siglos. En su muro aún colgaban un escudo, un yelmo, una espada y una cota de malla, dejados allí mucho tiempo atrás.
- id: ulmo
  en: As Tuor stood on the shore in arms, a storm rose, and out of the waves came Ulmo, Lord of Waters, tall and terrible, crowned with foam.
  es: Mientras Tuor estaba en la orilla, armado, se levantó una tormenta, y de entre las olas surgió Ulmo, Señor de las Aguas, alto y temible, coronado de espuma.
- id: message
  en: "Ulmo told him to go to hidden Gondolin with a warning for Turgon: the city's end was near; he should leave it and go down to the sea."
  es: "Ulmo le ordenó ir a la oculta Gondolin con una advertencia para Turgon: el fin de la ciudad estaba cerca; debía abandonarla y bajar hacia el mar."
- id: guide
  en: He gave Tuor a cloak to wrap him in shadow, and promised him a guide. The next day Voronwë, an Elf of Gondolin saved from a shipwreck, was found on the shore.
  es: Le dio a Tuor un manto para envolverlo en sombra, y le prometió un guía. Al día siguiente encontraron en la orilla a Voronwë, un Elfo de Gondolin que se había salvado de un naufragio.
