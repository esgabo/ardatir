- id: born
  en: In the spring, Idril bore Tuor a son, and they named him Eärendil.
  es: En primavera, Idril le dio a Tuor un hijo, y lo llamaron Eärendil.
- id: light
  en: He was a beautiful child, with a brightness about him, and both Elves and Men were among his forebears.
  es: Era un niño hermoso, con un brillo especial, y entre sus antepasados había Elfos y Hombres.
- id: star
  en: Huor's words before he fell had come true. From his house and Turgon's, a new hope had been born.
  es: Las palabras de Huor antes de caer se habían cumplido. De su casa y de la de Turgon había nacido una nueva esperanza.
- id: passage
  en: But Idril felt a foreboding of evil. In secret, she had a hidden passage dug from her house beneath the city walls and out into the valley.
  es: Pero Idril presentía algo malo. En secreto, mandó excavar un pasadizo oculto desde su casa, por debajo de las murallas, hasta el valle.
