- id: lights
  en: Finrod was hunting in the east of Beleriand when, at nightfall, he saw lights in a valley below the hills.
  es: Finrod estaba de caza en el este de Beleriand cuando, al caer la noche, vio luces en un valle al pie de las colinas.
- id: men
  en: "He found a camp of people he had never seen before: Men, newly come over the mountains from the east. They were asleep, and he did not wake them."
  es: "Encontró un campamento de gentes que nunca había visto: Hombres, recién llegados del este a través de las montañas. Estaban dormidos, y no los despertó."
- id: harp
  en: He picked up a rough harp that lay by the fire and began to play. The Men woke to music that seemed to show them visions of the world.
  es: Tomó un arpa tosca que había junto al fuego y empezó a tocar. Los Hombres despertaron con una música que parecía mostrarles visiones del mundo.
- id: beor
  en: Their leader was Bëor, and he and Finrod became friends. Finrod stayed with them a while and taught them, and they named him Nóm, which means Wisdom.
  es: Su jefe era Bëor, y él y Finrod se hicieron amigos. Finrod se quedó un tiempo con ellos y les enseñó, y lo llamaron Nóm, que significa Sabiduría.
- id: service
  en: In time Bëor went with Finrod to Nargothrond and served him all his life. His people were the first of Men to be called Elf-friends.
  es: Con el tiempo Bëor fue con Finrod a Nargothrond y lo sirvió toda su vida. Su pueblo fue el primero de los Hombres en ser llamado Amigos de los Elfos.
