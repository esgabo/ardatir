- id: stone
  en: Húrin came at last to Brethil, to the great stone the woodmen had raised above the gorge, carved with the names of Túrin and Nienor.
  es: Húrin llegó por fin a Brethil, a la gran piedra que los hombres del bosque habían alzado sobre la garganta, con los nombres de Túrin y Nienor grabados.
- id: morwen
  en: There, in the evening, sat an old woman, worn and grey. It was Morwen, his wife, who had wandered in the wild since she was lost from Doriath's riders.
  es: Allí, al atardecer, estaba sentada una anciana, cansada y canosa. Era Morwen, su esposa, que vagaba por las tierras salvajes desde que se perdió de los jinetes de Doriath.
- id: question
  en: She asked him how Nienor had found her brother, and he could not answer. They held hands as the sun went down.
  es: Ella le preguntó cómo había encontrado Nienor a su hermano, y él no supo responder. Se tomaron de la mano mientras se ponía el sol.
- id: death
  en: Morwen died there at sunset, with her hand in his. Húrin buried her beside the stone of their children.
  es: Morwen murió allí al ponerse el sol, con la mano en la suya. Húrin la enterró junto a la piedra de sus hijos.
- id: alone
  en: Then he rose, full of a dark and bitter grief, and went on his way alone.
  es: Luego se levantó, lleno de una pena oscura y amarga, y siguió su camino solo.
