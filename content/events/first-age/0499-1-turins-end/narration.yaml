- id: dragon
  en: Glaurung came out of Nargothrond to burn Brethil. Túrin went with two companions to meet him at Cabed-en-Aras, a deep gorge where the river Teiglin ran far below.
  es: Glaurung salió de Nargothrond para quemar Brethil. Túrin fue con dos compañeros a su encuentro en Cabed-en-Aras, una garganta profunda por cuyo fondo corría el río Teiglin.
- id: strike
  en: In the night he climbed the cliff beneath the dragon, and as Glaurung dragged himself across the gorge, Túrin drove his black sword deep into its soft belly.
  es: De noche trepó por el precipicio bajo el dragón, y cuando Glaurung se arrastraba sobre la garganta, Túrin le hundió su espada negra en el vientre blando.
- id: truth
  en: "Níniel, searching for him, found him lying senseless by the dying dragon. With his last breath, Glaurung lifted his spell from her and told her the truth: Túrin was her brother."
  es: "Níniel, que lo buscaba, lo encontró tendido sin sentido junto al dragón moribundo. Con su último aliento, Glaurung deshizo su hechizo y le dijo la verdad: Túrin era su hermano."
- id: nienor
  en: All her memory came back. Overwhelmed by horror and grief, she ran to the edge of the gorge and cast herself into the river far below.
  es: Recuperó toda la memoria. Abrumada por el horror y la pena, corrió hasta el borde de la garganta y se arrojó al río, muy abajo.
- id: brandir
  en: When Túrin woke, Brandir told him what had happened. Túrin would not believe it, and in his rage struck Brandir down. Then Mablung of Doriath came, and his words confirmed it all.
  es: Cuando Túrin despertó, Brandir le contó lo ocurrido. Túrin no quiso creerlo, y en su furia lo abatió. Entonces llegó Mablung de Doriath, y sus palabras lo confirmaron todo.
- id: end
  en: In despair, Túrin turned his black sword against himself, and died. So ended the tale of the children of Húrin.
  es: Desesperado, Túrin volvió su espada negra contra sí mismo, y murió. Así terminó la historia de los hijos de Húrin.
