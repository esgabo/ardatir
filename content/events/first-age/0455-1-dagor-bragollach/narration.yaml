- id: night
  en: One winter night, when the watchers had grown easy after long peace, Morgoth struck.
  es: Una noche de invierno, cuando los vigías se habían confiado tras la larga paz, Morgoth atacó.
- id: fire
  en: Rivers of flame poured out of Thangorodrim across the plain of Ard-galen. The green grass burned, and the smoke choked the guards in the hills.
  es: Ríos de llamas brotaron de Thangorodrim sobre la llanura de Ard-galen. La hierba verde ardió, y el humo ahogó a los guardias de las colinas.
- id: glaurung
  en: Behind the fire came Glaurung, now fully grown, with Balrogs and great armies of orcs.
  es: Tras el fuego llegó Glaurung, ya crecido del todo, con Balrogs y grandes ejércitos de orcos.
- id: dorthonion
  en: The Noldor were scattered. On the highlands of Dorthonion, guarded by Finrod's brothers and by Barahir's people, many fell, and Finrod himself rode north to their aid.
  es: Los Noldor quedaron dispersos. En las tierras altas de Dorthonion, guardadas por los hermanos de Finrod y por el pueblo de Barahir, muchos cayeron, y el propio Finrod cabalgó al norte en su ayuda.
- id: broken
  en: Fingolfin and Maedhros held out in their strongholds, but the fighting went on from winter into spring. The Siege of Angband was broken, never to be made whole again.
  es: Fingolfin y Maedhros resistieron en sus fortalezas, pero la lucha se prolongó del invierno a la primavera. El Sitio de Angband quedó roto, y nunca volvería a cerrarse.
