- id: wait
  en: On midsummer morning, Fingon's host waited in the west for the signal from the east. It did not come, for Maedhros had been delayed by treachery.
  es: La mañana de pleno verano, la hueste de Fingon esperaba en el oeste la señal del este. No llegó, pues una traición había retrasado a Maedhros.
- id: turgon
  en: Then trumpets sounded from the south. Turgon had come out of Gondolin with ten thousand of his people, and the host cheered to see them.
  es: Entonces sonaron trompetas desde el sur. Turgon había salido de Gondolin con diez mil de los suyos, y la hueste los recibió con vítores.
- id: charge
  en: Morgoth sent a herald to taunt them, and killed a captive Elf in front of their eyes. Fingon's people could hold back no longer, and charged across the plain to the very gates of Angband.
  es: Morgoth envió un heraldo a provocarlos, y mató a un Elfo cautivo delante de sus ojos. La gente de Fingon ya no pudo contenerse, y cargó a través de la llanura hasta las mismas puertas de Angband.
- id: treachery
  en: At last Maedhros came, and the battle might yet have turned. But the Easterlings marching with him changed sides, and the eastern host was broken.
  es: Al fin llegó Maedhros, y la batalla aún podría haber cambiado. Pero los Orientales que marchaban con él se pasaron al enemigo, y la hueste del este quedó deshecha.
- id: fingon
  en: In the west, Fingon fought on until Gothmog, lord of the Balrogs, struck him down.
  es: En el oeste, Fingon siguió luchando hasta que Gothmog, señor de los Balrogs, lo abatió.
- id: tears
  en: The armies of Elves and Men were shattered. It was remembered ever after as Nirnaeth Arnoediad, the Battle of Unnumbered Tears.
  es: Los ejércitos de Elfos y Hombres quedaron destrozados. Se la recordó para siempre como Nirnaeth Arnoediad, la Batalla de las Lágrimas Innumerables.
