- id: grief
  en: Lúthien's grief was so deep that her spirit left her body and went west, to the halls of Mandos.
  es: La pena de Lúthien fue tan honda que su espíritu abandonó su cuerpo y se fue al oeste, a las moradas de Mandos.
- id: waiting
  en: Beren's spirit had stayed there for her sake, unwilling to leave the world as Men must until he had seen her once more.
  es: El espíritu de Beren se había quedado allí por ella, sin querer abandonar el mundo como deben los Hombres hasta verla una vez más.
- id: song
  en: She knelt before Mandos and sang of her love for Beren and of the parting of Elves and Men. As she sang, even stern Mandos was moved to pity.
  es: Se arrodilló ante Mandos y cantó su amor por Beren y la separación entre Elfos y Hombres. Mientras cantaba, hasta el severo Mandos se conmovió.
- id: manwe
  en: Mandos had no power to change the fate of Men, so he brought her plea to Manwë, and Manwë offered Lúthien a choice.
  es: Mandos no tenía poder para cambiar el destino de los Hombres, así que llevó su súplica a Manwë, y Manwë le ofreció a Lúthien una elección.
- id: choice
  en: She could live in Valinor until the end of the world, free of sorrow, but without Beren. Or she could go back to Middle-earth with him, become mortal, and one day die as Men do.
  es: Podía vivir en Valinor hasta el fin del mundo, libre de pena, pero sin Beren. O podía volver a la Tierra Media con él, hacerse mortal y morir algún día como los Hombres.
- id: chose
  en: She chose Beren, and a mortal life. So she alone of the Elves would one day truly leave the world.
  es: Eligió a Beren, y una vida mortal. Así, ella sola entre los Elfos dejaría un día el mundo de verdad.
