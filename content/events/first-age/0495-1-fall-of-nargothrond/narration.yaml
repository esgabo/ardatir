- id: bridge
  en: Glaurung reached Nargothrond before Túrin. The great bridge led the enemy straight to the doors, and the city was sacked.
  es: Glaurung llegó a Nargothrond antes que Túrin. El gran puente llevó al enemigo directo a las puertas, y la ciudad fue saqueada.
- id: eyes
  en: Túrin arrived as the captives were being driven away. Glaurung looked into his eyes and held him there under a spell, unable to move.
  es: Túrin llegó cuando se llevaban a los cautivos. Glaurung lo miró a los ojos y lo retuvo allí bajo un hechizo, sin poder moverse.
- id: finduilas
  en: The dragon mocked him with his failures. And Túrin heard Finduilas calling to him as the orcs drove her away, and could not stir.
  es: El dragón se burló de él echándole en cara sus fracasos. Y Túrin oyó a Finduilas llamándolo mientras los orcos se la llevaban, y no pudo moverse.
- id: lie
  en: "Then Glaurung lied: Túrin's mother and sister were suffering in Dor-lómin, he said, and if Túrin did not go to them, they would perish."
  es: "Entonces Glaurung mintió: dijo que la madre y la hermana de Túrin sufrían en Dor-lómin, y que si Túrin no iba con ellas, morirían."
- id: north
  en: Freed from the spell, Túrin ran north toward Dor-lómin, leaving Finduilas behind. Glaurung lay down on the treasure of Nargothrond, alone in its empty halls.
  es: Libre del hechizo, Túrin corrió hacia el norte, hacia Dor-lómin, dejando atrás a Finduilas. Glaurung se tendió sobre el tesoro de Nargothrond, solo en sus estancias vacías.
