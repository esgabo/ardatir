- id: havens
  en: At the Havens of Sirion, Elwing grew up and married Eärendil, and they had twin sons, Elrond and Elros. The Silmaril seemed to bring the havens healing and blessing.
  es: En los Puertos del Sirion, Elwing creció y se casó con Eärendil, y tuvieron dos hijos gemelos, Elrond y Elros. El Silmaril parecía traer a los puertos curación y bendición.
- id: away
  en: Eärendil was far away at sea when the last sons of Fëanor, bound by their oath, could hold back no longer.
  es: Eärendil estaba lejos, en el mar, cuando los últimos hijos de Fëanor, atados por su juramento, ya no pudieron contenerse.
- id: attack
  en: The last sons of Fëanor fell upon the havens. It was the third and cruellest of the Kinslayings, and two of the brothers died in it.
  es: Los últimos hijos de Fëanor cayeron sobre los puertos. Fue la tercera y la más cruel de las Matanzas de Parientes, y dos de los hermanos murieron en ella.
- id: elwing
  en: Elwing would not give up the jewel. Holding it to her breast, she threw herself into the sea.
  es: Elwing no quiso entregar la joya. Apretándola contra su pecho, se arrojó al mar.
- id: ulmo
  en: Ulmo lifted her from the waves and gave her the shape of a great white bird. She flew out over the sea to find Eärendil, the Silmaril shining like a star on her breast.
  es: Ulmo la sacó de las olas y le dio la forma de una gran ave blanca. Voló sobre el mar en busca de Eärendil, con el Silmaril brillando como una estrella en su pecho.
- id: twins
  en: Elrond and Elros were taken captive. But Maglor took pity on them and cared for them, and in time came to love them.
  es: Elrond y Elros fueron hechos prisioneros. Pero Maglor se compadeció de ellos y los cuidó, y con el tiempo llegó a quererlos.
