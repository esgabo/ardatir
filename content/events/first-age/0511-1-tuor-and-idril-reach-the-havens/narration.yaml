- id: willows
  en: The survivors wandered south and rested a while in the land of willows, easing their grief. Then they went down to the mouths of Sirion, by the sea.
  es: Los supervivientes vagaron hacia el sur y descansaron un tiempo en la tierra de los sauces, aliviando su pena. Luego bajaron hasta las desembocaduras del Sirion, junto al mar.
- id: havens
  en: There they joined Elwing, daughter of Dior, and the last people of Doriath, and a new haven grew up by the sea under Ulmo's protection.
  es: Allí se unieron a Elwing, hija de Dior, y a los últimos habitantes de Doriath, y junto al mar creció un nuevo puerto bajo la protección de Ulmo.
- id: earendil
  en: Eärendil grew up there among ships and sails, and he and Elwing became friends.
  es: Eärendil creció allí entre barcos y velas, y él y Elwing se hicieron amigos.
- id: ship
  en: As Tuor grew old, a longing for the sea filled his heart. He built a great ship and named it Eärrámë, Sea-Wing.
  es: Cuando Tuor envejeció, un anhelo por el mar le llenó el corazón. Construyó una gran nave y la llamó Eärrámë, Ala de Mar.
- id: west
  en: With Idril beside him, he sailed into the west, and they were never seen again. Old songs say that Tuor, alone of mortal Men, was allowed to join the Elves.
  es: Con Idril a su lado, navegó hacia el oeste, y nunca se les volvió a ver. Las viejas canciones dicen que a Tuor, único entre los Hombres mortales, se le permitió unirse a los Elfos.
