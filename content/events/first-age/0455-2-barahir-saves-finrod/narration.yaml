- id: trapped
  en: Riding north to help his brothers, Finrod was cut off in the Fen of Serech and surrounded by orcs.
  es: Cabalgando al norte para ayudar a sus hermanos, Finrod quedó aislado en la Ciénaga de Serech, rodeado de orcos.
- id: barahir
  en: Barahir, a lord of the house of Bëor, came with his bravest men, broke through the orcs, and made a wall of spears around the king.
  es: Barahir, un señor de la casa de Bëor, acudió con sus hombres más valientes, se abrió paso entre los orcos e hizo un muro de lanzas alrededor del rey.
- id: escape
  en: Fighting every step, they brought Finrod out of the marsh, though many of Barahir's men fell.
  es: Luchando a cada paso, sacaron a Finrod de la ciénaga, aunque muchos de los hombres de Barahir cayeron.
- id: ring
  en: In thanks, Finrod gave Barahir his own ring, and swore that he would help Barahir and all his kin in any need.
  es: En agradecimiento, Finrod le dio a Barahir su propio anillo, y juró ayudarlo a él y a todos los suyos en cualquier necesidad.
- id: heirs
  en: It came to be called the Ring of Barahir, and his heirs would keep it for thousands of years.
  es: Llegó a llamarse el Anillo de Barahir, y sus herederos lo conservarían durante miles de años.
