- id: ring
  en: Beren went west to Nargothrond and showed Finrod the ring of Barahir. Finrod remembered his oath at once.
  es: Beren fue al oeste, a Nargothrond, y mostró a Finrod el anillo de Barahir. Finrod recordó su juramento al instante.
- id: hopeless
  en: He knew the quest was hopeless, and that seeking a Silmaril would wake the oath of Fëanor's sons.
  es: Sabía que la empresa no tenía esperanza, y que buscar un Silmaril despertaría el juramento de los hijos de Fëanor.
- id: brothers
  en: Celegorm and Curufin, two of those sons, were living in Nargothrond. They declared that no one but them would ever hold a Silmaril, and turned the people against their king.
  es: Celegorm y Curufin, dos de esos hijos, vivían en Nargothrond. Declararon que nadie salvo ellos tendría jamás un Silmaril, y pusieron al pueblo en contra de su rey.
- id: crown
  en: Finrod would not break his word. He took off his crown, gave it to his brother Orodreth to keep, and said he would go all the same.
  es: Finrod no quiso faltar a su palabra. Se quitó la corona, se la entregó a su hermano Orodreth para que la guardara, y dijo que iría de todos modos.
- id: ten
  en: Ten of his people stayed loyal and went with him. With Beren, they set out north toward the enemy's lands, and Nargothrond never saw its king again.
  es: Diez de los suyos le fueron fieles y lo acompañaron. Con Beren, partieron hacia el norte, hacia las tierras del enemigo, y Nargothrond nunca volvió a ver a su rey.
