- id: ship
  en: Eärendil had built a ship, Vingilot, the Foam-flower, and sailed far in search of Valinor, but the shadows and enchantments of the sea always turned him back.
  es: Eärendil había construido una nave, Vingilot, la Flor de la Espuma, y había navegado lejos en busca de Valinor, pero las sombras y los encantamientos del mar siempre lo hacían volver.
- id: bird
  en: Then a white bird came flying to his ship from the east. It was Elwing, with the Silmaril on her breast.
  es: Entonces un ave blanca llegó volando a su nave desde el este. Era Elwing, con el Silmaril en el pecho.
- id: passage
  en: With the holy jewel bound on Eärendil's brow, Vingilot passed the enchanted isles and the shadowy seas, and came at last to the shores of Aman.
  es: Con la joya sagrada ceñida a la frente de Eärendil, Vingilot dejó atrás las islas encantadas y los mares en sombra, y llegó por fin a las costas de Aman.
- id: tirion
  en: Eärendil walked alone into the empty streets of Tirion, for the Elves were away at festival. Then Eönwë, Manwë's herald, came and called him before the Valar.
  es: Eärendil entró solo en las calles vacías de Tirion, pues los Elfos estaban de fiesta. Entonces llegó Eönwë, heraldo de Manwë, y lo llamó ante los Valar.
- id: plea
  en: Before them all, he spoke for both Elves and Men. He asked pardon for the Noldor and pity for Middle-earth in its sorrow, and the Valar heard him.
  es: Ante todos ellos, habló en nombre de Elfos y Hombres. Pidió perdón para los Noldor y compasión para la Tierra Media en su dolor, y los Valar lo escucharon.
- id: sky
  en: He never went back to the lands of Men. The Valar set his ship to sail the heavens, and with the Silmaril on his brow, he became a star of hope.
  es: Nunca volvió a las tierras de los Hombres. Los Valar hicieron que su nave surcara los cielos, y con el Silmaril en la frente se convirtió en una estrella de esperanza.
