- id: peace
  en: Years of peace followed in the new light. Fingolfin, now High King of the Noldor, wanted his people and the Elves of Beleriand to know one another.
  es: Siguieron años de paz bajo la nueva luz. Fingolfin, ahora Rey Supremo de los Noldor, quería que su pueblo y los Elfos de Beleriand se conocieran.
- id: ivrin
  en: He called a great feast at the pools of Ivrin, where the river Narog rises beneath the mountains.
  es: Convocó una gran fiesta en los lagos de Ivrin, donde nace el río Narog al pie de las montañas.
- id: guests
  en: "Elves of many kinds came: Noldor of every house, among them Maedhros and Finrod, Grey-elves from the woods, and Círdan's people from the coast. Thingol did not come himself, but sent two envoys in his place."
  es: "Acudieron Elfos de muchas clases: Noldor de todas las casas, entre ellos Maedhros y Finrod, Elfos Grises de los bosques y la gente de Círdan desde la costa. Thingol no fue en persona, pero envió a dos emisarios en su lugar."
- id: friendship
  en: They feasted, held games and made new friends. The Noldor began to speak the tongue of the Grey-elves, and old quarrels were softened for a while.
  es: Celebraron banquetes y juegos e hicieron nuevos amigos. Los Noldor empezaron a hablar la lengua de los Elfos Grises, y las viejas disputas se suavizaron durante un tiempo.
- id: name
  en: Ever after it was remembered as Mereth Aderthad, the Feast of Reunion.
  es: Desde entonces se la recordó como Mereth Aderthad, la Fiesta de la Reunión.
