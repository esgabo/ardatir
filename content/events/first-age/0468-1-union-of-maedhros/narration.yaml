- id: hope
  en: Beren and Lúthien's deed showed that Morgoth was not beyond reach. Maedhros resolved to unite the free peoples and strike at Angband once more.
  es: La hazaña de Beren y Lúthien demostró que Morgoth no era inalcanzable. Maedhros decidió unir a los pueblos libres y atacar Angband una vez más.
- id: league
  en: From his hill of Himring he called on Elves, Men and Dwarves. The Dwarves sent warriors and weapons, and Men of many houses came, among them Easterlings newly arrived in the land.
  es: Desde su colina de Himring llamó a Elfos, Hombres y Enanos. Los Enanos enviaron guerreros y armas, y acudieron Hombres de muchas casas, entre ellos Orientales recién llegados a la tierra.
- id: west
  en: "In the west, Fingon, now High King, made ready with Húrin and the Men of Dor-lómin. They agreed on a signal: a beacon fire in the east would mean the attack had begun."
  es: "En el oeste, Fingon, ahora Rey Supremo, se preparó con Húrin y los Hombres de Dor-lómin. Acordaron una señal: un fuego en el este anunciaría que el ataque había comenzado."
- id: refused
  en: Not all came. Orodreth kept Nargothrond apart, and Thingol would not join, for Fëanor's sons had threatened him over his Silmaril. No one expected anything from hidden Gondolin.
  es: No todos acudieron. Orodreth mantuvo a Nargothrond al margen, y Thingol no quiso unirse, pues los hijos de Fëanor lo habían amenazado por su Silmaril. Nadie esperaba nada de la oculta Gondolin.
- id: spies
  en: And Morgoth had spies everywhere. He learned of the plan, and some of the Easterlings were already secretly his.
  es: Y Morgoth tenía espías por todas partes. Se enteró del plan, y algunos de los Orientales ya eran suyos en secreto.
