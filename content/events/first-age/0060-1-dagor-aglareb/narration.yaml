- id: quiet
  en: For years Morgoth seemed to sleep. Then, without warning, his orcs poured south out of Angband.
  es: Durante años Morgoth pareció dormir. Luego, sin previo aviso, sus orcos salieron en tropel de Angband hacia el sur.
- id: raid
  en: They spread across the land in bands, some through the passes to the west, some to the east, plundering as they went.
  es: Se extendieron por la tierra en bandas, unos por los pasos hacia el oeste y otros hacia el este, saqueando a su paso.
- id: trap
  en: But the Noldor were ready. Fingolfin came down from the north-west and Maedhros from the east, and they caught Morgoth's main army between them on the plain.
  es: Pero los Noldor estaban preparados. Fingolfin bajó desde el noroeste y Maedhros desde el este, y atraparon al grueso del ejército de Morgoth entre los dos en la llanura.
- id: victory
  en: The army was destroyed almost to the last orc, and the scattered bands were hunted down by the Grey-elves of Beleriand.
  es: El ejército fue destruido casi hasta el último orco, y las bandas dispersas fueron perseguidas por los Elfos Grises de Beleriand.
- id: name
  en: They called it Dagor Aglareb, the Glorious Battle. It was a victory, but also a warning, and the princes resolved to keep Morgoth shut in.
  es: La llamaron Dagor Aglareb, la Batalla Gloriosa. Fue una victoria, pero también una advertencia, y los príncipes decidieron mantener a Morgoth encerrado.
