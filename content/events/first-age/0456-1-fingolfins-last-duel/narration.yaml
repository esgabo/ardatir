- id: news
  en: Word reached Fingolfin that Dorthonion was lost and his people scattered. Grief and rage filled him, and it seemed to him that all the Noldor were doomed.
  es: A Fingolfin le llegó la noticia de que Dorthonion se había perdido y su pueblo estaba disperso. La pena y la ira lo llenaron, y le pareció que todos los Noldor estaban condenados.
- id: ride
  en: He rode alone across the burned plain to Angband on his horse Rochallor, struck the gates and called Morgoth out to fight.
  es: Cabalgó solo por la llanura quemada hasta Angband en su caballo Rochallor, golpeó las puertas y desafió a Morgoth a salir a luchar.
- id: duel
  en: Morgoth came out, huge and dark, with a great hammer. Fingolfin's sword flashed cold and bright, and seven times he wounded the Dark Lord.
  es: Morgoth salió, enorme y oscuro, con un gran martillo. La espada de Fingolfin destellaba fría y brillante, y siete veces hirió al Señor Oscuro.
- id: fall
  en: But Fingolfin grew weary, and at last he fell. Even then, with his last strength, he struck at Morgoth's foot as it pressed down on him.
  es: Pero Fingolfin se fue cansando, y al fin cayó. Aun entonces, con sus últimas fuerzas, hirió el pie de Morgoth cuando este lo aplastaba.
- id: eagle
  en: Thorondor, king of the eagles, swept down, tore at Morgoth's face, and carried Fingolfin's body away to the mountains around Gondolin, where Turgon laid his father to rest.
  es: Thorondor, rey de las Águilas, bajó en picado, desgarró el rostro de Morgoth y se llevó el cuerpo de Fingolfin a las montañas que rodean Gondolin, donde Turgon dio sepultura a su padre.
- id: limp
  en: Morgoth was lame from that day, and his wounds ached for ever.
  es: Desde aquel día Morgoth quedó cojo, y sus heridas nunca dejaron de dolerle.
