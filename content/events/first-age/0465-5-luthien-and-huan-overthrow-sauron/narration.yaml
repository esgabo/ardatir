- id: song
  en: Lúthien stood on the bridge to Sauron's island and sang a song no stone wall could keep out. Deep below, in the dark, Beren heard it and sang back.
  es: Lúthien se plantó en el puente que llevaba a la isla de Sauron y entonó una canción que ningún muro de piedra podía detener. Muy abajo, en la oscuridad, Beren la oyó y le respondió cantando.
- id: wolves
  en: Sauron sent wolves out against her, one after another. Huan killed them all, and then Draugluin, the father of werewolves.
  es: Sauron envió lobos contra ella, uno tras otro. Huan los mató a todos, y después a Draugluin, el padre de los licántropos.
- id: sauron
  en: Then Sauron himself came out, in the shape of the greatest wolf of all. Huan caught him by the throat and would not let go.
  es: Entonces salió el propio Sauron, con la forma del mayor de todos los lobos. Huan lo atrapó por el cuello y no lo soltó.
- id: yield
  en: Lúthien told him to give up his tower, or lose his body and wander as a naked, shamed spirit. Sauron yielded, and fled away as a great vampire bat into the forests.
  es: Lúthien le ordenó que entregara su torre, o perdería su cuerpo y vagaría como un espíritu desnudo y avergonzado. Sauron se rindió y huyó a los bosques convertido en un gran murciélago vampiro.
- id: free
  en: The walls fell and the pits were opened. Lúthien found Beren mourning beside Finrod. They laid the elf-king to rest on the island, and it was clean again.
  es: Los muros cayeron y los pozos se abrieron. Lúthien encontró a Beren llorando junto a Finrod. Dieron sepultura al rey elfo en la isla, y esta volvió a quedar limpia.
