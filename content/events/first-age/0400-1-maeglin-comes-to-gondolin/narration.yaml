- id: flight
  en: Maeglin grew up listening to his mother's tales of the Noldor and the hidden king. One day, while Eöl was away, the two of them fled together toward Gondolin.
  es: Maeglin creció escuchando los relatos de su madre sobre los Noldor y el rey oculto. Un día, mientras Eöl estaba fuera, huyeron juntos hacia Gondolin.
- id: welcome
  en: Turgon rejoiced to see his sister again, and welcomed her son into the city.
  es: Turgon se alegró de ver de nuevo a su hermana, y acogió a su hijo en la ciudad.
- id: eol
  en: But Eöl had followed them in secret and was caught at the gate. Turgon offered him a home in Gondolin, but Eöl would neither stay nor leave his son behind.
  es: Pero Eöl los había seguido en secreto y fue apresado en la puerta. Turgon le ofreció un hogar en Gondolin, pero Eöl no quería quedarse ni dejar atrás a su hijo.
- id: dart
  en: He snatched a hidden dart and threw it at Maeglin. Aredhel sprang between them and was struck, and she died of the wound.
  es: Sacó un dardo escondido y se lo arrojó a Maeglin. Aredhel se interpuso y fue alcanzada, y murió de la herida.
- id: judgement
  en: Turgon condemned Eöl, and he was cast from the high wall of the city. As he fell, he cursed his son, foretelling that he would die the same way.
  es: Turgon condenó a Eöl, y fue arrojado desde lo alto de la muralla de la ciudad. Al caer, maldijo a su hijo, anunciándole que moriría del mismo modo.
- id: shadow
  en: Maeglin stayed in Gondolin and rose high among its lords. He kept his thoughts to himself, and secretly loved his cousin Idril, the king's daughter.
  es: Maeglin se quedó en Gondolin y llegó a ser uno de sus grandes señores. Se guardaba sus pensamientos, y amaba en secreto a su prima Idril, la hija del rey.
