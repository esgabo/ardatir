- id: tower
  en: On the island of Tol Sirion, in the pass into Beleriand, stood the watchtower Finrod had built. His brother Orodreth held it.
  es: En la isla de Tol Sirion, en el paso hacia Beleriand, se alzaba la torre de vigilancia que Finrod había construido. Su hermano Orodreth la defendía.
- id: sauron
  en: Two years after the fire, Sauron, Morgoth's greatest servant, came against it. He was a mighty sorcerer, and dread went before him like a cloud.
  es: Dos años después del fuego, Sauron, el mayor siervo de Morgoth, marchó contra ella. Era un poderoso hechicero, y el terror lo precedía como una nube.
- id: falls
  en: The defenders could not stand against him, and Orodreth fled south to Nargothrond.
  es: Los defensores no pudieron resistirle, y Orodreth huyó al sur, a Nargothrond.
- id: werewolves
  en: Sauron took the tower for his own and filled it with wolves and werewolves. The fair island became Tol-in-Gaurhoth, the Isle of Werewolves.
  es: Sauron se quedó con la torre y la llenó de lobos y licántropos. La hermosa isla se convirtió en Tol-in-Gaurhoth, la Isla de los Licántropos.
- id: pass
  en: From then on, the road from the north into the heart of Beleriand was watched by the enemy, and no one passed without Sauron knowing.
  es: Desde entonces, el camino del norte hacia el corazón de Beleriand estuvo vigilado por el enemigo, y nadie pasaba sin que Sauron lo supiera.
