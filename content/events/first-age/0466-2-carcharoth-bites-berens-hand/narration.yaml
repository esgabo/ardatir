- id: awake
  en: They ran for the gate, and found Carcharoth awake and waiting.
  es: Corrieron hacia la puerta, y encontraron a Carcharoth despierto y esperando.
- id: jewel
  en: Lúthien was too weary to cast him into sleep again. Beren stepped in front of her and held up the Silmaril, hoping its light would drive the wolf back.
  es: Lúthien estaba demasiado cansada para dormirlo otra vez. Beren se puso delante de ella y alzó el Silmaril, con la esperanza de que su luz hiciera retroceder al lobo.
- id: bite
  en: Carcharoth looked at the holy jewel and was not afraid. He sprang, and bit off Beren's hand at the wrist, Silmaril and all.
  es: Carcharoth miró la joya sagrada y no tuvo miedo. Saltó, y le arrancó a Beren la mano por la muñeca, con el Silmaril dentro.
- id: fire
  en: The jewel burned him from inside. Mad with pain, the wolf fled howling to the south, and every living thing ran from his path.
  es: La joya lo abrasó por dentro. Loco de dolor, el lobo huyó aullando hacia el sur, y todo ser vivo escapaba a su paso.
- id: eagles
  en: Beren lay close to death, and Lúthien tended him. Then Thorondor and his eagles came down, lifted them both, and carried them high over the mountains toward Doriath.
  es: Beren yacía al borde de la muerte, y Lúthien lo cuidaba. Entonces bajaron Thorondor y sus águilas, los alzaron a los dos y los llevaron muy alto sobre las montañas, hacia Doriath.
