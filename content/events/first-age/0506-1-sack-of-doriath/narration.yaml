- id: dior
  en: Dior, son of Beren and Lúthien, had become King of Doriath, and tried to bring back its old glory. He wore the Silmaril on his breast.
  es: Dior, hijo de Beren y Lúthien, se había convertido en rey de Doriath, e intentaba devolverle su antigua gloria. Llevaba el Silmaril sobre el pecho.
- id: oath
  en: The sons of Fëanor heard of it, and their oath would not let them rest. They sent to Dior demanding the jewel, and he gave them no answer.
  es: Los hijos de Fëanor se enteraron, y su juramento no los dejó descansar. Enviaron a pedirle la joya a Dior, y él no les respondió.
- id: attack
  en: In the depth of winter they came against Menegroth with an army. For the second time, Elves fought Elves.
  es: En pleno invierno marcharon contra Menegroth con un ejército. Por segunda vez, Elfos lucharon contra Elfos.
- id: fallen
  en: Dior killed Celegorm, and Curufin and another brother fell too. But Dior was slain, and his wife Nimloth with him, and their two young sons were lost in the forest.
  es: Dior mató a Celegorm, y también cayeron Curufin y otro de los hermanos. Pero Dior murió, y con él su esposa Nimloth, y sus dos hijos pequeños se perdieron en el bosque.
- id: elwing
  en: Doriath was destroyed. A few escaped with Dior's little daughter, Elwing, and she carried the Silmaril with her to the mouths of Sirion.
  es: Doriath quedó destruida. Unos pocos escaparon con la pequeña hija de Dior, Elwing, y ella se llevó el Silmaril hasta las desembocaduras del Sirion.
