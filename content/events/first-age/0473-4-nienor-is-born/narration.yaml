- id: birth
  en: Early in the new year, in Dor-lómin, Morwen gave birth to a daughter.
  es: A comienzos del nuevo año, en Dor-lómin, Morwen dio a luz a una hija.
- id: name
  en: She named her Nienor, which means Mourning, for her husband was lost to her and her son was far away.
  es: La llamó Nienor, que significa Luto, pues había perdido a su esposo y su hijo estaba lejos.
- id: pride
  en: The Easterlings ruled the land, but Morwen kept her house and her pride, and they were half afraid of her.
  es: Los Orientales gobernaban la tierra, pero Morwen conservó su casa y su orgullo, y ellos le tenían cierto miedo.
- id: grow
  en: Nienor grew up golden-haired and fearless, like her father's kin, knowing her brother only from her mother's stories.
  es: Nienor creció con el cabello dorado y sin miedo a nada, como la familia de su padre, y solo conocía a su hermano por los relatos de su madre.
