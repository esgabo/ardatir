- id: search
  en: In Doriath, Morwen heard that the Black Sword of Nargothrond was her son, and rode out to find him. Nienor followed in secret, disguised among the king's riders.
  es: En Doriath, Morwen oyó que la Espada Negra de Nargothrond era su hijo, y salió a buscarlo. Nienor la siguió en secreto, disfrazada entre los jinetes del rey.
- id: glaurung
  en: "Near Nargothrond, Nienor came face to face with Glaurung. He looked into her eyes and laid a darkness on her mind, and she forgot everything: her name, her past, even how to speak."
  es: "Cerca de Nargothrond, Nienor se encontró cara a cara con Glaurung. Él la miró a los ojos y le cubrió la mente de oscuridad, y ella lo olvidó todo: su nombre, su pasado, hasta cómo hablar."
- id: wild
  en: Lost and afraid, she ran wild through the woods, until a storm drove her to shelter on a grassy mound near the Crossings of Teiglin.
  es: Perdida y asustada, corrió sin rumbo por los bosques, hasta que una tormenta la obligó a refugiarse en un túmulo cubierto de hierba cerca de los Cruces del Teiglin.
- id: found
  en: Túrin, out with the woodmen hunting orcs, found her there, on the grave of Finduilas.
  es: Túrin, que había salido con los hombres del bosque a cazar orcos, la encontró allí, sobre la tumba de Finduilas.
- id: niniel
  en: She could not tell them her name, so Túrin called her Níniel, Maiden of Tears. She healed slowly in Brethil, and came to love him, as he loved her.
  es: Ella no podía decirles su nombre, así que Túrin la llamó Níniel, Doncella de las Lágrimas. Fue sanando poco a poco en Brethil, y llegó a amarlo, igual que él la amaba a ella.
