- id: news
  en: Word came to Ossiriand that the Dwarves were marching home from Doriath, laden with its treasure.
  es: A Ossiriand llegó la noticia de que los Enanos volvían a casa desde Doriath, cargados con su tesoro.
- id: ford
  en: Beren took up arms once more. With his son Dior and the Green-elves of Ossiriand, he lay in wait at the ford of Sarn Athrad.
  es: Beren volvió a tomar las armas. Con su hijo Dior y los Elfos Verdes de Ossiriand, los esperó emboscado en el vado de Sarn Athrad.
- id: ambush
  en: The Elves fell on the Dwarves as they crossed the river. Few escaped, and those who fled into the hills met the Shepherds of the Trees.
  es: Los Elfos cayeron sobre los Enanos mientras cruzaban el río. Pocos escaparon, y los que huyeron hacia las colinas se toparon con los Pastores de Árboles.
- id: necklace
  en: Beren himself slew the lord of Nogrod and took back the Nauglamír, with the Silmaril set in it. The rest of the gold he cast into the river.
  es: El propio Beren mató al señor de Nogrod y recuperó el Nauglamír, con el Silmaril engastado. El resto del oro lo arrojó al río.
- id: luthien
  en: Lúthien wore the necklace on Tol Galen, and it was said she had never been so fair. Not long after, the two of them passed quietly from the world, and the Silmaril came to their son Dior.
  es: Lúthien llevó el collar en Tol Galen, y se dijo que nunca había sido tan hermosa. Poco después, los dos dejaron el mundo en paz, y el Silmaril pasó a su hijo Dior.
