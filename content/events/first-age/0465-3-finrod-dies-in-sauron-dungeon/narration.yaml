- id: disguise
  en: Near Tol Sirion they slew a band of orcs, and Finrod used his arts to give the whole company the shapes of orcs.
  es: Cerca de Tol Sirion acabaron con una banda de orcos, y Finrod usó sus artes para dar a toda la compañía el aspecto de orcos.
- id: caught
  en: But Sauron, watching from his tower, sensed that something was wrong, and had them brought before him.
  es: Pero Sauron, que vigilaba desde su torre, presintió que algo no encajaba, y mandó que los llevaran ante él.
- id: songs
  en: Sauron and Finrod fought with songs of power. Finrod sang of Valinor's light and of things hidden and freed; Sauron sang of treachery and darkness. At last Finrod's strength failed, and he fell.
  es: Sauron y Finrod lucharon con canciones de poder. Finrod cantó a la luz de Valinor y a lo oculto que se libera; Sauron cantó a la traición y a la oscuridad. Al fin las fuerzas de Finrod flaquearon, y cayó.
- id: pit
  en: Their disguises fell away, and they were thrown into a deep pit. In the dark, a wolf came, and one by one it took the companions.
  es: Sus disfraces se desvanecieron, y los arrojaron a un pozo profundo. En la oscuridad llegaba un lobo, y uno tras otro se llevó a los compañeros.
- id: finrod
  en: When the wolf came for Beren, Finrod broke his chains and fought it with his bare hands. He killed it, but was wounded to death, and died in the dark beside his friend.
  es: Cuando el lobo vino a por Beren, Finrod rompió sus cadenas y luchó con él a manos desnudas. Lo mató, pero quedó herido de muerte, y murió en la oscuridad junto a su amigo.
