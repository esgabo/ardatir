- id: passage
  en: Idril's secret passage saved them. Through it Tuor led everyone who could escape, out of the burning city and into the dark valley.
  es: El pasadizo secreto de Idril los salvó. Por él Tuor sacó a todos los que pudieron escapar, de la ciudad en llamas al valle oscuro.
- id: north
  en: "They took the way no one would expect: north, up to Cirith Thoronath, the Eagles' Cleft, a high and narrow pass in the mountains."
  es: "Tomaron el camino que nadie esperaría: hacia el norte, hasta Cirith Thoronath, la Hendidura de las Águilas, un paso alto y estrecho en las montañas."
- id: ambush
  en: There, on a narrow path above a sheer drop, orcs and a Balrog fell upon them.
  es: Allí, en un sendero angosto sobre un precipicio, los atacaron orcos y un Balrog.
- id: glorfindel
  en: Glorfindel, lord of the House of the Golden Flower, fought the Balrog on the edge of the cliff, and both fell into the chasm.
  es: Glorfindel, señor de la Casa de la Flor Dorada, luchó contra el Balrog al borde del precipicio, y los dos cayeron al abismo.
- id: eagles
  en: Thorondor's eagles swooped on the orcs and drove them back. The survivors raised a mound of stones over Glorfindel, and in time golden flowers grew on it.
  es: Las águilas de Thorondor cayeron sobre los orcos y los hicieron retroceder. Los supervivientes alzaron un túmulo de piedras sobre Glorfindel, y con el tiempo crecieron en él flores doradas.
