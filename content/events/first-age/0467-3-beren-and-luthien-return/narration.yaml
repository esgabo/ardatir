- id: wake
  en: Beren and Lúthien woke again in the green woods of Doriath, alive, and together.
  es: Beren y Lúthien despertaron de nuevo en los verdes bosques de Doriath, vivos, y juntos.
- id: melian
  en: They went to Menegroth. Thingol rejoiced, and the Silmaril Beren had won stayed with him. But Melian saw in her daughter's face that she was mortal now, and grieved.
  es: Fueron a Menegroth. Thingol se alegró, y el Silmaril que Beren había ganado se quedó con él. Pero Melian vio en el rostro de su hija que ahora era mortal, y sufrió.
- id: ossiriand
  en: Then they went east to Ossiriand, the Land of Seven Rivers, and made their home on the green isle of Tol Galen.
  es: Luego se fueron al este, a Ossiriand, la Tierra de los Siete Ríos, y se hicieron un hogar en la verde isla de Tol Galen.
- id: peace
  en: They lived quietly there, far from the wars of the world, and no mortal spoke with Beren again. Their son Dior was born there.
  es: Vivieron allí en paz, lejos de las guerras del mundo, y ningún mortal volvió a hablar con Beren. Allí nació su hijo, Dior.
- id: kindreds
  en: Through their children and their children's children, something of Lúthien would flow into the families of Men, and never be wholly lost.
  es: A través de sus hijos y de los hijos de sus hijos, algo de Lúthien pasaría a las familias de los Hombres, y nunca se perdería del todo.
