- id: home
  en: Through a bitter winter Túrin came back to the land of his childhood, and found his mother's house empty and fallen into ruin.
  es: Atravesando un invierno cruel, Túrin volvió a la tierra de su infancia, y encontró la casa de su madre vacía y en ruinas.
- id: aerin
  en: From Aerin, a kinswoman, he learned that Morwen and Nienor had gone south to Doriath, seeking him. The dragon had lied.
  es: Por Aerin, una pariente, supo que Morwen y Nienor se habían ido al sur, a Doriath, en su busca. El dragón había mentido.
- id: brodda
  en: In his fury he struck down Brodda, the Easterling who had taken Aerin and the land, in his own hall, and had to flee once more.
  es: En su furia abatió a Brodda, el Oriental que se había adueñado de Aerin y de la tierra, en su propio salón, y tuvo que huir una vez más.
- id: late
  en: He had come north for nothing, and left Finduilas for nothing. Once again, he was too late.
  es: Había venido al norte para nada, y había abandonado a Finduilas para nada. Una vez más, llegaba tarde.
