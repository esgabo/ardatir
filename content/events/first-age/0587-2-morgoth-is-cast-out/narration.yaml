- id: pits
  en: Angband's mountains were broken and its deep pits laid open. The host of the Valar went down into them.
  es: Las montañas de Angband estaban rotas y sus hondos pozos al descubierto. La hueste de los Valar descendió a ellos.
- id: plea
  en: Morgoth fled to his deepest dungeon and begged for peace and pardon. This time, no one believed him.
  es: Morgoth huyó a su mazmorra más profunda y suplicó paz y perdón. Esta vez nadie le creyó.
- id: bound
  en: He was thrown down and bound again with the chain Angainor, and his iron crown was beaten into a collar around his neck.
  es: Lo derribaron y lo ataron de nuevo con la cadena Angainor, y su corona de hierro fue martillada hasta convertirla en un collar alrededor de su cuello.
- id: jewels
  en: The two Silmarils still in the crown were taken from it and given to Eönwë to keep.
  es: Los dos Silmarils que quedaban en la corona le fueron arrancados y entregados a Eönwë para que los guardara.
- id: void
  en: Then the Valar thrust Morgoth out through the Door of Night, beyond the walls of the world, into the Void.
  es: Entonces los Valar arrojaron a Morgoth por la Puerta de la Noche, más allá de los muros del mundo, al Vacío.
