- id: secret
  en: For a while Beren and Lúthien met in secret in the woods. But Daeron the minstrel, who also loved Lúthien, told the king.
  es: Durante un tiempo Beren y Lúthien se vieron en secreto en los bosques. Pero Daeron el juglar, que también amaba a Lúthien, se lo contó al rey.
- id: hall
  en: Lúthien herself led Beren into Menegroth and stood beside him before her father's throne, while her mother Melian watched in silence.
  es: La propia Lúthien llevó a Beren a Menegroth y se quedó a su lado ante el trono de su padre, mientras su madre Melian observaba en silencio.
- id: anger
  en: Thingol was furious that a mortal Man should dare to love his daughter. Beren answered without fear, and showed Barahir's ring, the token of Finrod's friendship.
  es: Thingol se enfureció de que un Hombre mortal osara amar a su hija. Beren respondió sin miedo, y mostró el anillo de Barahir, prenda de la amistad de Finrod.
- id: price
  en: "Then Thingol set a price he believed impossible: Beren could have Lúthien if he brought him one of the Silmarils from Morgoth's iron crown."
  es: "Entonces Thingol fijó un precio que creía imposible: Beren tendría a Lúthien si le traía uno de los Silmarils de la corona de hierro de Morgoth."
- id: quest
  en: Beren accepted, and left Doriath with the quest before him. Melian warned the king that with those words he had bound a heavy fate to his own house.
  es: Beren aceptó, y dejó Doriath con la empresa por delante. Melian advirtió al rey que con aquellas palabras había atado un destino terrible a su propia casa.
