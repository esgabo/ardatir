- id: menegroth
  en: Finrod visited Thingol in Doriath and marvelled at Menegroth, the Thousand Caves, a king's halls carved deep in the rock.
  es: Finrod visitó a Thingol en Doriath y quedó maravillado ante Menegroth, las Mil Cavernas, unos salones reales excavados en lo hondo de la roca.
- id: narog
  en: He longed for such a stronghold of his own. In the west, high above the gorge of the river Narog, he found deep caves in the cliffs.
  es: Deseó tener una fortaleza así. En el oeste, muy por encima de la garganta del río Narog, encontró cuevas profundas en los acantilados.
- id: delving
  en: With the help of the Dwarves of the Blue Mountains, he carved them into a great hidden city, with long halls and fountains inside the rock.
  es: Con la ayuda de los Enanos de las Montañas Azules, las convirtió en una gran ciudad oculta, con largos salones y fuentes dentro de la roca.
- id: felagund
  en: The Dwarves called him Felagund, Hewer of Caves, and he kept that name all his life.
  es: Los Enanos lo llamaron Felagund, el Excavador de Cavernas, y conservó ese nombre toda su vida.
- id: people
  en: Finrod brought his people to live there, in Nargothrond. His brother Orodreth kept watch for him in the north, in a tower on the island of Tol Sirion.
  es: Finrod llevó allí a su pueblo, a Nargothrond. Su hermano Orodreth vigilaba por él en el norte, en una torre en la isla de Tol Sirion.
