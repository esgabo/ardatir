- id: ring
  en: After the Glorious Battle, the princes of the Noldor set a ring of watchers around Angband, from the hills in the west to the plains in the east.
  es: Tras la Batalla Gloriosa, los príncipes de los Noldor tendieron un anillo de vigías alrededor de Angband, desde las colinas del oeste hasta las llanuras del este.
- id: watch
  en: Fingolfin watched the plain of Ard-galen from the northern mountains, and Maedhros held the hill of Himring in the east.
  es: Fingolfin vigilaba la llanura de Ard-galen desde las montañas del norte, y Maedhros guardaba la colina de Himring en el este.
- id: bloom
  en: Behind that guard, Beleriand flourished. The Elves built and sang and travelled, and for nearly four hundred years the land was at peace.
  es: Tras esa guardia, Beleriand floreció. Los Elfos construían, cantaban y viajaban, y durante casi cuatrocientos años la tierra estuvo en paz.
- id: deep
  en: But the siege was never complete. Morgoth could not be dug out of his deep halls, and there, in the dark, he bred his creatures and waited.
  es: Pero el asedio nunca fue completo. A Morgoth no se le podía sacar de sus hondas estancias, y allí, en la oscuridad, criaba a sus criaturas y esperaba.
- id: glaurung
  en: Once a young dragon crept out, Glaurung, still only half-grown. Fingon's riders drove him back with their arrows, and the Elves thought little more of it.
  es: Una vez salió a rastras un dragón joven, Glaurung, aún a medio crecer. Los jinetes de Fingon lo hicieron retroceder con sus flechas, y los Elfos no le dieron más importancia.
