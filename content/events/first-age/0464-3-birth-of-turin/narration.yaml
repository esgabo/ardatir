- id: dorlomin
  en: In Dor-lómin, in the cold north-west, lived Húrin, lord of the House of Hador, and his wife Morwen, a proud and beautiful lady of the House of Bëor.
  es: En Dor-lómin, en el frío noroeste, vivían Húrin, señor de la Casa de Hador, y su esposa Morwen, una dama orgullosa y hermosa de la Casa de Bëor.
- id: son
  en: In the year Beren first saw Lúthien, Morwen gave birth to their first child, a son. Húrin named him Túrin.
  es: El año en que Beren vio por primera vez a Lúthien, Morwen dio a luz a su primer hijo, un varón. Húrin lo llamó Túrin.
- id: boy
  en: The boy had his mother's dark hair and grey eyes, and her serious, proud heart. He was slow to laugh, but quick to pity.
  es: El niño tenía el pelo oscuro y los ojos grises de su madre, y su corazón serio y orgulloso. Tardaba en reír, pero se compadecía enseguida.
- id: gondolin
  en: Years before, as boys, Húrin and his brother Huor had been carried by eagles to hidden Gondolin, and had lived there a while as guests of King Turgon. Húrin had kept its secret ever since.
  es: Años atrás, de muchachos, Húrin y su hermano Huor habían sido llevados por las águilas a la oculta Gondolin, y habían vivido allí un tiempo como huéspedes del rey Turgon. Húrin guardaba su secreto desde entonces.
- id: shadow
  en: Since the Sudden Flame the war had gone badly, and Morgoth's shadow lay close over the north. Túrin was born into that shadow.
  es: Desde la Llama Súbita la guerra iba mal, y la sombra de Morgoth se cernía sobre el norte. Túrin nació bajo esa sombra.
