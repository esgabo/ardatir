- id: friend
  en: Fingon could not bear the feud between the houses. And he remembered his old friendship with Maedhros, who had not wanted to leave him behind at Losgar.
  es: Fingon no soportaba la enemistad entre las casas. Y recordaba su vieja amistad con Maedhros, que no había querido dejarlo atrás en Losgar.
- id: climb
  en: Without a word to anyone, he went alone to Thangorodrim and climbed among its cliffs, searching for his friend.
  es: Sin decir nada a nadie, fue solo a Thangorodrim y trepó por sus precipicios, buscando a su amigo.
- id: song
  en: Finding no way, he sang a song of the Noldor that they had sung together long ago in Valinor. High above, a faint voice took up the song. It was Maedhros.
  es: Al no hallar camino, entonó una canción de los Noldor que habían cantado juntos mucho tiempo atrás en Valinor. Muy arriba, una voz débil siguió la canción. Era Maedhros.
- id: plea
  en: But Maedhros hung far out of reach. He begged Fingon to shoot him with an arrow and end his pain. Fingon drew his bow, and called on Manwë for help.
  es: Pero Maedhros colgaba muy lejos de su alcance. Le rogó a Fingon que le disparara una flecha y pusiera fin a su dolor. Fingon tensó el arco y pidió ayuda a Manwë.
- id: eagle
  en: At that moment Thorondor, king of the eagles, swooped down and carried Fingon up to his friend.
  es: En ese momento Thorondor, rey de las Águilas, descendió y llevó a Fingon hasta su amigo.
- id: freed
  en: The chain could not be broken, so Fingon cut off Maedhros's hand at the wrist, and the eagle bore them both home. Maedhros healed, and gave up his claim to be king, so that the feud could end.
  es: La cadena no podía romperse, así que Fingon le cortó a Maedhros la mano por la muñeca, y el águila los llevó a los dos a casa. Maedhros sanó, y renunció a su derecho a ser rey para que terminara la enemistad.
