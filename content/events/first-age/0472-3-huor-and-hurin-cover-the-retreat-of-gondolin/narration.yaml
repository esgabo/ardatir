- id: retreat
  en: As the rout spread, Turgon gathered what was left of his host and turned south toward the Pass of Sirion, and the way home to hidden Gondolin.
  es: Mientras la derrota se extendía, Turgon reunió lo que quedaba de su hueste y se volvió al sur, hacia el Paso del Sirion y el camino de vuelta a la oculta Gondolin.
- id: stand
  en: Húrin and Huor, with the Men of Dor-lómin, made a stand behind him, at the marshes and the stream across the mouth of the pass, so the enemy could not follow.
  es: Húrin y Huor, con los Hombres de Dor-lómin, se hicieron fuertes tras él, en las ciénagas y el arroyo que cruzaban la entrada del paso, para que el enemigo no pudiera seguirlo.
- id: farewell
  en: Húrin urged Turgon to go while he still could, for the hidden city was the Elves' last hope. And Huor foresaw that one day a great hope would come from Turgon's house and his own.
  es: Húrin instó a Turgon a marcharse mientras aún podía, pues la ciudad oculta era la última esperanza de los Elfos. Y Huor previó que algún día de la casa de Turgon y de la suya nacería una gran esperanza.
- id: huor
  en: The Men of Dor-lómin fought until almost all had fallen. Huor was struck by an arrow and died.
  es: Los Hombres de Dor-lómin lucharon hasta que casi todos cayeron. Huor fue alcanzado por una flecha y murió.
- id: hurin
  en: Húrin fought on alone, crying out each time he struck that day would come again, until he was buried under his foes. Then, at Morgoth's command, he was taken alive to Angband.
  es: Húrin siguió luchando solo, gritando a cada golpe que el día volvería, hasta quedar sepultado bajo sus enemigos. Entonces, por orden de Morgoth, lo llevaron vivo a Angband.
