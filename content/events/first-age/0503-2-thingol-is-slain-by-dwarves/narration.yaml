- id: desire
  en: Thingol wished to wear his Silmaril. He asked the Dwarves of Nogrod, the finest smiths of the age, to set it in the Nauglamír.
  es: Thingol deseaba llevar puesto su Silmaril. Pidió a los Enanos de Nogrod, los mejores herreros de su tiempo, que lo engastaran en el Nauglamír.
- id: craft
  en: They remade the necklace more beautiful than ever, with the Silmaril shining at its heart. But as they worked, they came to crave it for themselves.
  es: Rehicieron el collar más hermoso que nunca, con el Silmaril brillando en su centro. Pero mientras trabajaban, empezaron a codiciarlo para sí.
- id: quarrel
  en: When the work was done, they claimed the necklace as theirs by right. Thingol answered them with scorn.
  es: Cuando terminaron, reclamaron el collar como suyo por derecho. Thingol les respondió con desprecio.
- id: slain
  en: In their anger they struck down the king in the deep halls of Menegroth. They fled with the jewel, but were hunted down, and the Nauglamír was brought back.
  es: En su ira, mataron al rey en las hondas estancias de Menegroth. Huyeron con la joya, pero los persiguieron, y el Nauglamír fue recuperado.
- id: melian
  en: Melian sat long in silent grief beside him. Then she left Middle-earth and returned to Valinor, and the enchantment that had guarded Doriath for so long faded away.
  es: Melian permaneció mucho tiempo junto a él, en silencio y llena de pena. Luego dejó la Tierra Media y volvió a Valinor, y el encantamiento que había protegido Doriath durante tanto tiempo se desvaneció.
- id: sack
  en: With the forest unguarded, a host of Dwarves came from Nogrod to avenge their kin. They broke into Menegroth and carried off its treasure, the Nauglamír with it.
  es: Con el bosque sin protección, una hueste de Enanos llegó de Nogrod para vengar a los suyos. Irrumpieron en Menegroth y se llevaron su tesoro, y con él el Nauglamír.
