- id: ask
  en: Túrin asked Níniel to marry him. She wished to, yet something in her heart held back, and she did not know why.
  es: Túrin le pidió a Níniel que se casara con él. Ella lo deseaba, pero algo en su corazón la retenía, y no sabía por qué.
- id: brandir
  en: Brandir loved her too, and felt a dread he could not explain. He urged her to wait.
  es: Brandir también la amaba, y sentía un temor que no sabía explicar. Le aconsejó que esperara.
- id: wed
  en: When Túrin asked again, she said yes, and they were married at midsummer, among the people of the forest.
  es: Cuando Túrin volvió a pedírselo, ella dijo que sí, y se casaron en pleno verano, entre la gente del bosque.
- id: happy
  en: For a time they were happy. Túrin kept his word to stay at home and not seek war, and before long Níniel was expecting a child.
  es: Durante un tiempo fueron felices. Túrin cumplió su palabra de quedarse en casa y no buscar la guerra, y al poco Níniel esperaba un hijo.
- id: unknown
  en: Neither of them knew the truth of who they were. Only the dragon, far away in Nargothrond, knew.
  es: Ninguno de los dos sabía la verdad sobre quiénes eran. Solo el dragón, lejos, en Nargothrond, lo sabía.
