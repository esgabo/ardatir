- id: return
  en: "Beren and Lúthien came back to Menegroth. Beren showed the king his empty arm: the Silmaril was in his hand, he said, but his hand was in the wolf. Thingol's heart softened, and he gave Lúthien to Beren."
  es: "Beren y Lúthien volvieron a Menegroth. Beren mostró al rey su brazo vacío: el Silmaril estaba en su mano, dijo, pero su mano estaba en el lobo. El corazón de Thingol se ablandó, y le concedió a Lúthien."
- id: wolf
  en: But Carcharoth, maddened by the jewel, had broken into Doriath, and nothing could stand in his way. Thingol and Beren went out to hunt him, with the hound Huan and Thingol's captains.
  es: Pero Carcharoth, enloquecido por la joya, había entrado en Doriath, y nada podía cerrarle el paso. Thingol y Beren salieron a cazarlo, con el perro Huan y los capitanes de Thingol.
- id: fight
  en: By a waterfall the wolf turned on them and sprang at the king. Beren leapt before him and was badly wounded, and Huan threw himself on the wolf. They fought until both lay dying.
  es: Junto a una cascada el lobo se volvió contra ellos y saltó sobre el rey. Beren se interpuso y quedó gravemente herido, y Huan se lanzó sobre el lobo. Lucharon hasta que los dos cayeron moribundos.
- id: silmaril
  en: The Silmaril was cut from the wolf's body and laid in Beren's hand. He held it up and gave it to Thingol, and his quest was over.
  es: Sacaron el Silmaril del cuerpo del lobo y lo pusieron en la mano de Beren. Él lo alzó y se lo dio a Thingol, y su empresa quedó cumplida.
- id: huan
  en: Huan spoke for the third and last time in his life, to bid Beren farewell, and died.
  es: Huan habló por tercera y última vez en su vida, para despedirse de Beren, y murió.
- id: arms
  en: They carried Beren home, and he died in Lúthien's arms, asking her to wait for him beyond the Western Sea.
  es: Llevaron a Beren a casa, y murió en brazos de Lúthien, pidiéndole que lo esperara más allá del Mar del Oeste.
