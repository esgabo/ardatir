title: { en: "The hunt of Carcharoth", es: "La caza de Carcharoth" }
summary:
  en: "Maddened by the Silmaril, Carcharoth ravages Doriath. Beren and Huan hunt him: Huan kills the wolf but is slain, and Beren is mortally wounded. The Silmaril is cut from the wolf's belly, and Beren dies in Lúthien's arms."
  es: "Enloquecido por el Silmaril, Carcharoth asuela Doriath. Beren y Huan le dan caza: Huan mata al lobo pero muere a su vez, y Beren queda herido de muerte. El Silmaril es extraído del vientre del lobo, y Beren muere en brazos de Lúthien."
