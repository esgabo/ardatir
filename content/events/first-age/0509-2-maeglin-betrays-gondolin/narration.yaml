- id: ore
  en: Maeglin loved to search the mountains for metal ore, and sometimes went out beyond the Encircling Mountains, against the king's command.
  es: A Maeglin le gustaba buscar mineral en las montañas, y a veces salía más allá de las Montañas Circundantes, contra la orden del rey.
- id: captured
  en: One day orcs caught him there, and carried him to Angband.
  es: Un día los orcos lo atraparon allí y se lo llevaron a Angband.
- id: bargain
  en: Maeglin feared torment. Morgoth promised him the lordship of Gondolin, and Idril for his own, if he would show the way in.
  es: Maeglin temía el tormento. Morgoth le prometió el señorío de Gondolin, e Idril para él, si le mostraba el camino para entrar.
- id: betrayal
  en: So Maeglin told Morgoth where the city lay and how it could be reached. Then he was sent home with a smile on his face, so that no one would suspect.
  es: Así que Maeglin le reveló a Morgoth dónde estaba la ciudad y cómo se podía llegar a ella. Luego lo enviaron de vuelta con una sonrisa en el rostro, para que nadie sospechara.
- id: army
  en: "In Gondolin nothing seemed to change. But in Angband, Morgoth began to build an army for the hidden city: orcs, Balrogs, and dragons of a new kind, made of iron and flame."
  es: "En Gondolin nada pareció cambiar. Pero en Angband, Morgoth empezó a preparar un ejército para la ciudad oculta: orcos, Balrogs y dragones de una nueva clase, hechos de hierro y llamas."
