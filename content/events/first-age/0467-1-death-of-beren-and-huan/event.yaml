summary:
  en: "Maddened by the Silmaril, Carcharoth ravages Doriath. Huan and Beren hunt him and kill him, but Huan dies and Beren is mortally wounded. The Silmaril is cut from the wolf's belly, and Beren dies in Lúthien's arms."
  es: "Enloquecido por el Silmaril, Carcharoth asuela Doriath. Huan y Beren lo cazan y lo matan, pero Huan muere y Beren queda herido de muerte. El Silmaril es extraído del vientre del lobo, y Beren muere en brazos de Lúthien."
