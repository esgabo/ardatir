- id: alone
  en: For four years Beren fought on alone in Dorthonion, until Morgoth set a great price on his head and he had to flee.
  es: Durante cuatro años Beren siguió luchando solo en Dorthonion, hasta que Morgoth puso un gran precio a su cabeza y tuvo que huir.
- id: mountains
  en: He went south over the Mountains of Terror, where great spiders and darker things lived. He came out of them grey and bowed with pain.
  es: Fue hacia el sur por las Montañas del Terror, donde vivían arañas enormes y cosas aún más oscuras. Salió de ellas encanecido y encorvado por el sufrimiento.
- id: girdle
  en: He passed through the enchantment Melian had woven around Doriath, as if fate itself had opened the way for him.
  es: Atravesó el encantamiento que Melian había tejido alrededor de Doriath, como si el propio destino le hubiera abierto el camino.
- id: dance
  en: One summer evening, in a woodland glade, he saw Lúthien, King Thingol's daughter, dancing among tall hemlocks in flower to the music of a flute.
  es: Una tarde de verano, en un claro del bosque, vio a Lúthien, la hija del rey Thingol, bailando entre altas cicutas en flor al son de una flauta.
- id: spell
  en: All his pain was forgotten, and he could not speak. She vanished into the trees, and he wandered the woods for months, searching for her.
  es: Olvidó todo su dolor y se quedó sin habla. Ella desapareció entre los árboles, y él vagó por los bosques durante meses, buscándola.
- id: tinuviel
  en: "When spring came he saw her again, and called out to her: Tinúviel, Nightingale. She stopped, and looked at him, and from that moment she loved him too."
  es: "Cuando llegó la primavera la vio de nuevo y la llamó: Tinúviel, Ruiseñor. Ella se detuvo, lo miró, y desde ese momento también lo amó."
