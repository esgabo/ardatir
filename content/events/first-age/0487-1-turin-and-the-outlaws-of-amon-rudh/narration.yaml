- id: outlaws
  en: Far from Doriath, Túrin became the leader of a band of outlaws in the woods south of the Teiglin, calling himself Neithan, the Wronged.
  es: Lejos de Doriath, Túrin se convirtió en jefe de una banda de proscritos en los bosques al sur del Teiglin, y se hacía llamar Neithan, el Agraviado.
- id: mim
  en: They caught an old Petty-dwarf named Mîm, and to save his life he led them to his hidden home inside the hill of Amon Rûdh.
  es: Atraparon a un viejo Enano Mezquino llamado Mîm, y para salvar la vida los llevó a su hogar oculto dentro de la colina de Amon Rûdh.
- id: son
  en: One of Mîm's sons had been struck by an outlaw's arrow, and died of it. Mîm never forgave them.
  es: Uno de los hijos de Mîm había sido alcanzado por una flecha de los proscritos, y murió de ello. Mîm nunca se lo perdonó.
- id: beleg
  en: Then Beleg found Túrin again. He could not persuade him to go home, so he stayed, bringing Elvish bread and healing, and the land around became known for the Bow and the Helm.
  es: Entonces Beleg encontró de nuevo a Túrin. No logró convencerlo de volver a casa, así que se quedó, trayendo pan élfico y curación, y la tierra de alrededor se hizo famosa por el Arco y el Yelmo.
- id: betrayed
  en: Their fame reached Morgoth. Mîm, caught by orcs, led them to the secret hill. The outlaws were overrun, Beleg was left wounded, and Túrin was carried off a prisoner.
  es: Su fama llegó a oídos de Morgoth. Mîm, capturado por los orcos, los condujo a la colina secreta. Los proscritos fueron arrollados, Beleg quedó herido y Túrin fue llevado prisionero.
