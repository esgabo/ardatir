- id: winter
  en: Tuor and Voronwë went east through the Fell Winter, the cruellest anyone remembered, hidden under Ulmo's cloak.
  es: Tuor y Voronwë fueron hacia el este a través del Invierno Cruel, el más duro que nadie recordaba, ocultos bajo el manto de Ulmo.
- id: ivrin
  en: They came to the pools of Ivrin, where the Narog rises, and found them fouled and broken. The dragon had passed that way.
  es: Llegaron a los lagos de Ivrin, donde nace el Narog, y los encontraron mancillados y destrozados. El dragón había pasado por allí.
- id: stranger
  en: As they stood grieving, a tall man in black, with a long black sword, hurried past them northward, and they heard him cry out the name of Nargothrond.
  es: Mientras se lamentaban, un hombre alto vestido de negro, con una larga espada negra, pasó a toda prisa hacia el norte, y lo oyeron gritar el nombre de Nargothrond.
- id: cousins
  en: It was Túrin, hurrying north after the dragon's lie. He and Tuor were cousins, sons of the brothers Húrin and Huor, but neither knew the other, and they never met again.
  es: Era Túrin, que corría hacia el norte tras la mentira del dragón. Él y Tuor eran primos, hijos de los hermanos Húrin y Huor, pero ninguno reconoció al otro, y nunca volvieron a encontrarse.
- id: fear
  en: Voronwë understood from his cry that Nargothrond had fallen. With greater fear, they pressed on toward Gondolin.
  es: Por aquel grito, Voronwë comprendió que Nargothrond había caído. Con más miedo que antes, siguieron hacia Gondolin.
