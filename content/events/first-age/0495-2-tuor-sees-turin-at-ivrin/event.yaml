title: { en: Tuor sees Túrin at Ivrin, es: Tuor ve a Túrin en Ivrin }
summary:
  en: On the road to Gondolin, Tuor and Voronwë find the pools of Ivrin defiled. A tall man in black hurries past them northward. It is Túrin, Tuor's cousin, and neither knows the other.
  es: En el camino a Gondolin, Tuor y Voronwë encuentran profanados los lagos de Ivrin. Un hombre alto vestido de negro pasa a toda prisa hacia el norte. Es Túrin, primo de Tuor, y ninguno reconoce al otro.
