- id: stays
  en: Tuor stayed in Gondolin. He learned the lore of the Elves and grew strong and wise, and Turgon came to love him.
  es: Tuor se quedó en Gondolin. Aprendió la sabiduría de los Elfos y se volvió fuerte y sabio, y Turgon llegó a quererlo.
- id: idril
  en: Idril, the king's golden-haired daughter, loved him in return.
  es: Idril, la hija del rey, de cabellos dorados, lo amó a su vez.
- id: wed
  en: Turgon gave her to him, and there was great joy in the city. After Beren and Lúthien, it was only the second marriage between the Elves and Men.
  es: Turgon se la concedió, y hubo gran alegría en la ciudad. Después de Beren y Lúthien, era solo el segundo matrimonio entre los Elfos y los Hombres.
- id: maeglin
  en: Only Maeglin was not glad. He had long wanted Idril for himself, and his hatred of Tuor grew in silence.
  es: Solo Maeglin no se alegró. Hacía mucho que deseaba a Idril para sí, y su odio hacia Tuor crecía en silencio.
