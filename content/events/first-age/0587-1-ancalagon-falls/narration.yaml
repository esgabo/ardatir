- id: dragons
  en: "Driven back to Angband, Morgoth let loose his last and greatest weapon: winged dragons, never seen before."
  es: "Acorralado en Angband, Morgoth soltó su última y mayor arma: dragones alados, nunca vistos hasta entonces."
- id: storm
  en: They burst out in a storm of fire and thunder, and the host of the Valar fell back before them.
  es: Salieron en una tormenta de fuego y truenos, y la hueste de los Valar retrocedió ante ellos.
- id: earendil
  en: Then Eärendil came, shining in his ship of the sky, and with him all the great birds of the heavens, led by Thorondor.
  es: Entonces llegó Eärendil, resplandeciente en su nave del cielo, y con él todas las grandes aves de los cielos, guiadas por Thorondor.
- id: battle
  en: They fought in the air all day and all through the night. Before the sun rose, Eärendil slew Ancalagon the Black, mightiest of the dragons.
  es: Lucharon en el aire todo el día y toda la noche. Antes del amanecer, Eärendil mató a Ancalagon el Negro, el más poderoso de los dragones.
- id: fall
  en: Ancalagon crashed down on Thangorodrim, and its towers were broken by his fall. The sun rose, and the dragons were gone.
  es: Ancalagon se desplomó sobre Thangorodrim, y sus torres se quebraron con la caída. Salió el sol, y los dragones habían desaparecido.
