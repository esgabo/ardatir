- id: hoard
  en: Húrin went to the empty halls of Nargothrond, where the dragon's treasure still lay. Mîm the dwarf was there, gloating over it, and Húrin slew him.
  es: Húrin fue a las estancias vacías de Nargothrond, donde aún yacía el tesoro del dragón. Allí estaba Mîm el enano, regodeándose con él, y Húrin lo mató.
- id: necklace
  en: "From the whole hoard he took only one thing: the Nauglamír, a famous necklace the Dwarves had made long ago for Finrod."
  es: "De todo el tesoro tomó una sola cosa: el Nauglamír, un famoso collar que los Enanos habían hecho mucho tiempo atrás para Finrod."
- id: throw
  en: He carried it to Menegroth, threw it at Thingol's feet, and told the king bitterly that this was his payment for keeping Húrin's wife and children so poorly.
  es: Lo llevó a Menegroth, lo arrojó a los pies de Thingol y le dijo con amargura al rey que aquel era su pago por haber cuidado tan mal de su esposa y sus hijos.
- id: melian
  en: "Then Melian spoke to him, gently, and told him the truth: his mind had been bent by Morgoth, and Thingol had sheltered his family as well as he could."
  es: "Entonces Melian le habló con dulzura y le dijo la verdad: Morgoth había torcido su mente, y Thingol había protegido a su familia lo mejor que pudo."
- id: gift
  en: Húrin's anger left him. He picked up the necklace and gave it to Thingol as a gift. Then he went away into the west, and was never seen again.
  es: La ira de Húrin se desvaneció. Recogió el collar y se lo dio a Thingol como regalo. Luego se marchó hacia el oeste, y nunca más se le volvió a ver.
