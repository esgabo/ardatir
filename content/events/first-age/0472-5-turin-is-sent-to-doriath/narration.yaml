- id: easterlings
  en: After the great battle, Easterlings took Dor-lómin and treated its people cruelly. Morwen feared that her son would be taken from her.
  es: Tras la gran batalla, los Orientales se adueñaron de Dor-lómin y trataron con crueldad a su gente. Morwen temía que le arrebataran a su hijo.
- id: send
  en: So, though it broke her heart, she sent eight-year-old Túrin south over the mountains with two old servants, to seek King Thingol, who had come to honour Beren, her kinsman.
  es: Así que, aunque se le partía el corazón, envió al sur, por las montañas, a Túrin, de ocho años, con dos ancianos criados, en busca del rey Thingol, que había llegado a honrar a Beren, pariente de ella.
- id: road
  en: The road was long and hard. Lost and starving at the edge of Doriath, they were found by Beleg the Strongbow, who brought them to Menegroth.
  es: El camino fue largo y duro. Perdidos y hambrientos en el linde de Doriath, los encontró Beleg Arcofirme, que los llevó a Menegroth.
- id: welcome
  en: Thingol welcomed the boy for Beren's sake and took him as his foster-son, and Queen Melian watched over him kindly.
  es: Thingol acogió al niño en recuerdo de Beren y lo tomó como hijo adoptivo, y la reina Melian velaba por él con cariño.
- id: parting
  en: Morwen stayed behind in Dor-lómin, expecting her second child. Túrin never saw his mother again.
  es: Morwen se quedó en Dor-lómin, esperando a su segundo hijo. Túrin nunca volvió a ver a su madre.
