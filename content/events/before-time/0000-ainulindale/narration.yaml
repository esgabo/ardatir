- id: void
  en: Before there was a world, there was only Ilúvatar, the One, and the Ainur he had made from his thought.
  es: Antes de que hubiera un mundo, solo existía Ilúvatar, el Único, y los Ainur que había creado de su pensamiento.
- id: theme
  en: He gave them a great theme, and they began to sing it together, each adding their own voice.
  es: Les dio un gran tema, y comenzaron a cantarlo juntos, cada uno sumando su propia voz.
- id: harmony
  en: Their music filled the emptiness, rising and weaving into a single harmony.
  es: Su música llenó el vacío, elevándose y entretejiéndose en una sola armonía.
- id: discord
  en: But Melkor, the mightiest of them, wanted more than his part. He wove his own thoughts into the music, and discord spread around him.
  es: Pero Melkor, el más poderoso de ellos, quiso más que su parte. Entretejió sus propios pensamientos en la música, y la discordia se extendió a su alrededor.
- id: struggle
  en: Twice Ilúvatar raised a new theme, and twice the discord rose against it, until the two musics fought in the halls.
  es: Dos veces alzó Ilúvatar un nuevo tema, y dos veces la discordia se alzó contra él, hasta que las dos músicas lucharon en las estancias.
- id: silence
  en: Then, with a single chord, Ilúvatar ended the music.
  es: Entonces, con un solo acorde, Ilúvatar puso fin a la música.
- id: vision
  en: "He showed the Ainur what they had sung: a vision of a world, turning in the void, with its seas and lands and the long story still to come."
  es: "Mostró a los Ainur lo que habían cantado: la visión de un mundo que giraba en el vacío, con sus mares y sus tierras, y la larga historia aún por venir."
- id: ea
  en: And then he spoke one word, Eä. Let it be. And the world was real.
  es: Y entonces pronunció una palabra, Eä. Que sea. Y el mundo fue real.
- id: arda
  en: In the middle of the void lay Arda, wrapped in its airs and its encircling seas. Some of the Ainur went down into it, to shape it, and to wait.
  es: En medio del vacío yacía Arda, envuelta en sus aires y sus mares circundantes. Algunos de los Ainur descendieron a ella, para darle forma, y para esperar.
