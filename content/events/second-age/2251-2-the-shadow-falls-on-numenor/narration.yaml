- id: wealth
  en: Númenor had grown rich and mighty from its voyages, and its people began to want what they could not have.
  es: Númenor se había hecho rica y poderosa con sus viajes, y su gente empezó a desear lo que no podía tener.
- id: death
  en: They lived long, and yet they died. More and more they asked why the Elves and the Valar should endure while Men had to leave the world.
  es: Vivían mucho, y aun así morían. Cada vez más se preguntaban por qué los Elfos y los Valar perduraban mientras los Hombres tenían que abandonar el mundo.
- id: messengers
  en: The Valar sent messengers to tell them that death was no punishment, but Ilúvatar's gift to Men. Few listened.
  es: Los Valar enviaron mensajeros para decirles que la muerte no era un castigo, sino el don de Ilúvatar a los Hombres. Pocos escucharon.
- id: king
  en: King Tar-Atanamir spoke openly against the Valar and clung to his life and his sceptre to the very end, unwilling to let either go.
  es: El rey Tar-Atanamir habló abiertamente contra los Valar y se aferró a la vida y al cetro hasta el final, sin querer soltar ni lo uno ni lo otro.
- id: fear
  en: From then on, the fear of death lay over the island like a shadow.
  es: Desde entonces, el miedo a la muerte se extendió sobre la isla como una sombra.
