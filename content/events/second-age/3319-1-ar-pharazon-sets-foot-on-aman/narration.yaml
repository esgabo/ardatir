- id: beyond
  en: The fleet sailed far beyond the sight of Númenor, past every limit the Ban had set.
  es: La flota navegó mucho más allá de la vista de Númenor, rebasando todos los límites que marcaba la Prohibición.
- id: eressea
  en: It came to Tol Eressëa, and the Elves there mourned. Then it reached the coast of Aman itself, under the silent mountains of the Valar.
  es: Llegó a Tol Eressëa, y los Elfos de allí se lamentaron. Después alcanzó la costa de la propia Aman, bajo las silenciosas montañas de los Valar.
- id: doubt
  en: For a moment Ar-Pharazôn wavered and almost turned back. But his pride was stronger than his fear.
  es: Por un momento Ar-Pharazôn vaciló y estuvo a punto de volverse. Pero su orgullo pudo más que su miedo.
- id: landing
  en: He stepped onto the forbidden shore and declared that the land was his.
  es: Pisó la orilla prohibida y proclamó que aquella tierra era suya.
- id: camp
  en: His army camped around Túna, the hill-city of the Elves, which stood empty, for its people had fled.
  es: Su ejército acampó alrededor de Túna, la ciudad élfica de la colina, que estaba vacía, porque su gente había huido.
