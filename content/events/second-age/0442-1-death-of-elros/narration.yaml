- id: reign
  en: Elros ruled Númenor for four hundred and ten years, and under him the island grew strong and fair.
  es: Elros gobernó Númenor durante cuatrocientos diez años, y bajo su reinado la isla se hizo fuerte y hermosa.
- id: death
  en: At last, at five hundred years of age, he died, as all Men must. He was the first of the long-lived kings of Númenor.
  es: Por fin, a los quinientos años de edad, murió, como han de morir todos los Hombres. Fue el primero de los longevos reyes de Númenor.
- id: line
  en: His heirs took the sceptre after him, and kings of his line would rule the island until its end.
  es: Sus herederos tomaron el cetro después de él, y reyes de su linaje gobernarían la isla hasta su final.
- id: elrond
  en: Far away in Middle-earth, his brother Elrond lived on among the Elves, unchanged. Ages later, he would raise Elros's distant heirs in his own house.
  es: Lejos, en la Tierra Media, su hermano Elrond seguía viviendo entre los Elfos, sin cambiar. Edades después, criaría en su propia casa a los lejanos herederos de Elros.
