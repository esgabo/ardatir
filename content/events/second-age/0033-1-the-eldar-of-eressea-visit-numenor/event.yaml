title: { en: "The Eldar of Eressëa visit Númenor", es: "Los Eldar de Eressëa visitan Númenor" }
summary:
  en: "In the early centuries, Elven ships come from Tol Eressëa to the western shore and are welcomed as friends. They teach songs and lore and bring gifts: flowers, singing birds and a seedling of the White Tree of Eressëa, which grows into Nimloth in the King's courtyard."
  es: "En los primeros siglos, naves élficas llegan desde Tol Eressëa a la costa occidental y son recibidas como amigas. Enseñan cantos y saberes y traen regalos: flores, aves canoras y un retoño del Blanco Árbol de Eressëa, que crece como Nimloth en el patio del Rey."
