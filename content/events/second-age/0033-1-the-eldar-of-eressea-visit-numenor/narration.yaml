- id: ships
  en: In the first centuries of Númenor, ships often came out of the west to the haven of Andúnië. They were Elven ships, from Tol Eressëa, the island beside Aman.
  es: En los primeros siglos de Númenor, a menudo llegaban barcos desde el oeste al puerto de Andúnië. Eran barcos élficos, de Tol Eressëa, la isla junto a Aman.
- id: friends
  en: The Elves were welcomed as friends. They taught songs and lore, and many Númenóreans learned to speak their tongues.
  es: Los Elfos eran recibidos como amigos. Enseñaban canciones y saberes, y muchos númenóreanos aprendieron a hablar sus lenguas.
- id: gifts
  en: "They brought gifts as well: flowers and fragrant trees, birds that sang, and fair things from the Blessed Realm."
  es: "También traían regalos: flores y árboles fragantes, pájaros cantores y cosas hermosas del Reino Bendecido."
- id: tree
  en: The finest gift was a seedling of the White Tree of Eressëa. Planted in the King's courtyard, it grew into Nimloth the Fair and flowered white above the city.
  es: El mejor regalo fue un retoño del Árbol Blanco de Eressëa. Plantado en el patio del Rey, se convirtió en Nimloth el Hermoso y floreció en blanco sobre la ciudad.
- id: fade
  en: The visits went on for long centuries. Only much later, as the kings turned against the Elves, did the ships grow rare, until they came only in secret.
  es: Las visitas continuaron durante largos siglos. Solo mucho después, cuando los reyes se volvieron contra los Elfos, los barcos empezaron a escasear, hasta que solo llegaban a escondidas.
