- id: old
  en: Ar-Pharazôn was growing old, and the fear of death gnawed at him.
  es: Ar-Pharazôn envejecía, y el miedo a la muerte lo corroía.
- id: whisper
  en: Sauron told him that the Valar were keeping endless life from him, and that whoever held the Undying Lands would never die. A king as great as he, Sauron said, could simply take them.
  es: Sauron le dijo que los Valar le negaban la vida sin fin, y que quien poseyera las Tierras Imperecederas no moriría jamás. Un rey tan grande como él, decía Sauron, podía sencillamente tomarlas.
- id: build
  en: So for years the forests of Númenor were felled, and the smiths hammered day and night, making ships and weapons.
  es: Así que durante años se talaron los bosques de Númenor, y los herreros martillearon día y noche, fabricando barcos y armas.
- id: fleet
  en: "When it was done, the Great Armament filled the western havens: the mightiest fleet Men had ever made."
  es: "Cuando terminaron, la Gran Armada llenaba los puertos del oeste: la flota más poderosa que los Hombres habían construido jamás."
- id: dread
  en: The Faithful watched the ships gather, and were afraid.
  es: Los Fieles veían reunirse los barcos, y tenían miedo.
