- id: warning
  en: Sauron was urging the King to cut down Nimloth, the White Tree in the King's courts. Amandil told his family, and remembered the old belief that the line of the Kings was bound to the Tree.
  es: Sauron insistía al Rey en que talara Nimloth, el Árbol Blanco de los patios del Rey. Amandil se lo contó a su familia, y recordó la antigua creencia de que el linaje de los Reyes estaba unido al Árbol.
- id: resolve
  en: His grandson Isildur, still young, made up his mind to save something of it.
  es: Su nieto Isildur, todavía joven, decidió salvar algo de él.
- id: night
  en: He went by night, in disguise, into the forbidden courts of Armenelos, where the Tree stood under guard at Sauron's command.
  es: Fue de noche, disfrazado, a los patios prohibidos de Armenelos, donde el Árbol estaba vigilado por orden de Sauron.
- id: fruit
  en: He took a single fruit from the Tree and ran. The guards fell on him, and he fought his way out, badly wounded.
  es: Tomó un único fruto del Árbol y huyó. Los guardias se le echaron encima, y él se abrió paso luchando, gravemente herido.
- id: heal
  en: The fruit reached Amandil and was planted in secret. Isildur lay near death for a long while, and only grew well again when the seed put out its first leaf.
  es: El fruto llegó a manos de Amandil y se plantó en secreto. Isildur estuvo largo tiempo al borde de la muerte, y solo sanó cuando la semilla echó su primera hoja.
