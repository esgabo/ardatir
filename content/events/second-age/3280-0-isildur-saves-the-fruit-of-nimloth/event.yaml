summary:
  en: "Hearing Amandil warn that the King means to fell Nimloth, his grandson Isildur goes by night, in disguise, into the forbidden courts of Armenelos. He takes a fruit from the guarded Tree and fights his way out, badly wounded, and the fruit reaches Amandil."
  es: "Al oír a Amandil advertir que el Rey piensa talar a Nimloth, su nieto Isildur entra de noche y disfrazado en los patios prohibidos de Armenelos. Toma un fruto del Árbol vigilado y escapa luchando, malherido, y el fruto llega a Amandil."
