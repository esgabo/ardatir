- id: ruin
  en: The war that overthrew Morgoth had broken the land. Beleriand, where the Elves had fought for so long, was gone beneath the sea.
  es: La guerra que derrocó a Morgoth había destrozado la tierra. Beleriand, donde los Elfos habían luchado durante tanto tiempo, había desaparecido bajo el mar.
- id: stay
  en: "Many Elves sailed into the West, but some chose to stay. They gathered in what was left: a green country between the Blue Mountains and the new coast, called Lindon."
  es: "Muchos Elfos navegaron hacia el Oeste, pero algunos decidieron quedarse. Se reunieron en lo que quedaba: una tierra verde entre las Montañas Azules y la nueva costa, llamada Lindon."
- id: king
  en: Gil-galad, the last High King of the Noldor in Middle-earth, ruled them there.
  es: Allí los gobernaba Gil-galad, el último Rey Supremo de los Noldor en la Tierra Media.
- id: havens
  en: On the Gulf of Lhûn, Círdan the Shipwright built the Grey Havens. From there, any Elf grown weary of Middle-earth could still find a ship to the West.
  es: En el golfo de Lhûn, Círdan el Carpintero de Barcos construyó los Puertos Grises. Desde allí, cualquier Elfo cansado de la Tierra Media podría encontrar todavía un barco hacia el Oeste.
