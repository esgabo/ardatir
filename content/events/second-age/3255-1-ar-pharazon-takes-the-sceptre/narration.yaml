- id: heir
  en: When Tar-Palantír died, the sceptre should have passed to his daughter, Míriel.
  es: Cuando murió Tar-Palantír, el cetro debería haber pasado a su hija, Míriel.
- id: seize
  en: But Pharazôn, the son of Gimilkhâd, took it for himself. He married Míriel against her will and against the law, for she was his cousin.
  es: Pero Pharazôn, el hijo de Gimilkhâd, se lo quedó para sí. Se casó con Míriel contra su voluntad y contra la ley, porque era su prima.
- id: fame
  en: Pharazôn had already won fame at war in Middle-earth, and the people loved him for the gold he brought home.
  es: Pharazôn ya se había hecho famoso guerreando en la Tierra Media, y el pueblo lo amaba por el oro que traía a casa.
- id: king
  en: "He ruled as Ar-Pharazôn, the Golden: the proudest and most powerful king Númenor had ever known. And still he wanted more."
  es: "Reinó como Ar-Pharazôn, el Dorado: el rey más orgulloso y poderoso que Númenor había conocido. Y aun así quería más."
