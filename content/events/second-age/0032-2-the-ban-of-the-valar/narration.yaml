- id: rule
  en: The island came with a single rule from the Valar.
  es: La isla llegó acompañada de una única norma de los Valar.
- id: ban
  en: "The Númenóreans could sail wherever they wished, except to the west: never so far that their own shores dropped out of sight. And they must never set foot on the Undying Lands."
  es: "Los númenóreanos podían navegar adonde quisieran, salvo hacia el oeste: nunca tan lejos como para perder de vista sus propias costas. Y jamás debían pisar las Tierras Imperecederas."
- id: why
  en: Living in Aman would not have made them immortal. Death was the lot Ilúvatar had given to Men, and it was not for the Valar to take it away.
  es: Vivir en Aman no los habría hecho inmortales. La muerte era lo que Ilúvatar había dado a los Hombres, y no estaba en manos de los Valar quitársela.
- id: sight
  en: "On the clearest days, the keenest eyes on the island's mountain could just make out a gleam of white far off: a city of the Elves on Eressëa."
  es: "En los días más claros, los ojos más agudos, desde la montaña de la isla, alcanzaban a distinguir un destello blanco a lo lejos: una ciudad de los Elfos en Eressëa."
- id: trust
  en: It was a test of trust. For a long time, the Númenóreans kept it gladly.
  es: Era una prueba de confianza. Durante mucho tiempo, los númenóreanos la cumplieron de buen grado.
