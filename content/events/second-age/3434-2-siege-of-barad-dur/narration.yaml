- id: enter
  en: The Alliance forced its way into Mordor and surrounded Barad-dûr, the Dark Tower.
  es: La Alianza se abrió paso hasta Mordor y rodeó Barad-dûr, la Torre Oscura.
- id: seven
  en: The siege lasted seven years. The tower was too strong to break, and Sauron would not yield.
  es: El sitio duró siete años. La torre era demasiado fuerte para derribarla, y Sauron no se rendía.
- id: sorties
  en: Again and again his forces came out to attack, and fire and missiles fell on the camps. The besiegers suffered heavy losses.
  es: Una y otra vez sus fuerzas salían a atacar, y sobre los campamentos caían fuego y proyectiles. Los sitiadores sufrieron grandes pérdidas.
- id: anarion
  en: Among the dead was Anárion, Elendil's younger son, struck by a stone hurled from the walls.
  es: Entre los muertos estaba Anárion, el hijo menor de Elendil, alcanzado por una piedra lanzada desde las murallas.
- id: worn
  en: But slowly the Dark Lord was worn down, until at last he had to come out and fight in person.
  es: Pero poco a poco el Señor Oscuro se fue desgastando, hasta que por fin tuvo que salir a luchar en persona.
