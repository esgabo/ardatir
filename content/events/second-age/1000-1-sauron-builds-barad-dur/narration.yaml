- id: servant
  en: Morgoth was gone, but his greatest servant, Sauron, had not left Middle-earth.
  es: Morgoth había desaparecido, pero su mayor servidor, Sauron, no había abandonado la Tierra Media.
- id: mordor
  en: "He chose a dark land in the east, fenced in by mountains on three sides: Mordor."
  es: "Eligió una tierra oscura en el este, cercada de montañas por tres lados: Mordor."
- id: tower
  en: Beside Orodruin, the Mountain of Fire, he began to raise a fortress, Barad-dûr, its roots sunk deep in the earth. It would take him centuries to finish.
  es: Junto a Orodruin, la Montaña de Fuego, empezó a levantar una fortaleza, Barad-dûr, con raíces hundidas en lo profundo de la tierra. Tardaría siglos en terminarla.
- id: wait
  en: He hated the Elves and wished to rule all of Middle-earth. But he knew he could not yet win by force, so he grew stronger in secret, and waited.
  es: Odiaba a los Elfos y deseaba gobernar toda la Tierra Media. Pero sabía que aún no podía vencer por la fuerza, así que se fortaleció en secreto, y esperó.
