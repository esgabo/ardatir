- id: out
  en: In the seventh year, the siege grew so tight that Sauron came out of his tower to fight.
  es: En el séptimo año, el cerco era tan cerrado que Sauron salió de su torre a luchar.
- id: slopes
  en: On the slopes of Orodruin, the Dark Lord faced Gil-galad and Elendil.
  es: En las laderas de Orodruin, el Señor Oscuro se enfrentó a Gil-galad y a Elendil.
- id: fall
  en: The struggle was terrible. Gil-galad was slain, burned by the heat of Sauron's hand. Elendil was struck down too, and his sword Narsil shattered in the fall.
  es: La lucha fue terrible. Gil-galad murió, quemado por el calor de la mano de Sauron. También Elendil cayó, y su espada Narsil se hizo pedazos en la caída.
- id: thrown
  en: But Sauron, too, was thrown down. Together, the two kings had brought him to the ground.
  es: Pero también Sauron fue derribado. Entre los dos reyes lo habían echado por tierra.
- id: witness
  en: Isildur had stood by his father to the end, and Elrond and Círdan by Gil-galad. Now the High King of the Elves and the High King of Men lay dead.
  es: Isildur había permanecido junto a su padre hasta el final, y Elrond y Círdan junto a Gil-galad. Ahora el Rey Supremo de los Elfos y el Rey Supremo de los Hombres yacían muertos.
