- id: out
  en: In the seventh year, the siege grew so tight that Sauron came out of his tower to fight.
  es: En el séptimo año, el cerco era tan estrecho que Sauron salió de su torre a luchar.
- id: slopes
  en: On the slopes of Orodruin, the Dark Lord faced Gil-galad and Elendil.
  es: En las laderas de Orodruin, el Señor Oscuro se enfrentó a Gil-galad y a Elendil.
- id: fall
  en: The struggle was terrible. Gil-galad was slain, burned by the heat of Sauron's hand. Elendil was struck down too, and his sword Narsil broke in two beneath him.
  es: La lucha fue terrible. Gil-galad murió, quemado por el calor de la mano de Sauron. También Elendil cayó, y su espada Narsil se partió en dos bajo su cuerpo.
- id: thrown
  en: But Sauron, too, was thrown down. Together, the two kings had brought him to the ground.
  es: Pero también Sauron fue derribado. Entre los dos reyes lo habían echado por tierra.
- id: witness
  en: Elrond and Isildur saw it all. The High King of the Elves and the High King of Men lay dead.
  es: Elrond e Isildur lo vieron todo. El Rey Supremo de los Elfos y el Rey Supremo de los Hombres yacían muertos.
