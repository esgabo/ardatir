- id: dark
  en: The Elves of Eressëa could no longer come to Númenor. Under Sauron's shadow, the island had grown too dark for them.
  es: Los Elfos de Eressëa ya no podían ir a Númenor. Bajo la sombra de Sauron, la isla se había vuelto demasiado oscura para ellos.
- id: gift
  en: "Instead they sent a gift to Amandil, Lord of Andúnië, for the comfort of the Faithful: seven seeing-stones, the palantíri."
  es: "En su lugar enviaron un regalo a Amandil, Señor de Andúnië, para consuelo de los Fieles: siete piedras videntes, los palantíri."
- id: stones
  en: Each was a globe of dark crystal. Through them, those who held the stones could look far away, and share their thoughts with one another.
  es: Cada una era una esfera de cristal oscuro. A través de ellas, quienes las tenían podían ver muy lejos y compartir sus pensamientos unos con otros.
- id: comfort
  en: In those years of fear, the stones were a sign to the Faithful of Rómenna that the Elves had not forgotten them.
  es: En aquellos años de miedo, las piedras eran para los Fieles de Rómenna una señal de que los Elfos no los habían olvidado.
