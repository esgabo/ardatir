- id: storm
  en: Sauron's armies broke through to Ost-in-Edhil, the city of the Elven-smiths.
  es: Los ejércitos de Sauron se abrieron paso hasta Ost-in-Edhil, la ciudad de los herreros elfos.
- id: taken
  en: Celebrimbor defended the smiths' great hall to the last, but he was captured.
  es: Celebrimbor defendió hasta el final la gran sala de los herreros, pero fue capturado.
- id: torment
  en: Sauron took the Nine from the city, and under torment Celebrimbor told him where the Seven were. But he would not say a word about the Three.
  es: Sauron se llevó de la ciudad los Nueve, y bajo tormento Celebrimbor le reveló dónde estaban los Siete. Pero no quiso decir ni una palabra sobre los Tres.
- id: death
  en: So Celebrimbor, grandson of Fëanor, died, and Eregion was laid waste.
  es: Así murió Celebrimbor, nieto de Fëanor, y Eregion quedó asolada.
- id: elrond
  en: Elrond's host came too late to save the city. He gathered the survivors who had escaped and turned north.
  es: El ejército de Elrond llegó demasiado tarde para salvar la ciudad. Reunió a los supervivientes que habían escapado y se dirigió al norte.
