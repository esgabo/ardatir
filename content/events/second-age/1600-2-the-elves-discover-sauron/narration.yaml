- id: feel
  en: The moment Sauron put on the One Ring, Celebrimbor, far away in Eregion, felt him.
  es: En el momento en que Sauron se puso el Anillo Único, Celebrimbor, lejos de allí en Eregion, lo percibió.
- id: know
  en: "He heard Sauron's will reaching for his mind, and understood: the friendly teacher Annatar had been Sauron all along, and he meant to make them his slaves."
  es: "Sintió que la voluntad de Sauron buscaba su mente, y lo comprendió: el amable maestro Annatar había sido Sauron desde el principio, y pretendía convertirlos en sus esclavos."
- id: off
  en: Afraid and angry, the Elves took off their rings, and would not use them while Sauron held the One.
  es: Asustados y furiosos, los Elfos se quitaron sus anillos, y no quisieron usarlos mientras Sauron tuviera el Único.
- id: three
  en: "Above all, the Three must never fall into his hands. Celebrimbor sought Galadriel's counsel: Nenya he gave to her, and Narya and Vilya he sent west to Gil-galad."
  es: "Sobre todo, los Tres no debían caer nunca en sus manos. Celebrimbor pidió consejo a Galadriel: a ella le dio Nenya, y envió Narya y Vilya al oeste, a Gil-galad."
