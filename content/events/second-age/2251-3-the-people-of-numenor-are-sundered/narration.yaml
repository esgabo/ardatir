- id: split
  en: In the days of Tar-Ancalimon, the fear of death split Númenor in two.
  es: En los días de Tar-Ancalimon, el miedo a la muerte partió Númenor en dos.
- id: kings-men
  en: "Most of the people sided with the King. They were called the King's Men: they resented the Ban, turned away from the Valar, and wanted no more of the Elves."
  es: "La mayor parte del pueblo se puso del lado del Rey. Los llamaban los Hombres del Rey: les pesaba la Prohibición, daban la espalda a los Valar y no querían saber nada más de los Elfos."
- id: faithful
  en: A smaller people stayed true to the old friendship. They were called the Faithful. They still loved the Elves and gave thanks to Ilúvatar.
  es: Un pueblo más pequeño siguió fiel a la antigua amistad. Los llamaban los Fieles. Seguían amando a los Elfos y dando gracias a Ilúvatar.
- id: west
  en: Many of the Faithful lived in the west of the island, around Andúnië, where the Elven ships had once come in.
  es: Muchos de los Fieles vivían en el oeste de la isla, en torno a Andúnië, adonde antes llegaban los barcos de los Elfos.
- id: rift
  en: Year by year, the rift between the two grew wider.
  es: Año tras año, la brecha entre ambos se hacía más honda.
