- id: demand
  en: Sauron's plan was laid bare. Now he demanded that the Elves hand over every ring, since they had been made with his knowledge.
  es: El plan de Sauron había quedado al descubierto. Entonces exigió que los Elfos le entregaran todos los anillos, ya que se habían hecho con su saber.
- id: refuse
  en: The Elves refused.
  es: Los Elfos se negaron.
- id: war
  en: So Sauron took up open war. His armies came out of Mordor and marched west toward Eregion.
  es: Así que Sauron pasó a la guerra abierta. Sus ejércitos salieron de Mordor y marcharon hacia el oeste, hacia Eregion.
- id: help
  en: In Lindon, Gil-galad gathered what strength he could, and in time sent Elrond east with a host to help.
  es: En Lindon, Gil-galad reunió todas las fuerzas que pudo, y con el tiempo envió a Elrond hacia el este con un ejército para ayudar.
- id: long
  en: A long, dark war had begun between the Elves and Sauron.
  es: Había empezado una guerra larga y oscura entre los Elfos y Sauron.
