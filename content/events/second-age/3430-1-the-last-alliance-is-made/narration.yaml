- id: danger
  en: Elendil and Gil-galad saw that if they did not stand together, Sauron would destroy them one at a time.
  es: Elendil y Gil-galad comprendieron que, si no se mantenían unidos, Sauron los destruiría uno por uno.
- id: pact
  en: "So they made a pact between their peoples: the Last Alliance of Elves and Men."
  es: "Así que sellaron un pacto entre sus pueblos: la Última Alianza de Elfos y Hombres."
- id: host
  en: "They gathered their armies at Imladris, Elrond's valley: a host greater and more splendid than anyone then living in Middle-earth had ever seen."
  es: "Reunieron sus ejércitos en Imladris, el valle de Elrond: una hueste más grande y espléndida de lo que nadie que viviera entonces en la Tierra Media había visto jamás."
- id: herald
  en: Elrond stood at Gil-galad's side as his herald.
  es: Elrond estaba al lado de Gil-galad como su heraldo.
- id: others
  en: Dwarves came too, and others. Not every people was of one mind, and some of them marched for Sauron; but the Elves stood together, every one behind Gil-galad.
  es: También acudieron Enanos, y otros. No todos los pueblos pensaban igual, y algunos marcharon a favor de Sauron; pero los Elfos estaban unidos, todos ellos detrás de Gil-galad.
