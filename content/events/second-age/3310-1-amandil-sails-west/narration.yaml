- id: plan
  en: "Amandil, Lord of Andúnië, saw where the King was heading. He resolved to do what Eärendil had done long before: sail into the West and beg the Valar for mercy."
  es: "Amandil, Señor de Andúnië, vio adónde se dirigía el Rey. Decidió hacer lo que Eärendil había hecho mucho tiempo atrás: navegar hacia el Oeste y suplicar clemencia a los Valar."
- id: son
  en: He told his son Elendil to gather the Faithful onto ships, with everything they could save, and to keep apart from the King's fleet.
  es: Le pidió a su hijo Elendil que reuniera a los Fieles en barcos, con todo lo que pudieran salvar, y que se mantuviera apartado de la flota del Rey.
- id: leave
  en: Then, by night, with three servants, he set out, sailing east at first as if bound for Middle-earth, and then turning west.
  es: "Entonces, de noche, con tres servidores, partió: primero navegó hacia el este, como si fuera a la Tierra Media, y luego viró hacia el oeste."
- id: gone
  en: No word of him ever came back.
  es: Nunca volvieron a tener noticias de él.
- id: ships
  en: Elendil did as his father asked. Quietly, ships were made ready off the eastern coast, with his sons Isildur and Anárion beside him.
  es: Elendil hizo lo que su padre le había pedido. En silencio, se prepararon barcos frente a la costa oriental, con sus hijos Isildur y Anárion a su lado.
