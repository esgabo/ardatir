- id: teaching
  en: For years Annatar worked beside the smiths of Ost-in-Edhil, and under his teaching their craft rose higher than ever before.
  es: Durante años Annatar trabajó junto a los herreros de Ost-in-Edhil, y con sus enseñanzas su arte alcanzó cotas más altas que nunca.
- id: rings
  en: Together they made many rings of power, beautiful things that held something of their makers' strength.
  es: Juntos hicieron muchos anillos de poder, objetos hermosos que guardaban algo de la fuerza de quienes los forjaban.
- id: seven-nine
  en: Among them were seven great rings, and nine more. Annatar's hand was in every one, and he had his own purposes for them, which he kept hidden.
  es: Entre ellos había siete grandes anillos, y nueve más. La mano de Annatar estaba en cada uno, y él tenía sus propios propósitos para ellos, que mantenía ocultos.
- id: later
  en: One day the Seven would go to the lords of the Dwarves, and the Nine to the lords of Men.
  es: Un día los Siete irían a parar a los señores de los Enanos, y los Nueve a los señores de los Hombres.
