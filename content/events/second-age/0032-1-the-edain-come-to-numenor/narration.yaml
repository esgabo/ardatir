- id: gift
  en: For the Men who had fought beside the Elves against Morgoth, the Valar raised an island out of the sea, far to the west, between Middle-earth and Aman.
  es: Para los Hombres que habían luchado junto a los Elfos contra Morgoth, los Valar alzaron una isla del mar, muy al oeste, entre la Tierra Media y Aman.
- id: star
  en: The Edain set out in many ships. Eärendil's star shone ahead of them in the sky and showed them the way across the water.
  es: Los Edain partieron en muchos barcos. La estrella de Eärendil brillaba delante de ellos en el cielo y les mostraba el camino sobre el agua.
- id: landing
  en: They found a green and gentle land shaped like a five-pointed star, with a tall mountain at its heart. They called it Númenor.
  es: Encontraron una tierra verde y apacible con forma de estrella de cinco puntas, con una alta montaña en el centro. La llamaron Númenor.
- id: king
  en: Elros, the brother who had chosen to be a Man, became their first King, and took the royal name Tar-Minyatur.
  es: Elros, el hermano que había elegido ser Hombre, fue su primer Rey, y tomó el nombre real de Tar-Minyatur.
- id: life
  en: A long, bright age began for his people. They lived three times as long as other Men, and they learned, built and sailed in peace.
  es: Empezó una larga y luminosa época para su pueblo. Vivían tres veces más que los demás Hombres, y aprendían, construían y navegaban en paz.
