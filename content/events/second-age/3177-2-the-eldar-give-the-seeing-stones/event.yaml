title: { en: "The Eldar give the seeing-stones to Amandil", es: "Los Eldar entregan las piedras videntes a Amandil" }
summary:
  en: "In secret, the Elves of Eressëa give the seven palantíri to Amandil, Lord of Andúnië. They are a comfort for the Faithful, who can look across the sea toward the lands they are forbidden to reach."
  es: "En secreto, los Elfos de Eressëa entregan los siete palantíri a Amandil, Señor de Andúnië. Son un consuelo para los Fieles, que pueden mirar a través del mar hacia las tierras que se les prohíbe alcanzar."
