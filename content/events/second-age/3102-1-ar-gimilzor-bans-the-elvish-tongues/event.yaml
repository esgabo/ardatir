title: { en: "Ar-Gimilzôr bans the Elvish tongues", es: "Ar-Gimilzôr prohíbe las lenguas élficas" }
summary:
  en: "The King forbids anyone to speak the Elven tongues and will not let the Eldar land. The Faithful are watched and hated, and the Elves of Eressëa now come only in secret. He drives the Faithful he can find east to Rómenna, under watch."
  es: "El Rey prohíbe hablar las lenguas élficas y no deja desembarcar a los Eldar. Los Fieles son vigilados y odiados, y los Elfos de Eressëa solo vienen ya en secreto. Destierra a los Fieles que encuentra al este, a Rómenna, bajo vigilancia."
