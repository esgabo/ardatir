- id: king
  en: No king had hated the Faithful more than Ar-Gimilzôr.
  es: Ningún rey había odiado tanto a los Fieles como Ar-Gimilzôr.
- id: ban
  en: He forbade anyone in Númenor to speak the Elven tongues, and he would not let the ships of Eressëa come to land.
  es: Prohibió que nadie en Númenor hablara las lenguas élficas, y no permitió que los barcos de Eressëa tocaran tierra.
- id: secret
  en: Even so, the Elves still came now and then, in secret, to the western shore, where a few of the Faithful welcomed them.
  es: Aun así, los Elfos seguían llegando de vez en cuando, en secreto, a la costa occidental, donde algunos de los Fieles los recibían.
- id: watch
  en: The King hunted out the Faithful he could find and moved them away from the west, to Rómenna on the eastern coast, where he could keep them under watch.
  es: El Rey buscó a todos los Fieles que pudo encontrar y los apartó del oeste, a Rómenna, en la costa oriental, donde podía tenerlos vigilados.
- id: wait
  en: The Faithful bore it quietly. They kept their tongues and their friendships hidden, and waited.
  es: Los Fieles lo soportaron en silencio. Guardaron ocultas sus lenguas y sus amistades, y esperaron.
