- id: fell
  en: At last the King gave way to Sauron. Nimloth, the Elves' gift from the island's first days, was cut down.
  es: Por fin el Rey cedió ante Sauron. Nimloth, el regalo de los Elfos de los primeros días de la isla, fue talado.
- id: burn
  en: Its wood was carried into the Temple and burned on the altar of Melkor.
  es: Su madera se llevó al Templo y se quemó en el altar de Melkor.
- id: smoke
  en: A dark smoke rose from the dome and hung over the land for seven days.
  es: Un humo oscuro se elevó de la cúpula y se quedó suspendido sobre la tierra durante siete días.
- id: mourn
  en: The Faithful mourned. To them the Tree had stood for the line of their kings and for their bond with the Elves.
  es: Los Fieles lo lloraron. Para ellos, el Árbol había representado el linaje de sus reyes y su vínculo con los Elfos.
- id: hope
  en: But not all was lost. Hidden in Rómenna, a young tree grown from Nimloth's fruit was still alive.
  es: Pero no todo estaba perdido. Escondido en Rómenna, seguía vivo un arbolillo nacido del fruto de Nimloth.
