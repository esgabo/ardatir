- id: arrive
  en: Sauron came to Númenor as a prisoner. He looked on the island's splendour, and envied it, and hated it all the more.
  es: Sauron llegó a Númenor como prisionero. Contempló el esplendor de la isla, y lo envidió, y lo odió aún más.
- id: flatter
  en: But he was fair to look at and wise in speech. He flattered the King and told him of hidden things that no one in Númenor knew.
  es: Pero era hermoso a la vista y sabio de palabra. Halagó al Rey y le habló de cosas ocultas que nadie en Númenor conocía.
- id: rise
  en: Within three years he was no longer a prisoner but the King's closest counsellor.
  es: En menos de tres años ya no era un prisionero, sino el consejero más cercano del Rey.
- id: amandil
  en: Most of the court fawned on him. Only Amandil, Lord of Andúnië, spoke against him, and was pushed aside.
  es: Casi toda la corte lo adulaba. Solo Amandil, Señor de Andúnië, habló en su contra, y fue apartado.
