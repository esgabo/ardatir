- id: shore
  en: When the storm let them go, the ships were flung onto the shores of Middle-earth.
  es: Cuando la tormenta los soltó, los barcos fueron arrojados a las costas de la Tierra Media.
- id: lindon
  en: Elendil's ships came to land in Lindon, the country of the Elves.
  es: Los barcos de Elendil tocaron tierra en Lindon, el país de los Elfos.
- id: welcome
  en: Gil-galad, the Elven-king, welcomed the survivors as friends, as his people had always welcomed the Elf-friends of Númenor.
  es: Gil-galad, el rey de los Elfos, recibió a los supervivientes como amigos, igual que su pueblo había recibido siempre a los Amigos de los Elfos de Númenor.
- id: sons
  en: But Elendil's sons were not with him. The storm had carried Isildur and Anárion far away to the south.
  es: Pero los hijos de Elendil no estaban con él. La tormenta se había llevado a Isildur y a Anárion muy lejos, hacia el sur.
- id: few
  en: Of all who had dwelt on the island, only these few ships had escaped.
  es: De todos los que habían vivido en la isla, solo habían escapado aquellos pocos barcos.
