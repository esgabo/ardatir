- id: fire
  en: Far away in Mordor, Sauron went down into the fires of Orodruin.
  es: Lejos de allí, en Mordor, Sauron bajó a los fuegos de Orodruin.
- id: forge
  en: There, in secret, he made a ring of gold, plain to look at, and poured into it much of his own strength and will.
  es: Allí, en secreto, hizo un anillo de oro, sencillo a la vista, y vertió en él gran parte de su propia fuerza y voluntad.
- id: purpose
  en: This was the Ruling Ring. Through it he meant to see the thoughts of all who wore the other rings, and bend them to his own.
  es: Era el Anillo Soberano. Con él pretendía ver los pensamientos de todos los que llevaran los otros anillos, y doblegarlos a los suyos.
- id: risk
  en: But to put so much of himself into it was a gamble. While the Ring lasted, so would his power; if it were ever destroyed, he would be brought low.
  es: Pero poner tanto de sí mismo en él era una apuesta. Mientras el Anillo durase, también duraría su poder; si alguna vez se destruía, él quedaría abatido.
- id: tower
  en: In those same years, his great tower of Barad-dûr was finished.
  es: En esos mismos años quedó terminada su gran torre de Barad-dûr.
