- id: flight
  en: With Sauron's armies behind them, Elrond and the survivors of Eregion went north along the feet of the mountains.
  es: Con los ejércitos de Sauron a sus espaldas, Elrond y los supervivientes de Eregion fueron hacia el norte, siguiendo las faldas de las montañas.
- id: valley
  en: They came to a hidden valley, deep in a fold of the land below the Misty Mountains, where a river ran loud over its stones.
  es: Llegaron a un valle escondido, en lo hondo de un pliegue de la tierra al pie de las Montañas Nubladas, donde un río corría ruidoso sobre las piedras.
- id: refuge
  en: "There Elrond made a stronghold and a refuge: Imladris, which Men would later call Rivendell."
  es: "Allí Elrond levantó un baluarte y un refugio: Imladris, que más tarde los Hombres llamarían Rivendel."
- id: gil-galad
  en: Far to the west, Gil-galad held on in Lindon, and the two kept faith with each other across the ruined land.
  es: Muy al oeste, Gil-galad resistía en Lindon, y los dos se mantuvieron fieles el uno al otro a través de la tierra arrasada.
- id: outlast
  en: Rivendell would remain a haven for the weary and the wise through all the years to come, and it would outlast Sauron himself.
  es: Rivendel seguiría siendo un refugio para los cansados y los sabios durante todos los años venideros, y sobreviviría al propio Sauron.
