- id: mithril
  en: "News spread among the Elves of Lindon: far to the east, under the Misty Mountains, the Dwarves of Moria had found mithril, a silver metal unlike any other."
  es: "Entre los Elfos de Lindon corrió la noticia: muy al este, bajo las Montañas Nubladas, los Enanos de Moria habían encontrado mithril, un metal plateado distinto de cualquier otro."
- id: craftsmen
  en: Many of the Noldor, who loved fine craft above all things, left Lindon and went east to live near it.
  es: Muchos de los Noldor, que amaban los trabajos finos por encima de todo, dejaron Lindon y fueron hacia el este para vivir cerca de él.
- id: eregion
  en: "At the Dwarves' western door they founded a realm of their own: Eregion, the land of holly trees."
  es: "Ante la puerta occidental de los Enanos fundaron un reino propio: Eregion, la tierra de los acebos."
- id: lord
  en: Their lord was Celebrimbor, the grandson of Fëanor, and a master smith.
  es: Su señor era Celebrimbor, nieto de Fëanor, y un maestro herrero.
- id: friendship
  en: Galadriel lived in Eregion too, and between its Elves and the Dwarves of Moria grew a friendship such as Elves and Dwarves had seldom known.
  es: También Galadriel vivía en Eregion, y entre sus Elfos y los Enanos de Moria nació una amistad como pocas veces habían conocido Elfos y Enanos.
