- id: return
  en: Sauron had come back to Mordor as a spirit. For more than a hundred years he brooded there and built up his strength again.
  es: Sauron había vuelto a Mordor convertido en espíritu. Durante más de cien años rumió allí su odio y volvió a reunir fuerzas.
- id: strike
  en: When he felt strong enough, he struck at Gondor, the young kingdom on his doorstep.
  es: Cuando se sintió lo bastante fuerte, atacó Gondor, el joven reino que tenía a las puertas.
- id: taken
  en: His armies came over the mountains and took Minas Ithil, Isildur's tower. They burned the White Tree that grew there.
  es: Sus ejércitos cruzaron las montañas y tomaron Minas Ithil, la torre de Isildur. Quemaron el Árbol Blanco que crecía allí.
- id: escape
  en: Isildur escaped with his wife and sons, carrying a seedling of the Tree. They went down the river by ship and sailed north to find Elendil.
  es: Isildur escapó con su esposa y sus hijos, llevando consigo un retoño del Árbol. Bajaron por el río en barco y navegaron hacia el norte en busca de Elendil.
- id: anarion
  en: Anárion stayed behind to hold Osgiliath against the enemy.
  es: Anárion se quedó para defender Osgiliath frente al enemigo.
