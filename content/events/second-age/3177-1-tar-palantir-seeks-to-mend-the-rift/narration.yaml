- id: son
  en: "Ar-Gimilzôr's son was nothing like his father. He took the sceptre under an Elvish name once more: Tar-Palantír, the far-seeing."
  es: "El hijo de Ar-Gimilzôr no se parecía en nada a su padre. Tomó el cetro de nuevo con un nombre élfico: Tar-Palantír, el que ve a lo lejos."
- id: repent
  en: He grieved for what the kings before him had done. He honoured the Faithful again, and went up the holy mountain to give thanks to Ilúvatar, as the first kings had.
  es: Lamentaba lo que habían hecho los reyes anteriores. Volvió a honrar a los Fieles, y subía a la montaña sagrada para dar gracias a Ilúvatar, como los primeros reyes.
- id: tree
  en: He cared for the neglected White Tree, and warned that if it ever died, the line of the Kings would end with it.
  es: Cuidó del Árbol Blanco, que estaba descuidado, y advirtió que si alguna vez moría, el linaje de los Reyes acabaría con él.
- id: brother
  en: But his brother Gimilkhâd led the King's Men against him, and many of the people followed him.
  es: Pero su hermano Gimilkhâd encabezó a los Hombres del Rey contra él, y muchos del pueblo lo siguieron.
- id: late
  en: "Tar-Palantír had no son, only a daughter, Míriel. The harm his fathers had done was too deep to mend: the rift did not close, and the shadow deepened."
  es: "Tar-Palantír no tuvo hijos varones, solo una hija, Míriel. El daño que habían hecho sus antepasados era demasiado hondo para repararlo: la brecha no se cerró, y la sombra se hizo más densa."
