- id: banner
  en: At last Ar-Pharazôn put on his armour, went aboard his great ship, and raised his banner.
  es: Por fin Ar-Pharazôn se puso su armadura, subió a su gran nave y alzó su estandarte.
- id: sail
  en: Trumpets sounded, and the fleet put out. So many ships moved together that the sea itself seemed hidden.
  es: Sonaron las trompetas, y la flota se hizo a la mar. Avanzaban juntos tantos barcos que el propio mar parecía oculto.
- id: west
  en: It sailed into the west, against the Ban, toward the land of the Valar.
  es: Navegó hacia el oeste, contra la Prohibición, rumbo a la tierra de los Valar.
- id: sauron
  en: Sauron did not go. He stayed behind in his Temple in Armenelos, and waited.
  es: Sauron no fue. Se quedó en su Templo de Armenelos, y esperó.
- id: watch
  en: On the shores, the people watched the last sails sink below the horizon, and the island fell silent.
  es: En las costas, la gente vio desaparecer las últimas velas tras el horizonte, y la isla quedó en silencio.
