- id: south
  en: Far to the south, the storm had brought Isildur and Anárion to the mouths of the Great River, Anduin.
  es: Muy al sur, la tormenta había llevado a Isildur y a Anárion a las desembocaduras del Río Grande, el Anduin.
- id: gondor
  en: Up the river they founded a second kingdom, Gondor, in lands where Faithful Númenóreans had settled long before.
  es: Río arriba fundaron un segundo reino, Gondor, en tierras donde mucho antes se habían asentado númenóreanos Fieles.
- id: osgiliath
  en: Spanning the river they built their chief city, Osgiliath, the Citadel of the Stars.
  es: A ambas orillas del río construyeron su ciudad principal, Osgiliath, la Ciudadela de las Estrellas.
- id: towers
  en: "On either side they raised a tower-city: Minas Ithil, the Tower of the Moon, for Isildur in the east; and Minas Anor, the Tower of the Setting Sun, for Anárion in the west."
  es: "A cada lado levantaron una ciudad torre: Minas Ithil, la Torre de la Luna, para Isildur, en el este; y Minas Anor, la Torre del Sol Poniente, para Anárion, en el oeste."
- id: tree
  en: Before his house in Minas Ithil, Isildur planted the young White Tree he had carried from Númenor.
  es: Ante su casa en Minas Ithil, Isildur plantó el joven Árbol Blanco que había traído de Númenor.
