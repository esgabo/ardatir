- id: war
  en: "The War of Wrath was over, and Morgoth had been thrust out of the world. In Middle-earth, two young brothers waited to learn what would become of them: Elrond and Elros, the sons of Eärendil and Elwing."
  es: "La Guerra de la Cólera había terminado, y Morgoth había sido arrojado fuera del mundo. En la Tierra Media, dos hermanos jóvenes esperaban saber qué sería de ellos: Elrond y Elros, los hijos de Eärendil y Elwing."
- id: blood
  en: In them ran the blood of Elves and of Men, and of a Maia too. So the Valar let each of them choose which people he would belong to.
  es: Por sus venas corría sangre de Elfos y de Hombres, y también de una Maia. Por eso los Valar dejaron que cada uno eligiera a qué pueblo quería pertenecer.
- id: elrond
  en: Elrond chose the Elves. He would keep their long life, bound to the world for as long as it lasted.
  es: Elrond eligió a los Elfos. Conservaría su larga vida, ligado al mundo mientras el mundo durase.
- id: elros
  en: Elros chose Men, and with them the gift of death. Even so, he was granted a life many times longer than theirs.
  es: Elros eligió a los Hombres, y con ellos el don de la muerte. Aun así, se le concedió una vida muchas veces más larga que la de ellos.
- id: parting
  en: So the twins' roads parted. One would stay among the Elves for ages to come; the other would become the first king of a new people.
  es: Así se separaron los caminos de los gemelos. Uno se quedaría entre los Elfos durante edades; el otro sería el primer rey de un pueblo nuevo.
