- id: chasm
  en: Far in the west, the sea split open into a great chasm. The King's fleet was swallowed, and the hills fell on him and his army, burying them.
  es: Muy al oeste, el mar se abrió en una inmensa sima. La flota del Rey fue engullida, y las colinas cayeron sobre él y su ejército, sepultándolos.
- id: wave
  en: Then Númenor itself was thrown down. A vast wave rose out of the sea and came rolling over the island.
  es: Después fue derribada la propia Númenor. Una ola inmensa se alzó del mar y avanzó sobre la isla.
- id: miriel
  en: Queen Míriel ran up the slopes of the holy mountain, the Meneltarma, but the water was faster, and she was lost.
  es: La reina Míriel subió corriendo las laderas de la montaña sagrada, el Meneltarma, pero el agua fue más rápida, y pereció.
- id: sunk
  en: The island and all its glory, its towers and gardens, its people and its pride, went down into the sea.
  es: La isla y toda su gloria, sus torres y jardines, su gente y su orgullo, se hundieron en el mar.
- id: sauron
  en: Sauron was caught in the ruin as well. His fair body was destroyed, and his spirit fled east, back to Mordor.
  es: También Sauron quedó atrapado en la ruina. Su hermoso cuerpo fue destruido, y su espíritu huyó hacia el este, de vuelta a Mordor.
- id: never
  en: "His fair disguise was lost for good: from then on, every shape he took showed his hatred plainly."
  es: "Su hermoso disfraz se perdió para siempre: desde entonces, cada forma que adoptaba mostraba a las claras su odio."
