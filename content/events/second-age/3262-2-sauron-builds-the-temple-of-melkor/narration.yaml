- id: lie
  en: Sauron spoke to the King of the darkness before the world, and of Melkor, who, he said, was its true lord and could free Men from death.
  es: Sauron habló al Rey de la oscuridad anterior al mundo, y de Melkor, que, según él, era su verdadero señor y podía librar a los Hombres de la muerte.
- id: valar
  en: The Valar, he whispered, had lied to keep Men small.
  es: Los Valar, susurraba, habían mentido para mantener pequeños a los Hombres.
- id: temple
  en: On the hill of Armenelos he raised a vast round temple under a great dome, and its first fire would be lit with wood from the White Tree.
  es: En la colina de Armenelos levantó un inmenso templo circular bajo una gran cúpula, y su primer fuego se encendería con madera del Árbol Blanco.
- id: sacrifice
  en: Fires burned there day and night, and people were put to death on its altar, many of them taken from among the Faithful.
  es: Allí ardían fuegos día y noche, y en su altar se daba muerte a personas, muchas de ellas apresadas entre los Fieles.
- id: kneel
  en: The King and most of his people bowed down to Melkor, hoping to escape death. But death came only sooner, and more cruelly.
  es: El Rey y la mayor parte de su pueblo se postraron ante Melkor, con la esperanza de escapar de la muerte. Pero la muerte solo llegó antes, y con más crueldad.
