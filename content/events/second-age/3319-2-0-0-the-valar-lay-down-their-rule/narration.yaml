- id: watch
  en: From their halls, the Valar watched the mortal army on their shore.
  es: Desde sus estancias, los Valar contemplaban al ejército mortal en su orilla.
- id: refuse
  en: They would not make war on the Children of Ilúvatar themselves. Instead, Manwë and the Valar laid down their rule of Arda.
  es: No querían hacer la guerra ellos mismos a los Hijos de Ilúvatar. En su lugar, Manwë y los Valar renunciaron a su gobierno de Arda.
- id: call
  en: They gave the world back to Ilúvatar, the One who had made it, and asked him to decide.
  es: Devolvieron el mundo a Ilúvatar, el Único que lo había hecho, y le pidieron que decidiera.
- id: answer
  en: And Ilúvatar answered. What came next would break the fleet and change the shape of the world itself.
  es: E Ilúvatar respondió. Lo que vino después destrozaría la flota y cambiaría la forma del propio mundo.
