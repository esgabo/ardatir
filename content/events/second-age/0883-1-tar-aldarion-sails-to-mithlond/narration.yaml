- id: mariner
  en: Aldarion loved the sea more than anything. Even as heir he had spent years away on voyages, and when he became King, as Tar-Aldarion, he did not stop.
  es: Aldarion amaba el mar más que nada. Ya siendo heredero había pasado años fuera, de viaje, y cuando se convirtió en Rey, como Tar-Aldarion, no dejó de navegar.
- id: havens
  en: Soon after taking the sceptre, he sailed once more to Mithlond, the Grey Havens, where Círdan and Gil-galad were his friends.
  es: Poco después de tomar el cetro, navegó una vez más a Mithlond, los Puertos Grises, donde Círdan y Gil-galad eran sus amigos.
- id: shadow
  en: They spoke of the shadow that Gil-galad feared was rising again in the east, and of how Elves and Men might face it together.
  es: Hablaron de la sombra que Gil-galad temía que volviera a alzarse en el este, y de cómo podrían afrontarla juntos Elfos y Hombres.
- id: bond
  en: That bond between the island and the Elves of Lindon, renewed by Aldarion, would one day save them in their darkest hour.
  es: Aquel vínculo entre la isla y los Elfos de Lindon, renovado por Aldarion, los salvaría un día en su hora más oscura.
