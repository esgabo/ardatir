- id: waiting
  en: "Off the eastern coast, the Faithful waited aboard nine ships: four for Elendil, three for Isildur and two for Anárion."
  es: "Frente a la costa oriental, los Fieles esperaban a bordo de nueve barcos: cuatro de Elendil, tres de Isildur y dos de Anárion."
- id: cargo
  en: "They had brought what they could save: their families, the seeing-stones, and the young tree grown from Nimloth's fruit."
  es: "Habían llevado todo lo que pudieron salvar: sus familias, las piedras videntes y el arbolillo nacido del fruto de Nimloth."
- id: storm
  en: Then a storm came out of the west. The wind tore at their sails and drove them eastward, away from the island.
  es: Entonces llegó una tormenta desde el oeste. El viento desgarraba sus velas y los empujaba hacia el este, lejos de la isla.
- id: wave
  en: Behind them, Númenor went down. The great wave caught the ships, and they rode it, high over the water, into the dark.
  es: Detrás de ellos, Númenor se hundía. La gran ola alcanzó los barcos, y estos cabalgaron sobre ella, muy por encima del agua, hacia la oscuridad.
- id: home
  en: They did not see the end. They only knew that their home was gone.
  es: No vieron el final. Solo sabían que su hogar había desaparecido.
