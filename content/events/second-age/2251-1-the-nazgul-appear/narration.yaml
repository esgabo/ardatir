- id: gift
  en: Sauron gave the Nine Rings to great lords among Men, who were glad to take them.
  es: Sauron entregó los Nueve Anillos a grandes señores de los Hombres, que los aceptaron con gusto.
- id: power
  en: The rings brought them wealth and glory, and their lives stretched on long past their time.
  es: Los anillos les trajeron riqueza y gloria, y sus vidas se alargaron mucho más allá de lo que les correspondía.
- id: fade
  en: But slowly, one by one, they began to fade. They could go unseen, and the world of shadows grew clearer to them than the world of the living.
  es: Pero poco a poco, uno tras otro, empezaron a desvanecerse. Podían ir sin ser vistos, y el mundo de las sombras se les hacía más claro que el de los vivos.
- id: wraiths
  en: "In the end they were only shadows, bound to the One Ring: the Nazgûl, the Ringwraiths, the most terrible of Sauron's servants."
  es: "Al final no eran más que sombras, atadas al Anillo Único: los Nazgûl, los Espectros del Anillo, los más terribles servidores de Sauron."
- id: seen
  en: Around the year 2250 of the age, they were first seen abroad in the world.
  es: Hacia el año 2250 de la edad, se los vio por primera vez recorriendo el mundo.
