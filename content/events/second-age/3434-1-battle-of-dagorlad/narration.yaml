- id: march
  en: The host of the Alliance crossed the Misty Mountains and marched down the Great River toward Mordor.
  es: La hueste de la Alianza cruzó las Montañas Nubladas y descendió siguiendo el Río Grande hacia Mordor.
- id: plain
  en: Before the gates of Mordor lay a wide, bare plain. There Sauron's army came out to meet them.
  es: Ante las puertas de Mordor se extendía una llanura amplia y desnuda. Allí salió a su encuentro el ejército de Sauron.
- id: battle
  en: The battle was long and hard. Elves, Men and Dwarves fought side by side, and no enemy could stand against Gil-galad's spear or Elendil's sword.
  es: La batalla fue larga y dura. Elfos, Hombres y Enanos lucharon codo con codo, y ningún enemigo podía resistir la lanza de Gil-galad ni la espada de Elendil.
- id: victory
  en: In the end the Alliance won. Sauron's host broke and fled back into Mordor.
  es: Al final venció la Alianza. La hueste de Sauron se desbandó y huyó de vuelta a Mordor.
- id: name
  en: So many fell there that the place was remembered ever after as Dagorlad, the Battle Plain.
  es: Cayeron tantos allí que el lugar se recordó para siempre como Dagorlad, la Llanura de la Batalla.
