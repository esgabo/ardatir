- id: guise
  en: Sauron took on a fair shape and came west among the Elves. He called himself Annatar, the Lord of Gifts.
  es: Sauron adoptó una forma hermosa y fue hacia el oeste, entre los Elfos. Se hacía llamar Annatar, el Señor de los Dones.
- id: lindon
  en: In Lindon, Gil-galad would not let him in. He and Elrond did not trust this gracious stranger, whoever he might be.
  es: En Lindon, Gil-galad no le permitió la entrada. Ni él ni Elrond se fiaban de aquel forastero tan amable, fuera quien fuera.
- id: eregion
  en: But in Eregion the smiths listened. They longed to make Middle-earth as fair as the Blessed Realm, and Annatar offered them knowledge to do it.
  es: Pero en Eregion los herreros lo escucharon. Anhelaban hacer la Tierra Media tan hermosa como el Reino Bendecido, y Annatar les ofrecía el saber para lograrlo.
- id: galadriel
  en: Galadriel was wary of him, but the smiths paid her little heed.
  es: Galadriel desconfiaba de él, pero los herreros le hicieron poco caso.
- id: welcome
  en: Celebrimbor and his craftsmen took him in as a teacher and a friend. None of them guessed who he really was.
  es: Celebrimbor y sus artesanos lo acogieron como maestro y como amigo. Ninguno adivinó quién era en realidad.
