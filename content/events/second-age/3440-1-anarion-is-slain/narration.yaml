- id: years
  en: Six years into the siege, the brothers Isildur and Anárion still fought side by side before the Dark Tower.
  es: Seis años después de empezar el sitio, los hermanos Isildur y Anárion seguían luchando codo con codo ante la Torre Oscura.
- id: walls
  en: From its high walls, the defenders hurled down fire and stones.
  es: Desde sus altas murallas, los defensores arrojaban fuego y piedras.
- id: death
  en: One day a great stone struck Anárion, and he was killed.
  es: Un día una gran piedra alcanzó a Anárion, y murió.
- id: grief
  en: Elendil had lost a son, and Isildur a brother. From then on, Isildur fought on alone beside his father.
  es: Elendil había perdido a un hijo, e Isildur a un hermano. Desde entonces, Isildur siguió luchando solo junto a su padre.
- id: line
  en: Years later, Anárion's son Meneldil would rule Gondor in his place.
  es: Años después, Meneldil, el hijo de Anárion, reinaría en Gondor en su lugar.
