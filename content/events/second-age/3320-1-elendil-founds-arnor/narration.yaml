- id: inland
  en: Elendil did not linger long by the sea. With Gil-galad's friendship, he went east into the wide lands of Eriador.
  es: Elendil no se quedó mucho tiempo junto al mar. Con la amistad de Gil-galad, se adentró hacia el este en las amplias tierras de Eriador.
- id: arnor
  en: There he founded a kingdom for the exiles of Númenor in the north of Middle-earth, and called it Arnor.
  es: Allí fundó un reino para los exiliados de Númenor en el norte de la Tierra Media, y lo llamó Arnor.
- id: annuminas
  en: His seat was Annúminas, a city beside the still waters of Lake Evendim.
  es: Su sede fue Annúminas, una ciudad junto a las aguas tranquilas del lago Evendim.
- id: stones
  en: The seeing-stones they had saved were set in towers, so that the realms of the exiles could speak to one another from afar.
  es: Las piedras videntes que habían salvado se colocaron en torres, para que los reinos de los exiliados pudieran comunicarse a gran distancia.
- id: high-king
  en: Elendil became High King of all the exiles, in the north and in the south.
  es: Elendil se convirtió en Rey Supremo de todos los exiliados, en el norte y en el sur.
