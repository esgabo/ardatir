summary:
  en: "Great clouds in the shape of eagles darken the sky from the west, and thunder rolls over the island. Lightning strikes the Temple's dome, but Sauron stands on its pinnacle unharmed, and the King does not turn back."
  es: "Grandes nubes con forma de águilas oscurecen el cielo desde el oeste, y el trueno rueda sobre la isla. Un rayo golpea la cúpula del Templo, pero Sauron se alza ileso en su cima, y el Rey no da marcha atrás."
