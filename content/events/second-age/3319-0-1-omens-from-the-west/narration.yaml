- id: clouds
  en: As the fleet gathered, the sky over Númenor changed. Clouds shaped like great eagles came out of the west, their wings stretched across the heavens.
  es: Mientras se reunía la flota, el cielo de Númenor cambió. Nubes con forma de grandes águilas llegaron desde el oeste, con las alas extendidas de un lado a otro del cielo.
- id: fear
  en: Some of the people were afraid and cried out for mercy. Most hardened their hearts.
  es: Algunos se asustaron y pidieron clemencia a gritos. La mayoría endureció su corazón.
- id: lightning
  en: Thunder rolled, and lightning killed men on the hills and in the fields. A bolt struck the Temple and broke its dome apart.
  es: Retumbó el trueno, y los rayos mataron a hombres en las colinas y en los campos. Uno cayó sobre el Templo y le partió la cúpula.
- id: sauron
  en: Through the flames, Sauron stood on the top of the Temple, untouched, defying the storm.
  es: Entre las llamas, Sauron se alzaba en lo alto del Templo, intacto, desafiando la tormenta.
- id: king
  en: The King saw him and did not turn back. The omens only made him hurry.
  es: El Rey lo vio y no se volvió atrás. Los presagios solo lo hicieron darse prisa.
