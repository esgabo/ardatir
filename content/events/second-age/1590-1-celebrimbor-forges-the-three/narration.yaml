- id: leaves
  en: When Annatar had taught the smiths what he wished, he left Eregion.
  es: Cuando Annatar hubo enseñado a los herreros lo que quería, se marchó de Eregion.
- id: alone
  en: Working alone, Celebrimbor made three more rings, the fairest of all. Annatar never touched them.
  es: Trabajando solo, Celebrimbor hizo tres anillos más, los más hermosos de todos. Annatar nunca los tocó.
- id: power
  en: They were not made for war or for mastery. Their power was to heal what was hurt and to keep fair things from fading.
  es: No se hicieron para la guerra ni para dominar. Su poder era sanar lo herido e impedir que las cosas hermosas se marchitaran.
- id: names
  en: Narya was the ring of fire, Nenya the ring of water, and Vilya the ring of air.
  es: Narya era el anillo del fuego, Nenya el anillo del agua, y Vilya el anillo del aire.
