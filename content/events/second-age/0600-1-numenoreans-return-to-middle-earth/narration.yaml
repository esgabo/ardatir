- id: mariners
  en: For centuries the Númenóreans grew great as mariners, sailing ever farther over the seas.
  es: Durante siglos los númenóreanos se hicieron grandes marinos, y navegaban cada vez más lejos por los mares.
- id: east
  en: Around the six-hundredth year of the age, their first ships reached the shores of Middle-earth again.
  es: Hacia el año seiscientos de la edad, sus primeros barcos volvieron a alcanzar las costas de la Tierra Media.
- id: lindon
  en: At the Grey Havens, Círdan and Gil-galad welcomed them as old friends.
  es: En los Puertos Grises, Círdan y Gil-galad los recibieron como a viejos amigos.
- id: news
  en: "From the Elves they learned what had become of the lands their forefathers had left: Beleriand drowned, and the Men who stayed behind still poor and afraid."
  es: "Por los Elfos supieron qué había sido de las tierras que habían dejado sus antepasados: Beleriand anegada, y los Hombres que se quedaron, todavía pobres y temerosos."
- id: teachers
  en: In those days the Númenóreans came as friends and teachers, bringing grain and wine and showing the Men of the coasts their crafts.
  es: "En aquellos días los númenóreanos llegaban como amigos y maestros: traían grano y vino, y enseñaban sus oficios a los Hombres de las costas."
