title: { en: "Númenor comes to the rescue of Lindon", es: "Númenor acude al rescate de Lindon" }
summary:
  en: "Called by Gil-galad, a great fleet sent by Tar-Minastir reaches Lindon, and a second force lands at the mouth of the Gwathló. Caught between them, Sauron's army is destroyed, and he flees back to Mordor, wary of the sea-kings."
  es: "Llamada por Gil-galad, una gran flota enviada por Tar-Minastir llega a Lindon, y una segunda fuerza desembarca en la desembocadura del Gwathló. Atrapado entre ambas, el ejército de Sauron es aniquilado y él huye de vuelta a Mordor, receloso de los reyes del mar."
