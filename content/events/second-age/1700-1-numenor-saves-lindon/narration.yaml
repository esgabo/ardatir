- id: pressed
  en: By now Sauron held almost all of Eriador. Lindon and Elrond's hidden valley still stood, but Gil-galad's people were hard pressed.
  es: Para entonces Sauron dominaba casi todo Eriador. Lindon y el valle escondido de Elrond aún resistían, pero el pueblo de Gil-galad estaba en grave aprieto.
- id: call
  en: Gil-galad sent to Númenor for help, and the King, Tar-Minastir, answered with a great fleet.
  es: Gil-galad pidió ayuda a Númenor, y el Rey, Tar-Minastir, respondió con una gran flota.
- id: landing
  en: The fleet came into Lindon, and the Númenóreans marched out beside Gil-galad's Elves. Another part of it sailed south and landed at the mouth of the Gwathló, behind Sauron's army.
  es: La flota llegó a Lindon, y los númenóreanos salieron a combatir junto a los Elfos de Gil-galad. Otra parte navegó hacia el sur y desembarcó en la desembocadura del Gwathló, a espaldas del ejército de Sauron.
- id: crushed
  en: Caught between the two hosts, Sauron's army was destroyed. He himself barely escaped, with only a small guard.
  es: Atrapado entre las dos huestes, el ejército de Sauron fue aniquilado. Él mismo escapó a duras penas, con solo una pequeña guardia.
- id: wary
  en: He fled back to Mordor. He had learned to fear the sea-kings of Númenor, and he would not forget it.
  es: Huyó de vuelta a Mordor. Había aprendido a temer a los reyes del mar de Númenor, y no lo olvidaría.
