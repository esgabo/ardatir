- id: invasion
  en: Deceived by Sauron, the King of Númenor sailed west with a vast fleet and set foot on the shores of Aman, the land the Valar had forbidden to Men.
  es: Engañado por Sauron, el Rey de Númenor navegó hacia el oeste con una inmensa flota y desembarcó en las costas de Aman, la tierra que los Valar habían vedado a los Hombres.
- id: plea
  en: Then Manwë and the Valar set aside their rule of the world and called on Ilúvatar, the One, to decide.
  es: Entonces Manwë y los Valar renunciaron a su gobierno del mundo e invocaron a Ilúvatar, el Único, para que decidiera.
- id: change
  en: And Ilúvatar changed the world. The sea opened between Númenor and Aman, the fleet was swallowed, and Aman with Valinor was lifted out of the world forever.
  es: E Ilúvatar cambió el mundo. El mar se abrió entre Númenor y Aman, la flota fue engullida, y Aman, con Valinor, fue apartada del mundo para siempre.
- id: round
  en: The flat earth bent and closed upon itself into a globe. From then on, a ship that sailed far enough west would only come back round to the east.
  es: La tierra llana se curvó y se cerró sobre sí misma hasta ser una esfera. Desde entonces, un barco que navegara lo bastante al oeste solo volvería a dar la vuelta hasta el este.
- id: straight-road
  en: But the Elves were not forgotten. For their ships alone a Straight Road still runs on, rising from the bent sea into the sky, all the way to the lost West.
  es: Pero los Elfos no fueron olvidados. Solo para sus barcos sigue habiendo un Camino Recto, que se eleva desde el mar curvado hacia el cielo, hasta el Oeste perdido.
