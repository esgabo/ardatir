id: the-world-is-made-round
age: second-age
when:
  # The same year as the Downfall; the Akallabêth tells it as one moment.
  start: { age: second-age, year: 3319 }
  precision: year
place: aman
characters: [ iluvatar, manwe ]
arcs: [ the-downfall-of-numenor, the-shape-of-arda ]
journeys: []
tags: [ cosmology, silmarillion ]
status: scripted
source: { book: the-silmarillion, chapter: "Akallabêth" }
title:
  en: The World is made round
  es: El mundo se vuelve redondo
summary:
  en: "Ilúvatar changes the shape of the world: the sea opens, Aman is taken out of the circles of the world, and the flat earth is bent into a globe. Only the Straight Road still leads West, for the Elves alone."
  es: "Ilúvatar cambia la forma del mundo: el mar se abre, Aman es apartada de los círculos del mundo, y la tierra llana se curva hasta ser una esfera. Solo el Camino Recto sigue llevando al Oeste, y solo para los Elfos."
links:
  - to: ar-pharazon-sets-foot-on-aman
    type: caused-by
    note:
      en: "The Valar give the world back to Ilúvatar, who answers the invasion."
      es: "Los Valar devuelven el mundo a Ilúvatar, que responde a la invasión."
  - to: downfall-of-numenor
    type: concurrent
    note:
      en: "The same change, seen from the island: the chasm that swallows the fleet and the wave that drowns Númenor."
      es: "El mismo cambio, visto desde la isla: la sima que se traga la flota y la ola que ahoga Númenor."
