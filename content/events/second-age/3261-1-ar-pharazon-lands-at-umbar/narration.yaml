- id: news
  en: Word reached Armenelos that Sauron now called himself King of Men, and meant to drive the Númenóreans into the sea.
  es: Llegó a Armenelos la noticia de que Sauron se hacía llamar Rey de los Hombres, y que pretendía echar al mar a los númenóreanos.
- id: fleet
  en: Ar-Pharazôn answered with the greatest fleet yet seen, and landed at the haven of Umbar.
  es: Ar-Pharazôn respondió con la flota más grande vista hasta entonces, y desembarcó en el puerto de Umbar.
- id: march
  en: He marched inland with a host so huge and splendid that Sauron's own servants deserted him.
  es: Avanzó tierra adentro con un ejército tan inmenso y espléndido que los propios servidores de Sauron lo abandonaron.
- id: kneel
  en: So Sauron came down and knelt before the King, humble and fair-spoken. He had seen that he could not win this by force.
  es: Así que Sauron bajó y se arrodilló ante el Rey, humilde y de palabra amable. Había comprendido que no podía vencer por la fuerza.
- id: hostage
  en: Ar-Pharazôn took him back to Númenor as a hostage, to hold him to his oaths. It was just what Sauron wanted.
  es: Ar-Pharazôn se lo llevó a Númenor como rehén, para obligarlo a cumplir sus juramentos. Era justo lo que Sauron quería.
