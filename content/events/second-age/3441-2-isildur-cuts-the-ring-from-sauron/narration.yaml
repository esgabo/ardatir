- id: sword
  en: Isildur stood over his fallen father and took up the broken hilt of Narsil.
  es: Isildur se quedó junto a su padre caído y recogió la empuñadura rota de Narsil.
- id: cut
  en: With it, he cut the One Ring from Sauron's hand.
  es: Con ella, cortó el Anillo Único de la mano de Sauron.
- id: overthrown
  en: Sauron was overthrown. His body was gone and his spirit fled, and his Dark Tower was torn down, though its foundations remained.
  es: Sauron fue derrotado. Su cuerpo desapareció y su espíritu huyó, y su Torre Oscura fue derribada, aunque sus cimientos permanecieron.
- id: plea
  en: "Elrond and Círdan were with him. The Mountain where the Ring was made was right there, they told him: throw it into the fire and end it."
  es: "Elrond y Círdan estaban con él. La Montaña donde se forjó el Anillo estaba allí mismo, le dijeron: que lo arrojara al fuego y acabara con él."
- id: keep
  en: But Isildur would not. He kept it for himself, as payment for the deaths of his father and his brother.
  es: Pero Isildur se negó. Se lo quedó, como compensación por la muerte de su padre y de su hermano.
- id: end
  en: So the Second Age came to its end. Sauron was beaten but not destroyed, for the Ring had not been unmade.
  es: Así llegó a su fin la Segunda Edad. Sauron había sido vencido pero no destruido, porque el Anillo no se había deshecho.
