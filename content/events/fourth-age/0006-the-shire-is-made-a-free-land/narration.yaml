- id: quiet
  en: "The war was five years gone, and the Shire had put itself back together: new mills pulled down, new trees planted, holes dug out and lived in again."
  es: "Hacía cinco años que la guerra había terminado, y la Comarca se había recompuesto: molinos nuevos derribados, árboles nuevos plantados, agujeros desenterrados y habitados otra vez."
- id: edict
  en: Then word came north from the King. No Man was to cross into the Shire; the little country was a free land, held under his sceptre and governed by nobody but hobbits.
  es: Entonces llegó del Rey una orden desde el sur. Ningún Hombre debía entrar en la Comarca; aquel pequeño país era tierra libre, amparada por su cetro y gobernada por nadie más que hobbits.
- id: keeping
  en: "It was the quietest kind of reward, and the one they would have chosen: to be left alone, and to know that being left alone was now the law."
  es: "Era la recompensa más discreta posible, y la que ellos habrían elegido: que los dejaran en paz, y saber que dejarlos en paz era ya la ley."
- id: mayor
  en: That same year the Mayor stepped down, and the Shire chose Samwise Gamgee in his place. They would choose him six times more.
  es: Ese mismo año el alcalde se retiró, y la Comarca eligió en su lugar a Samsagaz Gamyi. Lo elegirían seis veces más.
