title:
  en: The Shire is Made a Free Land
  es: La Comarca se declara tierra libre
summary:
  en: King Elessar forbids Men to enter the Shire and takes it under the protection of the Northern Sceptre, leaving the hobbits to govern themselves. The same year Sam is elected Mayor for the first of seven times.
  es: El rey Elessar prohíbe a los Hombres entrar en la Comarca y la pone bajo la protección del Cetro del Norte, dejando que los hobbits se gobiernen a sí mismos. Ese mismo año Sam es elegido alcalde por primera de siete veces.
links:
  - to: coronation-of-king-elessar
    type: enabled-by
    note:
      en: Only a crowned king of the North and South could set the Shire outside the traffic of Men and make it stick.
      es: Sólo un rey coronado del Norte y del Sur podía poner la Comarca al margen del paso de los Hombres y hacer que se respetara.
