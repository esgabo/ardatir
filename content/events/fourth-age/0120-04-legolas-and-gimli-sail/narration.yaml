- id: longing
  en: Legolas had heard gulls at Pelargir a hundred and twenty years before, and from that day the Sea had been pulling at him. He stayed for Aragorn.
  es: Legolas había oído las gaviotas en Pelargir ciento veinte años antes, y desde aquel día el Mar tiraba de él. Se quedó por Aragorn.
- id: ship
  en: When the King was dead he built a grey ship in Ithilien, in the green country he had helped to replant, and brought it down to the Anduin.
  es: Muerto el Rey, construyó una nave gris en Ithilien, en la tierra verde que él había ayudado a repoblar, y la bajó al Anduin.
- id: gimli
  en: And it is said that Gimli son of Glóin went with him, down the river and out past the mouths of Anduin and over the Sea.
  es: Y se cuenta que Gimli hijo de Glóin fue con él, río abajo y más allá de las bocas del Anduin, y cruzó el Mar.
- id: friendship
  en: No dwarf had ever been given that road. If he was granted it, it was for the Lady of the Golden Wood, and for an elf who would not go without him.
  es: A ningún enano se le había dado jamás ese camino. Si se le concedió, fue por la Dama del Bosque Dorado, y por un elfo que no quiso partir sin él.
- id: end
  en: When that ship passed the mouths of the river, the Fellowship of the Ring was over in Middle-earth.
  es: Cuando aquella nave pasó las bocas del río, la Compañía del Anillo había terminado en la Tierra Media.
