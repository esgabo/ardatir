- id: birthday
  en: "Three months later came the twenty-second of September: Bilbo's birthday, and Frodo's, and the day Frodo had ridden away sixty-one years before."
  es: "Tres meses después llegó el veintidós de septiembre: el cumpleaños de Bilbo, y el de Frodo, y el día en que Frodo se había marchado sesenta y un años antes."
- id: leaving
  en: Sam put his house in order, said goodbye to his children, and rode out of Bag End westward, an old gardener on a pony.
  es: Sam dejó su casa en orden, se despidió de sus hijos, y salió de Bolsón Cerrado hacia el oeste, un viejo jardinero sobre un poni.
- id: book
  en: At the Tower Hills Elanor was waiting. He gave her the great red book, the one Bilbo began and Frodo finished and he had added the last pages to.
  es: En las Colinas de las Torres lo esperaba Elanor. Le entregó el gran libro rojo, el que empezó Bilbo y terminó Frodo y al que él había añadido las últimas páginas.
- id: westward
  en: Then he went on past the white towers, and she watched him until she could not see him, and no one in Middle-earth saw him again.
  es: Después siguió más allá de las torres blancas, y ella lo miró hasta no poder verlo, y nadie en la Tierra Media volvió a verlo.
- id: ship
  en: Her children told their children that he came to the Grey Havens and took ship, and passed over Sea, the last of the Ring-bearers.
  es: Sus hijos contaron a sus hijos que llegó a los Puertos Grises y embarcó, y cruzó el Mar, el último de los Portadores del Anillo.
