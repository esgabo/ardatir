- id: message
  en: Two springs later a rider came to Buckland out of Rohan. King Éomer was old, and wished to see Holdwine of the Mark once more.
  es: Dos primaveras después llegó a Los Gamos un jinete venido de Rohan. El rey Éomer era anciano, y deseaba ver una vez más a Holdwine de la Marca.
- id: counsel
  en: Meriadoc was a hundred and two, and still hale. He went to his old friend the Thain, and the two of them decided together, as they had decided everything.
  es: Meriadoc tenía ciento dos años, y seguía entero. Fue a ver a su viejo amigo el Thain, y los dos lo decidieron juntos, como lo habían decidido todo.
- id: handover
  en: They gave their houses and their offices to their sons, the Master of Buckland and the Took of Tuckborough, and left the Shire in order behind them.
  es: Entregaron sus casas y sus cargos a sus hijos, el Señor de Los Gamos y el Tuk de Alforzada, y dejaron la Comarca en orden tras ellos.
- id: ford
  en: They rode south-east to Sarn Ford, two old hobbits with Rohan and Gondor in their saddlebags, and crossed over.
  es: Cabalgaron al sureste hasta el Vado de Sarn, dos viejos hobbits con Rohan y Gondor en las alforjas, y lo cruzaron.
- id: never
  en: No one in the Shire saw either of them again. One had been a squire of Rohan and the other a guard of the Citadel, and neither had ever quite come home from the war.
  es: Nadie en la Comarca volvió a verlos. Uno había sido escudero de Rohan y el otro guardia de la Ciudadela, y ninguno había regresado nunca del todo de la guerra.
