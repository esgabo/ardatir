summary:
  en: A message comes from King Éomer, who wants to see Holdwine of the Mark one last time. Merry is a hundred and two; he hands Buckland to his son, Pippin hands over the Thainship, and the two of them cross Sarn Ford and are never seen in the Shire again.
  es: Llega un mensaje del rey Éomer, que quiere ver una última vez a Holdwine de la Marca. Merry tiene ciento dos años; entrega Los Gamos a su hijo, Pippin cede el cargo de Thain, y los dos cruzan el Vado de Sarn y no vuelven a ser vistos en la Comarca.
