- id: midyear
  en: Mid-year's Day in the Shire is the longest and brightest of the year, a day outside the months, kept for feasting.
  es: El Día de Mediados del Año en la Comarca es el más largo y luminoso, un día fuera de los meses, reservado para las fiestas.
- id: rose
  en: On that day, in Bag End, Rose Gamgee died. They had been married sixty-two years and had thirteen children, and she had never once asked him about the Ring.
  es: Ese día, en Bolsón Cerrado, murió Rosita Gamyi. Llevaban sesenta y dos años casados y habían tenido trece hijos, y ella no le preguntó jamás por el Anillo.
- id: alone
  en: Sam was ninety-two. The garden was in order, the Shire was at peace, and his children had children of their own.
  es: Sam tenía noventa y dos años. El jardín estaba en orden, la Comarca en paz, y sus hijos tenían ya hijos propios.
- id: west
  en: He had been a Ring-bearer too. Of all the things he had been given, that was the one he had never used.
  es: Él también había sido Portador del Anillo. De todo lo que le habían concedido, eso era lo único que nunca había usado.
