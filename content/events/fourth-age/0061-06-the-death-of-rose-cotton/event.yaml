summary:
  en: On Mid-year's Day, in the house they had filled with thirteen children, Rose dies. Sam is ninety-two, and for the first time since he came home from the Sea there is nothing keeping him in the Shire.
  es: El Día de Mediados del Año, en la casa que habían llenado de trece hijos, muere Rosita. Sam tiene noventa y dos años, y por primera vez desde que volvió del Mar nada lo retiene en la Comarca.
