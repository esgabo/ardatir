- id: age
  en: Aragorn reigned a hundred and twenty years, and lived two hundred and ten. He had seen the Shire made free, his friends buried, and his kingdom at peace from the Sea to the Sea of Rhûn.
  es: Aragorn reinó ciento veinte años, y vivió doscientos diez. Había visto a la Comarca declarada libre, a sus amigos enterrados, y a su reino en paz desde el Mar hasta el Mar de Rhûn.
- id: crown
  en: Then, while his mind was still his own, he called Eldarion his son and gave him the winged crown and the sceptre of Arnor. It was a thing the kings of Númenor had once known how to do, and had forgotten.
  es: Entonces, mientras aún era dueño de su mente, llamó a su hijo Eldarion y le dio la corona alada y el cetro de Arnor. Era algo que los reyes de Númenor supieron hacer un día, y habían olvidado.
- id: farewell
  en: He went to the House of the Kings and lay down, and Arwen came to him and asked him to wait a little longer. She had not understood, until that room, what she had chosen.
  es: Fue a la Casa de los Reyes y se tendió allí, y Arwen vino a él y le pidió que esperara un poco más. No había comprendido, hasta aquella estancia, lo que había escogido.
- id: hope
  en: He told her that there is grief in parting but not despair, that they were not bound forever to the circles of the world, and that beyond them there is more than memory.
  es: Él le dijo que en la despedida hay dolor pero no desesperación, que no estaban atados para siempre a los círculos del mundo, y que más allá de ellos hay algo más que recuerdo.
- id: sleep
  en: Then he gave her his hand and slept, and the grace of his long life was plain on him, so that those who came in saw a young man asleep.
  es: Luego le dio la mano y se durmió, y la gracia de su larga vida quedó patente en él, de modo que quienes entraron vieron a un hombre joven dormido.
