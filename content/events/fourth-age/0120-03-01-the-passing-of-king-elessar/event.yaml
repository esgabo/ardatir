summary:
  en: At two hundred and ten years old, Aragorn chooses his hour, gives the crown to Eldarion, and lays down his life while he is still himself. Arwen cannot follow where he goes, and begs him to stay; he will not.
  es: A los doscientos diez años, Aragorn elige su hora, entrega la corona a Eldarion y rinde la vida mientras sigue siendo él mismo. Arwen no puede seguirlo a donde él va, y le ruega que se quede; él no accede.
