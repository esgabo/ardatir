- id: wedding
  en: On the Far Downs, at the western edge of the Shire, Elanor the Fair married Fastred of Greenholm.
  es: En las Lomas Lejanas, en el límite occidental de la Comarca, Elanor la Bella se casó con Fastred de Verdealtozano.
- id: gift
  en: The year after, the King gave the Shire everything from the downs west to the Tower Hills, and called it the Westmarch.
  es: Al año siguiente, el Rey entregó a la Comarca todo lo que va de las lomas al oeste hasta las Colinas de las Torres, y lo llamó la Marca del Oeste.
- id: undertowers
  en: Fastred and Elanor went to live there, at Undertowers beneath Elendil's white towers, and he was made the first Warden of the new country.
  es: Fastred y Elanor se fueron a vivir allí, en Bajo las Torres, al pie de las torres blancas de Elendil, y a él lo nombraron primer Guardián de la nueva tierra.
- id: westward
  en: Hobbits had never held land so far west before. Above their new home stood the tower whose seeing-stone looked out to Sea, and nowhere else.
  es: Nunca antes los hobbits habían tenido tierras tan al oeste. Sobre su nuevo hogar se alzaba la torre cuya piedra vidente miraba al Mar, y a nada más.
