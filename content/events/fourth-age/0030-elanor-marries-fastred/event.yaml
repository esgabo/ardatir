summary:
  en: Sam's eldest daughter marries Fastred of Greenholm on the Far Downs. The next year the King gives the Shire the land west to the Tower Hills, and the two of them go to keep it.
  es: La hija mayor de Sam se casa con Fastred de Verdealtozano en las Lomas Lejanas. Al año siguiente el Rey entrega a la Comarca la tierra que llega hasta las Colinas de las Torres, y los dos van a custodiarla.
