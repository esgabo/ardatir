summary:
  en: Arwen leaves Minas Tirith and goes to Lothlórien, now empty of its people, and lies down on the green mound where she gave Aragorn her troth. There she dies, and with her the last evening star of her kindred goes out of Middle-earth.
  es: Arwen deja Minas Tirith y va a Lothlórien, ya vacía de su gente, y se tiende en el túmulo verde donde dio su palabra a Aragorn. Allí muere, y con ella se apaga en la Tierra Media la última estrella vespertina de su linaje.
