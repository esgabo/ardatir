- id: leaving
  en: Arwen said goodbye to her children and left the City, and went north alone to the wood where she had grown up.
  es: Arwen se despidió de sus hijos y dejó la Ciudad, y marchó sola al norte, al bosque en que había crecido.
- id: empty
  en: Lothlórien was still beautiful and entirely empty. Her grandmother had gone over Sea, her grandfather had gone to Rivendell, and no one sang in the trees.
  es: Lothlórien seguía siendo hermosa y estaba del todo vacía. Su abuela había cruzado el Mar, su abuelo se había ido a Rivendel, y nadie cantaba en los árboles.
- id: mound
  en: She climbed Cerin Amroth, the green mound at the heart of the wood, where long ago she had taken his hand and chosen a mortal life.
  es: Subió a Cerin Amroth, el túmulo verde en el corazón del bosque, donde mucho antes le había tomado la mano y escogido una vida mortal.
- id: winter
  en: There she lay down, and there, before the leaves fell, she died; and her grave is on that hill until the world changes.
  es: Allí se tendió, y allí, antes de que cayeran las hojas, murió; y su tumba está en aquella colina hasta que el mundo cambie.
- id: evenstar
  en: She was called Evenstar, the evening star of her people. No one of the Elves born in Middle-earth was ever so fair again, and no one had to be.
  es: La llamaban Estrella de la Tarde, la estrella vespertina de su pueblo. Ninguna de los Elfos nacida en la Tierra Media volvió a ser tan hermosa, y no hizo falta que lo fuera.
