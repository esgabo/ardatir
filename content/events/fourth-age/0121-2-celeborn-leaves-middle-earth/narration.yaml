- id: rivendell
  en: Celeborn had not gone with Galadriel. He left the Golden Wood and lived at Rivendell with Elrond's sons, in a house that was emptying year by year.
  es: Celeborn no se había ido con Galadriel. Dejó el Bosque Dorado y vivió en Rivendel con los hijos de Elrond, en una casa que se vaciaba año tras año.
- id: memory
  en: He had seen the light of the Two Trees reflected in Doriath, and heard Melian sing, and watched Beleriand go under the Sea.
  es: Había visto la luz de los Dos Árboles reflejada en Doriath, y oído cantar a Melian, y contemplado cómo Beleriand se hundía bajo el Mar.
- id: havens
  en: No one wrote down the day he rode west to the Grey Havens. Only that he did, at last, and that he was the last to go.
  es: Nadie anotó el día en que cabalgó al oeste, hacia los Puertos Grises. Sólo que lo hizo, al fin, y que fue el último en partir.
- id: elder-days
  en: When his ship cleared the harbour, the last living memory of the Elder Days left Middle-earth, and what was left was history.
  es: Cuando su nave salió del puerto, la última memoria viva de los Días Antiguos dejó la Tierra Media, y lo que quedó fue historia.
