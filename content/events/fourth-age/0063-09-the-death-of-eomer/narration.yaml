- id: edoras
  en: Merry came to Edoras before the leaves turned, and Éomer knew him.
  es: Merry llegó a Edoras antes de que cambiaran las hojas, y Éomer lo reconoció.
- id: years
  en: Éomer the Blessed had been King of the Mark for sixty-five years. He had taken a ruined country and left it fuller of horses and children than it had ever been.
  es: Éomer el Bienaventurado había sido Rey de la Marca sesenta y cinco años. Había tomado un país arruinado y lo dejaba con más caballos y más niños que nunca.
- id: hand
  en: The old hobbit sat with the old king, and they talked, surely, about his sister, and about the thing she and Merry had brought down between them.
  es: El viejo hobbit se sentó con el viejo rey, y hablaron, sin duda, de su hermana, y de aquello que ella y Merry derribaron entre los dos.
- id: death
  en: That autumn Éomer died, and one of the last men living who had charged onto the Pelennor at dawn was gone.
  es: Aquel otoño murió Éomer, y se fue uno de los últimos hombres vivos que habían cargado sobre el Pelennor al amanecer.
- id: south
  en: Merry and Pippin rode on south to Gondor, and lived out their years there. When they died they were laid in the Silent Street among the great of the City.
  es: Merry y Pippin siguieron hacia el sur, a Gondor, y allí vivieron sus últimos años. Cuando murieron los pusieron en la Calle Silenciosa entre los grandes de la Ciudad.
