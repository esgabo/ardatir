  en: Merry reaches Edoras in time and sits with Éomer until the end. Éomer Éadig had ruled Rohan for sixty-five years, and the Mark had never been richer; then Merry and Pippin ride south to Gondor, to spend what is left of their lives there.
  es: Merry llega a Edoras a tiempo y acompaña a Éomer hasta el final. Éomer Éadig había gobernado Rohan sesenta y cinco años, y la Marca nunca había sido más próspera; después Merry y Pippin cabalgan al sur, a Gondor, a pasar allí lo que les quede de vida.
