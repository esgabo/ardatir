- id: north
  en: Nine years later the King came north again, and stayed a while by the lake at Evendim, where the kings of old had their city.
  es: Nueve años después el Rey volvió al norte, y se quedó una temporada junto al lago de Evendim, donde los reyes de antaño tuvieron su ciudad.
- id: arrival
  en: He rode as far as the Brandywine Bridge and no further. He had forbidden Men to enter the Shire, and he was a Man.
  es: Cabalgó hasta el Puente del Brandivino y no más allá. Había prohibido a los Hombres entrar en la Comarca, y él era un Hombre.
- id: friends
  en: "So his friends came out to him instead: the Master of Buckland, the Thain of the Shire, and the Mayor with his daughter."
  es: "Así que fueron sus amigos quienes salieron a su encuentro: el Señor de Los Gamos, el Thain de la Comarca, y el alcalde con su hija."
- id: star
  en: There on the bridge he gave Samwise the Star of the Dúnedain, a silver brooch out of the north, for a gardener who had carried the Ring up a mountain.
  es: Allí, en el puente, dio a Samsagaz la Estrella de los Dúnedain, un broche de plata venido del norte, a un jardinero que había llevado el Anillo hasta una montaña.
- id: elanor
  en: And Elanor, who was named for a flower of Lothlórien, was made a maid of honour to Queen Arwen, the first hobbit ever asked. Six years later she rode south with her parents to serve her.
  es: Y Elanor, que llevaba el nombre de una flor de Lothlórien, fue nombrada dama de honor de la reina Arwen, la primera hobbit a quien se le pidió. Seis años después cabalgó al sur con sus padres para servirla.
