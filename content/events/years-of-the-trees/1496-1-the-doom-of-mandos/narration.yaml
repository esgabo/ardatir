- id: north
  en: The Noldor went on northward along the coast, some in the stolen ships, most on foot. At the edge of the land, a dark figure stood above them on a cliff.
  es: Los Noldor siguieron hacia el norte por la costa, algunos en las naves robadas y la mayoría a pie. En el confín de la tierra, una figura oscura se alzaba sobre ellos en un acantilado.
- id: voice
  en: Some say it was Mandos himself. His voice rang over the whole host, telling them what their deeds had earned.
  es: Hay quien dice que era el propio Mandos. Su voz resonó sobre toda la hueste, diciéndoles lo que sus actos les habían ganado.
- id: doom
  en: Their oath would drive them, and turn against them. Betrayal and sorrow would follow them all their days, and the way back to Valinor would be shut.
  es: Su juramento los empujaría y se volvería contra ellos. La traición y el dolor los seguirían todos sus días, y el camino de vuelta a Valinor quedaría cerrado.
- id: finarfin
  en: Finarfin turned back with many of his people and asked the Valar's pardon. He became king of the Noldor who stayed in Aman.
  es: Finarfin se volvió atrás con muchos de los suyos y pidió perdón a los Valar. Se convirtió en rey de los Noldor que se quedaron en Aman.
- id: onward
  en: But Fëanor would not be stopped. Fingolfin and his sons, and Finarfin's children too, would not abandon their kin, and went on with him into the cold.
  es: Pero nada iba a detener a Fëanor. Fingolfin y sus hijos, y también los hijos de Finarfin, no quisieron abandonar a los suyos, y siguieron con él hacia el frío.
