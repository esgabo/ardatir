- id: camp
  en: Fëanor's people made camp by the long lake of Mithrim. Before they were ready, Morgoth's orcs came pouring down upon them.
  es: La gente de Fëanor acampó junto al largo lago de Mithrim. Antes de que estuvieran preparados, los orcos de Morgoth cayeron en tropel sobre ellos.
- id: battle
  en: But the Noldor had come from Aman, and the light of the Trees still burned in their eyes. They drove the orcs back and broke them. There was no Moon yet, and this was the Battle under Stars.
  es: Pero los Noldor venían de Aman, y la luz de los Árboles aún ardía en sus ojos. Rechazaron a los orcos y los derrotaron. Aún no había Luna, y esta fue la Batalla bajo las Estrellas.
- id: pursuit
  en: Fëanor, burning to reach Morgoth himself, rode ahead of his army toward Angband with only a few beside him.
  es: Fëanor, ansioso por alcanzar al propio Morgoth, se adelantó a su ejército hacia Angband con solo unos pocos a su lado.
- id: gothmog
  en: Balrogs came out against him, led by Gothmog, their lord. Fëanor fought on almost alone until he was struck down, mortally wounded.
  es: Los Balrogs salieron a su encuentro, guiados por Gothmog, su señor. Fëanor siguió luchando casi solo hasta que cayó, herido de muerte.
- id: ash
  en: His sons carried him back. Seeing Morgoth's mountains far off, he cursed his enemy and bound his sons to their oath. Then he died, and so fierce was his spirit that his body fell to ash.
  es: Sus hijos lo llevaron de vuelta. Al ver a lo lejos las montañas de Morgoth, maldijo a su enemigo y obligó a sus hijos a cumplir su juramento. Luego murió, y tan feroz era su espíritu que su cuerpo se deshizo en ceniza.
