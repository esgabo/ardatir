- id: shore
  en: The Vanyar and the Noldor reached the western shore of Middle-earth and saw the sea for the first time. Many were afraid of it.
  es: Los Vanyar y los Noldor llegaron a la costa occidental de la Tierra Media y vieron el mar por primera vez. A muchos les dio miedo.
- id: island
  en: Ulmo, lord of waters, came to help them. He drew a whole island out to the shore, and when the Elves had stepped onto it, he towed it across the sea to Aman.
  es: Ulmo, señor de las aguas, acudió en su ayuda. Llevó una isla entera hasta la orilla, y cuando los Elfos subieron a ella, la arrastró a través del mar hasta Aman.
- id: light
  en: They stepped onto the shores of the West, and for the first time the light of the Two Trees fell on their faces.
  es: Pisaron las costas del Oeste, y por primera vez la luz de los Dos Árboles cayó sobre sus rostros.
- id: tirion
  en: In a pass through the mountains, the Valar raised a green hill for them, and on it the Elves built a white city, Tirion.
  es: En un paso entre las montañas, los Valar alzaron para ellos una colina verde, y sobre ella los Elfos construyeron una ciudad blanca, Tirion.
- id: finwe
  en: There the Noldor lived, with Finwë as their king. They learned much from Aulë the smith, and came to love words, crafts and gems more than any other people.
  es: Allí vivieron los Noldor, con Finwë como rey. Aprendieron mucho de Aulë el herrero, y llegaron a amar las palabras, los oficios y las gemas más que ningún otro pueblo.
