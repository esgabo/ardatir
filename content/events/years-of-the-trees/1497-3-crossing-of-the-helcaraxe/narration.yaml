- id: choice
  en: "Abandoned in the cold north of Aman, Fingolfin's people had a choice: go back in shame, or cross the ice."
  es: "Abandonada en el frío norte de Aman, la gente de Fingolfin tenía que elegir: volver avergonzada, o cruzar el hielo."
- id: ice
  en: They chose the Helcaraxë, the Grinding Ice, where freezing mists hung and the ice shifted and split beneath their feet.
  es: Eligieron el Helcaraxë, el Hielo Crujiente, donde colgaban nieblas heladas y el hielo se movía y se abría bajo sus pies.
- id: loss
  en: Many were lost on the way. Elenwë, wife of Fingolfin's son Turgon, was among them, and the survivors held one another close in the frozen dark.
  es: Muchos se perdieron por el camino. Elenwë, esposa de Turgon, el hijo de Fingolfin, fue una de ellos, y los supervivientes se mantenían unidos en la oscuridad helada.
- id: lead
  en: Fingolfin led them on, with his son Fingon and Finarfin's children, Finrod and Galadriel, beside him. None of them would give up.
  es: Fingolfin los guiaba, con su hijo Fingon y los hijos de Finarfin, Finrod y Galadriel, a su lado. Ninguno quiso rendirse.
- id: grudge
  en: When at last they set foot in Middle-earth, they did not forget who had left them behind.
  es: Cuando por fin pisaron la Tierra Media, no olvidaron quién los había dejado atrás.
