- id: hunt
  en: Oromë, the great hunter of the Valar, still rode now and then into the dark lands of Middle-earth, chasing the monsters Melkor had bred there.
  es: Oromë, el gran cazador de los Valar, todavía cabalgaba de vez en cuando por las tierras oscuras de la Tierra Media, persiguiendo a los monstruos que Melkor había criado allí.
- id: song
  en: Riding east one day, he heard singing far away, and turned his white horse toward it. By the waters of Cuiviénen, he found the Elves.
  es: Un día, cabalgando hacia el este, oyó cantar a lo lejos y volvió hacia allí su caballo blanco. Junto a las aguas de Cuiviénen, encontró a los Elfos.
- id: fear
  en: Some of them ran and hid. Melkor had already sent shadows and dark riders among them, and some of their people had vanished, never to return.
  es: Algunos huyeron y se escondieron. Melkor ya había enviado sombras y jinetes oscuros entre ellos, y algunos de los suyos habían desaparecido para no volver.
- id: light
  en: But the bravest looked up into Oromë's face and saw no darkness there, only the light of the West. He loved them from that moment.
  es: Pero los más valientes miraron el rostro de Oromë y no vieron en él oscuridad, sino la luz del Oeste. Desde ese momento los amó.
- id: west
  en: "He stayed with them a while and told them of the light beyond the sea. Then he rode back to Valinor with the news: the Firstborn of Ilúvatar had awoken, and darkness was all around them."
  es: "Se quedó un tiempo con ellos y les habló de la luz más allá del mar. Luego volvió a Valinor con la noticia: los Primeros Nacidos de Ilúvatar habían despertado, y la oscuridad los rodeaba."
