source: { book: the-silmarillion, chapter: "Of the Beginning of Days" }
title:
  en: The Two Trees of Valinor
  es: Los Dos Árboles de Valinor
summary:
  en: "In Valinor, on a green mound by the gates of the city of the Valar, Yavanna sings and Nienna waters the earth with her tears. Two Trees grow there: silver Telperion and golden Laurelin, whose light waxes and wanes in turn, and from them the days of Valinor are counted."
  es: "En Valinor, sobre un montículo verde junto a las puertas de la ciudad de los Valar, Yavanna canta y Nienna riega la tierra con sus lágrimas. Allí crecen dos Árboles: Telperion, de plata, y Laurelin, de oro, cuya luz crece y mengua por turnos, y por ellos se cuentan los días de Valinor."
links:
