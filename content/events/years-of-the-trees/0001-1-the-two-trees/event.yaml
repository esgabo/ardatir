id: the-two-trees
age: years-of-the-trees
when:
  # The Annals of Aman begin the count of the Years of the Trees with their first flowering,
  # so year 1 by definition; the conversion to Sun-years is the axis's concern.
  start: { age: years-of-the-trees, year: 1 }
  precision: year
