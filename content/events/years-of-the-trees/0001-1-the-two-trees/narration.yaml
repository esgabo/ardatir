- id: aman
  en: After the Lamps fell, the Valar went to Aman, the land in the far West. They raised great mountains along its shore, and behind them they made Valinor, their new home.
  es: Tras la caída de las Lámparas, los Valar se fueron a Aman, la tierra del lejano Oeste. Alzaron grandes montañas a lo largo de su costa, y tras ellas hicieron Valinor, su nuevo hogar.
- id: song
  en: Near the gates of their city rose a green mound. Yavanna sat on it and sang, while Nienna watered the earth with her tears, and all the Valar listened in silence.
  es: Cerca de las puertas de su ciudad se alzaba un montículo verde. Yavanna se sentó en él y cantó, mientras Nienna regaba la tierra con sus lágrimas, y todos los Valar escuchaban en silencio.
- id: telperion
  en: Two shoots came up from the mound and grew into trees. The elder was Telperion, its leaves dark above and pale silver below, and silver light dripped from its blossoms.
  es: Del montículo brotaron dos retoños que crecieron hasta ser árboles. El mayor fue Telperion, de hojas oscuras por encima y de plata pálida por debajo, y de sus flores goteaba una luz de plata.
- id: laurelin
  en: The younger was Laurelin, fresh green rimmed with gold, its blossoms hanging like small flames and letting fall a warm, golden rain of light.
  es: El menor fue Laurelin, de un verde fresco ribeteado de oro, con flores que colgaban como pequeñas llamas y dejaban caer una cálida lluvia de luz dorada.
- id: mingling
  en: Each Tree shone and dimmed in turn, and twice a day their lights mingled softly. By that light the Valar counted the days, and the Years of the Trees began.
  es: Cada Árbol brillaba y se apagaba por turnos, y dos veces al día sus luces se mezclaban suavemente. Por esa luz contaron los Valar los días, y comenzaron los Años de los Árboles.
