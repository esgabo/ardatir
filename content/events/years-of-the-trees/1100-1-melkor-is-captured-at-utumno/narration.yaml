- id: council
  en: In Valinor, Manwë called the Valar to council. For the sake of the Elves, they agreed to go to war against Melkor, whatever it might cost.
  es: En Valinor, Manwë llamó a consejo a los Valar. Por el bien de los Elfos, acordaron hacer la guerra a Melkor, costara lo que costase.
- id: march
  en: They marched into the far north, to Utumno, Melkor's fortress dug deep beneath ice and stone.
  es: Marcharon hacia el lejano norte, hasta Utumno, la fortaleza de Melkor, excavada a gran profundidad bajo el hielo y la piedra.
- id: siege
  en: The siege was long, and the land shook and broke around it. At last the gates gave way, and the deep halls of Utumno were laid open.
  es: El asedio fue largo, y la tierra tembló y se quebró a su alrededor. Al fin cedieron las puertas, y las hondas estancias de Utumno quedaron al descubierto.
- id: tulkas
  en: Melkor fled into the deepest pit. Tulkas the strong wrestled him down, and he was bound with a great chain named Angainor.
  es: Melkor huyó al pozo más profundo. Tulkas el fuerte luchó con él hasta derribarlo, y lo ataron con una gran cadena llamada Angainor.
- id: judgement
  en: In chains, he was brought to Valinor and set before Manwë. He was shut away in the halls of Mandos, to stay there for three long ages.
  es: Encadenado, lo llevaron a Valinor ante Manwë. Lo encerraron en las moradas de Mandos, donde habría de permanecer tres largas edades.
