- id: ungoliant
  en: "Melkor slipped away from the Valar and went south, to a dark coast where Ungoliant lived: a spirit of endless hunger in the shape of a monstrous spider."
  es: "Melkor escapó de la vigilancia de los Valar y fue al sur, a una costa oscura donde vivía Ungoliant: un espíritu de hambre sin fin con forma de araña monstruosa."
- id: festival
  en: On a day of festival, when the Valar and most of the Elves were gathered on Manwë's mountain, the two crept into Valinor wrapped in a cloud of darkness.
  es: Un día de fiesta, cuando los Valar y la mayoría de los Elfos estaban reunidos en la montaña de Manwë, los dos entraron a escondidas en Valinor envueltos en una nube de oscuridad.
- id: trees
  en: Melkor struck each Tree with his spear, and Ungoliant drank their light to the last drop. The Trees withered, and a great darkness fell over Valinor.
  es: Melkor hirió cada Árbol con su lanza, y Ungoliant bebió su luz hasta la última gota. Los Árboles se secaron, y una gran oscuridad cayó sobre Valinor.
- id: formenos
  en: Then Melkor went to Formenos. Finwë stood alone at its doors and would not give way, and Melkor killed him. He broke open the iron chamber and took the Silmarils.
  es: Luego Melkor fue a Formenos. Finwë se le plantó solo ante las puertas y no cedió, y Melkor lo mató. Forzó la cámara de hierro y se llevó los Silmarils.
- id: refusal
  en: On the mountain, Yavanna said that only the light in the Silmarils could heal the Trees. Fëanor would not give them up. Then the news came from Formenos.
  es: En la montaña, Yavanna dijo que solo la luz de los Silmarils podía sanar los Árboles. Fëanor se negó a entregarlos. Entonces llegó la noticia de Formenos.
- id: morgoth
  en: His father was dead, and his jewels were gone. Fëanor cursed Melkor and named him Morgoth, the Black Enemy, while Morgoth fled north over the ice toward Middle-earth.
  es: Su padre había muerto y sus joyas habían desaparecido. Fëanor maldijo a Melkor y lo llamó Morgoth, el Enemigo Oscuro, mientras Morgoth huía al norte, sobre el hielo, hacia la Tierra Media.
