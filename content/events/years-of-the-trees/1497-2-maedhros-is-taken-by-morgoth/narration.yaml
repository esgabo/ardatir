- id: offer
  en: After Fëanor's death, Morgoth sent word to his sons. He would talk with them, he said, and might even give back a Silmaril.
  es: Tras la muerte de Fëanor, Morgoth envió un mensaje a sus hijos. Dijo que hablaría con ellos, y que quizá hasta les devolviera un Silmaril.
- id: parley
  en: Maedhros, the eldest, went to meet his messengers. Neither side meant to keep faith, but Morgoth sent far more.
  es: Maedhros, el mayor, fue a reunirse con sus mensajeros. Ninguno de los dos bandos pensaba cumplir su palabra, pero Morgoth envió muchos más.
- id: taken
  en: Maedhros's companions were all slain, and he was dragged to Angband alive.
  es: Todos los compañeros de Maedhros murieron, y a él lo arrastraron vivo hasta Angband.
- id: hostage
  en: Morgoth told his brothers that Maedhros would go free only if the Noldor gave up the war. They knew he would never keep his word, and did nothing.
  es: Morgoth dijo a sus hermanos que Maedhros solo quedaría libre si los Noldor abandonaban la guerra. Sabían que jamás cumpliría su palabra, y no hicieron nada.
- id: cliff
  en: So Morgoth had Maedhros hung by one wrist from a cliff high on Thangorodrim, and left him there, in pain, far above the world.
  es: Así que Morgoth mandó colgar a Maedhros de una muñeca en un precipicio de lo alto de Thangorodrim, y lo dejó allí, sufriendo, muy por encima del mundo.
