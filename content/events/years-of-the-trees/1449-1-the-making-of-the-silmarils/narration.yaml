- id: wish
  en: Fëanor began to wonder how the light of the Two Trees might be kept safe for ever, so that it could never fade.
  es: Fëanor empezó a preguntarse cómo podría guardarse para siempre la luz de los Dos Árboles, para que nunca se apagara.
- id: work
  en: He worked in secret for a long time, putting all his lore and all his skill into the task.
  es: Trabajó en secreto durante mucho tiempo, poniendo en la tarea todo su saber y toda su destreza.
- id: jewels
  en: At last he made three great jewels, the Silmarils. Within each one, the mingled light of the Trees lived on, glowing even in the deepest dark.
  es: Al fin hizo tres grandes joyas, los Silmarils. Dentro de cada una vivía la luz mezclada de los Árboles, que brillaba incluso en la más honda oscuridad.
- id: hallowed
  en: Varda blessed them, so that no evil hand could touch them without being burned.
  es: Varda las bendijo, de modo que ninguna mano malvada pudiera tocarlas sin quemarse.
- id: hunger
  en: All Valinor marvelled at them. But Fëanor loved them more and more, and began to hide them from every eye but his father's and his sons'.
  es: Todo Valinor las admiraba. Pero Fëanor las amaba cada vez más, y empezó a esconderlas de todos los ojos salvo los de su padre y sus hijos.
