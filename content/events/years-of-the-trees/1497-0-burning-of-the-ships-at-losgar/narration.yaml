- id: strait
  en: In the far north, only a narrow strait choked with ice parted Aman from Middle-earth. There were not enough ships to carry everyone over.
  es: En el extremo norte, solo un estrecho angosto atascado de hielo separaba Aman de la Tierra Media. No había naves suficientes para llevarlos a todos.
- id: secret
  en: Fëanor and his followers boarded the ships by night and crossed to Losgar, leaving Fingolfin's people waiting on the other shore.
  es: Fëanor y sus seguidores embarcaron de noche y cruzaron hasta Losgar, dejando a la gente de Fingolfin esperando en la otra orilla.
- id: maedhros
  en: When they landed, Maedhros, his eldest son, asked who would sail back for his friend Fingon. Fëanor answered that no one would.
  es: Al desembarcar, Maedhros, su hijo mayor, preguntó quién volvería a buscar a su amigo Fingon. Fëanor respondió que nadie.
- id: fire
  en: He had the ships set on fire. The swan-ships of the Teleri burned on the shore, a great blaze against the night sky.
  es: Mandó prender fuego a las naves. Las naves cisne de los Teleri ardieron en la orilla, una gran hoguera contra el cielo nocturno.
- id: seen
  en: Far across the water, Fingolfin's people saw the red glow in the north, and they knew they had been abandoned.
  es: Lejos, al otro lado del agua, la gente de Fingolfin vio el resplandor rojo en el norte, y supo que la habían abandonado.
