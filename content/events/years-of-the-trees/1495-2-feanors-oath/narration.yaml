- id: torches
  en: In the darkness, the Noldor gathered in Tirion by torchlight. Fëanor, though still banished, came back and climbed to a high place where all could see him.
  es: En la oscuridad, los Noldor se reunieron en Tirion a la luz de las antorchas. Fëanor, aunque seguía desterrado, volvió y subió a un lugar alto donde todos pudieran verlo.
- id: speech
  en: He spoke like fire. The Valar had not protected them, he said; why stay with jailers? He urged the Noldor to go back to Middle-earth, to be free and to rule their own lands.
  es: Habló como el fuego. Los Valar no los habían protegido, dijo; ¿por qué quedarse con sus carceleros? Instó a los Noldor a volver a la Tierra Media, a ser libres y gobernar sus propias tierras.
- id: oath
  en: "Then he and his seven sons swore an oath in the name of Ilúvatar: to pursue anyone, Vala, Elf or Man, who kept a Silmaril from them. No one could break such an oath, or take it back."
  es: "Entonces él y sus siete hijos pronunciaron un juramento en nombre de Ilúvatar: perseguir a cualquiera, Vala, Elfo u Hombre, que les negara un Silmaril. Nadie podía romper un juramento así, ni retractarse de él."
- id: brothers
  en: Fingolfin and Finarfin spoke against him, but the Noldor were stirred. Most chose to go, and Fingolfin went too, for his son Fingon urged him and he would not leave his people to Fëanor alone.
  es: Fingolfin y Finarfin le hablaron en contra, pero los Noldor estaban enardecidos. La mayoría decidió marcharse, y Fingolfin también se fue, porque su hijo Fingon se lo pidió y no quería dejar a su pueblo solo en manos de Fëanor.
- id: herald
  en: Finarfin's children, Finrod and Galadriel among them, chose to go as well. A messenger came from Manwë, warning them to stay, but Fëanor would not listen, and the Noldor set out.
  es: Los hijos de Finarfin, entre ellos Finrod y Galadriel, también decidieron partir. Llegó un mensajero de Manwë advirtiéndoles que se quedaran, pero Fëanor no quiso escuchar, y los Noldor se pusieron en marcha.
