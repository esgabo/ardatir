- id: haven
  en: Marching north, the Noldor came to Alqualondë, the Haven of the Swans, where the Teleri kept their white ships.
  es: En su marcha hacia el norte, los Noldor llegaron a Alqualondë, el Puerto de los Cisnes, donde los Teleri guardaban sus naves blancas.
- id: refuse
  en: "Fëanor asked for the ships. The Teleri were the Noldor's friends, but they refused: they would not help anyone leave against the will of the Valar, nor give away the ships they loved."
  es: "Fëanor pidió las naves. Los Teleri eran amigos de los Noldor, pero se negaron: no ayudarían a nadie a marcharse contra la voluntad de los Valar, ni regalarían las naves que tanto amaban."
- id: seize
  en: So Fëanor's people tried to take them by force. The Teleri fought back, and on the quays, in the dark, a terrible struggle began.
  es: Así que la gente de Fëanor intentó tomarlas por la fuerza. Los Teleri se defendieron, y en los muelles, en la oscuridad, comenzó una lucha terrible.
- id: fingon
  en: Fingolfin's people, arriving, rushed in to help their kin without knowing how the fight had started. Many of the Teleri fell. For the first time, Elves had killed Elves.
  es: La gente de Fingolfin, al llegar, corrió a ayudar a los suyos sin saber cómo había empezado la lucha. Muchos Teleri cayeron. Por primera vez, unos Elfos habían matado a otros.
- id: grief
  en: Finarfin, coming last, took no part, for his wife was of the Teleri. The ships were taken, and the sea itself rose in grief against them. It was a stain the Noldor would carry for ever.
  es: Finarfin, que llegó el último, no tomó parte, pues su esposa era de los Teleri. Las naves fueron robadas, y el propio mar se alzó de dolor contra ellos. Era una mancha que los Noldor llevarían para siempre.
