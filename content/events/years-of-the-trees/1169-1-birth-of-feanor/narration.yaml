- id: son
  en: In the bright days of Valinor, Finwë, king of the Noldor, and his wife Míriel had their first child, a son.
  es: En los días luminosos de Valinor, Finwë, rey de los Noldor, y su esposa Míriel tuvieron su primer hijo, un varón.
- id: name
  en: His mother called him Fëanor, Spirit of Fire, and he would live up to that name.
  es: Su madre lo llamó Fëanor, Espíritu de Fuego, y él haría honor a ese nombre.
- id: miriel
  en: But bringing him into the world had used up Míriel's strength. Weary in body and spirit, she lay down to rest in the gardens of Lórien, and her spirit left her and went to the halls of Mandos.
  es: Pero traerlo al mundo había agotado las fuerzas de Míriel. Cansada de cuerpo y de espíritu, se tendió a descansar en los jardines de Lórien, y su espíritu la abandonó y se fue a las moradas de Mandos.
- id: grief
  en: Finwë grieved deeply, and poured all his love into his son.
  es: Finwë sufrió una pena profunda, y volcó todo su amor en su hijo.
- id: flame
  en: Fëanor grew tall and quick, with a mind like a flame. In time he became the most skilled of all the Noldor, and the proudest.
  es: Fëanor creció alto y despierto, con una mente como una llama. Con el tiempo llegó a ser el más hábil de todos los Noldor, y el más orgulloso.
