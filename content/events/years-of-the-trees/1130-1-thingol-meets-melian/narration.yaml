- id: teleri
  en: The Teleri, last on the road, camped for a long time in the lands of Beleriand. Their lord, Elwë, often walked alone through the woods to visit his friend Finwë.
  es: Los Teleri, los últimos del camino, acamparon mucho tiempo en las tierras de Beleriand. Su señor, Elwë, solía caminar solo por los bosques para visitar a su amigo Finwë.
- id: nightingales
  en: One evening, in the forest of Nan Elmoth, he heard nightingales, and among them a voice singing. He followed it, as if in a dream.
  es: Una tarde, en el bosque de Nan Elmoth, oyó ruiseñores, y entre ellos una voz que cantaba. La siguió, como en un sueño.
- id: melian
  en: In a clearing stood Melian, a Maia who had come from the gardens of Lórien in Valinor. Starlight shone around her.
  es: En un claro estaba Melian, una Maia que había venido de los jardines de Lórien en Valinor. La luz de las estrellas brillaba a su alrededor.
- id: enchanted
  en: Elwë took her hand, and in that instant a spell fell on them both. They stood there, silent and still, while the years passed over them unnoticed.
  es: Elwë le tomó la mano, y en ese instante un hechizo cayó sobre los dos. Se quedaron allí, en silencio e inmóviles, mientras los años pasaban sobre ellos sin que lo notaran.
- id: search
  en: His people searched for him and never found him. At last most of the Teleri went on to the sea without their lord, but some stayed behind to wait for him.
  es: Su pueblo lo buscó sin encontrarlo nunca. Al fin la mayoría de los Teleri siguió hacia el mar sin su señor, pero algunos se quedaron a esperarlo.
