- id: summons
  en: The Valar wished to bring the Elves to Valinor, safe in the light of the Trees. But the Elves were wary, for until then they had known the riders of the dark more than any friend.
  es: Los Valar deseaban llevar a los Elfos a Valinor, a salvo bajo la luz de los Árboles. Pero los Elfos desconfiaban, pues hasta entonces habían conocido más a los jinetes de la oscuridad que a ningún amigo.
- id: ambassadors
  en: So three of them, Ingwë, Finwë and Elwë, rode with Oromë to see Valinor for themselves. They came back full of wonder, and urged their people to go.
  es: Así que tres de ellos, Ingwë, Finwë y Elwë, cabalgaron con Oromë para ver Valinor con sus propios ojos. Volvieron maravillados y animaron a su pueblo a partir.
- id: kindreds
  en: "Most followed them, in three hosts: the Vanyar, the Noldor and the Teleri. Others would not leave their starlit shores, and stayed behind."
  es: "La mayoría los siguió, en tres huestes: los Vanyar, los Noldor y los Teleri. Otros no quisieron dejar sus orillas bajo las estrellas, y se quedaron."
- id: road
  en: Oromë rode at their head on his white horse, and they went west slowly, for the road was long and none of them had walked it before.
  es: Oromë cabalgaba al frente en su caballo blanco, y avanzaron despacio hacia el oeste, pues el camino era largo y ninguno lo había recorrido antes.
- id: scattered
  en: Over the years some grew weary, or fell in love with a river or a forest, and stayed where they were. And so the Elves were scattered along the way.
  es: Con los años, algunos se cansaron, o se enamoraron de un río o de un bosque, y se quedaron donde estaban. Y así los Elfos quedaron dispersos a lo largo del camino.
