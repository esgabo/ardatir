- id: stars
  en: Far in the east of Middle-earth, the lands still lay in darkness. Above them, Varda had just kindled new stars, brighter than any before.
  es: En el lejano este de la Tierra Media, las tierras seguían a oscuras. Sobre ellas, Varda acababa de encender estrellas nuevas, más brillantes que ninguna antes.
- id: wake
  en: By a quiet bay, under those stars, the first Elves opened their eyes. Starlight was the first thing they ever saw, and they loved it ever after.
  es: Junto a una bahía tranquila, bajo esas estrellas, los primeros Elfos abrieron los ojos. La luz de las estrellas fue lo primero que vieron, y la amaron para siempre.
- id: water
  en: The first sound they heard was water running over stone. Later the place was remembered as Cuiviénen, the Water of Awakening.
  es: El primer sonido que oyeron fue el del agua corriendo sobre las piedras. Más tarde el lugar se recordaría como Cuiviénen, el Agua del Despertar.
- id: voices
  en: "They began to speak and to sing. Finding no other voices in the world, they called themselves the Quendi: those who speak with voices."
  es: "Empezaron a hablar y a cantar. Como no hallaron otras voces en el mundo, se llamaron a sí mismos los Quendi: los que hablan con voces."
- id: names
  en: They gave names to the stars, the waters and the trees around them, and lived there long in wonder. No Vala knew yet that they had come, but Melkor, watching from the north, was the first to learn of them.
  es: Dieron nombre a las estrellas, a las aguas y a los árboles que los rodeaban, y vivieron allí mucho tiempo maravillados. Ningún Vala sabía aún que habían llegado, pero Melkor, que vigilaba desde el norte, fue el primero en descubrirlos.
