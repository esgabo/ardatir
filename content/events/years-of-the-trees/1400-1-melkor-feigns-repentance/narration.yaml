- id: release
  en: When his three ages in the halls of Mandos were over, Melkor was brought once more before the Valar.
  es: Cumplidas sus tres edades en las moradas de Mandos, Melkor fue llevado de nuevo ante los Valar.
- id: plea
  en: He knelt before Manwë and begged forgiveness. He promised to help heal all the harm he had done, and to serve the Elves.
  es: Se arrodilló ante Manwë y pidió perdón. Prometió ayudar a sanar todo el daño que había hecho, y servir a los Elfos.
- id: pardon
  en: Manwë, who had no evil in him, believed his brother. Melkor was pardoned and set free, though at first he had to dwell within sight of the Valar.
  es: Manwë, que no tenía maldad alguna, creyó a su hermano. Melkor fue perdonado y liberado, aunque al principio tuvo que vivir a la vista de los Valar.
- id: helper
  en: In time he walked freely through Valinor, offering help and wise advice to anyone who asked for it.
  es: Con el tiempo pudo ir libremente por Valinor, ofreciendo ayuda y sabios consejos a quien se los pidiera.
- id: hatred
  en: But behind his fair words he hated the Elves, and envied them the light they lived in. He was only waiting.
  es: Pero tras sus bellas palabras odiaba a los Elfos, y les envidiaba la luz en que vivían. Solo estaba esperando.
