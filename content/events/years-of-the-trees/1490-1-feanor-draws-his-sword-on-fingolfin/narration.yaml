- id: council
  en: Hoping to calm his sons, Finwë called a council in Tirion. Fëanor came to it armed, with a helm on his head and a sword at his side.
  es: Con la esperanza de calmar a sus hijos, Finwë convocó un consejo en Tirion. Fëanor acudió armado, con un yelmo en la cabeza y una espada al costado.
- id: blade
  en: When Fingolfin spoke, Fëanor turned on him, drew his sword and held its point to his brother's chest, warning him to keep out of his way.
  es: Cuando Fingolfin habló, Fëanor se volvió contra él, desenvainó la espada y le puso la punta en el pecho, advirtiéndole que no se cruzara en su camino.
- id: judgement
  en: The Valar called Fëanor to answer for it. They saw Melkor's lies behind the quarrel, but Fëanor had drawn a blade in Tirion, and he was banished from the city for twelve years.
  es: Los Valar llamaron a Fëanor a rendir cuentas. Vieron las mentiras de Melkor tras la disputa, pero Fëanor había desenvainado un arma en Tirion, y fue desterrado de la ciudad durante doce años.
- id: formenos
  en: He went north with his seven sons and built a stronghold, Formenos, and locked the Silmarils in a chamber of iron.
  es: Se fue al norte con sus siete hijos, levantó una fortaleza, Formenos, y encerró los Silmarils en una cámara de hierro.
- id: finwe
  en: Finwë, who loved Fëanor best of all his sons, chose to go with him into exile, and Fingolfin was left to rule the Noldor in Tirion.
  es: Finwë, que amaba a Fëanor más que a ninguno de sus hijos, decidió acompañarlo al destierro, y Fingolfin quedó gobernando a los Noldor en Tirion.
