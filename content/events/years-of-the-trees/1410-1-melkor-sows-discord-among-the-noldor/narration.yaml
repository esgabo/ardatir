- id: teacher
  en: Melkor sought out the Noldor most of all, for they loved to learn, and he had a great deal to teach.
  es: Melkor buscaba sobre todo a los Noldor, porque les encantaba aprender, y él tenía mucho que enseñar.
- id: lies
  en: "Quietly, among true things, he planted lies: that the Valar kept the Elves in Aman like prisoners, and meant to hand Middle-earth to Men, who had not yet awoken."
  es: "Con discreción, entre cosas ciertas, sembró mentiras: que los Valar tenían a los Elfos en Aman como prisioneros, y pensaban entregar la Tierra Media a los Hombres, que aún no habían despertado."
- id: whispers
  en: To Fëanor's followers he whispered that Fingolfin meant to take his brother's place as Finwë's heir. To Fingolfin's, that Fëanor meant to drive them out of Tirion.
  es: A los seguidores de Fëanor les susurró que Fingolfin quería ocupar el lugar de su hermano como heredero de Finwë. A los de Fingolfin, que Fëanor pensaba echarlos de Tirion.
- id: brothers
  en: Fëanor and his half-brother Fingolfin had never been close. Now each was ready to believe the worst of the other.
  es: Fëanor y su hermanastro Fingolfin nunca habían estado unidos. Ahora cada uno estaba dispuesto a creer lo peor del otro.
- id: swords
  en: Soon the Noldor were forging swords and shields in secret, and the old peace of Valinor wore thin.
  es: Pronto los Noldor forjaban espadas y escudos en secreto, y la antigua paz de Valinor se fue desgastando.
