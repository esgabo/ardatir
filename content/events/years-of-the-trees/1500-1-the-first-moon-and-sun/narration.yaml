- id: dark
  en: When Melkor poisoned the Two Trees, Valinor went dark. Yavanna sang over them and Nienna wept, but the Trees could not be healed.
  es: Cuando Melkor envenenó los Dos Árboles, Valinor quedó a oscuras. Yavanna cantó sobre ellos y Nienna lloró, pero los Árboles no pudieron sanar.
- id: last-light
  en: Yet before they died, Telperion put out one last silver flower, and Laurelin one last golden fruit.
  es: Pero antes de morir, Telperion dio una última flor de plata, y Laurelin un último fruto de oro.
- id: vessels
  en: Aulë made vessels to hold them, and Varda gave them paths across the sky. Tilion, who loved silver, would steer the flower; Arien, a spirit of fire, would carry the fruit.
  es: Aulë hizo vasijas para guardarlos, y Varda les trazó caminos por el cielo. Tilion, que amaba la plata, guiaría la flor; Arien, un espíritu de fuego, llevaría el fruto.
- id: moonrise
  en: The silver flower rose first, the Moon, and a new light passed over Middle-earth, which had known only the stars since the Lamps fell.
  es: La flor de plata salió primero, la Luna, y una luz nueva pasó sobre la Tierra Media, que solo había conocido las estrellas desde la caída de las Lámparas.
- id: sunrise
  en: Then the golden fruit climbed into the sky, the Sun. Its first light fell on Fingolfin's banners, and far in the east the first Men opened their eyes.
  es: Luego el fruto dorado subió al cielo, el Sol. Su primera luz cayó sobre los estandartes de Fingolfin, y lejos, en el este, los primeros Hombres abrieron los ojos.
- id: years
  en: The Years of the Trees were over, and the Years of the Sun had begun.
  es: Los Años de los Árboles habían terminado, y habían comenzado los Años del Sol.
