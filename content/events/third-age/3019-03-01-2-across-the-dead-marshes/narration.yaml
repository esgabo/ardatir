- id: guide
  en: Gollum led the hobbits out of the hills and into the marshes, where he knew hidden paths. He moved quickly and quietly, sniffing the air, and seemed almost glad to be useful.
  es: Gollum guió a los hobbits fuera de las colinas y hacia las ciénagas, donde conocía sendas ocultas. Se movía deprisa y en silencio, olfateando el aire, y casi parecía contento de ser útil.
- id: marsh
  en: The marshes stretched grey and wet in every direction, full of reeds, mud and still, stinking pools. Mist hung over everything, and no birds sang.
  es: Las ciénagas se extendían grises y mojadas en todas direcciones, llenas de juncos, barro y charcas quietas y malolientes. La niebla lo cubría todo, y no cantaba ningún pájaro.
- id: lights
  en: At night small lights flickered over the water like candles. Gollum warned them not to follow the lights and not to look too closely.
  es: De noche, pequeñas luces titilaban sobre el agua como velas. Gollum les advirtió que no siguieran las luces y que no miraran demasiado.
- id: faces
  en: Sam stumbled and looked anyway. Deep in the water he saw pale faces, the faces of warriors who fell in a great battle long ago. Frodo, too, stared as if he could not look away.
  es: Sam tropezó y miró de todos modos. En el fondo del agua vio rostros pálidos, los rostros de guerreros caídos en una gran batalla de hacía mucho tiempo. También Frodo los miraba, como si no pudiera apartar la vista.
- id: wings
  en: Once a dark shadow passed high overhead, a Black Rider on wings, and a cold fear swept over them. They lay in the mud until it was gone.
  es: Una vez, una sombra oscura pasó muy alto sobre sus cabezas, un Jinete Negro con alas, y un miedo frío los invadió. Se quedaron tendidos en el barro hasta que se fue.
- id: two
  en: On the far side, Sam lay awake and heard Gollum arguing with himself in two voices, one that wanted to keep his promise and one that wanted the precious back.
  es: "Al otro lado, Sam se quedó despierto y oyó a Gollum discutir consigo mismo con dos voces: una que quería cumplir su promesa y otra que quería recuperar su tesoro."
