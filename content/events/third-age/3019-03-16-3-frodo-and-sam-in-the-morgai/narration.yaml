- id: ridge
  en: The hobbits left the road and climbed into the Morgai, a ridge of rock and thorn inside the mountains of Mordor. It was hard going, but no Orcs came there.
  es: Los hobbits dejaron el camino y subieron al Morgai, una cresta de roca y espinos dentro de las montañas de Mordor. Era un camino difícil, pero allí no iban los orcos.
- id: water
  en: Thirsty beyond words, they found a thin stream trickling from the rocks. Sam drank first, in case it was poisoned. It was cold and clean.
  es: Muertos de sed, encontraron un hilillo de agua que manaba de las rocas. Sam bebió primero, por si estaba envenenada. Estaba fría y limpia.
- id: star
  en: That night, while Frodo slept, Sam saw a white star twinkling through a gap in the clouds. For a moment hope came back to him. No darkness, he felt, could reach so high, or last for ever.
  es: Aquella noche, mientras Frodo dormía, Sam vio una estrella blanca que titilaba por un hueco entre las nubes. Por un momento le volvió la esperanza. Ninguna oscuridad, sintió, podía llegar tan alto, ni durar para siempre.
- id: view
  en: Climbing to the crest of the ridge, they looked out over the plain of Gorgoroth, full of fires and camps. Far across it rose Mount Doom, smoking, its top hidden in cloud.
  es: Al subir a lo alto de la cresta, contemplaron la llanura de Gorgoroth, llena de fuegos y campamentos. Muy lejos, al otro lado, se alzaba el Monte del Destino, humeante, con la cima oculta entre las nubes.
- id: far
  en: At last they could see their goal. But between them and the mountain lay many miles of open, guarded land, and Frodo felt the Ring grow heavier still.
  es: Por fin veían su meta. Pero entre ellos y la montaña había muchas leguas de tierra abierta y vigilada, y Frodo sintió que el Anillo le pesaba aún más.
