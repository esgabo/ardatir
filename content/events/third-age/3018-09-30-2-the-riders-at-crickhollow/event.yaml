summary:
  en: "Black Riders force the door of the little house at Crickhollow in the dark, but Fatty Bolger has already slipped out the back. He runs for help, the horn-call of Buckland rings out over the land, and the Riders flee north."
  es: "En la oscuridad, los Jinetes Negros fuerzan la puerta de la casita de Cricava, pero Gordo Bolger ya ha escapado por detrás. Corre a pedir ayuda, el cuerno de Los Gamos resuena por toda la región y los Jinetes huyen hacia el norte."
