- id: alone
  en: "That same night Fatty Bolger was alone in the house at Crickhollow. In the dark he saw black shapes creeping across the garden."
  es: "Esa misma noche, Gordo Bolger estaba solo en la casa de Cricava. En la oscuridad vio unas formas negras que avanzaban sigilosas por el jardín."
- id: flee
  en: "He did not wait to see more. He slipped out by the back door and ran through the night to the nearest house for help."
  es: "No esperó a ver más. Salió por la puerta de atrás y corrió en la noche hasta la casa más cercana a pedir ayuda."
- id: door
  en: "Behind him, the Black Riders broke down the front door, and found the house empty."
  es: "A sus espaldas, los Jinetes Negros derribaron la puerta principal, y encontraron la casa vacía."
- id: horn
  en: "Then the horn-call of Buckland rang out, unheard for a hundred years. Lights sprang up in every house, and hobbits came running."
  es: "Entonces resonó la llamada del cuerno de Los Gamos, que no se oía desde hacía cien años. Se encendieron luces en todas las casas, y los hobbits acudieron corriendo."
- id: north
  en: "The Riders galloped away north, out of Buckland. The Ring was not there, and they knew now that it had already gone."
  es: "Los Jinetes huyeron al galope hacia el norte, fuera de Los Gamos. El Anillo no estaba allí, y ahora sabían que ya se había marchado."
