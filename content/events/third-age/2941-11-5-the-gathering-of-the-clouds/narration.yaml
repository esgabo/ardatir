- id: thrush
  en: On a high spur of the Mountain, the old thrush came back and chattered at the dwarves. None of them could understand its speech, so it flew away, and returned with a raven.
  es: En un alto espolón de la Montaña, el viejo zorzal volvió y les gorjeó a los enanos. Ninguno entendía su lengua, así que se fue volando y regresó con un cuervo.
- id: roac
  en: He was Roäc, son of Carc, grey with age, chief of the ravens of the Mountain, who had long been friends of Thorin's people. Smaug was dead, he told them, shot down over the lake.
  es: Era Roäc, hijo de Carc, gris de puro viejo, jefe de los cuervos de la Montaña, que desde antiguo eran amigos del pueblo de Thorin. Smaug había muerto, les dijo, abatido sobre el lago.
- id: warning
  en: But not all his news was good. Men and elves were coming, and birds were gathering from far and wide, sure there would be a battle. Trust the Bowman, he advised, and make peace.
  es: Pero no todas sus noticias eran buenas. Venían hombres y elfos, y de todas partes se reunían pájaros, seguros de que habría batalla. Confía en el Arquero, le aconsejó, y haz las paces.
- id: wall
  en: Thorin would not hear of it. He sent ravens to his cousin Dáin in the Iron Hills, and the dwarves built a wall of stone across the Front Gate.
  es: Thorin no quiso ni oír hablar de ello. Envió cuervos a su primo Dáin, en las Colinas de Hierro, y los enanos levantaron un muro de piedra ante la Puerta Principal.
- id: parley
  en: When the hosts came, Bard walked up to the wall and spoke fairly. He asked for a share of the treasure, to rebuild his people's ruined town. Thorin refused him.
  es: Cuando llegaron las huestes, Bardo subió hasta el muro y habló con buenas palabras. Pidió una parte del tesoro para reconstruir la ciudad en ruinas de su gente. Thorin se la negó.
- id: arrow
  en: A herald blew a trumpet and declared the Mountain besieged. In fury, Thorin snatched up a bow and shot, and the arrow stuck quivering in the herald's shield. Watching from the wall, Bilbo's heart sank.
  es: Un heraldo tocó la trompeta y declaró sitiada la Montaña. Furioso, Thorin tomó un arco y disparó, y la flecha se quedó temblando clavada en el escudo del heraldo. Bilbo lo miraba desde el muro, con el corazón encogido.
