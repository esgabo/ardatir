# Hobbit ch. 15: the dwarves hold the Front Gate; the hosts camp before it
place: erebor
characters: [ thorin, roac, bilbo, bard, balin, dwalin, fili, kili, dori, nori, ori, oin, gloin, bifur, bofur, bombur ]
