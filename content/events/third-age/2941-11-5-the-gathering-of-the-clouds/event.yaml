summary:
  en: "The old raven Roäc tells Thorin the dragon is dead and that men and elves are coming. Thorin sends for Dáin and walls up the Front Gate; when Bard asks for a share of the treasure he refuses, and shoots an arrow into the herald's shield. The siege begins."
  es: "El viejo cuervo Roäc le cuenta a Thorin que el dragón ha muerto y que vienen hombres y elfos. Thorin manda llamar a Dáin y tapia la Puerta Principal; cuando Bardo pide una parte del tesoro, se niega, y dispara una flecha contra el escudo del heraldo. Comienza el asedio."
beats:
  - { id: roac, label: { en: "Roäc's news", es: "Las noticias de Roäc" } }
  - { id: wall, label: { en: "The wall at the gate", es: "El muro en la puerta" } }
  - { id: parley, label: { en: "Bard asks", es: "Bardo pide" } }
  - { id: arrow, label: { en: "An arrow in the shield", es: "Una flecha en el escudo" } }
