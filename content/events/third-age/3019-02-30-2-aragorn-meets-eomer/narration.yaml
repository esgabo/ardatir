- id: plains
  en: For three days Aragorn, Legolas and Gimli had run across the plains of Rohan. On the fourth morning a great company of riders came thundering toward them.
  es: Durante tres días Aragorn, Legolas y Gimli habían corrido por las llanuras de Rohan. A la cuarta mañana, una gran compañía de jinetes se lanzó al galope hacia ellos.
- id: spears
  en: The Riders circled them with spears levelled. Their leader, Éomer, demanded to know who they were. Gimli bristled, and for a moment it seemed blood would be spilled.
  es: Los Jinetes los rodearon con las lanzas en ristre. Su jefe, Éomer, les exigió que dijeran quiénes eran. Gimli se encrespó, y por un momento pareció que correría la sangre.
- id: sword
  en: "Then Aragorn threw back his cloak and drew his sword, the blade that had been broken and forged anew. He named himself: Aragorn, son of Arathorn, heir of Isildur."
  es: "Entonces Aragorn echó atrás la capa y desenvainó su espada, la hoja que había estado rota y había sido forjada de nuevo. Dijo quién era: Aragorn, hijo de Arathorn, heredero de Isildur."
- id: news
  en: Éomer was amazed. He told them his riders had destroyed the Orcs at the forest's edge and burned them on a pyre. They had seen no hobbits there.
  es: Éomer quedó asombrado. Les contó que sus jinetes habían destruido a los orcos en el linde del bosque y los habían quemado en una pira. No habían visto hobbits allí.
- id: horses
  en: Though it went against the king's law, Éomer trusted them. He lent them two horses and asked only that they come to Edoras one day to answer for it.
  es: Aunque iba contra la ley del rey, Éomer confió en ellos. Les prestó dos caballos y solo les pidió que algún día fueran a Edoras a dar cuenta de ello.
