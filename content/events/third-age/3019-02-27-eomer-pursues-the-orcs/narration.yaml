- id: news
  en: Word came to Éomer, Third Marshal of the Riddermark, that Orcs were crossing the Eastfold, coming down from the hills by the river.
  es: Llegó a Éomer, Tercer Mariscal de la Marca de los Jinetes, la noticia de que había orcos cruzando el Folde Este, bajando de las colinas junto al río.
- id: orders
  en: At court, the king's evil counsellor had kept the riders at home, and Éomer had no leave to go. He went anyway, at midnight, with the men of his own household.
  es: En la corte, el malvado consejero del rey retenía a los jinetes en casa, y Éomer no tenía permiso para salir. Salió de todos modos, a medianoche, con los hombres de su propia casa.
- id: ride
  en: The riders swept north and west across the wide plains, following the Orcs' trail through the grass. They rode without rest.
  es: Los jinetes cabalgaron hacia el norte y el oeste por las anchas llanuras, siguiendo el rastro de los orcos entre la hierba. Cabalgaron sin descanso.
- id: overtake
  en: As the next day ended, they caught up with them at last, close to the dark eaves of Fangorn Forest. The Orcs were too late to reach the trees.
  es: Al terminar el día siguiente, por fin los alcanzaron, muy cerca de los oscuros lindes del Bosque de Fangorn. Los orcos no llegaron a tiempo a los árboles.
- id: ring
  en: Éomer set his riders in a ring around the Orc camp. All night they watched and waited, and no one would slip through. At first light they would attack.
  es: Éomer dispuso a sus jinetes en un círculo alrededor del campamento de los orcos. Toda la noche vigilaron y esperaron, y nadie se les escaparía. Con la primera luz atacarían.
