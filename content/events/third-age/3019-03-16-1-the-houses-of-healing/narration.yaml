- id: shadow
  en: Faramir, Éowyn and Merry lay in the Houses of Healing, sunk in a cold sleep that no one could cure. It was the Black Breath, the sickness left by the Nazgûl.
  es: Faramir, Éowyn y Merry yacían en las Casas de Curación, sumidos en un sueño frío que nadie sabía curar. Era el Aliento Negro, la enfermedad que dejaban los Nazgûl.
- id: ioreth
  en: An old nurse, Ioreth, sighed that the hands of the king were healing hands, or so the old stories said. Gandalf heard her, and sent for Aragorn.
  es: Una anciana enfermera, Ioreth, suspiró que las manos del rey eran manos que curaban, o eso decían las viejas historias. Gandalf la oyó y mandó llamar a Aragorn.
- id: athelas
  en: Aragorn came quietly into the city, hooded, and asked for kingsfoil, a humble herb nobody valued anymore. He crushed its leaves in hot water, and a fresh, living scent filled the room.
  es: Aragorn entró en la ciudad sin ruido, encapuchado, y pidió hojas de reyes, una hierba humilde a la que ya nadie daba valor. Machacó sus hojas en agua caliente, y un aroma fresco y vivo llenó la habitación.
- id: faramir
  en: Faramir opened his eyes and knew Aragorn at once. He named him his king, and offered his service.
  es: Faramir abrió los ojos y reconoció a Aragorn al instante. Lo llamó su rey, y le ofreció sus servicios.
- id: eowyn
  en: Then Aragorn called Éowyn back from the dark, and Éomer held her hand as she woke. Her arm would mend, but her heart needed more healing still.
  es: Después Aragorn llamó a Éowyn para que regresara de la oscuridad, y Éomer le sostuvo la mano mientras despertaba. Su brazo sanaría, pero su corazón necesitaba aún más curación.
- id: merry
  en: Last of all, Merry woke up, and the first thing he asked for was supper, and then his pipe. Pippin laughed and cried at once.
  es: El último en despertar fue Merry, y lo primero que pidió fue la cena, y luego su pipa. Pippin reía y lloraba a la vez.
- id: king
  en: Aragorn worked late into the night, healing the sick and wounded. And word ran through the city that the King had come back.
  es: Aragorn trabajó hasta bien entrada la noche, curando a enfermos y heridos. Y por toda la ciudad corrió la voz de que el Rey había vuelto.
