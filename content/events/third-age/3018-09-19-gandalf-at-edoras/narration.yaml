- id: gate
  en: "Gandalf came to Edoras, the hill-town of the Horse-lords with its golden hall. At first the guards would not even let him in."
  es: "Gandalf llegó a Edoras, la ciudad en la colina de los Señores de los Caballos, con su palacio dorado. Al principio los guardias ni siquiera lo dejaron entrar."
- id: king
  en: "The next day he stood before King Théoden. The king was old and weary, and beside him sat Gríma, his counsellor, whose quiet words turned him against every visitor."
  es: "Al día siguiente se presentó ante el rey Théoden. El rey estaba viejo y cansado, y a su lado se sentaba Gríma, su consejero, cuyas palabras susurradas lo volvían contra todo visitante."
- id: warn
  en: "Gandalf warned of Saruman's treachery, but Théoden listened coldly. He did not want trouble, or the wizard who always seemed to bring it."
  es: "Gandalf le advirtió de la traición de Saruman, pero Théoden lo escuchó con frialdad. No quería problemas, ni al mago que siempre parecía traerlos."
- id: horse
  en: "In the end the king told him to take any horse he wished and be on his way. Gandalf went to choose one, and chose the one the king would least want to lose."
  es: "Al final el rey le dijo que se llevara el caballo que quisiera y siguiera su camino. Gandalf fue a elegir, y eligió el que el rey menos querría perder."
