- id: dark
  en: "For two days they walked through the endless dark halls of Moria, carved long ago by Dwarves. Gimli was full of wonder; the others felt the silence pressing on them."
  es: "Durante dos días caminaron por las interminables salas oscuras de Moria, talladas hace mucho por los Enanos. Gimli estaba maravillado; los demás sentían el silencio como un peso."
- id: tomb
  en: "In a chamber lit by a shaft of daylight they found a tomb. Here lay Balin, Bilbo's old friend from the quest to the Lonely Mountain, who had come to win back Moria."
  es: "En una cámara iluminada por un haz de luz del día encontraron una tumba. Allí yacía Balin, el viejo amigo de Bilbo de la aventura de la Montaña Solitaria, que había venido a recuperar Moria."
- id: book
  en: "A torn and burned book told the story of Balin's colony: a hopeful beginning, then attacks, and at last a few hurried lines written by the dwarves trapped in that very room."
  es: "Un libro rasgado y quemado contaba la historia de la colonia de Balin: un comienzo lleno de esperanza, después los ataques y, por último, unas líneas apresuradas escritas por los enanos atrapados en aquella misma sala."
- id: drums
  en: "Then a drum began to beat far below, deep and slow. Orcs were coming."
  es: "Entonces empezó a sonar un tambor muy abajo, profundo y lento. Venían los orcos."
- id: fight
  en: "The Company held the door. A great cave-troll pushed its foot through and Frodo stabbed it with Sting; then an Orc-chief speared Frodo, and only the mithril shirt beneath his coat saved him."
  es: "La Compañía defendió la puerta. Un enorme troll de las cavernas metió el pie y Frodo lo apuñaló con Dardo; luego un cabecilla orco alcanzó a Frodo con una lanza, y solo la cota de mithril que llevaba bajo la ropa lo salvó."
