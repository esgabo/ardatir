- id: north
  en: The war was not only in the south. Far to the north, a great army of Easterlings crossed the river and fell on the kingdom of Dale.
  es: La guerra no estaba solo en el sur. Lejos, en el norte, un gran ejército de Orientales cruzó el río y cayó sobre el reino de Valle.
- id: kings
  en: King Brand, grandson of Bard the Bowman, rode out to meet them, and King Dáin of the Lonely Mountain came to fight beside him. Dáin was the same dwarf who had come to Thorin's aid in the Battle of Five Armies, long ago.
  es: El rey Brand, nieto de Bardo el Arquero, salió a su encuentro, y el rey Dáin de la Montaña Solitaria acudió a luchar a su lado. Dáin era el mismo enano que había acudido en ayuda de Thorin en la Batalla de los Cinco Ejércitos, mucho tiempo atrás.
- id: retreat
  en: But the Easterlings were too many. Men and dwarves were driven back from Dale to the gate of the Mountain.
  es: Pero los Orientales eran demasiados. Hombres y enanos fueron rechazados desde Valle hasta la puerta de la Montaña.
- id: fall
  en: There King Brand fell. Old King Dáin stood over his body before the gate, holding the enemy back until darkness fell, and there he fell too.
  es: Allí cayó el rey Brand. El viejo rey Dáin se plantó sobre su cuerpo ante la puerta, conteniendo al enemigo hasta que cayó la noche, y allí cayó él también.
- id: siege
  en: The survivors, men and dwarves together, took refuge inside the Lonely Mountain. The enemy surrounded it, and they held out under siege.
  es: Los supervivientes, hombres y enanos juntos, se refugiaron dentro de la Montaña Solitaria. El enemigo la rodeó, y ellos resistieron sitiados.
