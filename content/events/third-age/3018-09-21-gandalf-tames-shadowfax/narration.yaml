- id: stallion
  en: "Out on the plains of Rohan ran a great grey horse, proud and swift, that no rider had ever tamed: Shadowfax, chief of the horses of the Mark."
  es: "Por las llanuras de Rohan corría un gran caballo gris, orgulloso y veloz, al que ningún jinete había domado jamás: Sombragris, el primero de los caballos de la Marca."
- id: follow
  en: "Gandalf followed him across the grasslands, mile after mile, speaking softly and never forcing him."
  es: "Gandalf lo siguió por los pastizales, milla tras milla, hablándole en voz baja y sin forzarlo nunca."
- id: trust
  en: "At last the great horse turned and came to him. From then on Shadowfax would carry Gandalf and no one else, swift as the wind."
  es: "Por fin el gran caballo se volvió y se acercó a él. Desde entonces, Sombragris llevaría a Gandalf y a nadie más, rápido como el viento."
- id: north
  en: "Gandalf rode north toward the Shire as fast as Shadowfax could gallop. He feared he was already too late."
  es: "Gandalf cabalgó hacia el norte, hacia la Comarca, tan deprisa como Sombragris podía galopar. Temía haber llegado ya demasiado tarde."
