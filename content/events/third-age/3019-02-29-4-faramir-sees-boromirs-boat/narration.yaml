- id: river
  en: Faramir, captain of Gondor and Boromir's younger brother, sat at night beside the Great River, in the grey dark, listening to the water.
  es: Faramir, capitán de Gondor y hermano menor de Boromir, estaba sentado de noche junto al Río Grande, en la penumbra gris, escuchando el agua.
- id: boat
  en: Out of the dark came a small grey boat, shining faintly, riding low as if heavy. It drifted toward him, and no one rowed it.
  es: De la oscuridad surgió una barquita gris que relucía débilmente y navegaba muy hundida, como si fuera cargada. Se acercaba a la deriva, y nadie remaba en ella.
- id: brother
  en: In it lay a warrior, his broken sword across his knees and many wounds upon him. His face was peaceful. It was Boromir.
  es: En ella yacía un guerrero, con la espada rota sobre las rodillas y muchas heridas en el cuerpo. Su rostro estaba en paz. Era Boromir.
- id: gone
  en: Faramir did not dare to touch it. The boat turned away and passed on down the river toward the sea, and was lost in the night.
  es: Faramir no se atrevió a tocarla. La barca se apartó y siguió río abajo hacia el mar, y se perdió en la noche.
- id: knowing
  en: Dream or waking, he could not tell. But from that night on, Faramir knew in his heart that his brother was dead.
  es: No sabía si era un sueño o si estaba despierto. Pero desde aquella noche, Faramir supo en su corazón que su hermano había muerto.
