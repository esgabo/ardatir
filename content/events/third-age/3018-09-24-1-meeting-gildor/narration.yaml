- id: road
  en: "On the road the next day they heard hoofbeats behind them. The hobbits hid among roots under a tree, and a black-cloaked Rider came by, sniffing the air."
  es: "Al día siguiente, en el camino, oyeron cascos a sus espaldas. Los hobbits se escondieron entre las raíces de un árbol, y un Jinete envuelto en negro pasó por allí, olfateando el aire."
- id: urge
  en: "Frodo felt a sudden, strong wish to slip on the Ring. He held back, and the Rider rode on."
  es: "Frodo sintió de pronto un fuerte deseo de ponerse el Anillo. Se contuvo, y el Jinete siguió adelante."
- id: singing
  en: "At nightfall in the woods the dark shape seemed to come creeping toward them again. Then singing rose among the trees, and it slipped away."
  es: "Al caer la noche, en el bosque, la sombra oscura pareció acercarse de nuevo a ellos. Entonces se alzó un canto entre los árboles, y la sombra se escabulló."
- id: elves
  en: "It was a company of Elves led by Gildor, walking west through the Shire. Sam had dreamed of Elves all his life, and could hardly believe his eyes."
  es: "Era una compañía de Elfos encabezada por Gildor, que viajaba hacia el oeste atravesando la Comarca. Sam había soñado con los Elfos toda su vida, y apenas podía creer lo que veía."
- id: supper
  en: "They took the hobbits to their camp and shared a supper the hobbits remembered all their lives. Frodo greeted them in their own tongue, and Gildor named him Elf-friend."
  es: "Llevaron a los hobbits a su campamento y compartieron con ellos una cena que recordarían toda la vida. Frodo los saludó en su propia lengua, y Gildor lo llamó Amigo de los Elfos."
- id: warning
  en: "Gildor would say little about the Riders, only that they were servants of the Enemy. Frodo should leave the Shire at once, he warned, and take friends who would go with him."
  es: "Gildor dijo poco de los Jinetes, solo que eran siervos del Enemigo. Frodo debía dejar la Comarca enseguida, le advirtió, y llevar consigo a amigos dispuestos a acompañarlo."
