- id: wrath
  en: When Bard showed Thorin the Arkenstone, the dwarf-king's fury turned on Bilbo, and only Gandalf saved the hobbit from his grasp. Then Dáin arrived from the Iron Hills with an army of dwarves.
  es: Cuando Bardo mostró a Thorin la Piedra del Arca, la furia del rey enano se volvió contra Bilbo, y solo Gandalf libró al hobbit de sus manos. Entonces llegó Dáin desde las Colinas de Hierro con un ejército de enanos.
- id: brink
  en: Dwarves stood against elves and men, and battle was about to begin. Then the sky grew dark, and Gandalf cried out a warning. Goblins and wolves were coming, led by Bolg, son of Azog.
  es: Enanos frente a elfos y hombres, la batalla estaba a punto de empezar. Entonces el cielo se oscureció, y Gandalf gritó una advertencia. Venían trasgos y lobos, guiados por Bolg, hijo de Azog.
- id: alliance
  en: In a moment, old quarrels were forgotten. Dwarves, elves and men stood together against the common enemy in the valley before the Mountain's gate.
  es: En un instante se olvidaron las viejas disputas. Enanos, elfos y hombres se unieron contra el enemigo común en el valle ante la puerta de la Montaña.
- id: charge
  en: The goblins swarmed over the slopes, and the battle turned against them. Then Thorin burst out of the gate with his companions, gleaming in his armour, and the dwarves rallied to him.
  es: Los trasgos invadieron las laderas, y la batalla se volvió en su contra. Entonces Thorin salió por la puerta con sus compañeros, reluciente en su armadura, y los enanos se reunieron a su alrededor.
- id: eagles
  en: Still the enemy was too many. But Bilbo, watching from the hillside, saw great shapes in the western sky. The eagles had come. A moment later a stone struck his head, and he knew no more.
  es: Aun así, el enemigo era demasiado numeroso. Pero Bilbo, que miraba desde la ladera, vio grandes siluetas en el cielo del oeste. Habían llegado las águilas. Un instante después, una piedra le golpeó la cabeza y perdió el sentido.
- id: beorn
  en: Last of all came Beorn, as a huge bear, scattering goblins and wolves before him. He crushed Bolg, and the enemy broke and fled.
  es: El último en llegar fue Beorn, convertido en un oso enorme, que dispersaba a trasgos y lobos a su paso. Aplastó a Bolg, y el enemigo se desbandó y huyó.
- id: cost
  en: The battle was won, but at a bitter price. Fíli and Kíli had fallen defending their uncle, and Thorin was carried from the field, gravely wounded.
  es: La batalla estaba ganada, pero a un precio amargo. Fíli y Kíli habían caído defendiendo a su tío, y a Thorin lo sacaron del campo gravemente herido.
