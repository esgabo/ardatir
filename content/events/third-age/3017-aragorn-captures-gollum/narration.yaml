- id: hunt
  en: "Gandalf had long wanted to find Gollum, the creature who had once owned Bilbo's ring. Aragorn, a Ranger of the North, searched the wild lands for him year after year."
  es: "Gandalf llevaba mucho tiempo queriendo encontrar a Gollum, la criatura que había poseído el anillo de Bilbo. Aragorn, un Montaraz del Norte, lo buscó por las tierras salvajes año tras año."
- id: marshes
  en: "At last, on the edge of the Dead Marshes, Aragorn came upon him: thin, filthy and half-starved, creeping along with his nose to the ground. He had come out of Mordor."
  es: "Por fin, al borde de las Ciénagas de los Muertos, Aragorn dio con él: flaco, sucio y medio muerto de hambre, arrastrándose con la nariz pegada al suelo. Venía de Mordor."
- id: caught
  en: "Gollum fought and bit, but Aragorn caught him and tied a rope around his neck. The road north was long and miserable for both of them."
  es: "Gollum se debatió y mordió, pero Aragorn lo atrapó y le ató una cuerda al cuello. El camino hacia el norte fue largo y penoso para los dos."
- id: elves
  en: "He brought him to the Elvenking in Mirkwood, where Gandalf questioned him. The Elves agreed to keep Gollum prisoner, and to treat him as kindly as they could."
  es: "Lo llevó ante el Rey Elfo del Bosque Negro, donde Gandalf lo interrogó. Los Elfos aceptaron tener a Gollum prisionero y tratarlo con toda la bondad que pudieran."
