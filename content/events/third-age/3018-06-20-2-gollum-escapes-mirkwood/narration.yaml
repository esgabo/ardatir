- id: kept
  en: "In the Elvenking's realm, the Elves kept Gollum as kindly as they could. On fine days they let him climb a tall tree in the forest, with guards waiting below."
  es: "En el reino del Rey Elfo, los Elfos trataban a Gollum con toda la bondad posible. Los días de buen tiempo lo dejaban trepar a un árbol alto del bosque, con guardias esperando abajo."
- id: tree
  en: "One summer evening he would not come down, and his guards sat patiently under the branches."
  es: "Una tarde de verano no quiso bajar, y sus guardias esperaron con paciencia bajo las ramas."
- id: orcs
  en: "Out of the shadows, Orcs fell on them. It seemed they had come to set Gollum free."
  es: "De entre las sombras, los Orcos cayeron sobre ellos. Al parecer, habían venido a liberar a Gollum."
- id: gone
  en: "The Elves drove the Orcs off after a hard fight, but when it was over Gollum was gone. His trail led south toward Dol Guldur, where the Elves dared not follow."
  es: "Los Elfos rechazaron a los Orcos tras una dura lucha, pero cuando terminó, Gollum había desaparecido. Su rastro llevaba al sur, hacia Dol Guldur, adonde los Elfos no se atrevieron a seguirlo."
