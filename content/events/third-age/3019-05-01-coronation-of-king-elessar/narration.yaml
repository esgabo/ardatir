- id: field
  en: On the first day of May, the people of Minas Tirith gathered before the gate of their city, and the Host of the West stood in shining ranks.
  es: El primer día de mayo, el pueblo de Minas Tirith se reunió ante la puerta de su ciudad, y la Hueste del Oeste formaba en filas relucientes.
- id: steward
  en: Faramir, Steward of Gondor, came forward and gave up his white rod of office. Aragorn gave it back to him, and asked him to serve as Steward still.
  es: Faramir, Senescal de Gondor, se adelantó y entregó su vara blanca. Aragorn se la devolvió, y le pidió que siguiera siendo Senescal.
- id: crown
  en: The ancient crown of Gondor was brought out, white and tall, with wings of pearl and silver. Aragorn raised it high, but did not set it on his own head.
  es: Sacaron la antigua corona de Gondor, blanca y alta, con alas de perla y plata. Aragorn la alzó en alto, pero no se la puso él mismo.
- id: frodo
  en: Many had struggled and suffered to bring him to this day, he said. So he asked Frodo to bring him the crown, and Gandalf to set it on his head.
  es: Muchos habían luchado y sufrido para traerlo hasta aquel día, dijo. Así que pidió a Frodo que le llevara la corona, y a Gandalf que se la pusiera en la cabeza.
- id: king
  en: "When Aragorn rose, crowned, the people gasped. He looked like a king from the old tales, wise and strong and kind. The people cheered his name: Elessar, the Elfstone."
  es: "Cuando Aragorn se levantó coronado, el pueblo contuvo el aliento. Parecía un rey de las viejas historias, sabio, fuerte y bondadoso. El pueblo aclamó su nombre: Elessar, la Piedra de Elfo."
- id: city
  en: Then, to the sound of trumpets, the King walked through the gate and into his city, and the people cheered.
  es: Entonces, al son de las trompetas, el Rey cruzó la puerta y entró en su ciudad, entre los vítores del pueblo.
