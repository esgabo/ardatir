- id: bree
  en: "In the dark the hobbits reached Bree, where Men and hobbits lived side by side. The Prancing Pony was full of light, noise and gossip."
  es: "Ya de noche, los hobbits llegaron a Bree, donde Hombres y hobbits vivían juntos. El Poney Pisador estaba lleno de luz, ruido y habladurías."
- id: strider
  en: "In a shadowy corner sat a weather-worn Ranger, his hood drawn up, watching them. The innkeeper said the folk there called him Strider."
  es: "En un rincón en sombra estaba sentado un Montaraz curtido, con la capucha puesta, observándolos. El posadero dijo que allí lo llamaban Trancos."
- id: song
  en: "Pippin started a story that came close to naming Baggins. To stop him, Frodo jumped onto a table and sang a silly song, but he fell, and the Ring slipped onto his finger. In front of everyone, he vanished."
  es: "Pippin empezó una historia que estuvo a punto de mencionar a Bolsón. Para impedirlo, Frodo se subió a una mesa y cantó una canción tonta, pero se cayó, y el Anillo se le deslizó en el dedo. Delante de todos, desapareció."
- id: warn
  en: "Later, in the hobbits' private parlour, Strider warned them they were in danger and offered to guide them. His price: that they take him with them."
  es: "Más tarde, en la salita privada de los hobbits, Trancos les advirtió que estaban en peligro y se ofreció a guiarlos. Su precio: que lo llevaran con ellos."
- id: letter
  en: "Then Butterbur remembered a letter Gandalf had left with him months before and forgotten to send. In it Gandalf named Strider as a friend, whose true name was Aragorn."
  es: "Entonces Cebadilla recordó una carta que Gandalf le había dejado meses atrás y que había olvidado enviar. En ella Gandalf presentaba a Trancos como un amigo, cuyo verdadero nombre era Aragorn."
- id: trust
  en: "Sam was still not sure of him. But Frodo decided to trust the Ranger."
  es: "Sam seguía sin fiarse de él. Pero Frodo decidió confiar en el Montaraz."
