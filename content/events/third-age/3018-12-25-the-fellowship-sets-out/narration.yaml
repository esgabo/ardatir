- id: scouts
  en: "For two months scouts searched the lands around, while winter came on, and the hobbits rested in Rivendell."
  es: "Durante dos meses los exploradores recorrieron las tierras de alrededor, mientras llegaba el invierno, y los hobbits descansaban en Rivendel."
- id: gifts
  en: "Bilbo gave Frodo his little elven sword, Sting, and a shirt of mithril, light as a feather and harder than steel."
  es: "Bilbo le dio a Frodo su pequeña espada élfica, Dardo, y una cota de mithril, ligera como una pluma y más dura que el acero."
- id: sword
  en: "The broken sword of Isildur was forged anew for Aragorn, and he gave it a new name: Andúril, Flame of the West."
  es: "La espada rota de Isildur fue forjada de nuevo para Aragorn, y él le dio un nuevo nombre: Andúril, Llama del Oeste."
- id: nine
  en: "Elrond chose nine walkers to go against the Nine Riders. With Frodo went Sam, Merry and Pippin, Gandalf, Aragorn, Boromir, Legolas the Elf and Gimli the Dwarf."
  es: "Elrond eligió a nueve caminantes para oponerlos a los Nueve Jinetes. Con Frodo irían Sam, Merry y Pippin, Gandalf, Aragorn, Boromir, Legolas el Elfo y Gimli el Enano."
- id: dusk
  en: "On a cold grey evening they set out, with Bill the pony carrying their packs. Elrond gave them his blessing, and they slipped away into the dark."
  es: "Una fría tarde gris se pusieron en marcha, con el poney Bill cargando con sus fardos. Elrond les dio su bendición, y se perdieron en la oscuridad."
