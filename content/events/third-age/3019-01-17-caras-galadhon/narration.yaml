- id: city
  en: "In the evening they came to Caras Galadhon, the city of the Elves built high among the great trees, glittering with silver lamps."
  es: "Al anochecer llegaron a Caras Galadhon, la ciudad de los Elfos construida en lo alto de los grandes árboles, resplandeciente de lámparas de plata."
- id: hall
  en: "They climbed a long ladder to a hall in the treetop, where Celeborn and Galadriel, the Lord and Lady of the Galadhrim, sat side by side."
  es: "Subieron por una larga escala hasta una sala en la copa de un árbol, donde Celeborn y Galadriel, el Señor y la Señora de los Galadhrim, estaban sentados uno junto al otro."
- id: grief
  en: "Celeborn asked where Gandalf was. When they told him of his fall, there was deep sorrow. Galadriel spoke kindly to Gimli of his people's ancient halls, and won his heart."
  es: "Celeborn preguntó dónde estaba Gandalf. Cuando le contaron su caída, hubo una pena honda. Galadriel le habló con dulzura a Gimli de las antiguas moradas de su pueblo, y se ganó su corazón."
- id: look
  en: "Then the Lady looked at each of them in silence. Each felt she was offering them a choice: to turn aside from the danger ahead, toward something they longed for."
  es: "Entonces la Señora los miró a cada uno en silencio. Cada uno sintió que le ofrecía una elección: apartarse del peligro que les esperaba y volverse hacia algo que anhelaba."
- id: hearts
  en: "Boromir found it a trial, and did not trust her. Frodo felt he had found a friend."
  es: "Para Boromir fue una prueba, y no se fio de ella. Frodo sintió que había encontrado una amiga."
- id: rest
  en: "That night they slept in peace for the first time since Moria, while the Elves sang laments for Gandalf among the trees."
  es: "Aquella noche durmieron en paz por primera vez desde Moria, mientras los Elfos cantaban lamentos por Gandalf entre los árboles."
