- id: horn
  en: Under the trees of Parth Galen the Company had scattered, each searching for Frodo. Then a great horn rang out through the woods, again and again. It was the horn of Gondor, and Boromir was blowing it for help.
  es: Bajo los árboles de Parth Galen, la Compañía se había dispersado, cada uno buscando a Frodo. Entonces un gran cuerno resonó por el bosque, una y otra vez. Era el cuerno de Gondor, y Boromir lo hacía sonar pidiendo ayuda.
- id: stand
  en: Orcs had fallen on Merry and Pippin, huge Uruk-hai bearing the White Hand of Saruman. Boromir stood between them and the hobbits, and many of the enemy fell before his sword.
  es: "Los orcos habían caído sobre Merry y Pippin: enormes Uruk-hai con la Mano Blanca de Saruman. Boromir se plantó entre ellos y los hobbits, y muchos enemigos cayeron ante su espada."
- id: arrows
  en: But there were too many. Arrows struck him again and again, and the Orcs seized the two hobbits and carried them off, alive, toward the west.
  es: Pero eran demasiados. Las flechas lo alcanzaron una y otra vez, y los orcos atraparon a los dos hobbits y se los llevaron vivos hacia el oeste.
- id: found
  en: Aragorn came running, too late. He found Boromir sitting against a tree, his sword broken, his horn split in two, and the bodies of his foes all around him.
  es: Aragorn llegó corriendo, demasiado tarde. Encontró a Boromir sentado contra un árbol, con la espada rota, el cuerno partido en dos y los cuerpos de sus enemigos a su alrededor.
- id: confession
  en: With his last strength Boromir told him the truth. He had tried to take the Ring from Frodo, and he was ashamed; this fight had been his atonement. He begged Aragorn to go to Minas Tirith and save his people.
  es: Con sus últimas fuerzas, Boromir le dijo la verdad. Había intentado quitarle el Anillo a Frodo, y se avergonzaba; aquella lucha había sido su expiación. Rogó a Aragorn que fuera a Minas Tirith y salvara a su pueblo.
- id: peace
  en: "Aragorn held his hand and told him he had not failed: in the end he had beaten the Ring's hold on him, and Gondor would stand. Boromir smiled, and was still."
  es: "Aragorn le cogió la mano y le dijo que no había fracasado: al final había vencido el dominio del Anillo, y Gondor resistiría. Boromir sonrió, y quedó inmóvil."
