- id: night
  en: In the darkest hour of the night, the enemy brought up Grond, a huge battering ram shaped like a ravening wolf, drawn by great beasts and guarded by trolls.
  es: En la hora más oscura de la noche, el enemigo trajo a Grond, un enorme ariete con forma de lobo voraz, arrastrado por grandes bestias y custodiado por trolls.
- id: witchking
  en: Behind it rode the Witch-king, the Lord of the Nazgûl. He spoke words of power, and Grond struck the gate three times.
  es: Tras él cabalgaba el Rey Brujo, el Señor de los Nazgûl. Pronunció palabras de poder, y Grond golpeó la puerta tres veces.
- id: broken
  en: At the third stroke the great gate of Gondor burst apart, as if a spell had shattered it. The Witch-king rode in under the arch, and everyone fled before him.
  es: Al tercer golpe, la gran puerta de Gondor saltó en pedazos, como si un hechizo la hubiera quebrado. El Rey Brujo entró a caballo bajo el arco, y todos huyeron ante él.
- id: gandalf
  en: All but one. Gandalf sat waiting on Shadowfax, alone in the gateway, and he told the Witch-king to go back to the shadow he came from.
  es: Todos menos uno. Gandalf aguardaba a lomos de Sombragris, solo en la entrada, y ordenó al Rey Brujo que volviera a la sombra de la que había salido.
- id: laugh
  en: The Witch-king threw back his hood and laughed. He had a crown, but no head could be seen beneath it. He lifted a flaming sword.
  es: El Rey Brujo se echó atrás la capucha y se rio. Llevaba una corona, pero debajo no se veía ninguna cabeza. Alzó una espada llameante.
- id: cock
  en: Then, somewhere in the city, a cock crowed at the coming of morning. And from far off on the fields rose the blowing of many horns. Rohan had come.
  es: Entonces, en algún lugar de la ciudad, cantó un gallo ante la llegada de la mañana. Y desde lejos, en los campos, llegó el son de muchos cuernos. Rohan había llegado.
