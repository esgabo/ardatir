- id: door
  en: In the grey morning the Company rode into a dark wood of black trees, and came to a great door in the side of the mountain. A cold dread flowed out of it.
  es: En la grisácea mañana, la Compañía entró en un bosque oscuro de árboles negros y llegó a una gran puerta en la ladera de la montaña. De ella brotaba un temor frío.
- id: oathbreakers
  en: Long ago, Aragorn explained, the Men of the Mountains had sworn to fight for Isildur, and broken their oath. Isildur cursed them never to rest until it was fulfilled.
  es: Hacía mucho tiempo, explicó Aragorn, los Hombres de las Montañas habían jurado luchar por Isildur, y habían roto su juramento. Isildur los maldijo a no descansar nunca hasta cumplirlo.
- id: dark
  en: Aragorn led the way in with a torch. The horses trembled but followed. Gimli came last of all, ashamed of his fear, for a dwarf who loved caves now hated this one.
  es: Aragorn entró el primero con una antorcha. Los caballos temblaban, pero lo siguieron. Gimli iba el último de todos, avergonzado de su miedo, pues él, un enano amante de las cuevas, detestaba aquella.
- id: whispers
  en: Behind them, in the dark, came whispers and the faint sound of many feet. Legolas, looking back, saw shapes of men and horses, pale and grey, following.
  es: Tras ellos, en la oscuridad, se oían susurros y el débil rumor de muchos pies. Legolas, al mirar atrás, vio figuras de hombres y caballos, pálidas y grises, que los seguían.
- id: call
  en: "Aragorn did not turn back. He called out to the Dead: he was Isildur's heir, and he summoned them to the Stone of Erech."
  es: "Aragorn no se volvió. Llamó a los Muertos: él era el heredero de Isildur, y los convocaba a la Piedra de Erech."
- id: out
  en: Hours later the Company came out under the open sky, in a valley beyond the mountains. The shadow-host came with them, and people fled in terror wherever they passed.
  es: Horas después, la Compañía salió bajo el cielo abierto, en un valle al otro lado de las montañas. La hueste de sombras iba con ellos, y la gente huía aterrada allí por donde pasaban.
