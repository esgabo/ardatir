- id: guests
  en: "Half of Hobbiton came to Bilbo's party. He was turning one hundred and eleven, and his young cousin and heir Frodo, who shared his birthday, was turning thirty-three."
  es: "Medio Hobbiton acudió a la fiesta de Bilbo. Cumplía ciento once años, y su joven primo y heredero Frodo, que celebraba el cumpleaños el mismo día, cumplía treinta y tres."
- id: feast
  en: "There were tents and games, a present for every guest, and fireworks made by Gandalf that filled the sky with flowers and dragons of light."
  es: "Hubo carpas y juegos, un regalo para cada invitado y fuegos artificiales de Gandalf que llenaron el cielo de flores y dragones de luz."
- id: vanish
  en: "After supper Bilbo stood up to make a speech that left everyone puzzled. Then he said goodbye, and in a blinding flash he was gone. He had slipped on his magic ring; the flash was Gandalf's doing."
  es: "Después de la cena, Bilbo se levantó para dar un discurso que dejó a todos desconcertados. Luego se despidió y, en un destello cegador, desapareció. Se había puesto su anillo mágico; el destello era cosa de Gandalf."
- id: mine
  en: "Back at Bag End, Bilbo was ready for the road. But when Gandalf reminded him to leave the ring for Frodo, as they had agreed, the old hobbit grew strangely angry and called it his own."
  es: "De vuelta en Bolsón Cerrado, Bilbo estaba listo para el camino. Pero cuando Gandalf le recordó que debía dejarle el anillo a Frodo, como habían acordado, el viejo hobbit se enfadó de un modo extraño y dijo que era suyo."
- id: letgo
  en: "Gandalf stood firm, and Bilbo came to himself. He let the envelope with the ring fall to the floor and walked out into the night, lighter than he had felt in years."
  es: "Gandalf no cedió, y Bilbo volvió en sí. Dejó caer al suelo el sobre con el anillo y salió a la noche, más ligero de lo que se había sentido en años."
- id: frodo
  en: "Frodo was left with Bag End, and with the ring. Gandalf, thoughtful and uneasy, told him to keep it hidden and not to use it."
  es: "Frodo se quedó con Bolsón Cerrado, y con el anillo. Gandalf, pensativo e inquieto, le pidió que lo mantuviera escondido y que no lo usara."
