- id: wait
  en: "All summer Frodo waited for Gandalf, who had promised to come back. Now it was autumn, Bag End was sold, and still there was no word."
  es: "Todo el verano Frodo esperó a Gandalf, que había prometido volver. Ya era otoño, Bolsón Cerrado estaba vendido, y seguía sin haber noticias."
- id: pretend
  en: "Frodo let everyone think he was simply moving to a little house in Buckland. On the evening after his fiftieth birthday he set out on foot with Sam and Pippin."
  es: "Frodo dejó que todos creyeran que simplemente se mudaba a una casita en Los Gamos. La tarde siguiente a su quincuagésimo cumpleaños partió a pie con Sam y Pippin."
- id: stars
  en: "They walked quietly across the fields under the stars, their packs heavy, while the Shire slept."
  es: "Caminaron en silencio por los campos bajo las estrellas, con las mochilas pesadas, mientras la Comarca dormía."
- id: rider
  en: "Behind them, a black horse came up the hill into Hobbiton. Its rider asked old Gaffer Gamgee for Mister Baggins, and the Gaffer told him he had gone."
  es: "A sus espaldas, un caballo negro subió la colina hasta Hobbiton. Su jinete preguntó al viejo Tío Gamyi por el señor Bolsón, y el Tío le dijo que se había ido."
- id: sniff
  en: "The stranger hissed and rode off into the dark, after them."
  es: "El desconocido soltó un siseo y se alejó en la oscuridad, tras ellos."
