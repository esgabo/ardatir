- id: challenge
  en: The Host of the West halted before the Black Gate. Trumpets sounded, and heralds called on the Dark Lord to come out and face justice.
  es: La Hueste del Oeste se detuvo ante la Puerta Negra. Sonaron las trompetas, y los heraldos desafiaron al Señor Oscuro a salir y responder ante la justicia.
- id: mouth
  en: For a long time there was silence. Then a small door opened, and out rode the Mouth of Sauron, a man who served the Dark Tower and had long ago forgotten his own name.
  es: Durante largo rato hubo silencio. Luego se abrió una pequeña puerta, y salió a caballo la Boca de Sauron, un hombre que servía a la Torre Oscura y que había olvidado su propio nombre hacía mucho tiempo.
- id: tokens
  en: "Mocking, he held up three things: a short sword that Sam had carried, a grey Elven cloak, and Frodo's shirt of mithril. Pippin cried out in grief."
  es: "Burlón, mostró tres objetos: una espada corta que había llevado Sam, una capa gris élfica y la cota de mithril de Frodo. Pippin gritó de dolor."
- id: terms
  en: The spy had been caught, the Mouth said. If they wanted him spared, the West must surrender and become Sauron's slaves.
  es: El espía había sido capturado, dijo la Boca. Si querían salvarlo, el Oeste debía rendirse y convertirse en esclavo de Sauron.
- id: refusal
  en: Gandalf strode forward and took the tokens from him. He refused the terms utterly, and the Mouth of Sauron fled back to the gate.
  es: Gandalf dio un paso al frente y le quitó los objetos. Rechazó las condiciones por completo, y la Boca de Sauron huyó de vuelta a la puerta.
- id: trap
  en: Then drums rolled, and the Black Gate swung open. A vast army poured out, and from the hills on either side more enemies came. The trap had closed.
  es: Entonces redoblaron los tambores, y la Puerta Negra se abrió de par en par. Salió un ejército inmenso, y desde las colinas a ambos lados llegaron más enemigos. La trampa se había cerrado.
