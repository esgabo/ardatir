- id: retreat
  en: Théoden led his riders into Helm's Deep, a narrow valley closed by a wall and guarded by an old fortress, the Hornburg. Saruman's host was close behind.
  es: Théoden llevó a sus jinetes al Abismo de Helm, un valle estrecho cerrado por un muro y guardado por una vieja fortaleza, Cuernavilla. La hueste de Saruman les pisaba los talones.
- id: storm
  en: Night fell with rain, and a vast host of Orcs and wild men came against the walls with ladders and rams. Aragorn and Éomer fought at the gate, and Gimli saved Éomer's life.
  es: Cayó la noche con lluvia, y una enorme hueste de orcos y hombres salvajes atacó las murallas con escalas y arietes. Aragorn y Éomer lucharon en la puerta, y Gimli salvó la vida de Éomer.
- id: blast
  en: Deep in the night, a fire of Saruman's making burst beneath the Deeping Wall and blew a hole in it. The enemy poured through, and the defenders fell back to the Hornburg and the caves.
  es: Bien entrada la noche, un fuego creado por Saruman estalló bajo el Muro del Abismo y abrió un boquete. El enemigo entró en tropel, y los defensores se replegaron a Cuernavilla y a las cuevas.
- id: ride
  en: At dawn Théoden would wait no longer. With Aragorn beside him, he rode out of the gate with his men, sounding the great horn of Helm, and cut a path through the enemy.
  es: Al alba, Théoden no quiso esperar más. Con Aragorn a su lado, salió por la puerta con sus hombres, haciendo sonar el gran cuerno de Helm, y se abrió paso entre el enemigo.
- id: gandalf
  en: "On the hill above, a white rider appeared: Gandalf had come, with Erkenbrand and a thousand men on foot. The Orcs, caught between them, fled."
  es: "En la colina de arriba apareció un jinete blanco: Gandalf había llegado, con Erkenbrand y mil hombres a pie. Los orcos, atrapados entre ellos, huyeron."
- id: wood
  en: But in the night a forest had appeared in the valley where none had been. The Orcs ran into its shadows, and none came out again.
  es: Pero durante la noche había aparecido un bosque en el valle donde antes no había ninguno. Los orcos corrieron hacia sus sombras, y ninguno volvió a salir.
- id: count
  en: Legolas and Gimli had kept count of the foes they felled through the night. Gimli won their contest, forty-two to forty-one.
  es: Legolas y Gimli habían llevado la cuenta de los enemigos abatidos durante la noche. Gimli ganó la competición, cuarenta y dos a cuarenta y uno.
