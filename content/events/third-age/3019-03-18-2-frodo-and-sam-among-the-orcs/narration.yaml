- id: road
  en: Coming down from the Morgai, the hobbits had to follow a road north for a while. In their Orc gear, with no other way to go, they trudged along it.
  es: Al bajar del Morgai, los hobbits tuvieron que seguir un camino hacia el norte durante un trecho. Con su ropa de orco y sin otro camino posible, avanzaron por él a duras penas.
- id: caught
  en: A company of Orcs came marching up behind them. Their slave-driver took the two for deserters and forced them into the line.
  es: Una compañía de orcos llegó marchando detrás de ellos. Su capataz los tomó por desertores y los obligó a entrar en la fila.
- id: march
  en: For miles they were driven along at a run, with a whip cracking behind them. Frodo was close to falling, and Sam feared they would be found out.
  es: Durante leguas los obligaron a avanzar a la carrera, con un látigo restallando a sus espaldas. Frodo estaba a punto de caer, y Sam temía que los descubrieran.
- id: crush
  en: At last they reached a crossroads crowded with other troops all trying to pass at once. Pushing and shoving turned into a brawl.
  es: Por fin llegaron a un cruce abarrotado de otras tropas que intentaban pasar todas a la vez. Los empujones y codazos acabaron en una pelea.
- id: escape
  en: In the confusion, the hobbits dropped to the ground and crawled away to the edge of the road. No one noticed. They were free again, and closer to the mountain.
  es: En la confusión, los hobbits se tiraron al suelo y se alejaron a rastras hasta el borde del camino. Nadie se dio cuenta. Volvían a ser libres, y estaban más cerca de la montaña.
