- id: climb
  en: "So Gandalf led them up toward the high pass under Caradhras, the red-sided mountain, hoping to cross before anyone could follow."
  es: "Así que Gandalf los guio hacia el alto paso bajo Caradhras, la montaña de laderas rojas, con la esperanza de cruzar antes de que nadie pudiera seguirlos."
- id: storm
  en: "The mountain seemed to turn against them. Snow whirled, stones crashed down from above, and strange voices cried in the wind."
  es: "La montaña pareció volverse contra ellos. La nieve se arremolinaba, caían piedras desde lo alto y unas voces extrañas gritaban en el viento."
- id: fire
  en: "Freezing, they huddled under a wall of rock. Gandalf lit a fire with his staff, though anyone watching would know a wizard was there."
  es: "Helados, se acurrucaron bajo una pared de roca. Gandalf encendió un fuego con su bastón, aunque cualquiera que vigilara sabría que allí había un mago."
- id: back
  en: "By morning the path ahead was buried deep. There was no going on, and Gandalf turned them back."
  es: "Por la mañana el sendero estaba enterrado bajo la nieve. No había forma de seguir, y Gandalf los hizo volver."
- id: drifts
  en: "Boromir and Aragorn forced a way down through the drifts and carried the hobbits on their backs, while Legolas ran lightly over the top of the snow."
  es: "Boromir y Aragorn se abrieron paso hacia abajo entre los ventisqueros y llevaron a los hobbits a cuestas, mientras Legolas corría con ligereza sobre la nieve."
- id: moria
  en: "Beaten by the mountain, they had one road left, and no one liked it: under the mountains, through the dark mines of Moria."
  es: "Vencidos por la montaña, les quedaba un solo camino, y a nadie le gustaba: bajo las montañas, a través de las oscuras minas de Moria."
