- id: out
  en: Sam led his master out of the mountain. Around them the ground shook, fire poured down the slopes, and ash filled the air.
  es: Sam sacó a su amo de la montaña. A su alrededor la tierra temblaba, el fuego corría por las laderas y la ceniza llenaba el aire.
- id: island
  en: They reached a small hill of ash, but the burning rivers cut them off on every side. There was nowhere else to go.
  es: Llegaron a una pequeña colina de ceniza, pero los ríos de fuego les cerraban el paso por todos lados. No había ningún otro sitio adonde ir.
- id: together
  en: Frodo was himself again, and calm. He was glad, he told Sam, that they were together at the end. Sam held his hand and said what a tale it would make, if anyone was left to tell it.
  es: Frodo volvía a ser él mismo, y estaba tranquilo. Se alegraba, le dijo a Sam, de que estuvieran juntos al final. Sam le tomó la mano y dijo que menuda historia sería, si quedaba alguien para contarla.
- id: eagles
  en: Then great wings swept out of the smoke. Gwaihir, lord of the Eagles, and two of his kin had come, and on Gwaihir's back rode Gandalf.
  es: Entonces unas grandes alas surgieron del humo. Habían llegado Gwaihir, señor de las Águilas, y dos de sus parientes, y a lomos de Gwaihir iba Gandalf.
- id: lifted
  en: The Eagles found the two hobbits lying on the ash, fast asleep or near death, and gently lifted them up and carried them away out of the fire.
  es: Las Águilas encontraron a los dos hobbits tendidos en la ceniza, profundamente dormidos o al borde de la muerte, y los levantaron con delicadeza y se los llevaron lejos del fuego.
