- id: book
  en: Two years had passed. Frodo gave Sam the great red book in which he and Bilbo had written their story, and asked Sam to finish it.
  es: Habían pasado dos años. Frodo le dio a Sam el gran libro rojo en el que él y Bilbo habían escrito su historia, y le pidió que lo terminara.
- id: road
  en: Then the two rode out together. In the woods they met a company of Elves, with Elrond and Galadriel among them, and old Bilbo too, sleepy and happy.
  es: Luego los dos salieron juntos a caballo. En el bosque se encontraron con una comitiva de Elfos, entre ellos Elrond y Galadriel, y también el viejo Bilbo, adormilado y feliz.
- id: why
  en: Sam understood at last. Frodo was leaving. He had been too deeply hurt to rest in the Shire. He had saved it, but it was others who would enjoy it.
  es: Sam lo comprendió por fin. Frodo se marchaba. Había sufrido heridas demasiado hondas para encontrar descanso en la Comarca. La había salvado, pero eran otros quienes la disfrutarían.
- id: havens
  en: At the Grey Havens, a white ship waited, and Gandalf stood on the quay, wearing his ring openly at last. Merry and Pippin came riding hard to say goodbye.
  es: En los Puertos Grises esperaba una nave blanca, y Gandalf estaba en el muelle, llevando por fin su anillo a la vista. Merry y Pippin llegaron a caballo a toda prisa para despedirse.
- id: farewell
  en: Frodo kissed his friends and went aboard with Bilbo, Gandalf, Elrond and Galadriel. The ship slipped out to sea and was gone into the West.
  es: Frodo besó a sus amigos y subió a bordo con Bilbo, Gandalf, Elrond y Galadriel. La nave salió al mar y desapareció hacia el Oeste.
- id: home
  en: Sam rode home in silence. At Bag End the lamp was lit, and supper was ready. Rosie drew him in and put their little daughter in his lap, and he took a deep breath. He was home.
  es: Sam volvió a casa en silencio. En Bolsón Cerrado la lámpara estaba encendida, y la cena estaba lista. Rosita lo hizo pasar y le puso a su hijita en el regazo, y él respiró hondo. Estaba en casa.
