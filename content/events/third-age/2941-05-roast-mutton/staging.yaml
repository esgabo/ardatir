stage: diorama
duration: 34
set: kits/trollshaws/trolls-camp.glb
# A wet night in the hills, and the sun that comes up over the eastern trees at the end of it.
light:
  - { t: 0, preset: night }
  - { t: 0.84, preset: night }
  - { t: 0.93, preset: dawn }
  - { t: 1, preset: morning }
# The shot (#28, #83): wide on the wet wood and the one light in it, in to the fire as Bilbo
# creeps up, tight on the purse that cries out, then out again as the company is brought in and
# laid along the path, and wide for the dawn that turns the three of them to stone.
camera:
  - { t: 0, x: -2.30, z: 1.60, width: 12.5 }
  - { t: 0.22, x: -0.30, z: 0.90, width: 8.6 }
  - { t: 0.42, x: 0.20, z: 0.90, width: 7.5 }
  - { t: 0.62, x: -1.70, z: 1.80, width: 11.8 }
  - { t: 0.85, x: -0.10, z: 1.80, width: 9.2 }
  - { t: 1, x: 0.00, z: 1.80, width: 9.0 }
# What the scene does, at the beat it does it (DESIGN §9.5). The fire itself is the place's own
# sound (a `camp` scape), so only what happens around it is written here.
sound:
  # A log going in the fire the mutton is burning over.
  - { t: 0.07, cue: crack, gain: 0.6 }
  # The trolls fall out among themselves, as they do over everything.
  - { t: 0.33, cue: thud }
  - { t: 0.36, cue: thud, gain: 0.7 }
  # The company caught one at a time and dropped in sacks.
  - { t: 0.44, cue: thud }
  - { t: 0.47, cue: thud, gain: 0.85 }
  - { t: 0.5, cue: thud, gain: 0.8 }
  - { t: 0.53, cue: thud, gain: 0.75 }
  # The sun comes over the trees and three trolls become three stones.
  - { t: 0.87, cue: rumble }
narration:
  fire: 0
  trolls: 0.22
  caught: 0.42
  voices: 0.62
  dawn: 0.85
beats:
  caught: 0.45
  dawn: 0.88
tracks:
  # The trolls stand just outside the stumps and boulder the kit puts round the fire
  # (trollshaws.py SEATS), not on their spots: there is no sitting pose yet, and a standing
  # figure placed at a seat is buried in it to the waist (#81). When one arrives, they move
  # back onto the seats with `action: sit` and a `y` for the seat's height.
  - characterId: william
    becomes: { t: 0.88, model: characters/william/william-stone.glb }
    keyframes:
      - { t: 0, x: -2.35, z: -0.90, action: talk, thought: { en: "Mutton again. Always mutton.", es: "Carnero otra vez. Siempre carnero." } }
      - { t: 0.3, x: -2.35, z: -0.90, action: idle }
      - { t: 0.38, x: -2.05, z: -0.30, action: walk }
      - { t: 0.42, x: -2.05, z: -0.30, action: talk, thought: { en: "What is this little thing? Too small to be worth the trouble.", es: "¿Qué es esta cosita? Demasiado pequeña para tanto lío." } }
      - { t: 0.78, x: -2.05, z: -0.30, action: fight }
      - { t: 0.86, x: -2.05, z: -0.30, action: idle }
      - { t: 1, x: -2.05, z: -0.30, action: idle }
  - characterId: bert
    becomes: { t: 0.88, model: characters/bert/bert-stone.glb }
    keyframes:
      - { t: 0, x: 2.50, z: -1.28, action: talk }
      - { t: 0.3, x: 2.50, z: -1.28, action: idle }
      - { t: 0.38, x: 2.50, z: -1.28, action: idle }
      - { t: 0.66, x: 2.50, z: -1.28, action: talk, thought: { en: "Roast them. I say roast them, and be done.", es: "Asarlos. Digo que los asemos, y se acabó." } }
      - { t: 0.78, x: 2.50, z: -1.28, action: fight }
      - { t: 0.86, x: 2.50, z: -1.28, action: idle }
      - { t: 1, x: 2.50, z: -1.28, action: idle }
  - characterId: tom
    becomes: { t: 0.88, model: characters/tom/tom-stone.glb }
    keyframes:
      - { t: 0, x: 0.55, z: 2.99, action: talk }
      - { t: 0.3, x: 0.55, z: 2.99, action: idle }
      - { t: 0.38, x: 0.55, z: 2.99, action: idle }
      - { t: 0.72, x: 0.55, z: 2.99, action: talk, thought: { en: "Who keeps saying that? Was that you, Bert?", es: "¿Quién dice eso? ¿Fuiste tú, Berto?" } }
      - { t: 0.78, x: 0.55, z: 2.99, action: fight }
      - { t: 0.86, x: 0.55, z: 2.99, action: idle }
      - { t: 1, x: 0.55, z: 2.99, action: idle }
  - characterId: bilbo
    model: characters/bilbo/bilbo-travel.glb   # Dwalin's hood and cloak, from the road out of Hobbiton (ch. 2)
    keyframes:
      - { t: 0, x: -7.00, z: 4.45, action: walk, thought: { en: "A light, in all this wet. A burglar should go and look.", es: "Una luz, con todo este agua. Un saqueador debería ir a mirar." } }
      - { t: 0.14, x: -4.30, z: 4.05, action: walk }
      - { t: 0.22, x: -3.10, z: 2.75, action: walk }
      - { t: 0.27, x: -2.75, z: 2.35, action: hide, thought: { en: "Three of them. Big as houses, and the fire is theirs.", es: "Tres. Grandes como casas, y la fogata es suya." } }
      - { t: 0.34, x: -2.20, z: 1.35, action: hide }
      - { t: 0.4, x: -1.60, z: 0.45, action: hide, thought: { en: "That purse is right there. One quiet hand.", es: "Esa bolsa está justo ahí. Una mano en silencio." } }
      - { t: 0.45, x: -1.50, z: 0.20, action: run, thought: { en: "It talked! The purse talked!", es: "¡Habló! ¡La bolsa habló!" } }
      - { t: 0.5, x: -2.20, z: 0.75, action: hide }
      - { t: 0.62, x: -0.50, z: 2.86, action: hide, thought: { en: "A sack, and the dark, and the three of them arguing.", es: "Un saco, la oscuridad, y los tres discutiendo." } }
      - { t: 0.88, x: -0.50, z: 2.86, action: hide }
      - { t: 0.94, x: -1.10, z: 2.25, action: idle, thought: { en: "Stone. They are all stone.", es: "Piedra. Son todos de piedra." } }
      - { t: 1, x: -1.10, z: 2.25, action: idle }
  - characterId: gandalf
    keyframes:
      - { t: 0, x: -8.60, z: 5.00, action: idle }
      - { t: 0.46, x: -8.60, z: 5.00, action: idle }
      - { t: 0.52, x: -4.40, z: 1.60, action: walk }
      - { t: 0.6, x: -3.70, z: 0.90, action: hide, thought: { en: "Keep them quarrelling. The dawn is doing the rest.", es: "Que sigan discutiendo. El amanecer hace lo demás." } }
      - { t: 0.78, x: -3.50, z: 0.75, action: hide }
      - { t: 0.9, x: -2.40, z: 1.50, action: walk }
      - { t: 0.96, x: -1.90, z: 2.00, action: talk, thought: { en: "The light has them. Their own quarrel held them until it came.", es: "La luz los tiene. Su propia disputa los retuvo hasta que llegó." } }
      - { t: 1, x: -1.90, z: 2.00, action: talk }
  - characterId: thorin
    keyframes:
      - { t: 0, x: -8.80, z: 6.40, action: idle }
      - { t: 0.558, x: -8.80, z: 6.40, action: idle }
      - { t: 0.613, x: -6.40, z: 4.38, action: walk }
      - { t: 0.703, x: -2.70, z: 3.60, action: hide }
      - { t: 0.93, x: -2.70, z: 3.60, action: hide }
      - { t: 1, x: -2.70, z: 3.60, action: hide, thought: { en: "One by one, into their sacks. I should have come first.", es: "Uno a uno, a sus sacos. Debí haber venido yo primero." } }
  - characterId: balin
    keyframes:
      - { t: 0, x: -8.30, z: 4.00, action: idle }
      - { t: 0.393, x: -8.30, z: 4.00, action: idle }
      - { t: 0.448, x: -6.40, z: 3.42, action: walk }
