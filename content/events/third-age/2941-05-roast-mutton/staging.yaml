stage: diorama
duration: 24
narration:
  fire: 0
  trolls: 0.25
  caught: 0.45
  voices: 0.6
  dawn: 0.85
tracks:
  - characterId: bilbo
    model: characters/bilbo/bilbo-travel.glb   # Dwalin's hood and cloak, from the road out of Hobbiton (ch. 2)
    keyframes:
      - { t: 0, x: -4, z: 3, action: walk, thought: { en: A burglar should be able to do this quietly., es: Un saqueador debería poder hacer esto en silencio. } }
      - { t: 0.3, x: -1, z: 1, action: hide, thought: { en: That purse is right there..., es: Esa bolsa está justo ahí... } }
      - { t: 0.45, x: 0, z: 0.5, action: run, thought: { en: It talked! The purse talked!, es: ¡Habló! ¡La bolsa habló! } }
      - { t: 1, x: -2.5, z: 2.5, action: idle, thought: { en: Stone. They are all stone., es: Piedra. Son todos de piedra. } }
  - characterId: william
    keyframes:
      - { t: 0, x: 1, z: -1, action: talk, thought: { en: "Mutton yesterday, mutton today...", es: "Cordero ayer, cordero hoy..." } }
      - { t: 0.45, x: 0.4, z: 0.2, action: fight, thought: { en: What's this little thing?, es: ¿Qué es esta cosita? } }
      - { t: 0.8, x: 1.2, z: -0.6, action: talk, thought: { en: Who said that? Bert? Tom?, es: ¿Quién dijo eso? ¿Berto? ¿Tom? } }
      - { t: 1, x: 1.2, z: -0.6, action: idle }
  - characterId: gandalf
    keyframes:
      - { t: 0, x: 5, z: -4, action: idle }
      - { t: 0.55, x: 3, z: -2.5, action: hide, thought: { en: Keep them quarrelling. Dawn is close., es: Que sigan peleando. El amanecer está cerca. } }
      - { t: 1, x: 0, z: 1.5, action: talk, thought: { en: "There, the first light. Their quarrel has cost them everything.", es: Ahí está la primera luz. Su disputa les ha costado todo. } }
