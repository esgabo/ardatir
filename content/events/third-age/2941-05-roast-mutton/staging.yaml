      - { t: 0.93, x: 2.70, z: 4.30, action: hide }
      - { t: 1, x: 2.70, z: 4.30, action: hide, thought: { en: "The sun. Look at them — the sun has done it.", es: "El sol. Míralos: lo ha hecho el sol." } }
