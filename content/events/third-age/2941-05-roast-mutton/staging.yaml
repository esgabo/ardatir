stage: diorama
duration: 34
set: kits/trollshaws/trolls-camp.glb
# A wet night in the hills, and the sun that comes up over the eastern trees at the end of it.
light:
  - { t: 0, preset: night }
  - { t: 0.84, preset: night }
  - { t: 0.93, preset: dawn }
  - { t: 1, preset: morning }
narration:
  fire: 0
  trolls: 0.22
  caught: 0.42
  voices: 0.62
  dawn: 0.85
beats:
  caught: 0.45
  dawn: 0.88
tracks:
  - characterId: william
    becomes: { t: 0.88, model: characters/william/william-stone.glb }
    keyframes:
      - { t: 0, x: -1.75, z: -0.55, action: talk, thought: { en: "Mutton again. Always mutton.", es: "Carnero otra vez. Siempre carnero." } }
      - { t: 0.3, x: -1.75, z: -0.55, action: idle }
      - { t: 0.38, x: -2.05, z: -0.30, action: walk }
      - { t: 0.42, x: -2.05, z: -0.30, action: talk, thought: { en: "What is this little thing? Too small to be worth the trouble.", es: "¿Qué es esta cosita? Demasiado pequeña para tanto lío." } }
      - { t: 0.78, x: -2.05, z: -0.30, action: fight }
      - { t: 0.86, x: -2.05, z: -0.30, action: idle }
      - { t: 1, x: -2.05, z: -0.30, action: idle }
  - characterId: bert
    becomes: { t: 0.88, model: characters/bert/bert-stone.glb }
    keyframes:
      - { t: 0, x: 1.95, z: -0.85, action: talk }
      - { t: 0.3, x: 1.95, z: -0.85, action: idle }
      - { t: 0.38, x: 1.95, z: -0.85, action: idle }
      - { t: 0.66, x: 1.95, z: -0.85, action: talk, thought: { en: "Roast them. I say roast them, and be done.", es: "Asarlos. Digo que los asemos, y se acabó." } }
      - { t: 0.78, x: 1.95, z: -0.85, action: fight }
      - { t: 0.86, x: 1.95, z: -0.85, action: idle }
      - { t: 1, x: 1.95, z: -0.85, action: idle }
  - characterId: tom
    becomes: { t: 0.88, model: characters/tom/tom-stone.glb }
    keyframes:
      - { t: 0, x: 0.45, z: 2.30, action: talk }
      - { t: 0.3, x: 0.45, z: 2.30, action: idle }
      - { t: 0.38, x: 0.45, z: 2.30, action: idle }
      - { t: 0.72, x: 0.45, z: 2.30, action: talk, thought: { en: "Who keeps saying that? Was that you, Bert?", es: "¿Quién dice eso? ¿Fuiste tú, Berto?" } }
      - { t: 0.78, x: 0.45, z: 2.30, action: fight }
      - { t: 0.86, x: 0.45, z: 2.30, action: idle }
      - { t: 1, x: 0.45, z: 2.30, action: idle }
  - characterId: bilbo
    model: characters/bilbo/bilbo-travel.glb   # Dwalin's hood and cloak, from the road out of Hobbiton (ch. 2)
    keyframes:
      - { t: 0, x: -7.00, z: 4.45, action: walk, thought: { en: "A light, in all this wet. A burglar should go and look.", es: "Una luz, con todo este agua. Un saqueador debería ir a mirar." } }
      - { t: 0.14, x: -4.30, z: 4.05, action: walk }
      - { t: 0.22, x: -3.10, z: 2.75, action: walk }
      - { t: 0.27, x: -2.75, z: 2.35, action: hide, thought: { en: "Three of them. Big as houses, and the fire is theirs.", es: "Tres. Grandes como casas, y la fogata es suya." } }
      - { t: 0.34, x: -2.20, z: 1.35, action: hide }
      - { t: 0.4, x: -1.60, z: 0.45, action: hide, thought: { en: "That purse is right there. One quiet hand.", es: "Esa bolsa está justo ahí. Una mano en silencio." } }
      - { t: 0.45, x: -1.50, z: 0.20, action: run, thought: { en: "It talked! The purse talked!", es: "¡Habló! ¡La bolsa habló!" } }
      - { t: 0.5, x: -2.20, z: 0.75, action: hide }
      - { t: 0.62, x: -0.35, z: 2.90, action: hide, thought: { en: "A sack, and the dark, and the three of them arguing.", es: "Un saco, la oscuridad, y los tres discutiendo." } }
      - { t: 0.88, x: -0.35, z: 2.90, action: hide }
      - { t: 0.94, x: -1.10, z: 2.25, action: idle, thought: { en: "Stone. They are all stone.", es: "Piedra. Son todos de piedra." } }
      - { t: 1, x: -1.10, z: 2.25, action: idle }
  - characterId: gandalf
    keyframes:
      - { t: 0, x: -8.60, z: 5.00, action: idle }
      - { t: 0.46, x: -8.60, z: 5.00, action: idle }
      - { t: 0.52, x: -4.40, z: 1.60, action: walk }
      - { t: 0.6, x: -3.70, z: 0.90, action: hide, thought: { en: "Keep them quarrelling. The dawn is doing the rest.", es: "Que sigan discutiendo. El amanecer hace lo demás." } }
      - { t: 0.78, x: -3.50, z: 0.75, action: hide }
      - { t: 0.9, x: -2.40, z: 1.50, action: walk }
      - { t: 0.96, x: -1.90, z: 2.00, action: talk, thought: { en: "The light has them. Their own quarrel held them until it came.", es: "La luz los tiene. Su propia disputa los retuvo hasta que llegó." } }
      - { t: 1, x: -1.90, z: 2.00, action: talk }
  - characterId: thorin
    keyframes:
      - { t: 0, x: -8.20, z: 4.20, action: idle }
      - { t: 0.47, x: -6.40, z: 4.30, action: walk }
      - { t: 0.52, x: -2.45, z: 3.55, action: walk }
      - { t: 0.57, x: -0.95, z: 2.95, action: hide }
      - { t: 0.59, x: -0.95, z: 2.95, action: hide, thought: { en: "One by one, into their sacks. I should have come first.", es: "Uno a uno, a sus sacos. Debí haber venido yo primero." } }
      - { t: 0.93, x: -0.95, z: 2.95, action: hide }
      - { t: 1, x: -0.95, z: 2.95, action: hide }
  - characterId: balin
    keyframes:
      - { t: 0, x: -8.50, z: 4.50, action: idle }
      - { t: 0.482, x: -6.40, z: 4.55, action: walk }
      - { t: 0.532, x: -1.85, z: 3.85, action: walk }
      - { t: 0.582, x: -0.35, z: 3.25, action: hide }
      - { t: 0.93, x: -0.35, z: 3.25, action: hide }
      - { t: 0.95, x: -0.35, z: 3.25, action: hide, thought: { en: "The sun. Look at them — the sun has done it.", es: "El sol. Míralos: lo ha hecho el sol." } }
      - { t: 1, x: -0.35, z: 3.25, action: hide }
  - characterId: dwalin
