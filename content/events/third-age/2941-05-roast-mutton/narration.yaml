- id: fire
  en: Cold, wet and lost in the hills, the company spotted a light among the trees, and sent Bilbo to see what it was.
  es: Con frío, empapados y perdidos entre las colinas, los de la compañía vieron una luz entre los árboles, y enviaron a Bilbo a ver qué era.
- id: trolls
  en: Around a great fire sat three trolls, grumbling about their supper. Bilbo tried to pick a pocket, and the purse cried out.
  es: Alrededor de una gran fogata había tres trolls, quejándose de su cena. Bilbo intentó robar de un bolsillo, y la bolsa gritó.
- id: caught
  en: The trolls caught him, and one by one the dwarves who came looking for him were stuffed into sacks.
  es: Los trolls lo atraparon, y uno a uno los enanos que vinieron a buscarlo terminaron metidos en sacos.
- id: voices
  en: Then a voice from the dark, sounding just like one of the trolls, set them quarrelling about how to cook their catch.
  es: Entonces una voz desde la oscuridad, que sonaba igual que uno de los trolls, los hizo discutir sobre cómo cocinar su presa.
- id: dawn
  en: They argued until the sun came up. Trolls cannot bear daylight, and all three turned to stone.
  es: Discutieron hasta que salió el sol. Los trolls no soportan la luz del día, y los tres se convirtieron en piedra.
