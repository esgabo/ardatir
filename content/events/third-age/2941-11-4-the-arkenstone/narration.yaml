- id: siege
  en: With the dragon gone, the homeless people of Lake-town and the Elvenking's army came to the Mountain. Bard asked for a fair share of the treasure to rebuild. Thorin, walled in behind the gate, refused them everything.
  es: Muerto el dragón, la gente sin hogar de la Ciudad del Lago y el ejército del Rey Elfo llegaron a la Montaña. Bardo pidió una parte justa del tesoro para reconstruir. Thorin, atrincherado tras la puerta, se lo negó todo.
- id: stone
  en: Bilbo had a secret. Deep in the hoard he had found the Arkenstone, the shining Heart of the Mountain, the treasure Thorin longed for most of all, and he had hidden it away.
  es: Bilbo tenía un secreto. En lo hondo del tesoro había encontrado la Piedra del Arca, el resplandeciente Corazón de la Montaña, la joya que Thorin más ansiaba, y la había escondido.
- id: night
  en: One cold night, on his watch, he slipped on his ring, climbed down a rope from the wall, and made his way through the dark to the camp at Dale.
  es: Una noche fría, durante su guardia, se puso el anillo, bajó por una cuerda desde la muralla y atravesó la oscuridad hasta el campamento de Valle.
- id: gift
  en: Brought before Bard and the Elvenking, he set the Arkenstone in front of them. With this, he said, they could bargain with Thorin, and perhaps there would be no war.
  es: Llevado ante Bardo y el Rey Elfo, puso la Piedra del Arca delante de ellos. Con ella, les dijo, podrían negociar con Thorin, y quizá no habría guerra.
- id: gandalf
  en: As he left, an old man in a dark cloak rose to praise him. It was Gandalf, returned at last, and Bilbo's heart lifted to see him.
  es: Cuando se marchaba, un anciano envuelto en una capa oscura se levantó para alabarlo. Era Gandalf, que por fin había vuelto, y a Bilbo se le alegró el corazón al verlo.
- id: back
  en: They urged him to stay where he was safe. But Bilbo had given the dwarves his word, and before dawn he climbed back to the Mountain to face whatever would come.
  es: Le insistieron en que se quedara donde estaba a salvo. Pero Bilbo había dado su palabra a los enanos, y antes del amanecer regresó a la Montaña para afrontar lo que viniera.
