- id: found
  en: "Gwaihir the eagle, sent by Galadriel to look for him, found Gandalf on the peak and lifted him with great care."
  es: "El águila Gwaihir, enviada por Galadriel a buscarlo, encontró a Gandalf en la cumbre y lo alzó con sumo cuidado."
- id: fly
  en: "He bore him away over the mountains and the valleys, to the golden woods of Lothlórien."
  es: "Se lo llevó volando sobre las montañas y los valles, hasta los bosques dorados de Lothlórien."
- id: late
  en: "The Company had gone. They had left only the day before."
  es: "La Compañía ya no estaba. Había partido el día anterior."
- id: healed
  en: "There Galadriel healed him and clothed him in white. When he was ready, she gave him messages for friends he would meet again."
  es: "Allí Galadriel lo sanó y lo vistió de blanco. Cuando estuvo listo, le dio mensajes para los amigos con los que volvería a encontrarse."
