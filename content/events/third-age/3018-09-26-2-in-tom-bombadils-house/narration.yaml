- id: dusk
  en: "Tom led the weary hobbits through the dusk to his house at the foot of the hills, singing and splashing ahead of them."
  es: "Tom guio a los cansados hobbits en el crepúsculo hasta su casa al pie de las colinas, cantando y chapoteando delante de ellos."
- id: goldberry
  en: "There Goldberry, the River-daughter, welcomed them, golden-haired among lamps and bowls of water-lilies. Their fear seemed to melt away."
  es: "Allí los recibió Baya de Oro, la Hija del Río, de cabellos dorados, entre lámparas y cuencos de nenúfares. Su miedo pareció desvanecerse."
- id: supper
  en: "They ate a supper fit for a feast, and Tom sang and laughed with them. Before bed he told them not to heed any noises in the night."
  es: "Tomaron una cena digna de un banquete, y Tom cantó y rio con ellos. Antes de acostarse les dijo que no hicieran caso de ningún ruido nocturno."
- id: dreams
  en: "Yet each of them dreamed. Frodo saw a white-haired figure on a high tower and a great eagle; Pippin heard the willow; Merry dreamed of rising water. Only Sam slept like a log."
  es: "Aun así, todos soñaron. Frodo vio una figura de cabellos blancos en una torre alta y una gran águila; Pippin oyó al sauce; Merry soñó con aguas que subían. Solo Sam durmió como un tronco."
