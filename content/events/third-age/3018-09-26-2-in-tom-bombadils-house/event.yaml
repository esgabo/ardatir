summary:
  en: "At dusk Tom leads the weary hobbits to his house under the hill, where Goldberry welcomes them among lamps and water-lilies. After a merry supper they go to bed, and the night brings each of them strange dreams, which Tom has told them not to fear."
  es: "Al anochecer, Tom lleva a los cansados hobbits a su casa al pie de la colina, donde Baya de Oro los recibe entre lámparas y nenúfares. Tras una cena alegre se acuestan, y la noche les trae a cada uno sueños extraños, que Tom les ha dicho que no teman."
