- id: desolation
  en: The company came at last to the Lonely Mountain. All around it the land lay burned and bare, and in the valley below stood the empty ruins of Dale.
  es: La compañía llegó por fin a la Montaña Solitaria. A su alrededor, la tierra estaba quemada y desnuda, y en el valle se alzaban las ruinas vacías de Valle.
- id: bay
  en: High on the western side they found a small hidden hollow, with a sheer wall of rock at its back and a grey stone at its floor. It had to be the place.
  es: En lo alto de la ladera occidental encontraron una pequeña hondonada oculta, con una pared de roca lisa al fondo y una piedra gris en el suelo. Tenía que ser el lugar.
- id: waiting
  en: But the rock would not open. The dwarves struck it with their picks in vain, and their spirits sank. Bilbo sat for days by the grey stone, gazing west.
  es: Pero la roca no se abría. Los enanos la golpearon en vano con sus picos, y se desanimaron. Bilbo pasó días sentado junto a la piedra gris, mirando hacia el oeste.
- id: thrush
  en: One evening, with autumn nearly over, a thrush landed on the stone with a snail in its beak and began knocking it against the rock.
  es: Una tarde, con el otoño casi terminado, un zorzal se posó en la piedra con un caracol en el pico y empezó a golpearlo contra la roca.
- id: keyhole
  en: Then the setting sun broke through the clouds. A single ray fell on the wall, a flake of stone dropped away, and there was a keyhole.
  es: Entonces el sol poniente asomó entre las nubes. Un único rayo cayó sobre la pared, se desprendió una lasca de piedra, y allí apareció una cerradura.
- id: door
  en: Bilbo shouted for Thorin, who ran with the key his father had left him. It fitted, and turned. The dwarves pushed together, and a door swung inward into the dark.
  es: Bilbo llamó a gritos a Thorin, que acudió corriendo con la llave que le había dejado su padre. Encajó y giró. Los enanos empujaron todos a una, y una puerta se abrió hacia dentro, a la oscuridad.
