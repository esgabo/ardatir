- id: waste
  en: The Host left the green land of Ithilien behind and marched into the bare, poisoned country before the Black Gate.
  es: La Hueste dejó atrás la verde tierra de Ithilien y se adentró en la tierra desnuda y envenenada que había ante la Puerta Negra.
- id: fear
  en: Some of the younger men, from the farms and villages far from Mordor, were overcome with terror. They could not walk on.
  es: Algunos de los hombres más jóvenes, de granjas y aldeas lejanas de Mordor, quedaron vencidos por el terror. No podían seguir caminando.
- id: pity
  en: Aragorn did not scorn them. He looked at them with pity, not anger, and told them they might go.
  es: Aragorn no los despreció. Los miró con lástima, no con ira, y les dijo que podían marcharse.
- id: task
  en: "But he gave them a task, so they could turn back with honour: to retake the island of Cair Andros from the enemy. Some went, and the rest of the Host marched on."
  es: "Pero les dio una tarea, para que pudieran volver con honor: recuperar del enemigo la isla de Cair Andros. Algunos se fueron, y el resto de la Hueste siguió adelante."
