- id: arrive
  en: On the first day of May, the two travellers came down once more into the valley of Rivendell, and the elves in the trees greeted them with merry, teasing songs.
  es: El primer día de mayo, los dos viajeros descendieron una vez más al valle de Rivendel, y los elfos de los árboles los recibieron con canciones alegres y burlonas.
- id: tales
  en: In Elrond's house, Bilbo told the story of his adventures, and the elves listened eagerly.
  es: En la casa de Elrond, Bilbo contó la historia de sus aventuras, y los elfos lo escucharon con avidez.
- id: drowsy
  en: Later, tired and comfortable, he sat half asleep while Gandalf and Elrond talked quietly of things far away.
  es: Más tarde, cansado y a gusto, se quedó medio dormido mientras Gandalf y Elrond conversaban en voz baja sobre asuntos lejanos.
- id: news
  en: So Bilbo learned, almost by accident, where Gandalf had gone. The Wise had driven the Necromancer out of his dark fortress in the south of Mirkwood.
  es: Así se enteró Bilbo, casi por casualidad, de adónde había ido Gandalf. Los Sabios habían expulsado al Nigromante de su oscura fortaleza en el sur del Bosque Negro.
- id: home
  en: It was good news, and Bilbo was glad of it. But most of all, now, he wanted to go home.
  es: Era una buena noticia, y Bilbo se alegró. Pero, por encima de todo, ahora quería volver a casa.
