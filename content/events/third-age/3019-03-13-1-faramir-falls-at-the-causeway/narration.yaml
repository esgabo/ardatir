- id: sent
  en: Denethor sent Faramir back to defend the river crossings, though the odds were hopeless. Faramir obeyed without complaint.
  es: Denethor envió a Faramir de vuelta a defender los pasos del río, aunque no había esperanza. Faramir obedeció sin una queja.
- id: breach
  en: The enemy came over the river in great numbers. Faramir fell back across the fields to the forts on the causeway, and then the outer wall of the Pelennor was broken.
  es: El enemigo cruzó el río en gran número. Faramir se replegó por los campos hasta los fuertes de la calzada, y entonces se rompió la muralla exterior del Pelennor.
- id: rearguard
  en: Faramir stayed with the last of his men, holding the enemy back so the others could reach the city. The Nazgûl wheeled above, and the men's courage failed.
  es: Faramir se quedó con los últimos de sus hombres, conteniendo al enemigo para que los demás pudieran llegar a la ciudad. Los Nazgûl volaban en círculos sobre ellos, y el valor de los hombres flaqueaba.
- id: dart
  en: Then Faramir was struck by a dart and fell. The Southron horsemen closed in around him.
  es: Entonces Faramir fue alcanzado por un dardo y cayó. Los jinetes del sur se cerraron en torno a él.
- id: imrahil
  en: Trumpets rang from the city. Prince Imrahil of Dol Amroth charged out with his knights, broke through the enemy, and carried Faramir back across his saddle.
  es: Sonaron trompetas desde la ciudad. El príncipe Imrahil de Dol Amroth salió a la carga con sus caballeros, se abrió paso entre el enemigo y trajo de vuelta a Faramir atravesado sobre su silla.
- id: father
  en: Faramir lay in a burning fever, and did not wake. Denethor sat beside him, at last full of love and grief, but now too late, he feared.
  es: Faramir yacía con una fiebre ardiente, y no despertaba. Denethor se sentó a su lado, por fin lleno de amor y de pena, pero ya demasiado tarde, temía.
