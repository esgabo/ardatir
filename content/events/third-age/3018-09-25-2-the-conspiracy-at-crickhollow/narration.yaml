- id: house
  en: "At the little house in Crickhollow there were hot baths, a good supper and a warm fire. Merry and Fatty Bolger had everything ready."
  es: "En la casita de Cricava había baños calientes, una buena cena y un fuego acogedor. Merry y Gordo Bolger lo tenían todo preparado."
- id: confess
  en: "Then Frodo tried to say goodbye. To his astonishment, his friends already knew everything: the Ring, the danger, and his plan to leave."
  es: "Entonces Frodo intentó despedirse. Para su asombro, sus amigos ya lo sabían todo: el Anillo, el peligro y su plan de marcharse."
- id: spies
  en: "Years before, Merry had seen Bilbo vanish with the Ring, and Sam had been passing on what he heard all along. They had no intention of letting Frodo go alone."
  es: "Años atrás, Merry había visto a Bilbo desaparecer con el Anillo, y Sam les había ido contando todo lo que oía. No tenían ninguna intención de dejar que Frodo se fuera solo."
- id: plan
  en: "Frodo laughed and gave in. To avoid the road, Merry would lead them through the Old Forest, and they would leave before dawn."
  es: "Frodo se rio y se dio por vencido. Para evitar el camino, Merry los guiaría a través del Bosque Viejo, y partirían antes del amanecer."
- id: fatty
  en: "Fatty Bolger would stay behind in the house, pretending Frodo still lived there, to keep anyone who came asking off their trail."
  es: "Gordo Bolger se quedaría en la casa, fingiendo que Frodo seguía viviendo allí, para despistar a cualquiera que viniera preguntando."
