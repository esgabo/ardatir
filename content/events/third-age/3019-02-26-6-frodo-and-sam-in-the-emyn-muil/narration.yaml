- id: crossing
  en: Frodo and Sam paddled their little grey boat across the Great River and left it on the eastern shore. Behind them were their friends. Ahead lay Mordor.
  es: Frodo y Sam cruzaron el Río Grande remando en su barquita gris y la dejaron en la orilla oriental. Atrás quedaban sus amigos. Delante estaba Mordor.
- id: hills
  en: They climbed into the Emyn Muil, a maze of bare grey rock, sharp ridges and sudden cliffs. Nothing grew there but a little grass in the cracks.
  es: Se adentraron en las Emyn Muil, un laberinto de roca gris y desnuda, de crestas afiladas y precipicios repentinos. Allí no crecía nada salvo un poco de hierba en las grietas.
- id: lost
  en: Day after day they wandered, climbing up and scrambling down, only to find another drop in front of them. They could see the land they needed to reach, but not a way down to it.
  es: Día tras día vagaron, trepando y bajando a gatas, solo para encontrar otro precipicio delante. Veían la tierra a la que debían llegar, pero no el modo de bajar hasta ella.
- id: sam
  en: Sam carried the pans and rationed the waybread, and worried about his master more than himself. Frodo grew quiet, and the Ring felt heavier with every eastward step.
  es: Sam cargaba con las cazuelas y racionaba el pan del camino, y se preocupaba más por su amo que por sí mismo. Frodo se volvió callado, y el Anillo le pesaba más a cada paso hacia el este.
- id: followed
  en: At night, among the rocks, they had the uneasy feeling of being watched. Something was following them, and both of them could guess what it was.
  es: De noche, entre las rocas, tenían la inquietante sensación de que alguien los observaba. Algo los seguía, y los dos se imaginaban qué podía ser.
