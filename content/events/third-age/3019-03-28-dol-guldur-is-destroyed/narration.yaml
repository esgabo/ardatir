- id: attacks
  en: While war raged in the south, the dark fortress of Dol Guldur had sent its armies three times against the Golden Wood of Lórien. Each time they were driven back.
  es: Mientras la guerra rugía en el sur, la oscura fortaleza de Dol Guldur había enviado tres veces sus ejércitos contra el Bosque Dorado de Lórien. Las tres veces fueron rechazados.
- id: power
  en: The power of Galadriel protected the land. No enemy could take it, unless Sauron himself had come.
  es: El poder de Galadriel protegía la tierra. Ningún enemigo podía tomarla, a menos que viniera el propio Sauron.
- id: crossing
  en: When Sauron fell, Celeborn led the Elves of Lórien across the Great River, into the dark forest, and they took Dol Guldur.
  es: Cuando Sauron cayó, Celeborn guió a los Elfos de Lórien al otro lado del Río Grande, hacia el bosque oscuro, y tomaron Dol Guldur.
- id: walls
  en: Then Galadriel threw down its walls and laid bare its pits. The shadow that had lain over the forest for so long began to lift.
  es: Entonces Galadriel derribó sus muros y dejó al descubierto sus fosos. La sombra que durante tanto tiempo había cubierto el bosque empezó a levantarse.
- id: cleansed
  en: In time the great forest was cleansed, and given a new name, and its trees grew green and fair again.
  es: Con el tiempo, el gran bosque quedó limpio, recibió un nuevo nombre, y sus árboles volvieron a crecer verdes y hermosos.
