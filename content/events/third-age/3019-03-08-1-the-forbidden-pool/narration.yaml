- id: wake
  en: Late in the night Faramir woke Frodo and led him to the edge of the falls. Below, in the moonlit pool, a dark thin shape was diving for fish.
  es: Ya entrada la noche, Faramir despertó a Frodo y lo llevó al borde de la cascada. Abajo, en el estanque iluminado por la luna, una figura oscura y flaca buceaba en busca de peces.
- id: law
  en: It was Gollum. By Gondor's law, anyone who found that hidden pool must die, and the archers had their bows ready. Frodo begged for Gollum's life.
  es: Era Gollum. Según la ley de Gondor, quien descubriera aquel estanque oculto debía morir, y los arqueros tenían los arcos preparados. Frodo suplicó por la vida de Gollum.
- id: coax
  en: Frodo went down alone and called softly to Sméagol. Gollum came to his master, trusting him, and the Rangers seized him from behind.
  es: Frodo bajó solo y llamó en voz baja a Sméagol. Gollum se acercó a su amo, confiando en él, y los Montaraces lo atraparon por detrás.
- id: betrayed
  en: Gollum hissed and wept that his master had tricked him. Frodo had saved his life, but he felt he had betrayed him, and the thought stayed with him.
  es: Gollum siseaba y lloraba que su amo lo había engañado. Frodo le había salvado la vida, pero sentía que lo había traicionado, y aquella idea no se le iba de la cabeza.
- id: warning
  en: Faramir let the three go free. When he heard their road led to Cirith Ungol, his face grew grave, and he warned Frodo that it was a place of dark name.
  es: Faramir dejó marchar a los tres. Cuando supo que su camino llevaba a Cirith Ungol, su rostro se ensombreció, y advirtió a Frodo de que era un lugar de nombre siniestro.
- id: farewell
  en: In the morning he gave them food and walking staves and sent them on their way. They parted as friends, not knowing if they would ever meet again.
  es: Por la mañana les dio comida y bastones de caminante y los despidió. Se separaron como amigos, sin saber si volverían a verse.
