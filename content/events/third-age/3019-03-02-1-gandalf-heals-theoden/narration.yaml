- id: hall
  en: Gandalf and his companions rode up to Meduseld, the Golden Hall of Edoras. At the doors they had to give up their weapons, but Gandalf kept his staff.
  es: Gandalf y sus compañeros subieron a caballo hasta Meduseld, el Palacio de Oro de Edoras. A las puertas tuvieron que entregar sus armas, pero Gandalf conservó su bastón.
- id: king
  en: Inside, King Théoden sat bent and grey on his throne. At his feet sat Gríma Wormtongue, who whispered Saruman's poison into his ears.
  es: Dentro, el rey Théoden estaba sentado en su trono, encorvado y canoso. A sus pies se sentaba Gríma Lengua de Serpiente, que le susurraba al oído el veneno de Saruman.
- id: thunder
  en: Gandalf raised his staff. Thunder rolled, the hall went dark, and a flash of lightning split the gloom. Wormtongue fell flat on his face.
  es: Gandalf alzó el bastón. Retumbó un trueno, el salón se oscureció y un relámpago rasgó la penumbra. Lengua de Serpiente cayó de bruces.
- id: light
  en: Gandalf asked the king to come out into the open air. Leaning on his niece Éowyn, Théoden stepped out onto the terrace, and the sun shone on his face for the first time in years.
  es: Gandalf pidió al rey que saliera al aire libre. Apoyándose en su sobrina Éowyn, Théoden salió a la terraza, y el sol le dio en la cara por primera vez en años.
- id: sword
  en: He stood straighter, and his eyes cleared. He asked for his sword, and when his hand closed on its hilt, the old king became a warrior again.
  es: Se irguió, y se le aclararon los ojos. Pidió su espada, y cuando su mano se cerró sobre la empuñadura, el viejo rey volvió a ser un guerrero.
- id: wormtongue
  en: "Gríma was given a choice: ride to war with the king, or go. He spat and fled to his true master in Isengard. Théoden left Éowyn to rule his people and rode to war."
  es: "A Gríma le dieron a elegir: cabalgar a la guerra con el rey o marcharse. Escupió y huyó a Isengard, junto a su verdadero amo. Théoden dejó a Éowyn al mando de su pueblo y partió a la guerra."
