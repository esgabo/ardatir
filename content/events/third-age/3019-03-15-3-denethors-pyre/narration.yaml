- id: madness
  en: Denethor had given up all hope. He ordered his servants to carry Faramir, still burning with fever, down to the tombs of the Steward's house, and to build a pyre.
  es: Denethor había perdido toda esperanza. Ordenó a sus criados llevar a Faramir, aún ardiendo de fiebre, a las tumbas de la casa de los Senescales, y levantar una pira.
- id: pippin
  en: Pippin was horrified. He begged Beregond to stop it, and ran down through the burning city to find Gandalf.
  es: Pippin se horrorizó. Rogó a Beregond que lo impidiera, y bajó corriendo por la ciudad en llamas en busca de Gandalf.
- id: door
  en: Beregond held the door of the tomb against Denethor's servants, sword in hand, to save his captain. Then Gandalf arrived, with Pippin behind him.
  es: Beregond defendió la puerta de la tumba contra los criados de Denethor, espada en mano, para salvar a su capitán. Entonces llegó Gandalf, con Pippin tras él.
- id: stone
  en: Denethor showed them what had broken him. He too had a seeing-stone, and through it Sauron had shown him only what would make him despair.
  es: Denethor les mostró lo que lo había quebrantado. Él también tenía una piedra vidente, y a través de ella Sauron solo le había mostrado lo que lo llevaría a la desesperación.
- id: saved
  en: Gandalf lifted Faramir from the pyre and carried him out. Denethor would not come. He broke his staff, lay down on the pyre with the stone, and set it alight.
  es: Gandalf levantó a Faramir de la pira y lo sacó de allí. Denethor no quiso salir. Rompió su vara, se tendió en la pira con la piedra y le prendió fuego.
- id: grief
  en: So the Steward of Gondor perished. Gandalf mourned for him, and for the help he had been unable to give on the battlefield while he was saving Faramir.
  es: Así pereció el Senescal de Gondor. Gandalf lo lloró, y también la ayuda que no había podido prestar en el campo de batalla mientras salvaba a Faramir.
