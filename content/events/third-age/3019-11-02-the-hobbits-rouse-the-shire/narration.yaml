- id: bywater
  en: The next day the four reached Bywater, close to Hobbiton. Ugly new buildings stood among the old houses, and rough Men lounged in the village street.
  es: Al día siguiente, los cuatro llegaron a Delagua, cerca de Hobbiton. Entre las casas viejas se alzaban edificios nuevos y feos, y unos Hombres toscos holgazaneaban en la calle de la aldea.
- id: enough
  en: "When the ruffians threatened them, Merry decided it was time to act. Frodo agreed, but made them promise one thing: no hobbit was to be killed, not even those who had taken the ruffians' side."
  es: "Cuando los rufianes los amenazaron, Merry decidió que había llegado el momento de actuar. Frodo estuvo de acuerdo, pero les hizo prometer una cosa: no había que matar a ningún hobbit, ni siquiera a los que se habían puesto del lado de los rufianes."
- id: horn
  en: Merry raised the silver horn that Éowyn had given him and blew. Its call rang out over the hills, wild and stirring, and hobbits everywhere jumped up from their chairs.
  es: Merry alzó el cuerno de plata que le había regalado Éowyn y sopló. Su llamada resonó por las colinas, salvaje y emocionante, y por todas partes los hobbits se levantaron de un salto de sus sillas.
- id: gather
  en: They came running from every side, with axes, hammers, knives and sticks. Farmer Cotton welcomed the travellers, and Pippin rode off to bring the Tooks from their country.
  es: Acudieron corriendo de todas partes, con hachas, martillos, cuchillos y palos. El Granjero Coto dio la bienvenida a los viajeros, y Pippin partió a caballo a buscar a los Tuk de su tierra.
- id: first
  en: That evening a band of ruffians marched into Bywater and found themselves surrounded by angry hobbits. Most of them gave up and were locked away. The Shire had risen.
  es: Aquella tarde, una banda de rufianes entró en Delagua y se encontró rodeada de hobbits furiosos. La mayoría se rindió y quedó encerrada. La Comarca se había alzado.
