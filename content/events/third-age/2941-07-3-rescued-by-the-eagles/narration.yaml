- id: reunion
  en: On the far side of the mountains, Bilbo found Gandalf and the dwarves arguing over whether to go back for him. Still invisible, he stepped right into their midst, and the dwarves looked at him with new respect.
  es: Al otro lado de las montañas, Bilbo encontró a Gandalf y a los enanos discutiendo si debían volver a buscarlo. Todavía invisible, se plantó en medio de ellos, y los enanos lo miraron con un nuevo respeto.
- id: wargs
  en: They hurried downhill until nightfall, and stumbled into a clearing where the wargs, the wild wolves, were gathering. With the howling all around them, they scrambled up into the trees.
  es: Bajaron a toda prisa hasta que anocheció, y fueron a dar a un claro donde se reunían los wargos, los lobos salvajes. Con los aullidos a su alrededor, treparon a los árboles.
- id: fire
  en: Gandalf hurled flaming pine cones down at the wolves. Then the goblins arrived, piled wood under the trees, and set them alight.
  es: Gandalf lanzó piñas en llamas contra los lobos. Entonces llegaron los trasgos, amontonaron leña bajo los árboles y les prendieron fuego.
- id: eagles
  en: From his eyrie, the Lord of the Eagles had seen the fires. The great eagles swept down out of the night and plucked them from the burning branches, with Bilbo clinging to Dori's legs.
  es: Desde su nido, el Señor de las Águilas había visto el fuego. Las grandes águilas descendieron en la noche y los arrancaron de las ramas en llamas, con Bilbo agarrado a las piernas de Dori.
- id: eyrie
  en: They spent the night on a high ledge of the eagles' eyrie, fed and safe. Gandalf had once healed the eagle lord of an arrow wound, and the eagles had not forgotten.
  es: Pasaron la noche en una alta cornisa del nido de las águilas, alimentados y a salvo. Gandalf había curado una vez al señor de las águilas de una herida de flecha, y las águilas no lo habían olvidado.
- id: carrock
  en: In the morning the eagles carried them far to the east and set them down on the Carrock, a great rock standing in the middle of the river.
  es: Por la mañana, las águilas los llevaron muy lejos hacia el este y los dejaron en la Carroca, una gran roca que se alza en medio del río.
