- id: council
  en: "The next morning the captains of the West met in council: Aragorn, Gandalf, Prince Imrahil, Éomer, now King of Rohan, and the sons of Elrond."
  es: "A la mañana siguiente, los capitanes del Oeste se reunieron en consejo: Aragorn, Gandalf, el príncipe Imrahil, Éomer, ahora rey de Rohan, y los hijos de Elrond."
- id: odds
  en: They had won a great battle, but Mordor's armies still far outnumbered them. If they waited behind the walls, they would be overwhelmed sooner or later.
  es: Habían ganado una gran batalla, pero los ejércitos de Mordor aún los superaban con mucho. Si esperaban tras las murallas, tarde o temprano serían arrollados.
- id: ring
  en: Gandalf reminded them that victory could not come by arms. Their only hope was the Ring-bearer, struggling somewhere in Mordor, if he still lived.
  es: Gandalf les recordó que la victoria no podía llegar por las armas. Su única esperanza era el Portador del Anillo, que luchaba en algún lugar de Mordor, si es que aún vivía.
- id: eye
  en: So they would draw the Eye of Sauron toward themselves. Aragorn had already shown himself in the seeing-stone; Sauron would think the new king had the Ring, and would look nowhere else.
  es: Así que atraerían hacia ellos el Ojo de Sauron. Aragorn ya se había mostrado en la piedra vidente; Sauron pensaría que el nuevo rey tenía el Anillo, y no miraría a ningún otro lado.
- id: march
  en: They would march on the Black Gate with all the men they could spare, as bait in a trap they could not hope to escape. Éomer said simply that he would go.
  es: Marcharían contra la Puerta Negra con todos los hombres de que pudieran disponer, como cebo en una trampa de la que no podían esperar escapar. Éomer dijo sencillamente que él iría.
