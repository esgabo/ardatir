- id: thorin
  en: Thorin had walked into the firelight of the Wood-elves' feast, and been taken. Now the elves came back for the rest, worn out from the spiders, and led them away.
  es: Thorin había entrado en la luz de las hogueras del banquete de los Elfos del Bosque, y lo habían apresado. Ahora los elfos volvieron por los demás, agotados tras la lucha con las arañas, y se los llevaron.
- id: gates
  en: Their path ended at a river and a pair of great doors in a hillside. Bilbo, invisible with his ring, slipped through just before the gates closed behind them.
  es: El camino terminaba junto a un río, ante unas grandes puertas en la ladera de una colina. Bilbo, invisible gracias al anillo, se coló justo antes de que las puertas se cerraran tras ellos.
- id: king
  en: Deep inside sat the Elvenking. He asked the dwarves why they had come into his forest. They would not tell him their errand.
  es: En lo más hondo estaba sentado el Rey Elfo. Preguntó a los enanos por qué habían entrado en su bosque. No quisieron contarle a qué habían venido.
- id: cells
  en: So he had each of them locked away, apart from the others, until they learned some manners and told the truth.
  es: Así que mandó encerrar a cada uno por separado, hasta que aprendieran modales y dijeran la verdad.
- id: wander
  en: For weeks Bilbo crept through the halls, lonely and afraid of being found, stealing food when he could and learning the palace's ways.
  es: Durante semanas, Bilbo recorrió las estancias a hurtadillas, solo y con miedo de que lo descubrieran, robando comida cuando podía y aprendiendo los caminos del palacio.
- id: hope
  en: At last he found the cell where Thorin was kept and whispered through the door. Thorin's heart rose, and he sent word to the others to keep silent and trust their burglar.
  es: Por fin encontró la celda donde estaba Thorin y le susurró a través de la puerta. Thorin recobró el ánimo, y mandó decir a los demás que guardaran silencio y confiaran en su saqueador.
