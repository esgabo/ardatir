- id: water
  en: "Gandalf and the Balrog fell for a long time, and plunged into deep water at the roots of the mountains. The water was icy, and the Balrog's fire went out."
  es: "Gandalf y el Balrog cayeron durante mucho tiempo, y se hundieron en aguas profundas en las raíces de las montañas. El agua estaba helada, y el fuego del Balrog se apagó."
- id: deep
  en: "They fought on far below, in tunnels older than the Dwarves, where strange things live that have no names."
  es: "Siguieron luchando muy abajo, en túneles más antiguos que los Enanos, donde viven extrañas criaturas que no tienen nombre."
- id: stair
  en: "At last the Balrog fled up the Endless Stair, which climbs from the deepest roots to the very summit. Gandalf followed it all the way up."
  es: "Por fin el Balrog huyó por la Escalera Interminable, que sube desde las raíces más hondas hasta la misma cumbre. Gandalf lo siguió hasta arriba."
- id: peak
  en: "On the peak of Zirakzigil, among snow and sunlight, they fought. Lightning and thunder broke around the summit, and people far away saw a storm upon the mountain."
  es: "En la cima del Zirakzigil, entre la nieve y el sol, lucharon. Los rayos y los truenos estallaban en torno a la cumbre, y gentes lejanas vieron una tormenta sobre la montaña."
- id: end
  en: "In the end the Balrog plunged from the summit to its ruin. Then, his strength spent, Gandalf died there on the peak."
  es: "Al final, el Balrog se precipitó desde la cumbre hacia su ruina. Entonces, agotadas sus fuerzas, Gandalf murió allí, en la cumbre."
