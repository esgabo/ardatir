- id: seat
  en: "Unseen, Frodo ran up to the ancient Seat of Seeing on Amon Hen. Visions of war filled his eyes from every side, and then he felt the Eye reaching out for him."
  es: "Invisible, Frodo subió corriendo al antiguo Sitial de la Vista, en Amon Hen. Visiones de guerra le llenaban los ojos por todas partes, y entonces sintió que el Ojo se tendía hacia él."
- id: choose
  en: "Something within him told him to take the Ring off, and he did. Then he knew what he must do: go on alone, before the Ring could turn any more of his friends."
  es: "Algo en su interior le dijo que se quitara el Anillo, y lo hizo. Entonces supo lo que debía hacer: seguir solo, antes de que el Anillo pudiera torcer a más de sus amigos."
- id: search
  en: "Down by the river, the Company scattered in alarm to search for him. Sam guessed at once what his master meant to do, and ran for the boats."
  es: "Junto al río, la Compañía se dispersó alarmada para buscarlo. Sam adivinó enseguida lo que su señor pensaba hacer, y corrió hacia las barcas."
- id: boat
  en: "Frodo, invisible again, was pushing a boat into the water when Sam came crashing down the bank and leapt in after him, though he could not swim."
  es: "Frodo, de nuevo invisible, estaba empujando una barca al agua cuando Sam bajó por la orilla a trompicones y se lanzó tras él, aunque no sabía nadar."
- id: together
  en: "Frodo hauled him out, dripping. Sam would not be left behind, and Frodo, secretly glad, gave in."
  es: "Frodo lo sacó del agua, chorreando. Sam no se iba a quedar atrás, y Frodo, contento en el fondo, cedió."
- id: east
  en: "The two hobbits paddled across to the eastern shore, toward Mordor, alone together."
  es: "Los dos hobbits remaron hasta la orilla oriental, rumbo a Mordor, solos y juntos."
