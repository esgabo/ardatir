- id: arrive
  en: "On the same day, Gandalf rode into Rivendell, worn from hard travel. Some of the Riders had chased him north over the wild hills, and his road had been long."
  es: "Ese mismo día, Gandalf llegó a Rivendel, agotado tras un viaje muy duro. Algunos Jinetes lo habían perseguido hacia el norte por las colinas salvajes, y su camino había sido largo."
- id: worry
  en: "He had not found Frodo. He did not know if the hobbit was still alive, or if the Ring had already been taken."
  es: "No había encontrado a Frodo. No sabía si el hobbit seguía con vida, o si ya se habían apoderado del Anillo."
- id: elrond
  en: "Elrond told him that Glorfindel and others were out searching the roads. There was nothing more to do but wait, and hope."
  es: "Elrond le dijo que Glorfindel y otros estaban recorriendo los caminos. No quedaba más que esperar, y tener esperanza."
- id: ready
  en: "But if the Riders came to the river, Elrond and Gandalf would be ready for them."
  es: "Pero si los Jinetes llegaban al río, Elrond y Gandalf estarían preparados."
