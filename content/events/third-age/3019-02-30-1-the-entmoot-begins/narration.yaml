- id: gather
  en: Treebeard carried the hobbits to Derndingle, a deep green hollow in the forest. One by one the Ents arrived, tall and strange, each as different from the next as one tree from another.
  es: Bárbol llevó a los hobbits a Derndingle, una honda hondonada verde en el bosque. Uno a uno fueron llegando los Ents, altos y extraños, tan distintos entre sí como un árbol de otro.
- id: talk
  en: The Entmoot began. The Ents spoke in their own slow tongue, and it took a very long time to say anything at all.
  es: Comenzó la Asamblea de los Ents. Hablaban en su propia lengua lenta, y les llevaba muchísimo tiempo decir cualquier cosa.
- id: quickbeam
  en: The hobbits were left in the care of Quickbeam, a young and hasty Ent, as Ents go. He had already made up his mind, because Orcs had cut down the rowan trees he loved.
  es: Los hobbits quedaron al cuidado de Ramaviva, un Ent joven y apresurado, para ser un Ent. Él ya se había decidido, porque los orcos habían talado los serbales que tanto quería.
- id: days
  en: For three days the Ents talked while the hobbits waited, ate, slept and wondered. Then, as the third day was ending, the talk stopped.
  es: Durante tres días los Ents hablaron mientras los hobbits esperaban, comían, dormían y se preguntaban qué pasaría. Entonces, al final del tercer día, cesó la conversación.
- id: roused
  en: A great shout rang out over the forest, and the Ents came striding up out of the hollow. They had decided. They would march on Isengard.
  es: Un gran grito resonó sobre el bosque, y los Ents salieron de la hondonada a grandes pasos. Lo habían decidido. Marcharían sobre Isengard.
