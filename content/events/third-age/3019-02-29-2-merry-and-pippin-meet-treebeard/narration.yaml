- id: forest
  en: Fangorn was old, stuffy and still, and its trees seemed to watch the two hobbits as they walked. They followed the stream uphill until they came out onto a ledge in the sunlight.
  es: Fangorn era viejo, sofocante y silencioso, y sus árboles parecían observar a los dos hobbits mientras caminaban. Siguieron el arroyo cuesta arriba hasta salir a una cornisa bañada por el sol.
- id: voice
  en: "Then a deep, slow voice spoke behind them. What they had taken for an old tree stump was looking down at them: a tall being, part man and part tree, with a long grey beard and deep, ancient eyes that glinted green."
  es: "Entonces una voz grave y lenta habló a su espalda. Lo que habían tomado por un viejo tocón los estaba mirando: un ser alto, mitad hombre y mitad árbol, con una larga barba gris y unos ojos hondos y antiquísimos que destellaban en verde."
- id: treebeard
  en: He was Treebeard, the eldest of the Ents, the shepherds of the trees. He did not like to be hasty, and he took a long while deciding whether the hobbits were friends or foes.
  es: Era Bárbol, el más antiguo de los Ents, los pastores de los árboles. No le gustaba apresurarse, y tardó mucho en decidir si los hobbits eran amigos o enemigos.
- id: home
  en: In the end he lifted them in his arms and strode off through the forest, covering great distances with each step, until they came at dusk to his home beneath the mountains.
  es: Al final los levantó en brazos y se adentró en el bosque a grandes zancadas, recorriendo mucho camino con cada paso, hasta que al anochecer llegaron a su morada bajo las montañas.
- id: draught
  en: There he gave them a drink that tasted like cool water and fresh air, and they felt the strength flow down to their toes. Then he listened to their story.
  es: Allí les dio una bebida que sabía a agua fresca y a aire limpio, y sintieron la fuerza correrles hasta los dedos de los pies. Luego escuchó su historia.
- id: saruman
  en: When they spoke of Saruman, Treebeard's eyes glowed. The wizard's Orcs were cutting down his trees and leaving them to rot. Something, he said slowly, would have to be done.
  es: Cuando hablaron de Saruman, los ojos de Bárbol relucieron. Los orcos del mago talaban sus árboles y los dejaban pudrirse. Algo, dijo despacio, habría que hacer.
