- id: dark
  en: Night had fallen when the four hobbits came to the Brandywine Bridge, the eastern edge of the Shire. Where the road had always been open, a great gate now blocked the way, spiked on top.
  es: Ya era de noche cuando los cuatro hobbits llegaron al Puente del Brandivino, el límite oriental de la Comarca. Donde el camino siempre había estado abierto, ahora una gran puerta con pinchos en lo alto cerraba el paso.
- id: rules
  en: A notice said that no one could pass between sunset and sunrise. Frightened hobbits with lanterns peered over the gate and told them to go away.
  es: Un aviso decía que nadie podía pasar entre la puesta y la salida del sol. Unos hobbits asustados con farolillos se asomaron por encima de la puerta y les dijeron que se marcharan.
- id: climb
  en: Merry and Pippin climbed over the gate, and the gatekeepers ran. Among them was Bill Ferny, the bad man from Bree, who fled into the night when Merry chased him.
  es: Merry y Pippin saltaron por encima de la puerta, y los guardianes huyeron. Entre ellos estaba Bill Helechal, el malvado de Bree, que escapó en la noche cuando Merry lo persiguió.
- id: news
  en: The gatekeepers told them the news. There was a Chief at Bag End now, with big Men to do his bidding, and they took whatever they liked and called it sharing.
  es: Los guardianes les contaron las noticias. Ahora había un Jefe en Bolsón Cerrado, con Hombres grandes a sus órdenes, y se llevaban lo que querían y lo llamaban repartir.
- id: night
  en: The travellers spent a cold night in the gatehouse with no fire, no beer and hardly any food. The Shire they had dreamed of all the way home had changed.
  es: Los viajeros pasaron una noche fría en la casa de guardia, sin fuego, sin cerveza y casi sin comida. La Comarca con la que habían soñado durante todo el camino de vuelta había cambiado.
