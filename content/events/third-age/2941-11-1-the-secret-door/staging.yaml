      - { t: 0.34, x: -3.5, z: -3.8, action: fight, thought: { en: "Open, curse you. Open.", es: "Ábrete, maldita. Ábrete." } }
      - { t: 0.54, x: -3.6, z: -2.5, action: hide, thought: { en: "Dead end. Was it all for nothing?", es: "Un callejón sin salida. ¿Todo para nada?" } }
      - { t: 0.66, x: -3.6, z: -2.5, action: hide }
      - { t: 0.74, x: 0.3, z: -3.6, action: run }
      - { t: 0.8, x: 0.3, z: -3.6, action: fight, thought: { en: "My father left me this key. Turn, I beg you.", es: "Mi padre me dejó esta llave. Gira, te lo ruego." } }
