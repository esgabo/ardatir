  - characterId: bilbo
    model: characters/bilbo/bilbo-travel.glb   # Dwalin's hood and cloak, from the road out of Hobbiton (ch. 2)
    keyframes:
      - { t: 0, x: 4.2, z: 3.2, action: walk, thought: { en: "Burned and bare. And somewhere in there, a dragon.", es: "Todo quemado y pelado. Y por ahí dentro, un dragón." } }
      - { t: 0.16, x: 0.4, z: -3.5, action: idle, thought: { en: "A grey stone against the wall. This must be the place.", es: "Una piedra gris junto a la pared. Este debe de ser el lugar." } }
      - { t: 0.34, x: 0.6, z: -3.3, action: hide, thought: { en: "Someone ought to keep watching the west.", es: "Alguien tiene que seguir mirando al oeste." } }
      - { t: 0.54, x: 0.6, z: -3.3, action: hide, thought: { en: "A thrush with a snail. Rather rude, tapping like that.", es: "Un zorzal con un caracol. Qué descaro, golpeando así." } }
      - { t: 0.7, x: 0.6, z: -3.3, action: talk, thought: { en: "A keyhole! Thorin, Thorin, the key!", es: "¡Una cerradura! ¡Thorin, Thorin, la llave!" } }
      - { t: 0.84, x: 2.8, z: -3.2, action: idle, thought: { en: "It is open. It is really open.", es: "Está abierta. Está de verdad abierta." } }
  - characterId: thorin
