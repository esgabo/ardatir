summary:
  en: "On the mountain's western side the company waits, hopeless, until at sunset a thrush knocks on a stone and the last light shows a keyhole. Thorin's key fits, and the door opens."
  es: "En la ladera occidental de la montaña la compañía espera sin esperanza, hasta que al atardecer un zorzal golpea una piedra y la última luz revela una cerradura. La llave de Thorin encaja, y la puerta se abre."
