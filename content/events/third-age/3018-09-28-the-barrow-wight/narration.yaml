- id: farewell
  en: "In bright morning the hobbits rode out, and Goldberry waved goodbye from a hilltop. They crossed the grassy Barrow-downs, ate their lunch and dozed in the sun."
  es: "Con la luz de la mañana los hobbits se pusieron en marcha, y Baya de Oro les dijo adiós desde lo alto de una colina. Atravesaron las verdes Quebradas de los Túmulos, almorzaron y se adormecieron al sol."
- id: fog
  en: "When they woke, cold fog had covered everything. Groping through the mist, Frodo lost the others, and in the dark a cold hand seized him."
  es: "Al despertar, una niebla fría lo cubría todo. Avanzando a tientas, Frodo perdió a los demás, y en la oscuridad una mano helada lo atrapó."
- id: barrow
  en: "He came to his senses inside a barrow. His friends lay beside him, pale and still, dressed in white and gold, and a long arm came groping toward them."
  es: "Volvió en sí dentro de un túmulo. Sus amigos yacían a su lado, pálidos e inmóviles, vestidos de blanco y oro, y un largo brazo se acercaba a tientas hacia ellos."
- id: courage
  en: "For a moment Frodo thought of using the Ring to escape alone. Instead he seized a sword lying near him and struck at the arm, and then he remembered Tom's rhyme and sang it."
  es: "Por un momento Frodo pensó en usar el Anillo para escapar solo. En lugar de eso, agarró una espada que había a su lado y golpeó el brazo, y luego recordó la canción de Tom y la cantó."
- id: sunrise
  en: "Tom came with the sunrise. He broke open the barrow, banished the wight for ever, and woke the others on the grass, as if from a bad dream."
  es: "Tom llegó con el amanecer. Abrió el túmulo, expulsó al tumulario para siempre y despertó a los demás sobre la hierba, como de un mal sueño."
