title: { en: "The Barrow-wight", es: "El tumulario" }
summary:
  en: "Waved off by Goldberry, the hobbits ride onto the Downs, doze in the afternoon sun and wake to fog. In the dark a wight takes them into a barrow. Frodo comes to himself in time to sing the rhyme Tom taught him, and at sunrise Tom breaks in, banishes the wight and wakes the others on the open grass."
  es: "Despedidos por Baya de Oro, los hobbits cabalgan por las Quebradas, se adormecen al sol de la tarde y despiertan entre la niebla. En la oscuridad un tumulario se los lleva a un túmulo. Frodo vuelve en sí a tiempo de cantar la canción que Tom le enseñó, y al amanecer Tom irrumpe, expulsa al tumulario y despierta a los demás sobre la hierba."
