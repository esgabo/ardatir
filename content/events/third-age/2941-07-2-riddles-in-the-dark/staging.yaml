      - { t: 0.28, x: -4, z: 3.5, action: talk, thought: { en: "Who walks into my dark? A tasty visitor.", es: "¿Quién entra en mi oscuridad? Una visita sabrosa." } }
      - { t: 0.43, x: -3, z: 2.5, action: talk, thought: { en: "If I win, we eat it. If it wins, a door.", es: "Si gano, nos lo comemos. Si gana, una puerta." } }
      - { t: 0.57, x: -3, z: 2.5, action: talk, thought: { en: "What does it have in its pocket? Not fair!", es: "¿Qué tiene en el bolsillo? ¡No vale!" } }
