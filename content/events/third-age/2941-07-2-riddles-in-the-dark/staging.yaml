      - { t: 0.07, x: 4.8, z: -4.2, action: walk, thought: { en: "This little ring is cold. I will keep it.", es: "Este anillito está frío. Me lo quedaré." } }
      - { t: 0.14, x: 3, z: -2, action: walk, thought: { en: "Water, as black as ink.", es: "Agua, negra como la tinta." } }
      - { t: 0.28, x: 0.5, z: 0.5, action: walk, thought: { en: "Someone is out there on the water, whispering.", es: "Hay alguien ahí en el agua, susurrando." } }
