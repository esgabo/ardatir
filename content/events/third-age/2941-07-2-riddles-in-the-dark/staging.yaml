      - { t: 0.57, x: -1.5, z: 1.5, action: talk, thought: { en: "What have I got in my pocket? Why, it is nothing!", es: "¿Qué llevo en el bolsillo? ¡Si no es nada!" } }
      - { t: 0.71, x: -0.5, z: -0.5, action: run, thought: { en: "It makes me vanish! Quick, away!", es: "¡Me hace desaparecer! ¡Rápido, fuera!" } }
