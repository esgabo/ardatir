- id: alone
  en: Bilbo came to his senses in total darkness, alone. Crawling along the tunnel floor, his hand closed on a small, cold ring, and without really knowing why, he slipped it into his pocket.
  es: Bilbo volvió en sí en la más completa oscuridad, solo. Arrastrándose por el suelo del túnel, su mano dio con un anillo pequeño y frío, y sin saber muy bien por qué, se lo guardó en el bolsillo.
- id: lake
  en: His little elvish blade glowed faintly, giving him courage. He walked on and down, until his feet met icy water. A black lake lay in the roots of the mountain.
  es: Su pequeña hoja élfica brillaba débilmente y le daba valor. Siguió caminando cuesta abajo, hasta que sus pies tocaron agua helada. Un lago negro se extendía en las raíces de la montaña.
- id: gollum
  en: Out on the lake, in a tiny boat, lived Gollum, a thin creature with huge pale eyes who caught blind fish and talked to himself. He was hungry, and curious about this stranger.
  es: En el lago, en una barquita, vivía Gollum, una criatura flaca de enormes ojos pálidos que pescaba peces ciegos y hablaba consigo mismo. Tenía hambre, y sentía curiosidad por aquel desconocido.
- id: game
  en: They agreed on a game of riddles. If Bilbo lost, Gollum would eat him. If Bilbo won, Gollum would show him the way out. Riddle followed riddle, each harder than the last.
  es: Acordaron un juego de acertijos. Si Bilbo perdía, Gollum se lo comería. Si Bilbo ganaba, Gollum le enseñaría la salida. Un acertijo seguía a otro, cada uno más difícil que el anterior.
- id: pocket
  en: At last, running out of ideas, Bilbo asked Gollum to guess what was in his pocket. It was hardly a fair riddle, but Gollum could not guess, and the game was lost.
  es: Al final, sin más ideas, Bilbo le pidió a Gollum que adivinara qué tenía en el bolsillo. No era un acertijo muy justo, pero Gollum no lo adivinó, y perdió el juego.
- id: ring
  en: Gollum went to fetch his precious ring, meaning to vanish and catch the hobbit unseen. It was gone. When Bilbo, fleeing, slipped the ring on his finger, he vanished instead.
  es: Gollum fue a buscar su anillo, su tesoro, con la idea de volverse invisible y atrapar al hobbit sin ser visto. Había desaparecido. Cuando Bilbo, al huir, se puso el anillo en el dedo, fue él quien desapareció.
- id: pity
  en: At the way out, Gollum crouched in the passage. Bilbo could have struck him down, but pity stopped his hand. He leapt over Gollum and escaped, with a wail of hatred echoing behind him.
  es: Junto a la salida, Gollum estaba agazapado en el pasadizo. Bilbo podría haberlo matado, pero la compasión le detuvo la mano. Saltó por encima de Gollum y escapó, mientras un grito de odio resonaba a sus espaldas.
