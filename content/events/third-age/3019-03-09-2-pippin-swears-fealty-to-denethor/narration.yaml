- id: horn
  en: The horn was Boromir's. It had been found in the river, and Denethor wanted to know how his son had died.
  es: El cuerno era de Boromir. Lo habían encontrado en el río, y Denethor quería saber cómo había muerto su hijo.
- id: tale
  en: "Pippin told him: Boromir had died defending him and Merry from the Orcs. Then, stung by the old man's cold, proud gaze, he offered his small sword to Gondor, to repay that debt."
  es: "Pippin se lo contó: Boromir había muerto defendiéndolos a él y a Merry de los orcos. Entonces, herido por la mirada fría y orgullosa del anciano, ofreció su pequeña espada a Gondor, para pagar aquella deuda."
- id: oath
  en: Denethor accepted. Pippin knelt, laid his hand on the hilt, and repeated the words of the oath after him. Now he was a soldier of the Tower.
  es: Denethor aceptó. Pippin se arrodilló, puso la mano en la empuñadura y repitió tras él las palabras del juramento. Ahora era un soldado de la Torre.
- id: questions
  en: Then the Steward questioned him for an hour about everything, while Gandalf watched in silence. Pippin felt as if he had been turned inside out.
  es: Después, el Senescal lo interrogó durante una hora sobre todo, mientras Gandalf observaba en silencio. Pippin se sintió como si le hubieran vuelto del revés.
- id: beregond
  en: Later a guard of the Citadel named Beregond befriended him. He shared his food, showed him the city from the walls, and they talked like old friends.
  es: Más tarde, un guardia de la Ciudadela llamado Beregond se hizo amigo suyo. Compartió con él su comida, le enseñó la ciudad desde las murallas y hablaron como viejos amigos.
- id: shadow
  en: But from the walls they could see the darkness gathering in the east, over Mordor. Once a terrible cry came from the sky, and both of them crouched in fear.
  es: Pero desde las murallas veían la oscuridad acumularse en el este, sobre Mordor. Una vez llegó del cielo un grito terrible, y los dos se agacharon de miedo.
