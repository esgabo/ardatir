- id: eve
  en: On the eve of Midsummer, riders were seen coming from the north. The sons of Elrond rode first, bringing word that a great company followed.
  es: En la víspera del solsticio de verano, se vio llegar a unos jinetes desde el norte. Los hijos de Elrond venían delante, anunciando que los seguía una gran comitiva.
- id: company
  en: Then came the Elves of Rivendell and of Lórien, with Galadriel and Celeborn, and last of all, Elrond himself, and beside him his daughter Arwen.
  es: Después llegaron los Elfos de Rivendel y de Lórien, con Galadriel y Celeborn, y por último el propio Elrond, y a su lado su hija Arwen.
- id: meeting
  en: Aragorn went out to meet them at the gate. After long years of waiting, he saw Arwen again, and she had come to stay.
  es: Aragorn salió a recibirlos a la puerta. Tras largos años de espera, volvió a ver a Arwen, y ella había venido para quedarse.
- id: hand
  en: Elrond handed Aragorn the ancient sceptre of the northern kings and gave him his daughter in betrothal. Side by side, Aragorn and Arwen climbed to the Citadel.
  es: Elrond entregó a Aragorn el antiguo cetro de los reyes del norte y le concedió la mano de su hija. Uno junto al otro, Aragorn y Arwen subieron a la Ciudadela.
