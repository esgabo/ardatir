- id: escort
  en: A great company rode north out of Gondor, escorting the body of King Théoden home to Rohan.
  es: Una gran comitiva cabalgó hacia el norte desde Gondor, escoltando el cuerpo del rey Théoden de vuelta a Rohan.
- id: mound
  en: At Edoras, Théoden was laid in a great mound beside the kings who had gone before him, with his arms and treasures about him.
  es: En Edoras, Théoden fue depositado en un gran túmulo junto a los reyes que lo habían precedido, rodeado de sus armas y sus tesoros.
- id: lament
  en: The Riders of his household rode slowly around the mound, singing a lament. Merry stood by the mound and wept for the king who had been so kind to him.
  es: Los Jinetes de su casa cabalgaron despacio alrededor del túmulo, cantando un lamento. Merry, de pie junto al túmulo, lloraba por el rey que tan amable había sido con él.
- id: feast
  en: Then there was a great feast in the Golden Hall. Éomer, now king, rose and drank in memory of Théoden, and all who were there honoured the fallen.
  es: Después hubo un gran banquete en el Castillo de Oro. Éomer, ya rey, se levantó y bebió en memoria de Théoden, y todos los presentes honraron a los caídos.
- id: betrothal
  en: Before the feast ended, Éomer announced that his sister Éowyn would marry Faramir of Gondor. There was much joy, for they had found love and healing together.
  es: Antes de que terminara el banquete, Éomer anunció que su hermana Éowyn se casaría con Faramir de Gondor. Hubo gran alegría, porque juntos habían encontrado el amor y la curación.
- id: horn
  en: "When the friends rode on, Éowyn gave Merry a gift to remember them by: a small, ancient horn of silver, that would one day be heard again."
  es: "Cuando los amigos siguieron su camino, Éowyn le dio a Merry un regalo para que los recordara: un cuerno pequeño y antiguo de plata, que algún día volvería a oírse."
