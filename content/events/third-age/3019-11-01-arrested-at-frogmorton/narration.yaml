- id: ride
  en: "The hobbits rode on into the Shire. Everywhere they saw signs of trouble: houses empty, trees cut down, and no smoke from the chimneys."
  es: "Los hobbits siguieron cabalgando por la Comarca. Por todas partes veían señales de problemas: casas vacías, árboles talados y ninguna chimenea humeando."
- id: shirriffs
  en: At Frogmorton they were stopped by a band of Shirriffs, the Shire's own officers, with feathers in their caps and looking very important and very uncomfortable.
  es: En Rancho del Sapo los detuvo un grupo de oficiales de la Comarca, con plumas en las gorras, con aire muy importante y muy incómodo a la vez.
- id: arrest
  en: The Shirriffs announced that the four were under arrest for breaking gates, tearing up rules, and offering food to the guards, among other crimes.
  es: Los oficiales anunciaron que los cuatro quedaban detenidos por romper puertas, arrancar reglamentos y ofrecer comida a los guardias, entre otros delitos.
- id: laugh
  en: The travellers burst out laughing. After all they had faced, it was hard to be frightened of hobbits with feathers in their caps.
  es: Los viajeros se echaron a reír. Después de todo lo que habían vivido, era difícil asustarse de unos hobbits con plumas en la gorra.
- id: night
  en: They spent the night in the cold, cheerless Shirriff-house. One of the Shirriffs was an old acquaintance of Sam's, and Sam told him plainly he ought to be ashamed of himself.
  es: Pasaron la noche en la fría y triste casa de los oficiales. Uno de ellos era un viejo conocido de Sam, y Sam le dijo sin rodeos que debería darle vergüenza.
