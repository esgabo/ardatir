- id: alone
  en: Pippin had gone off with Gandalf to Gondor, and Merry was left behind among the Riders of Rohan, feeling small and useless.
  es: Pippin se había ido con Gandalf a Gondor, y Merry se quedó entre los Jinetes de Rohan, sintiéndose pequeño e inútil.
- id: kindness
  en: But old King Théoden had been kind to him. He liked the hobbit's talk of the Shire and of herbs, and he promised that Merry would ride beside him.
  es: Pero el viejo rey Théoden había sido amable con él. Le gustaban las historias del hobbit sobre la Comarca y sobre las hierbas, y le prometió que Merry cabalgaría a su lado.
- id: sword
  en: Filled with love for the old man, Merry knelt and laid his small sword on the king's knees, offering him his service.
  es: Lleno de cariño por el anciano, Merry se arrodilló y puso su pequeña espada sobre las rodillas del rey, ofreciéndole sus servicios.
- id: esquire
  en: Théoden was moved. He gave the sword back to Merry and named him an esquire of Rohan, a member of the king's own household.
  es: Théoden se conmovió. Le devolvió la espada a Merry y lo nombró escudero de Rohan, miembro de la propia casa del rey.
- id: ride
  en: Proud as he had ever been, Merry rode out with the king that morning, on a sturdy little pony, toward the mountains and the muster of Rohan.
  es: Más orgulloso que nunca, Merry salió con el rey aquella mañana, montado en un poni pequeño y robusto, rumbo a las montañas y a la reunión de las fuerzas de Rohan.
