- id: south
  en: "For two weeks the Company walked south by night, with the Misty Mountains always on their left."
  es: "Durante dos semanas la Compañía caminó hacia el sur de noche, siempre con las Montañas Nubladas a su izquierda."
- id: hollin
  en: "They came to the empty heathlands of Hollin, where Elves had lived long ago. The air was clean, and Legolas said that the stones themselves still remembered them."
  es: "Llegaron a los páramos vacíos de Eregion, donde hacía mucho habían vivido los Elfos. El aire era limpio, y Legolas dijo que las propias piedras aún los recordaban."
- id: rest
  en: "For the first time in days they felt safe, and rested in the morning sunlight."
  es: "Por primera vez en días se sintieron a salvo, y descansaron a la luz del sol de la mañana."
- id: crows
  en: "Then a dark cloud of crows came wheeling low over the hills, black birds from Dunland, searching the land below."
  es: "Entonces una nube oscura de cuervos llegó volando bajo sobre las colinas, aves negras de las Tierras Brunas que escudriñaban el terreno."
- id: spies
  en: "The Company hid among the bushes until the birds had gone. They were spies, Aragorn feared, and the road south was being watched."
  es: "La Compañía se escondió entre los matorrales hasta que las aves se fueron. Eran espías, temía Aragorn, y el camino del sur estaba vigilado."
