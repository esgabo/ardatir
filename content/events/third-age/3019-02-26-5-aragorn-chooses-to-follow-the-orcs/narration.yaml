- id: boats
  en: Back at the shore, Aragorn counted the boats. One was missing, and so were Frodo's pack and Sam's. Frodo had gone east alone, and faithful Sam had gone after him.
  es: De vuelta en la orilla, Aragorn contó las barcas. Faltaba una, y también la mochila de Frodo y la de Sam. Frodo se había marchado solo hacia el este, y el fiel Sam había ido tras él.
- id: choice
  en: Aragorn stood a long time in thought. Should he follow the Ring-bearer, as he had promised, or go after Merry and Pippin, taken alive by the Orcs?
  es: Aragorn se quedó largo rato pensativo. ¿Debía seguir al Portador del Anillo, como había prometido, o ir tras Merry y Pippin, capturados vivos por los orcos?
- id: decision
  en: At last he chose. Frodo's road was now in his own hands. But Aragorn would not leave two friends to torment and death while he still had strength to run.
  es: Al fin, eligió. El camino de Frodo estaba ya en sus propias manos. Pero Aragorn no iba a abandonar a dos amigos al tormento y la muerte mientras le quedaran fuerzas para correr.
- id: light
  en: They left behind everything they could spare, keeping only their weapons, their cloaks and some waybread. Then the three of them set off on the trail of the Uruk-hai.
  es: Dejaron atrás todo lo que no necesitaban, y se quedaron solo con las armas, las capas y algo de pan del camino. Luego los tres partieron tras el rastro de los Uruk-hai.
- id: hunt
  en: The trail led west, over hills and down onto the grasslands of Rohan. Day and night they ran, the elf, the dwarf and the man, and the Orcs were always a little ahead.
  es: El rastro llevaba al oeste, por las colinas y bajando a las praderas de Rohan. Corrieron de día y de noche, el elfo, el enano y el hombre, y los orcos siempre iban un poco por delante.
