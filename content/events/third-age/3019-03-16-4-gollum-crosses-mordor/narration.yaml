- id: left
  en: "Gollum had lost everything in the pass. The Ring had walked away from him twice, the great spider was hurt, and he had been kicked down a slope by a gardener from the Shire."
  es: "Gollum lo había perdido todo en el paso. El Anillo se le había escapado dos veces, la gran araña estaba herida, y un jardinero de la Comarca lo había echado a patadas por una ladera."
- id: follow
  en: "So he did the only thing he knew how to do. He went after it."
  es: "Así que hizo lo único que sabía hacer. Fue tras él."
- id: land
  en: "Mordor is a long grey waste of ash and thorn and dust, with the mountain smoking in the middle of it. There is almost nothing in it to eat, and nowhere in it to hide except flat on the ground."
  es: "Mordor es un largo yermo gris de ceniza, espinos y polvo, con la montaña humeando en el centro. Casi no hay nada que comer, y no hay dónde esconderse si no es pegado al suelo."
- id: crawl
  en: "He travelled by night and lay still by day, and he kept far enough behind the two hobbits that even Sam, who was watching for him, only twice saw something crawling on the slope behind them."
  es: "Viajaba de noche y se quedaba inmóvil de día, y se mantenía tan atrás de los dos hobbits que incluso Sam, que lo buscaba con los ojos, solo dos veces vio algo arrastrarse por la ladera a sus espaldas."
- id: armies
  en: "Twice the whole land moved around him, when the armies of the Dark Tower marched north to the war. He let them pass over him and went on."
  es: "Dos veces toda la tierra se movió a su alrededor, cuando los ejércitos de la Torre Oscura marcharon al norte a la guerra. Dejó que pasaran por encima de él y siguió adelante."
- id: patience
  en: "Nine days he kept it up, starving, burning with thirst, saying nothing to anyone. He knew where they were going better than they did, and he knew that at the end of that road they would have to stop."
  es: "Nueve días aguantó así, hambriento, ardiendo de sed, sin decir nada a nadie. Sabía mejor que ellos adónde iban, y sabía que al final de ese camino tendrían que detenerse."
