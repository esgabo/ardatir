- id: watch
  en: "At Sarn Ford, where the road from the south crosses the Brandywine into the Shire, a few Rangers kept watch, as they had for years, unseen by the hobbits."
  es: "En el Vado de Sarn, donde el camino del sur cruza el Brandivino hacia la Comarca, unos pocos Montaraces vigilaban, como llevaban años haciendo, sin que los hobbits lo supieran."
- id: riders
  en: "That evening the Black Riders came. The Rangers stood against them, but they could not hold back the Nine, and were driven off."
  es: "Aquella tarde llegaron los Jinetes Negros. Los Montaraces les hicieron frente, pero no pudieron contener a los Nueve y fueron rechazados."
- id: shire
  en: "The Riders crossed into the peaceful Shire and spread out to search. They were looking for one name: Baggins."
  es: "Los Jinetes entraron en la tranquila Comarca y se dispersaron para buscar. Buscaban un único nombre: Bolsón."
- id: far
  en: "And Gandalf, who might have warned Frodo, was still far away in Rohan."
  es: "Y Gandalf, que podría haber avisado a Frodo, seguía muy lejos, en Rohan."
