- id: hooves
  en: Riding back toward Helm's Deep under the stars, the king's company heard hooves behind them, coming fast. The riders turned and drew their swords.
  es: Mientras volvía hacia el Abismo de Helm bajo las estrellas, la compañía del rey oyó cascos tras ella, acercándose deprisa. Los jinetes se volvieron y desenvainaron las espadas.
- id: halbarad
  en: But Aragorn knew the voice that called out of the dark. It was Halbarad, his kinsman, with thirty Rangers of the North, grey-cloaked and silent.
  es: Pero Aragorn reconoció la voz que llamaba desde la oscuridad. Era Halbarad, su pariente, con treinta Montaraces del Norte, de capa gris y silenciosos.
- id: sons
  en: With them rode Elladan and Elrohir, the sons of Elrond. They had come a long way, from the far North, because Aragorn's people had heard that he needed them.
  es: Con ellos cabalgaban Elladan y Elrohir, los hijos de Elrond. Habían recorrido un largo camino desde el lejano Norte, porque el pueblo de Aragorn había sabido que él los necesitaba.
- id: message
  en: They brought a message from their father. If Aragorn was in haste, Elrond said, he should remember the Paths of the Dead.
  es: Traían un mensaje de su padre. Si Aragorn tenía prisa, decía Elrond, debía recordar las Sendas de los Muertos.
- id: joy
  en: Aragorn was glad beyond words to see his own people again. Together they rode on to the Hornburg, and the Grey Company was complete.
  es: Aragorn se alegró más de lo que podía expresar al ver de nuevo a su propia gente. Juntos siguieron cabalgando hasta Cuernavilla, y la Compañía Gris estuvo completa.
