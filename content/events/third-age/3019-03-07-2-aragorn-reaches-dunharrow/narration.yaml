- id: choice
  en: Aragorn had looked into the seeing-stone of Orthanc and wrestled with Sauron himself. Now he knew he must take the shortest road south, under the mountains, where no living man dared to go.
  es: Aragorn había mirado en la piedra vidente de Orthanc y se había enfrentado al propio Sauron. Ahora sabía que debía tomar el camino más corto hacia el sur, bajo las montañas, por donde ningún hombre vivo se atrevía a ir.
- id: road
  en: The Grey Company rode hard all day. At nightfall they climbed the winding road to Dunharrow, past rows of ancient, weathered stone figures.
  es: La Compañía Gris cabalgó sin descanso todo el día. Al anochecer subieron por el camino serpenteante hasta el Sagrario, pasando junto a hileras de antiguas figuras de piedra gastadas por el tiempo.
- id: welcome
  en: Éowyn welcomed them in the camp of her people. But when she heard where Aragorn meant to go, she went pale.
  es: Éowyn les dio la bienvenida en el campamento de su pueblo. Pero cuando supo adónde pensaba ir Aragorn, palideció.
- id: plea
  en: She begged him not to go, and then to let her ride with him. She was weary of being left behind to wait while others won glory and died.
  es: Le rogó que no fuera, y luego que la dejara cabalgar con él. Estaba cansada de quedarse atrás esperando mientras otros ganaban gloria y morían.
- id: refusal
  en: Aragorn refused her gently. Her duty was to her people, and his road was not for her. He knew she loved him, and he could not give her the love she hoped for.
  es: Aragorn se negó con delicadeza. Su deber era con su pueblo, y aquel camino no era para ella. Él sabía que ella lo amaba, y no podía darle el amor que ella esperaba.
