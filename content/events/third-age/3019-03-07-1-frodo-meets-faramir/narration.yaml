- id: ithilien
  en: Ithilien was green and sweet with herbs and spring flowers, a fair country even under the shadow of Mordor. Sam stewed two rabbits that Gollum had caught, and was proud of it.
  es: Ithilien era verde y olía a hierbas y a flores de primavera, una tierra hermosa aun a la sombra de Mordor. Sam guisó dos conejos que Gollum había cazado, y se sentía muy orgulloso de ello.
- id: rangers
  en: "But the smoke of his fire was seen. Tall men in green and brown surrounded the hobbits: Rangers of Gondor, led by their captain, Faramir. Gollum had vanished."
  es: "Pero alguien vio el humo de su fuego. Unos hombres altos vestidos de verde y pardo rodearon a los hobbits: Montaraces de Gondor, al mando de su capitán, Faramir. Gollum había desaparecido."
- id: mumak
  en: The Rangers were there to ambush an army from the south. In the fighting a huge beast like a moving grey hill crashed past them. Sam had seen his oliphaunt, and it was bigger than he had ever imagined.
  es: Los Montaraces estaban allí para tender una emboscada a un ejército del sur. Durante la lucha, una enorme bestia, como una colina gris en movimiento, pasó con estrépito junto a ellos. Sam había visto su olifante, y era más grande de lo que jamás había imaginado.
- id: cave
  en: Blindfolded, the hobbits were led to Henneth Annûn, a hidden cave behind a waterfall. At sunset the setting sun shone through the falling water, and it glowed red and gold.
  es: Con los ojos vendados, llevaron a los hobbits a Henneth Annûn, una cueva oculta tras una cascada. Al ponerse el sol, la luz atravesó el agua que caía, y la cascada brilló roja y dorada.
- id: questions
  en: Faramir asked hard questions about Boromir and about Isildur's Bane. Frodo answered carefully, saying no more than he had to.
  es: Faramir hizo preguntas difíciles sobre Boromir y sobre el Daño de Isildur. Frodo respondió con cuidado, sin decir más de lo necesario.
- id: slip
  en: Then Sam let the secret slip. Now Faramir knew that the Ring was there before him. But he had no wish to touch such a thing, and instead he offered them his help.
  es: Entonces a Sam se le escapó el secreto. Ahora Faramir sabía que el Anillo estaba ante él. Pero no tenía ningún deseo de tocar algo así, y en lugar de eso les ofreció su ayuda.
