- id: hunger
  en: Day after day the path wound on through the dark. Their food ran low, then ran out. And then, among the trees, they saw the lights of a feast.
  es: Día tras día, el sendero serpenteaba en la oscuridad. La comida empezó a escasear, y luego se acabó. Y entonces, entre los árboles, vieron las luces de un banquete.
- id: lights
  en: Starving, they left the path and ran toward it. Each time they reached the firelight it went out, and in the last darkness they lost one another.
  es: Hambrientos, abandonaron el sendero y corrieron hacia allí. Cada vez que llegaban a la luz de las hogueras, esta se apagaba, y en la última oscuridad se perdieron unos a otros.
- id: web
  en: Bilbo woke with sticky threads wound around his legs, and a giant spider coming at him. He drew his little sword and, fighting alone in the dark, he killed it.
  es: Bilbo se despertó con hilos pegajosos enrollados en las piernas y una araña gigante acercándose. Desenvainó su pequeña espada y, luchando solo en la oscuridad, la mató.
- id: sting
  en: Something changed in him then. He felt fiercer and braver, and he gave his blade a name. From now on it would be Sting.
  es: Algo cambió en él entonces. Se sintió más fiero y valiente, y le dio un nombre a su espada. A partir de ese momento se llamaría Dardo.
- id: bundles
  en: Searching for his friends, he found them hanging from the branches, wrapped up tight in spider silk, while the spiders gathered below.
  es: Buscando a sus amigos, los encontró colgados de las ramas, bien envueltos en seda de araña, mientras las arañas se reunían debajo.
- id: rescue
  en: Wearing his ring, Bilbo threw stones and sang rude songs to lure the spiders away, then slipped back and cut the dwarves free. Together they fought their way out of the webs.
  es: Con el anillo puesto, Bilbo les arrojó piedras y les cantó canciones burlonas para alejarlas, y luego volvió a escondidas y liberó a los enanos. Juntos se abrieron paso entre las telarañas.
- id: thorin
  en: They were saved, and the dwarves looked at Bilbo with wonder. But one of them was missing. Thorin was nowhere to be found.
  es: Se habían salvado, y los enanos miraban a Bilbo con asombro. Pero faltaba uno de ellos. Thorin no aparecía por ninguna parte.
