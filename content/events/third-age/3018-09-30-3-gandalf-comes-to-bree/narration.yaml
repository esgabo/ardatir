- id: night
  en: "Late on the last day of September, Shadowfax carried Gandalf through the west gate of Bree. He had ridden for days and found bad news at every door."
  es: "Al caer el último día de septiembre, Sombragrís llevó a Gandalf por la puerta oeste de Bree. Había cabalgado durante días y había encontrado malas noticias en cada puerta."
- id: crickhollow
  en: "At Crickhollow, hours before, he had found the door broken open and the house empty, and nobody who could tell him whether Frodo had been taken or had got away."
  es: "En Cricava, horas antes, había encontrado la puerta forzada y la casa vacía, y a nadie que pudiera decirle si Frodo había sido capturado o había escapado."
- id: inn
  en: "The Prancing Pony was shut and frightened. The Riders had struck it before dawn that same morning, slashing the beds in the room the hobbits were supposed to be sleeping in."
  es: "El Pony Pisador estaba cerrado y asustado. Los Jinetes lo habían asaltado antes del alba de aquella misma mañana, acuchillando las camas del cuarto en el que los hobbits debían estar durmiendo."
- id: butterbur
  en: "Barliman Butterbur gave him the rest of it. The hobbits had left on foot that morning with a Ranger for a guide; and the letter Gandalf had entrusted to him three months before had never been sent."
  es: "Cebadilla Mantecona le contó el resto. Los hobbits se habían marchado a pie aquella mañana con un Montaraz como guía; y la carta que Gandalf le había confiado tres meses antes nunca se había enviado."
- id: strider
  en: "Gandalf was angry, and then suddenly glad. Of all the people in the wild who might have found Frodo first, the one called Strider was the one he would have chosen himself."
  es: "Gandalf se enfadó, y de pronto se alegró. De todos los que en las tierras salvajes podrían haber encontrado antes a Frodo, el llamado Trancos era justo el que él habría elegido."
- id: away
  en: "He slept a little and was gone in the morning, riding east on the Road: three days behind his friends, and faster than anything hunting them."
  es: "Durmió un poco y se fue por la mañana, cabalgando al este por el Camino: tres días por detrás de sus amigos, y más rápido que cualquier cosa que los persiguiera."
