- id: decoy
  en: "Strider kept the hobbits in a sitting room for the night, and laid bolsters in their beds to look like sleepers."
  es: "Trancos hizo pasar la noche a los hobbits en una salita, y puso almohadones en sus camas para que parecieran durmientes."
- id: night
  en: "In the darkest hour, the window of their bedroom was forced open. Shadows crept in, and the empty beds were slashed to pieces."
  es: "En la hora más oscura forzaron la ventana de su dormitorio. Unas sombras entraron sigilosas, y las camas vacías quedaron hechas trizas."
- id: stables
  en: "In the morning the inn was in an uproar. The stable doors stood open, and every pony was gone, Merry's along with the rest."
  es: "Por la mañana la posada era un alboroto. Las puertas del establo estaban abiertas y no quedaba ni un poney, tampoco los de Merry."
- id: bill
  en: "Butterbur was horrified and ashamed. The only animal to be had was a thin, sad pony, sold dear by Bill Ferny, a sly fellow of Bree. Sam took pity on the pony and grew fond of him at once."
  es: "Cebadilla estaba horrorizado y avergonzado. El único animal que pudieron conseguir fue un poney flaco y triste, que les vendió muy caro Bill Helechal, un tipo taimado de Bree. Sam se compadeció del poney y le tomó cariño enseguida."
