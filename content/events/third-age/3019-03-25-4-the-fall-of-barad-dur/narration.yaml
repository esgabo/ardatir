- id: aware
  en: In the Dark Tower, the moment Frodo claimed the Ring, Sauron knew. All at once he saw his mistake, and the peril he was in.
  es: En la Torre Oscura, en el instante en que Frodo reclamó el Anillo, Sauron lo supo. De golpe vio su error y el peligro en que se encontraba.
- id: nazgul
  en: His whole will turned toward the mountain. He called the Nazgûl, and they flew from the battle like a storm toward Mount Doom.
  es: Toda su voluntad se volvió hacia la montaña. Llamó a los Nazgûl, y estos dejaron la batalla y volaron como una tormenta hacia el Monte del Destino.
- id: unmade
  en: They were too late. The Ring fell into the fire where it was made, and all the power Sauron had poured into it was undone.
  es: Llegaron demasiado tarde. El Anillo cayó al fuego donde había sido forjado, y todo el poder que Sauron había vertido en él quedó deshecho.
- id: tower
  en: The Dark Tower trembled and fell, its walls and towers crumbling into ruin. The mountain burst into flame, and the Nazgûl, caught in the fire, burned away to nothing.
  es: La Torre Oscura tembló y cayó, y sus murallas y torres se desmoronaron en ruinas. La montaña estalló en llamas, y los Nazgûl, atrapados en el fuego, ardieron hasta no quedar nada.
- id: shadow
  en: Over the land a vast black shadow rose, huge and threatening, reaching out a hand toward the West. Then a great wind blew, and it was swept away and gone.
  es: Sobre la tierra se alzó una inmensa sombra negra, enorme y amenazadora, que tendía una mano hacia el Oeste. Entonces sopló un gran viento, y se la llevó para siempre.
