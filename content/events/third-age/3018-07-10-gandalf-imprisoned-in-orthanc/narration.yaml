- id: arrive
  en: "Gandalf rode to Isengard and found Saruman waiting for him in the tall black tower of Orthanc. But the White Wizard had changed: his robes now shimmered with many colours."
  es: "Gandalf cabalgó hasta Isengard y encontró a Saruman esperándolo en la alta torre negra de Orthanc. Pero el Mago Blanco había cambiado: ahora sus ropas relucían con muchos colores."
- id: offer
  en: "Saruman spoke of a new power rising in the world, and of how the Wise might rule beside it, or take the One Ring and rule themselves. He wanted Gandalf to tell him where it was."
  es: "Saruman habló de un nuevo poder que se alzaba en el mundo, y de cómo los Sabios podrían gobernar a su lado, o bien apoderarse del Anillo Único y gobernar ellos. Quería que Gandalf le dijera dónde estaba."
- id: refuse
  en: "Gandalf would have none of it. He had come looking for help, and found a traitor."
  es: "Gandalf no quiso saber nada de aquello. Había venido en busca de ayuda, y había encontrado a un traidor."
- id: pinnacle
  en: "So Saruman had him shut on the very top of Orthanc, high above the valley, with no way down."
  es: "Así que Saruman lo hizo encerrar en lo más alto de Orthanc, muy por encima del valle, sin forma de bajar."
- id: below
  en: "From there Gandalf watched the green valley of Isengard turned into pits and forges, with wolves and Orcs gathering in the smoke. Alone in the cold wind, he waited."
  es: "Desde allí Gandalf vio cómo el verde valle de Isengard se convertía en fosos y forjas, con lobos y Orcos reuniéndose entre el humo. Solo, en el viento frío, esperó."
