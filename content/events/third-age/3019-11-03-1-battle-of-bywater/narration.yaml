- id: tooks
  en: In the morning Pippin returned with a hundred Tooks. Then news came that a large band of ruffians was marching on Bywater, meaning to crush the rising.
  es: Por la mañana, Pippin regresó con cien Tuk. Entonces llegó la noticia de que una gran banda de rufianes marchaba sobre Delagua para aplastar la rebelión.
- id: trap
  en: Merry made a plan. The hobbits let the ruffians march along a lane between high banks, then blocked the road ahead and behind with farm carts. The ruffians were trapped.
  es: Merry trazó un plan. Los hobbits dejaron que los rufianes avanzaran por un sendero entre altos taludes, y luego cerraron el camino por delante y por detrás con carros de granja. Los rufianes quedaron atrapados.
- id: fight
  en: Some gave up at once. Others tried to break out, and there was a short, fierce fight on the slope. Merry slew their leader.
  es: Algunos se rindieron enseguida. Otros intentaron escapar, y hubo una lucha breve y feroz en la ladera. Merry dio muerte a su cabecilla.
- id: frodo
  en: Frodo was there, but he did not draw his sword. He spent the battle stopping angry hobbits from harming the ruffians who had thrown down their weapons.
  es: Frodo estaba allí, pero no desenvainó la espada. Pasó la batalla impidiendo que los hobbits furiosos hicieran daño a los rufianes que habían arrojado sus armas.
- id: cost
  en: Nineteen hobbits fell that day, and their names were long remembered. It was the last battle of the War of the Ring, and it was fought in the Shire.
  es: Diecinueve hobbits cayeron aquel día, y sus nombres se recordaron durante mucho tiempo. Fue la última batalla de la Guerra del Anillo, y se libró en la Comarca.
