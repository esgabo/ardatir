- id: hill
  en: Near midnight the Company reached the hill of Erech. On its top stood a great black stone, round and half-buried, brought from Númenor by Isildur long ago.
  es: Cerca de la medianoche, la Compañía llegó a la colina de Erech. En su cima había una gran piedra negra, redonda y medio enterrada, traída de Númenor por Isildur mucho tiempo atrás.
- id: horn
  en: Aragorn climbed to the stone and blew a silver horn. Out of the dark an answer came, like an echo from caves far away.
  es: Aragorn subió hasta la piedra e hizo sonar un cuerno de plata. Desde la oscuridad llegó una respuesta, como un eco de cuevas lejanas.
- id: summons
  en: "He called the oathbreakers by what they had sworn. Out of the night a voice answered: they had come to keep their oath, and to find peace."
  es: "Llamó a los perjuros por lo que habían jurado. Desde la noche respondió una voz: habían venido a cumplir su juramento y a encontrar la paz."
- id: banner
  en: Halbarad unfurled the great standard he had brought. It was black, and if any device was on it, the night hid it.
  es: Halbarad desplegó el gran estandarte que había traído. Era negro, y si tenía algún emblema, la noche lo ocultaba.
- id: promise
  en: Aragorn made them a promise. If they followed him and kept their oath, he would hold it fulfilled, and they could rest at last.
  es: Aragorn les hizo una promesa. Si lo seguían y cumplían su juramento, él lo daría por cumplido, y por fin podrían descansar.
