- id: camp
  en: That night the company camped beneath the hill of Dol Baran. Pippin could not sleep. He kept thinking of the dark crystal ball, which Gandalf had taken from him.
  es: Aquella noche la compañía acampó al pie de la colina de Dol Baran. Pippin no podía dormir. No dejaba de pensar en la esfera de cristal oscuro que Gandalf le había quitado.
- id: theft
  en: Gandalf lay asleep with the bundle in his arms. Quietly, Pippin slipped it away and left a rock in its place. Then he crept off and uncovered the stone.
  es: Gandalf dormía con el bulto entre los brazos. Sin hacer ruido, Pippin se lo quitó y dejó una piedra en su lugar. Luego se apartó a escondidas y destapó la esfera.
- id: eye
  en: Deep in the stone, a fire burned, and an Eye looked out at him. It was Sauron, and his will held Pippin fast, demanding answers.
  es: En el fondo de la esfera ardía un fuego, y un Ojo lo miraba. Era Sauron, y su voluntad tenía atrapado a Pippin, exigiéndole respuestas.
- id: cry
  en: Pippin screamed and fell. Gandalf rushed to him and covered the stone. It was a palantír, he said, a seeing-stone of old, and Sauron used one too.
  es: Pippin gritó y cayó al suelo. Gandalf corrió hacia él y cubrió la piedra. Era un palantir, dijo, una antigua piedra vidente, y Sauron también usaba una.
- id: luck
  en: By good fortune Pippin had told Sauron nothing that mattered, and Sauron now believed the hobbit was Saruman's prisoner. Gandalf gave the stone to Aragorn, its rightful keeper.
  es: Por suerte, Pippin no le había dicho a Sauron nada importante, y Sauron creía ahora que el hobbit era prisionero de Saruman. Gandalf le dio la piedra a Aragorn, su legítimo guardián.
- id: nazgul
  en: "Then a winged shadow passed over the moon: a Nazgûl, a black rider on a flying steed. Gandalf caught Pippin up onto Shadowfax and rode away into the night, toward Minas Tirith."
  es: "Entonces una sombra alada cruzó por delante de la luna: un Nazgûl, un jinete negro en una montura voladora. Gandalf subió a Pippin a lomos de Sombragris y se alejó al galope en la noche, rumbo a Minas Tirith."
