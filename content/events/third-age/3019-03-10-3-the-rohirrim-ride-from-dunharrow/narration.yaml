- id: dark
  en: That morning no dawn came. A great darkness had rolled out of Mordor and covered the sky, and the camp at Dunharrow woke to a brown gloom.
  es: Aquella mañana no amaneció. Una gran oscuridad había salido de Mordor y cubierto el cielo, y el campamento del Sagrario despertó en una penumbra parda.
- id: arrow
  en: A messenger from Gondor had brought a red arrow, the sign of Gondor's greatest need. Théoden would ride to its aid with all the strength of Rohan.
  es: Un mensajero de Gondor había traído una flecha roja, la señal de la mayor necesidad de Gondor. Théoden acudiría en su ayuda con toda la fuerza de Rohan.
- id: merry
  en: But the king told Merry he must stay behind. The way was long and the battle would be fierce, and there was no horse to carry a hobbit. Merry was heartbroken.
  es: Pero el rey le dijo a Merry que debía quedarse. El camino era largo y la batalla sería feroz, y no había caballo para llevar a un hobbit. Merry se quedó desolado.
- id: dernhelm
  en: As the riders formed up, a young rider, slight and silent, came to Merry and offered to carry him. He called himself Dernhelm, and his grey eyes looked like those of someone with no hope left.
  es: Mientras los jinetes formaban, un joven jinete, menudo y callado, se acercó a Merry y se ofreció a llevarlo. Se hacía llamar Dernhelm, y sus ojos grises parecían los de alguien que ya no tenía esperanza.
- id: host
  en: Six thousand riders set off down the valley, with banners and spears, and Merry rode hidden among them, behind Dernhelm, under a cloak.
  es: Seis mil jinetes partieron valle abajo, con estandartes y lanzas, y Merry cabalgaba escondido entre ellos, detrás de Dernhelm, bajo una capa.
