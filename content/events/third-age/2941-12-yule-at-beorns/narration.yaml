- id: road
  en: With two small chests of treasure and a heart full of memories, Bilbo set out for home with Gandalf, and Beorn rode along with them.
  es: Con dos pequeños cofres de tesoro y el corazón lleno de recuerdos, Bilbo emprendió el regreso a casa con Gandalf, y Beorn los acompañó.
- id: winter
  en: Winter was closing in, so they stopped at Beorn's house and stayed there, warm and well fed, while the snow fell outside.
  es: El invierno se echaba encima, así que se detuvieron en la casa de Beorn y se quedaron allí, abrigados y bien alimentados, mientras fuera caía la nieve.
- id: yule
  en: At Yule, Beorn held a great feast, and guests came from all the lands around to share it. The halls rang with talk and song.
  es: En Yule, Beorn celebró un gran banquete, y acudieron invitados de todas las tierras de alrededor. Las estancias resonaban con charlas y canciones.
- id: peace
  en: The goblins of the mountains were few and frightened now, and the lands were safer than they had been for many years.
  es: Los trasgos de las montañas eran ahora pocos y estaban asustados, y aquellas tierras eran más seguras de lo que habían sido en muchos años.
- id: chief
  en: In time Beorn became a great chief, ruling a wide land between the mountains and the forest. When spring came, Bilbo and Gandalf went on their way.
  es: Con el tiempo, Beorn llegó a ser un gran jefe, señor de una amplia tierra entre las montañas y el bosque. Cuando llegó la primavera, Bilbo y Gandalf siguieron su camino.
