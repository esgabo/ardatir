stage: diorama
duration: 26
set: kits/beorn/beorns-house.glb
# Midwinter: a grey afternoon on the road home, then the long night of the feast, and the
# morning in spring when the two of them ride west again.
light:
  - { t: 0, preset: day }
  - { t: 0.28, preset: evening }
  - { t: 0.42, preset: dusk }
  - { t: 0.62, preset: dusk }
  - { t: 0.76, preset: night }
  - { t: 0.84, preset: morning }
  - { t: 1, preset: morning }
# The hall opens for Yule and shuts again in the spring (DESIGN §9.4): the south wall first,
# because it is the one between the table and the eye, then the roof.
reveal:
  - { t: 0.3, cover: front, amount: 0 }
  - { t: 0.4, cover: front, amount: 1 }
  - { t: 0.33, cover: roof, amount: 0 }
  - { t: 0.44, cover: roof, amount: 1 }
  - { t: 0.86, cover: front, amount: 1 }
  - { t: 0.94, cover: front, amount: 0 }
  - { t: 0.88, cover: roof, amount: 1 }
  - { t: 0.96, cover: roof, amount: 0 }
# The shot (#28): the holding under winter, in at the gate as the three of them come up the lane,
# then the table for the feast, and out again to the court and the road west in the spring.
camera:
  - { t: 0, x: -1, z: 2.4, width: 12.6 }
  - { t: 0.2, x: -0.8, z: 1, width: 8.4 }
  - { t: 0.44, x: 1.3, z: -3.7, width: 7.6 }
  - { t: 0.62, x: 1.7, z: -3.7, width: 6.8 }
  - { t: 0.84, x: -0.4, z: -0.8, width: 8.2 }
  - { t: 1, x: -1.1, z: 2.4, width: 10.2 }
# What the scene does, at the beat it does it (DESIGN §9.5).
sound:
  # In out of the snow for Yule.
  - { t: 0.37, cue: door }
  # The long feast.
  - { t: 0.44, cue: pour }
  - { t: 0.47, cue: clatter }
  - { t: 0.55, cue: clatter, gain: 0.8 }
  # And out again in the spring.
  - { t: 0.9, cue: door }
narration:
  road: 0
  winter: 0.2
  yule: 0.4
  peace: 0.62
  chief: 0.8
beats:
  road: 0
  winter: 0.2
  yule: 0.4
  chief: 0.8
tracks:
  - characterId: bilbo
    model: characters/bilbo/bilbo-travel.glb   # Dwalin's hood and cloak, from the road out of Hobbiton (ch. 2)
    keyframes:
      - { t: 0, x: -1.9, z: 8.8, action: walk, thought: { en: "Two small chests and a head full of memories. Home, at last.", es: "Dos cofrecillos y la cabeza llena de recuerdos. A casa, por fin." } }
      - { t: 0.12, x: -1.75, z: 5.1, action: walk }
      - { t: 0.2, x: -0.9, z: 1.1, action: idle, thought: { en: "Snow is coming. A warm hall will suit me very well.", es: "Viene la nieve. Un salón caldeado me vendrá de maravilla." } }
      - { t: 0.34, x: -0.4, z: -2.2, action: walk }
      - { t: 0.4, x: 0.8, z: -3.3, action: talk, thought: { en: "Songs, bread and honey. This is better than any dragon.", es: "Canciones, pan y miel. Esto es mejor que cualquier dragón." } }
      - { t: 0.62, x: 0.8, z: -3.3, action: hide, thought: { en: "Warm and well fed, and nothing to fear.", es: "Caliente, bien comido y sin nada que temer." } }
      - { t: 0.8, x: 0.8, z: -3.3, action: idle, thought: { en: "Spring. Time to go.", es: "Primavera. Hora de marcharse." } }
      - { t: 0.86, x: -0.4, z: -2.2, action: walk }
      - { t: 0.92, x: -1.8, z: 0.3, action: walk }
      - { t: 1, x: -1.35, z: 8.2, action: walk }
  - characterId: gandalf
    keyframes:
      - { t: 0, x: -0.6, z: 9.2, action: walk }
      - { t: 0.12, x: -0.75, z: 5.3, action: walk }
      - { t: 0.2, x: 0.2, z: 1.3, action: idle }
      - { t: 0.34, x: 0.45, z: -2.2, action: walk }
      - { t: 0.4, x: 1.8, z: -3.3, action: talk, thought: { en: "Guests from every side of the mountains. What a Yule.", es: "Invitados de todas partes de las montañas. Vaya Yule." } }
      - { t: 0.62, x: 1.8, z: -3.3, action: idle, thought: { en: "The goblins are few and frightened now. The lands breathe easier.", es: "Los trasgos son pocos y viven asustados. Las tierras respiran mejor." } }
      - { t: 0.8, x: 1.8, z: -3.3, action: idle }
      - { t: 0.86, x: 0.45, z: -2.2, action: walk }
      - { t: 0.92, x: -0.7, z: 0.5, action: walk }
      - { t: 1, x: -1.35, z: 9.4, action: walk }
  - characterId: beorn
    keyframes:
      - { t: 0, x: -1.35, z: 9.8, action: walk, thought: { en: "I will ride with them as far as my own door.", es: "Los acompañaré hasta mi propia puerta." } }
      - { t: 0.14, x: -1.35, z: 5.9, action: walk }
      - { t: 0.2, x: -1.35, z: 3.4, action: idle, thought: { en: "Stay the winter. My house is wide.", es: "Quedaos el invierno. Mi casa es grande." } }
      - { t: 0.3, x: -0.3, z: -0.6, action: walk }
      - { t: 0.4, x: 0, z: -2.2, action: walk }
      - { t: 0.44, x: 2.8, z: -2.35, action: walk }
      - { t: 0.48, x: 3.25, z: -4.05, action: talk, thought: { en: "Eat, drink, sing. It is Yule!", es: "¡Comed, bebed, cantad! ¡Es Yule!" } }
      - { t: 0.62, x: 3.25, z: -4.05, action: idle, thought: { en: "No goblin dares come near my land now.", es: "Ningún trasgo se atreve ya a acercarse a mis tierras." } }
      - { t: 0.8, x: 3.25, z: -4.05, action: idle, thought: { en: "My lands run from the mountains to the forest.", es: "Mis tierras van desde las montañas hasta el bosque." } }
      - { t: 0.86, x: 3.3, z: -2.5, action: walk }
      - { t: 0.92, x: 0.6, z: -1.6, action: walk }
      - { t: 1, x: -0.3, z: 1.2, action: talk }
