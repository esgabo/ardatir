- id: arrive
  en: After long travels and many farewells, the four hobbits and Gandalf rode into the valley of Rivendell once more.
  es: Tras largos viajes y muchas despedidas, los cuatro hobbits y Gandalf entraron a caballo de nuevo en el valle de Rivendel.
- id: bilbo
  en: They found Bilbo sitting in his little room, very old now and very sleepy. He was delighted to see them, though he kept nodding off in the middle of a sentence.
  es: Encontraron a Bilbo sentado en su cuartito, ya muy anciano y con mucho sueño. Se alegró muchísimo de verlos, aunque no dejaba de dormirse a mitad de una frase.
- id: birthday
  en: The next day was his birthday. In one more year, he said proudly, he would be older than the Old Took.
  es: Al día siguiente era su cumpleaños. Dentro de un año más, dijo con orgullo, sería más viejo que el Viejo Tuk.
- id: ring
  en: Bilbo asked Frodo what had become of the ring he had found. Frodo said it was gone, and Bilbo was sorry he had missed seeing it, but he soon nodded off again.
  es: Bilbo preguntó a Frodo qué había sido del anillo que él había encontrado. Frodo le dijo que ya no existía, y a Bilbo le dio pena no haberlo visto, pero enseguida volvió a quedarse dormido.
- id: book
  en: He gave Frodo his books and papers, and his unfinished diary of the adventures. Frodo would have to finish the story.
  es: Le dio a Frodo sus libros y papeles, y su diario inacabado de las aventuras. Frodo tendría que terminar la historia.
- id: home
  en: For two weeks the friends rested in Rivendell. But now the hobbits' hearts were turning toward the Shire, and they made ready to go home.
  es: Durante dos semanas los amigos descansaron en Rivendel. Pero ahora el corazón de los hobbits se volvía hacia la Comarca, y se prepararon para volver a casa.
