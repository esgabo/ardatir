- id: bridge
  en: "Two days out, at the Last Bridge over the river Mitheithel, Glorfindel found servants of the Enemy holding the crossing."
  es: "A dos días de camino, en el Último Puente sobre el río Mitheithel, Glorfindel encontró a siervos del Enemigo custodiando el paso."
- id: charge
  en: "Shining with a light of his own, he rode straight at them. Three Riders could not stand against him, and fled away westward into the dark."
  es: "Resplandeciendo con luz propia, cabalgó derecho hacia ellos. Tres Jinetes no pudieron hacerle frente y huyeron hacia el oeste, en la oscuridad."
- id: token
  en: "Before he rode on, he left a sign for the travellers on the bridge: a pale green elf-stone, to tell them the way was safe."
  es: "Antes de seguir, dejó una señal para los viajeros en el puente: una piedra élfica de un verde pálido, para indicarles que el camino estaba despejado."
- id: search
  en: "Then he searched the road and the wild lands on either side, day after day, looking for any trace of the hobbits."
  es: "Después recorrió el camino y las tierras salvajes a ambos lados, día tras día, buscando cualquier rastro de los hobbits."
