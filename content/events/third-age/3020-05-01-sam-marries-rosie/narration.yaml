- id: mending
  en: All that winter the hobbits mended the Shire. They pulled down the ugly new buildings, rebuilt the old homes, and Sam went everywhere planting young trees.
  es: Durante todo aquel invierno, los hobbits repararon la Comarca. Derribaron los edificios nuevos y feos, reconstruyeron los viejos hogares, y Sam fue por todas partes plantando árboles jóvenes.
- id: gift
  en: In each place he put a grain of the earth from the little box Galadriel had given him. In the Party Field he planted the silver nut that was in it.
  es: En cada lugar ponía un grano de la tierra de la cajita que le había dado Galadriel. En el Campo de la Fiesta plantó la nuez de plata que había dentro.
- id: spring
  en: When spring came, the Shire bloomed as never before. Trees shot up as if in a hurry, and in the Party Field a young tree with silver bark and golden flowers began to grow.
  es: Cuando llegó la primavera, la Comarca floreció como nunca. Los árboles crecían a toda prisa, y en el Campo de la Fiesta empezó a crecer un arbolillo de corteza plateada y flores doradas.
- id: rosie
  en: "On the first of May, Sam married Rosie Cotton. He had been torn between her and his master, but Frodo told him not to wait: his place was with Rosie now."
  es: "El primero de mayo, Sam se casó con Rosita Coto. Había estado dividido entre ella y su amo, pero Frodo le dijo que no esperara más: ahora su sitio estaba junto a Rosita."
- id: bagend
  en: Sam and Rosie came to live at Bag End with Frodo. It was a golden year in the Shire, full of sunshine, fruit and children.
  es: Sam y Rosita se fueron a vivir a Bolsón Cerrado con Frodo. Fue un año dorado en la Comarca, lleno de sol, de fruta y de niños.
- id: frodo
  en: Only Frodo was quiet, and on certain days of the year, when his old wounds remembered, he was ill.
  es: Solo Frodo estaba callado, y en ciertos días del año, cuando sus viejas heridas lo recordaban, enfermaba.
