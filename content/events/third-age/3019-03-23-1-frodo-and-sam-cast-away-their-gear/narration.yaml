- id: weight
  en: The mountain was still far away, and every step was a struggle. Frodo said they must carry no more than they had to.
  es: La montaña aún estaba lejos, y cada paso era una lucha. Frodo dijo que no debían llevar más de lo imprescindible.
- id: orc
  en: They threw away the Orc armour and helmets and weapons. They would not need to pass for Orcs any more.
  es: Arrojaron la armadura, los yelmos y las armas de orco. Ya no necesitarían hacerse pasar por orcos.
- id: pans
  en: Then Sam took out his cooking gear, which he had carried all the way from the Shire. He looked at the pans for a long moment, and threw them into a dark crack in the ground. It felt like throwing away his home.
  es: Entonces Sam sacó sus cacharros de cocina, que había llevado desde la Comarca. Miró las cazuelas un largo instante y las arrojó a una grieta oscura del suelo. Fue como tirar su propio hogar.
- id: kept
  en: "He kept only what they truly needed: a little water, the last of the waybread, the Elven rope, and his grey Elven cloak."
  es: "Se quedó solo con lo verdaderamente necesario: un poco de agua, lo que quedaba del pan del camino, la cuerda élfica y su capa gris élfica."
- id: on
  en: Lighter now, they stumbled on toward the mountain, Sam helping his master over the stones.
  es: Más ligeros, siguieron avanzando a trompicones hacia la montaña, con Sam ayudando a su amo a pasar por las piedras.
