- id: ponies
  en: "Tom called, and the runaway ponies came trotting back, along with his own stout pony."
  es: "Tom llamó, y los poneys huidos volvieron al trote, junto con su propio y robusto poney."
- id: blades
  en: "From the barrow's treasure he chose a long dagger for each hobbit. They had been made long ago by Men of Westernesse, enemies of the dark kingdom of Angmar."
  es: "Del tesoro del túmulo escogió una daga larga para cada hobbit. Las habían forjado hacía mucho los Hombres de Oesternesse, enemigos del oscuro reino de Angmar."
- id: north
  en: "Then he led them north across the downs. As the sun sank, they came down to the East Road at last."
  es: "Luego los guio hacia el norte por las quebradas. Cuando el sol se ponía, llegaron por fin al Camino del Este."
- id: bree
  en: "Tom told them of the village of Bree and its old inn, The Prancing Pony, kept by Barliman Butterbur, a good man to stay with."
  es: "Tom les habló del pueblo de Bree y de su vieja posada, El Poney Pisador, que regentaba Cebadilla Mantecona, un buen hombre en cuya casa alojarse."
- id: home
  en: "Then he wished them well and rode back the way they had come. Beyond here was not his country."
  es: "Luego les deseó suerte y volvió por donde habían venido. Más allá no estaba su tierra."
