- id: meanwhile
  en: While the dwarves travelled east toward the Mountain, far to the south the White Council gathered, the wisest of the elves and wizards.
  es: Mientras los enanos viajaban hacia el este, rumbo a la Montaña, lejos en el sur se reunía el Concilio Blanco, los más sabios entre los elfos y los magos.
- id: urging
  en: For years Gandalf had urged them to strike at Dol Guldur. And for years Saruman, the head of the Council, had talked them out of it.
  es: Durante años, Gandalf les había instado a atacar Dol Guldur. Y durante años, Saruman, el jefe del Concilio, los había disuadido.
- id: saruman
  en: Now, at last, Saruman agreed. He had learned that Sauron's servants were searching the Gladden Fields for the lost Ring, and secretly, he hoped to find it first himself.
  es: Ahora, por fin, Saruman estuvo de acuerdo. Había descubierto que los siervos de Sauron buscaban el Anillo perdido en los Campos Gladios y, en secreto, esperaba encontrarlo él primero.
- id: attack
  en: The Wise came against the dark fortress with all their power, and the shadow over southern Mirkwood was lifted.
  es: Los Sabios marcharon contra la fortaleza oscura con todo su poder, y la sombra que cubría el sur del Bosque Negro se disipó.
- id: flight
  en: But Sauron had seen them coming. He let Dol Guldur go and slipped away into the east, to his old land of Mordor, where he would rise again.
  es: Pero Sauron los había visto venir. Abandonó Dol Guldur y se escabulló hacia el este, a su antigua tierra de Mordor, donde volvería a alzarse.
