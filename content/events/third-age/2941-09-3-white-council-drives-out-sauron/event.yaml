summary:
  en: "While the dwarves journey east, the White Council at last moves against Dol Guldur. Sauron, having prepared, abandons it and flees, to rise again in Mordor."
  es: "Mientras los enanos viajan hacia el este, el Concilio Blanco actúa por fin contra Dol Guldur. Sauron, que ya lo tenía previsto, la abandona y huye, para resurgir en Mordor."
