- id: stairs
  en: High on the stairs, as the hobbits slept, Gollum crept back and gently touched Frodo's knee, looking almost like a weary old hobbit. Then Sam woke and spoke sharply, and the moment passed for ever.
  es: En lo alto de las escaleras, mientras los hobbits dormían, Gollum volvió a rastras y tocó con suavidad la rodilla de Frodo, casi como un viejo hobbit cansado. Entonces Sam se despertó y le habló con dureza, y aquel momento pasó para siempre.
- id: tunnel
  en: Gollum led them into a tunnel that smelled foul beyond words. The dark there was thick and heavy, and soon they realised that Gollum had gone.
  es: Gollum los llevó a un túnel que olía peor de lo que se pueda describir. La oscuridad allí era densa y pesada, y pronto se dieron cuenta de que Gollum se había ido.
- id: eyes
  en: Something was coming. Frodo raised the Phial, and its light blazed out like a star. Before them glittered a cluster of huge eyes, and they drew back from the light.
  es: Algo se acercaba. Frodo alzó el Frasco, y su luz resplandeció como una estrella. Ante ellos relucía un racimo de ojos enormes, que retrocedieron ante la luz.
- id: web
  en: A great web blocked the way out. Frodo cut through it with Sting and ran ahead toward the open air, while Sam followed behind.
  es: Una gran telaraña bloqueaba la salida. Frodo la cortó con Dardo y corrió hacia el aire libre, mientras Sam lo seguía.
- id: sting
  en: Then Gollum sprang on Sam from behind. By the time Sam broke free, Shelob, the great spider, had caught up with Frodo and stung him. He lay still.
  es: Entonces Gollum saltó sobre Sam por detrás. Cuando Sam logró soltarse, Ella-Laraña, la gran araña, había alcanzado a Frodo y le había clavado el aguijón. Frodo yacía inmóvil.
- id: courage
  en: Sam charged with Sting and wounded her, and she threw her whole bulk on top of him onto his raised blade. He held up the Phial, and its light drove her back into the dark.
  es: Sam cargó con Dardo y la hirió, y ella se arrojó con todo su peso sobre él, contra la hoja que él sostenía en alto. Sam alzó el Frasco, y su luz la hizo retroceder a la oscuridad.
