- id: ride
  en: Out of the mountains Aragorn rode south and east with the Grey Company, and behind them came the Shadow Host. No living thing could stand before them.
  es: Al salir de las montañas, Aragorn cabalgó hacia el sur y el este con la Compañía Gris, y tras ellos iba la Hueste de las Sombras. Ningún ser vivo podía hacerles frente.
- id: fleet
  en: At Pelargir, on the Great River, lay the fleet of the Corsairs of Umbar, fifty great ships and many smaller ones, ready to sail upriver against Minas Tirith.
  es: En Pelargir, sobre el Río Grande, estaba la flota de los Corsarios de Umbar, cincuenta grandes naves y muchas más pequeñas, dispuestas a remontar el río contra Minas Tirith.
- id: dead
  en: Aragorn gave a great cry, and the Dead swept forward like a grey tide onto the ships. The Corsairs were mad with fear. They leapt into the river and fled.
  es: Aragorn lanzó un gran grito, y los Muertos avanzaron como una marea gris sobre las naves. Los Corsarios enloquecieron de miedo. Se arrojaron al río y huyeron.
- id: freed
  en: On every ship, slaves were chained to the oars. Aragorn set them free, and the fleet was his.
  es: En cada nave había esclavos encadenados a los remos. Aragorn los liberó, y la flota fue suya.
- id: release
  en: Then he spoke to the King of the Dead. The oath was fulfilled, and they were free to rest. The Shadow Host vanished like mist on the wind.
  es: Entonces habló al Rey de los Muertos. El juramento estaba cumplido, y eran libres para descansar. La Hueste de las Sombras se desvaneció como niebla en el viento.
- id: gulls
  en: Legolas heard the cry of gulls over the river for the first time, and a longing for the Sea awoke in his heart that would never leave him.
  es: Legolas oyó por primera vez el grito de las gaviotas sobre el río, y en su corazón despertó un anhelo del Mar que ya nunca lo abandonaría.
- id: sail
  en: Aragorn filled the ships with the men of southern Gondor and turned them north, upriver, toward the besieged city.
  es: Aragorn llenó las naves con los hombres del sur de Gondor y las dirigió al norte, río arriba, hacia la ciudad sitiada.
