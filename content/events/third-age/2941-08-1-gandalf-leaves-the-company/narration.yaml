- id: edge
  en: After days of riding across the open lands, the company reached the edge of Mirkwood. A narrow path ran in under the trees and vanished into green-black gloom.
  es: Tras días cabalgando por tierras abiertas, la compañía llegó al linde del Bosque Negro. Un sendero estrecho se metía bajo los árboles y desaparecía en una penumbra verdinegra.
- id: ponies
  en: As they had promised Beorn, they unloaded the ponies and sent them home. Something large seemed to be watching from the shadows, making sure they kept their word.
  es: Tal como habían prometido a Beorn, descargaron los poneys y los mandaron de vuelta. Algo grande parecía vigilar desde las sombras, para asegurarse de que cumplían su palabra.
- id: leaving
  en: Then came the news they had dreaded. Gandalf was leaving them. He had urgent business far away to the south, and could go no further with them.
  es: Entonces llegó la noticia que temían. Gandalf se marchaba. Tenía un asunto urgente lejos, en el sur, y no podía acompañarlos más.
- id: warning
  en: His last advice was simple. Stay on the path, whatever you see or hear. If you leave it, you may never find it again.
  es: Su último consejo fue sencillo. No os apartéis del sendero, veáis lo que veáis y oigáis lo que oigáis. Si lo abandonáis, puede que nunca volváis a encontrarlo.
- id: into
  en: The wizard turned his horse and rode away. With heavy packs and heavier hearts, the hobbit and the dwarves stepped into the gloom of the forest.
  es: El mago dio la vuelta a su caballo y se alejó. Con las mochilas pesadas y el corazón aún más, el hobbit y los enanos se adentraron en la penumbra del bosque.
