- id: dawn
  en: At sunrise Shadowfax brought them to a long wall around green fields, and beyond it rose a mountain, and against the mountain, the city of Minas Tirith.
  es: Al salir el sol, Sombragris los llevó hasta una larga muralla que rodeaba campos verdes, y más allá se alzaba una montaña, y contra la montaña, la ciudad de Minas Tirith.
- id: city
  en: The city climbed the mountainside in seven white walls, one above the other. At the very top a slender white tower shone in the morning sun.
  es: La ciudad trepaba por la ladera en siete murallas blancas, una sobre otra. En lo más alto, una esbelta torre blanca resplandecía al sol de la mañana.
- id: climb
  en: They rode in through the great gate and up the winding streets, past houses of stone, to the Citadel at the top. Pippin had never seen anything so tall, or so proud.
  es: Entraron por la gran puerta y subieron por las calles sinuosas, entre casas de piedra, hasta la Ciudadela en lo alto. Pippin nunca había visto nada tan alto ni tan orgulloso.
- id: tree
  en: In a quiet court, beside a fountain, stood a dead white tree, its bare branches dripping. Silent guards in black and silver watched over it.
  es: En un patio silencioso, junto a una fuente, había un árbol blanco muerto, de ramas desnudas que goteaban. Unos guardias silenciosos vestidos de negro y plata lo custodiaban.
- id: steward
  en: In the great hall, below an empty throne, sat Denethor, Steward of Gondor, an old man proud and grim. In his lap lay a great horn, broken in two.
  es: En el gran salón, bajo un trono vacío, estaba sentado Denethor, Senescal de Gondor, un anciano orgulloso y severo. En su regazo descansaba un gran cuerno, partido en dos.
