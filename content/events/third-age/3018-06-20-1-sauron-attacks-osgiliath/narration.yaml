- id: strike
  en: "Far to the south, in Gondor, Sauron struck his first open blow. Out of Mordor a great host came against Osgiliath, the ruined old city on both banks of the Great River."
  es: "Lejos, en el sur, en Gondor, Sauron asestó su primer golpe abierto. De Mordor salió una gran hueste contra Osgiliath, la vieja ciudad en ruinas a ambas orillas del Río Grande."
- id: terror
  en: "With the army came a terror the soldiers had never felt before, a shadow like a dark horseman, and many fled before it."
  es: "Con el ejército llegó un terror que los soldados nunca habían sentido, una sombra como de jinete oscuro, y muchos huyeron ante ella."
- id: bridge
  en: "Boromir and his brother Faramir held the last bridge with their company, fighting until it was cast down behind them."
  es: "Boromir y su hermano Faramir defendieron el último puente con su compañía, luchando hasta que se derrumbó a sus espaldas."
- id: swim
  en: "Only four men swam back across the river to the western shore, and the two brothers were among them."
  es: "Solo cuatro hombres volvieron a nado hasta la orilla occidental, y los dos hermanos estaban entre ellos."
- id: after
  en: "Gondor still held the west bank, but Boromir knew the Enemy's strength was growing, and that worse was coming."
  es: "Gondor aún conservaba la orilla oeste, pero Boromir sabía que la fuerza del Enemigo crecía y que lo peor estaba por llegar."
