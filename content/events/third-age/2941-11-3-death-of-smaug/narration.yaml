- id: flight
  en: Sure that the people of the lake had helped the thief, Smaug left the Mountain in the night and flew south, burning with anger.
  es: Convencido de que la gente del lago había ayudado al ladrón, Smaug dejó la Montaña en plena noche y voló hacia el sur, ardiendo de ira.
- id: warning
  en: In Lake-town, people saw a golden glow in the north and thought the old songs were coming true. But Bard the bowman knew a dragon when he saw one. He called them to arms, and they cut the bridge.
  es: En la Ciudad del Lago, la gente vio un resplandor dorado en el norte y creyó que las viejas canciones se hacían realidad. Pero Bardo el arquero supo reconocer a un dragón. Los llamó a las armas, y cortaron el puente.
- id: fire
  en: Smaug swooped over the town, and roofs burst into flame wherever he passed. Arrows bounced off his armour. The Master slipped away in a boat, and many fled into the water.
  es: Smaug se lanzó sobre la ciudad, y los tejados estallaban en llamas allí donde pasaba. Las flechas rebotaban en su coraza. El Gobernador huyó en una barca, y muchos se arrojaron al agua.
- id: bard
  en: Bard stood with the last few archers, and one arrow left. An old thrush landed on his shoulder, and Bard, who understood its speech, heard what it had overheard on the Mountain.
  es: Bardo resistía con los últimos arqueros, y le quedaba una sola flecha. Un viejo zorzal se posó en su hombro, y Bardo, que entendía su lengua, escuchó lo que había oído en la Montaña.
- id: arrow
  en: It was a black arrow that had come down to him from his fathers. As the dragon wheeled low over the town, Bard drew and loosed it, straight at the bare patch on the left of the dragon's chest.
  es: Era una flecha negra que le habían legado sus antepasados. Cuando el dragón giró a baja altura sobre la ciudad, Bardo tensó el arco y la disparó, directa al hueco desnudo en el lado izquierdo del pecho del dragón.
- id: fall
  en: Smaug gave a scream that shook the land, and crashed down onto the burning town, and into the lake. A great cloud of steam rose into the dark. The dragon was dead.
  es: Smaug lanzó un alarido que estremeció la tierra y se desplomó sobre la ciudad en llamas, hasta caer en el lago. Una gran nube de vapor se elevó en la oscuridad. El dragón había muerto.
