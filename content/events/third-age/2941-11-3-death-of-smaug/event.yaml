summary:
  en: "Enraged, Smaug flies south and sets Lake-town ablaze. Bard, told by an old thrush where the dragon's armour is bare, looses his last arrow, and Smaug falls burning into the lake."
  es: "Enfurecido, Smaug vuela al sur e incendia la Ciudad del Lago. Bardo, a quien un viejo zorzal ha revelado dónde la coraza del dragón está desnuda, dispara su última flecha, y Smaug cae ardiendo en el lago."
