- id: west
  en: Leaving Rivendell, Bilbo and Gandalf rode west along the road, through country that had been wet and wild a year before.
  es: Al dejar Rivendel, Bilbo y Gandalf cabalgaron hacia el oeste por el camino, a través de unas tierras que un año antes habían estado empapadas y salvajes.
- id: trolls
  en: They came to the place where the trolls had caught them. The three still stood there, turned to stone, and one had a bird's nest tucked behind his ear.
  es: Llegaron al lugar donde los trolls los habían atrapado. Los tres seguían allí, convertidos en piedra, y uno tenía un nido de pájaro detrás de la oreja.
- id: dig
  en: Nearby, the company had buried the gold from the trolls' cave, on their way out. Now the two travellers dug it up again, still safe in its hiding place.
  es: Cerca de allí, la compañía había enterrado el oro de la cueva de los trolls cuando iba de camino. Ahora los dos viajeros volvieron a desenterrarlo, todavía a salvo en su escondite.
- id: share
  en: Bilbo wanted Gandalf to keep it all. The wizard would only take half, and told Bilbo that a hobbit coming home might be glad of some gold.
  es: Bilbo quería que Gandalf se lo quedara todo. El mago solo aceptó la mitad, y le dijo a Bilbo que a un hobbit que vuelve a casa quizá le venga bien algo de oro.
- id: on
  en: They loaded the gold onto the ponies and rode on, toward the Shire.
  es: Cargaron el oro en los poneys y siguieron cabalgando hacia la Comarca.
