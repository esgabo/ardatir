stage: diorama
duration: 26
narration:
  west: 0
  trolls: 0.2
  dig: 0.4
  share: 0.62
  on: 0.85
beats:
  trolls: 0.2
  dig: 0.4
  share: 0.62
  on: 0.85
tracks:
  - characterId: bilbo
    keyframes:
      - { t: 0, x: 6, z: 2.5, action: walk, thought: { en: "The road is dry this time. What a difference a year makes.", es: "El camino está seco esta vez. Cómo cambia todo en un año." } }
      - { t: 0.2, x: 3.2, z: 0.2, action: idle, thought: { en: "There they are, still stone. And a nest behind Tom's ear.", es: "Ahí están, todavía de piedra. Y un nido tras la oreja de Tom." } }
      - { t: 0.4, x: 4.3, z: -1.8, action: fight, thought: { en: "Here, under the stones. The gold is still where we left it.", es: "Aquí, bajo las piedras. El oro sigue donde lo dejamos." } }
      - { t: 0.62, x: 4, z: -0.8, action: talk, thought: { en: "Take it all, Gandalf. I hardly need it.", es: "Llévatelo todo, Gandalf. Yo casi no lo necesito." } }
      - { t: 0.85, x: -5, z: 3.8, action: walk, thought: { en: "Loaded up. On to the Shire.", es: "Cargados. Rumbo a la Comarca." } }
  - characterId: gandalf
    keyframes:
      - { t: 0, x: 6.2, z: 3.5, action: walk }
      - { t: 0.2, x: 3.8, z: 1.2, action: idle }
      - { t: 0.4, x: 5.3, z: -2.4, action: fight, thought: { en: "Safe in its hiding place. Good.", es: "A salvo en su escondite. Bien." } }
      - { t: 0.62, x: 5, z: -1.6, action: talk, thought: { en: "Half for me, half for you. A hobbit coming home may be glad of it.", es: "La mitad para mí y la mitad para ti. Un hobbit que vuelve a casa lo agradecerá." } }
      - { t: 0.85, x: -5.8, z: 2.8, action: walk }
  - characterId: bert
    model: characters/bert/bert-stone.glb   # turned to stone at the dawn in roast-mutton
    keyframes:
      - { t: 0, x: 0.4, z: -3.4, action: idle }
  - characterId: tom
    model: characters/tom/tom-stone.glb   # turned to stone at the dawn in roast-mutton
    keyframes:
      - { t: 0, x: 2, z: -3, action: idle, thought: { en: "A bird has built her nest behind my ear. I do not mind.", es: "Un pájaro ha hecho el nido tras mi oreja. No me importa." } }
  - characterId: william
    model: characters/william/william-stone.glb   # turned to stone at the dawn in roast-mutton
    keyframes:
      - { t: 0, x: -1.2, z: -3, action: idle, thought: { en: "Stone. Quite comfortable, really.", es: "Piedra. Bastante cómodo, la verdad." } }
