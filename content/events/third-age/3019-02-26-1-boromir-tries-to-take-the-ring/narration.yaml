- id: hour
  en: "Aragorn asked Frodo to choose their road. Frodo asked for an hour alone to think, and walked up into the woods."
  es: "Aragorn le pidió a Frodo que eligiera el camino. Frodo pidió una hora a solas para pensar, y se adentró en el bosque, cuesta arriba."
- id: follow
  en: "Boromir followed him. He spoke gently at first, of Gondor's need, and of how the Ring could save his people."
  es: "Boromir lo siguió. Al principio le habló con suavidad, de la necesidad de Gondor y de cómo el Anillo podría salvar a su pueblo."
- id: no
  en: "Frodo said no. Boromir grew angry, and the kindness fell from his face."
  es: "Frodo le dijo que no. Boromir se enfureció, y la amabilidad desapareció de su rostro."
- id: lunge
  en: "He sprang at Frodo to take the Ring by force. Frodo slipped it on, vanished, and ran."
  es: "Se abalanzó sobre Frodo para quitarle el Anillo por la fuerza. Frodo se lo puso, desapareció y echó a correr."
- id: regret
  en: "Boromir tripped and fell headlong. When he rose, the madness had left him, and he wept, calling for Frodo to come back."
  es: "Boromir tropezó y cayó de bruces. Cuando se levantó, la locura lo había abandonado, y lloró, llamando a Frodo para que volviera."
