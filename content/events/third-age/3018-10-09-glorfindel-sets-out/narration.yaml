- id: news
  en: "In Rivendell, word came from Gildor's people: the Black Riders were abroad, and the Ring-bearer might be on the road, alone and hunted."
  es: "En Rivendel llegó aviso de la gente de Gildor: los Jinetes Negros andaban sueltos, y el Portador del Anillo podía estar en el camino, solo y perseguido."
- id: scouts
  en: "Elrond sent out riders at once, north, west and south, to watch the roads and the river crossings."
  es: "Elrond envió jinetes de inmediato, al norte, al oeste y al sur, para vigilar los caminos y los vados de los ríos."
- id: glorfindel
  en: "Among them went Glorfindel, one of the mighty among the Elves, an Elf-lord of great power from the Elder Days."
  es: "Entre ellos partió Glorfindel, uno de los poderosos entre los Elfos, un señor élfico de gran poder venido de los Días Antiguos."
- id: road
  en: "He rode west along the great road on his white horse, its bells ringing, to find the hobbits before the Riders did."
  es: "Cabalgó hacia el oeste por el gran camino en su caballo blanco, con los cascabeles tintineando, para encontrar a los hobbits antes que los Jinetes."
