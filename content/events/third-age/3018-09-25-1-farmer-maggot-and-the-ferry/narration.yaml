- id: shortcut
  en: "In the morning Frodo chose a short cut across country, straight toward the Brandywine ferry. To his dismay, it brought them onto Farmer Maggot's land."
  es: "Por la mañana Frodo eligió un atajo campo a través, directo hacia la balsa del Brandivino. Para su disgusto, los llevó a las tierras del granjero Maggot."
- id: fear
  en: "As a boy Frodo had been caught taking the farmer's mushrooms, and he still feared Maggot's great dogs."
  es: "De niño, a Frodo lo habían pillado cogiendo setas del granjero, y aún temía a los grandes perros de Maggot."
- id: welcome
  en: "But Maggot welcomed them warmly. A strange black rider had come that very day, he said, asking for Baggins, and he had sent him packing."
  es: "Pero Maggot los recibió con afecto. Aquel mismo día, dijo, había venido un extraño jinete negro preguntando por Bolsón, y él lo había echado de allí."
- id: wagon
  en: "At dusk the farmer drove them in his wagon toward the ferry, and his wife sent them off with a basket of mushrooms. On the way, out of the mist, came Merry to meet them."
  es: "Al anochecer el granjero los llevó en su carreta hacia la balsa, y su mujer los despidió con una cesta de setas. Por el camino, de entre la niebla, apareció Merry a su encuentro."
- id: ferry
  en: "They crossed the dark river on the ferry. Looking back, Frodo saw something black crouching on the landing they had left, sniffing the ground."
  es: "Cruzaron el río oscuro en la balsa. Al mirar atrás, Frodo vio algo negro agazapado en el embarcadero que acababan de dejar, olfateando el suelo."
