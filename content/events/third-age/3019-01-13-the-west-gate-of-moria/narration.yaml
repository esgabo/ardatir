- id: wolves
  en: "In the night wolves surrounded the Company. Gandalf set the trees around them ablaze, and Legolas's arrows burst into flame, until the wolves fled at dawn."
  es: "Por la noche los lobos rodearon a la Compañía. Gandalf prendió fuego a los árboles de alrededor, y las flechas de Legolas se encendieron en llamas, hasta que los lobos huyeron al alba."
- id: door
  en: "At dusk they reached the cliffs of Moria beside a dark, still lake. Gandalf touched the rock, and in the moonlight silver lines appeared: a doorway, with letters and a star."
  es: "Al anochecer llegaron a los acantilados de Moria, junto a un lago oscuro y quieto. Gandalf tocó la roca, y a la luz de la luna aparecieron líneas plateadas: una puerta, con letras y una estrella."
- id: word
  en: "The doors would open only to a password. Gandalf tried spell after spell, until at last he laughed: the answer was the Elvish word for friend, and it had been written there all along."
  es: "Las puertas solo se abrirían con una contraseña. Gandalf probó un conjuro tras otro, hasta que por fin se rio: la respuesta era la palabra élfica para amigo, y había estado escrita allí todo el tiempo."
- id: bill
  en: "Sam had to let Bill the pony go, for there was no road for him in the dark below. It nearly broke his heart."
  es: "Sam tuvo que dejar marchar al poney Bill, pues no había camino para él en la oscuridad de abajo. Casi se le rompió el corazón."
- id: watcher
  en: "As the doors swung open, long arms rose out of the lake and seized Frodo by the foot. The Company rushed inside, and the doors were slammed shut behind them."
  es: "Cuando las puertas se abrieron, unos largos brazos salieron del lago y agarraron a Frodo por el pie. La Compañía se precipitó dentro, y las puertas se cerraron de golpe a sus espaldas."
