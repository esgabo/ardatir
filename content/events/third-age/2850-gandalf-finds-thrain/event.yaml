summary:
  en: "Entering Dol Guldur in secret, Gandalf learns that its master is Sauron himself. In the dungeons he finds a dying dwarf, Thráin, who gives him a map and a key for his son."
  es: "Entrando en secreto en Dol Guldur, Gandalf descubre que su señor es el mismo Sauron. En las mazmorras encuentra a un enano moribundo, Thráin, que le entrega un mapa y una llave para su hijo."
