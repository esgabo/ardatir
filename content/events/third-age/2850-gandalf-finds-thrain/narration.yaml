- id: shadow
  en: For many years a dark power had dwelt in the fortress of Dol Guldur, deep in the south of Mirkwood. The Wise called it the Necromancer, but none knew for certain what it was.
  es: Durante muchos años, un poder oscuro había habitado en la fortaleza de Dol Guldur, en lo profundo del sur del Bosque Negro. Los Sabios lo llamaban el Nigromante, pero nadie sabía con certeza qué era.
- id: enters
  en: Gandalf went to find out. In secret and at great risk, he slipped into the fortress and moved through its shadows.
  es: Gandalf fue a averiguarlo. En secreto y con gran peligro, se adentró en la fortaleza y avanzó entre sus sombras.
- id: truth
  en: What he learned was worse than he had feared. The Necromancer was Sauron himself, slowly gathering his strength, and searching for the One Ring he had lost.
  es: Lo que descubrió fue peor de lo que temía. El Nigromante era el mismo Sauron, que reunía poco a poco sus fuerzas y buscaba el Anillo Único que había perdido.
- id: dungeon
  en: Deep in the dungeons Gandalf found a dwarf, starved and broken, who could barely remember his own name. It was Thráin, son of Thrór, captured years before on his way to the Lonely Mountain.
  es: En lo hondo de las mazmorras, Gandalf encontró a un enano hambriento y destrozado, que apenas recordaba su propio nombre. Era Thráin, hijo de Thrór, capturado años atrás camino de la Montaña Solitaria.
- id: key
  en: Before he died, Thráin pressed a map and a small key into Gandalf's hands, and begged him to pass them on to his son.
  es: Antes de morir, Thráin puso en manos de Gandalf un mapa y una pequeña llave, y le rogó que se los hiciera llegar a su hijo.
- id: keep
  en: Gandalf escaped with them, and kept them safe for a very long time, waiting for the right moment to use them.
  es: Gandalf escapó con ellos y los guardó durante muchísimo tiempo, esperando el momento oportuno para usarlos.
