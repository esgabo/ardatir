- id: weeks
  en: "For more than two months Gandalf was a prisoner on the pinnacle of Orthanc, while summer turned to autumn."
  es: "Durante más de dos meses, Gandalf estuvo prisionero en la cima de Orthanc, mientras el verano se convertía en otoño."
- id: eagle
  en: "One night under the moon, a great eagle came gliding to the tower: Gwaihir, lord of the eagles. Radagast, who suspected nothing, had asked him to carry news to Gandalf."
  es: "Una noche, bajo la luna, una gran águila llegó planeando hasta la torre: Gwaihir, señor de las águilas. Radagast, que nada sospechaba, le había pedido que llevara noticias a Gandalf."
- id: escape
  en: "Instead of a messenger, Gwaihir found a prisoner. Gandalf climbed on his back, and before dawn they were far away, before Saruman knew he was gone."
  es: "En lugar de a un mensajero, Gwaihir encontró a un prisionero. Gandalf subió a su lomo y antes del alba ya estaban lejos, antes de que Saruman supiera que se había ido."
- id: rohan
  en: "Gwaihir could not carry him all the way north, so Gandalf asked to be set down in Rohan, the land of the Horse-lords, where he hoped to find a horse."
  es: "Gwaihir no podía llevarlo hasta el norte, así que Gandalf le pidió que lo dejara en Rohan, la tierra de los Señores de los Caballos, donde esperaba conseguir una montura."
