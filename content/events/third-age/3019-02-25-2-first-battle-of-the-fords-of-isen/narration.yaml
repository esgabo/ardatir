- id: far
  en: "That same day, far to the west, Saruman's army marched out of Isengard against Rohan."
  es: "Ese mismo día, lejos, en el oeste, el ejército de Saruman salió de Isengard contra Rohan."
- id: fords
  en: "Théodred, King Théoden's son, held the Fords of Isen with the Riders of the Mark. They were badly outnumbered, and Saruman's soldiers sought him out above all others."
  es: "Théodred, el hijo del rey Théoden, defendía los Vados del Isen con los Jinetes de la Marca. Eran muchos menos, y los soldados de Saruman lo buscaban a él por encima de todos."
- id: fall
  en: "Théodred fell, fighting bravely to the end. Rohan had lost its heir."
  es: "Théodred cayó, luchando con valor hasta el final. Rohan había perdido a su heredero."
- id: open
  en: "Now the way into the Westfold lay open, and the war had come to Rohan."
  es: "Ahora el camino hacia el Folde Oeste quedaba abierto, y la guerra había llegado a Rohan."
