- id: river
  en: "For days the boats drifted south on the Great River, through bare and empty lands. Sam was sure that a log was following them, a log with eyes."
  es: "Durante días las barcas descendieron hacia el sur por el Río Grande, entre tierras desnudas y vacías. Sam estaba seguro de que un tronco los seguía, un tronco con ojos."
- id: rapids
  en: "One dark night the current swept them toward the rapids of Sarn Gebir, and they had to paddle hard to turn back."
  es: "Una noche oscura la corriente los arrastró hacia los rápidos de Sarn Gebir, y tuvieron que remar con todas sus fuerzas para dar la vuelta."
- id: arrows
  en: "Arrows came flying from the eastern bank: Orcs had been waiting. Frodo was struck, but the mithril shirt beneath his clothes turned the arrows aside."
  es: "Desde la orilla oriental llegaron flechas volando: los orcos los estaban esperando. Alcanzaron a Frodo, pero la cota de mithril que llevaba bajo la ropa desvió las flechas."
- id: shadow
  en: "As they reached the western shore, a great winged shape came out of the south across the sky. Frodo felt a deadly chill in his heart."
  es: "Al llegar a la orilla occidental, una gran forma alada cruzó el cielo desde el sur. Frodo sintió un frío mortal en el corazón."
- id: shot
  en: "Legolas bent the bow of Lórien and shot. The shape gave a cry and fell out of the sky, and on the far bank the Orcs fell silent."
  es: "Legolas tensó el arco de Lórien y disparó. La forma lanzó un grito y cayó del cielo, y en la otra orilla los orcos enmudecieron."
