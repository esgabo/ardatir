- id: still
  en: "On the bare peak of Zirakzigil Gandalf's body lay still, while the stars wheeled above and the days passed, each as long as a lifetime."
  es: "En la cima pelada del Zirakzigil yacía inmóvil el cuerpo de Gandalf, mientras las estrellas giraban en lo alto y pasaban los días, cada uno tan largo como una vida."
- id: sent
  en: "But his task was not yet done. He was sent back, for a while, to finish it."
  es: "Pero su tarea aún no había terminado. Fue enviado de vuelta, por un tiempo, para cumplirla."
- id: wake
  en: "He woke alone on the mountaintop. He was Gandalf still, but changed, and his hair was now as white as snow."
  es: "Despertó solo en la cumbre. Seguía siendo Gandalf, pero había cambiado, y su cabello era ahora blanco como la nieve."
- id: listen
  en: "There he lay, half in a dream, and heard all the sounds of the world from far away: the joys and griefs of every land, and the slow turning of the earth."
  es: "Allí yacía, medio en sueños, y oía desde muy lejos todos los sonidos del mundo: las alegrías y las penas de todas las tierras, y el lento girar de la tierra."
