- id: hedge
  en: "Before dawn they rode their ponies through a tunnel under the High Hedge and into the Old Forest. The trees seemed to watch them, and every path turned them aside."
  es: "Antes del amanecer cruzaron con sus poneys un túnel bajo el Seto Alto y entraron en el Bosque Viejo. Los árboles parecían observarlos, y cada sendero los desviaba."
- id: river
  en: "However hard they tried, the forest drew them down to the Withywindle, a slow, dark river where an enormous old willow leaned over the water."
  es: "Por mucho que lo intentaron, el bosque los fue llevando hasta el Tornasauce, un río lento y oscuro sobre cuyas aguas se inclinaba un sauce viejo y enorme."
- id: sleep
  en: "In the warm afternoon a heavy sleepiness fell on them. Merry and Pippin sat against the willow, and its cracks closed around them."
  es: "En la tibia tarde los invadió un sueño pesado. Merry y Pippin se sentaron contra el sauce, y sus grietas se cerraron a su alrededor."
- id: fire
  en: "Sam pulled Frodo out of the river, where a root had tipped him in. They tried lighting a fire, but the tree only squeezed harder."
  es: "Sam sacó a Frodo del río, donde una raíz lo había hecho caer. Intentaron encender un fuego, pero el árbol solo apretó con más fuerza."
- id: tom
  en: "Frodo ran shouting for help, and someone answered with a song: a jolly fellow in a blue coat and yellow boots. It was Tom Bombadil, and when he sang to the willow, it let them go."
  es: "Frodo corrió pidiendo ayuda a gritos, y alguien le respondió con una canción: un tipo alegre de chaqueta azul y botas amarillas. Era Tom Bombadil, y cuando le cantó al sauce, este los soltó."
