- id: wander
  en: Thrór had lost his Mountain to the dragon. For many years he wandered with a few faithful followers, an old king without a kingdom.
  es: Thrór había perdido su Montaña a manos del dragón. Durante muchos años vagó con unos pocos fieles, un viejo rey sin reino.
- id: gate
  en: At last he came to the eastern gate of Moria, the great dwarf-city of his ancestors, silent now and dark. He told his companion that he meant to go in.
  es: Al fin llegó a la puerta oriental de Moria, la gran ciudad enana de sus antepasados, ahora callada y oscura. Le dijo a su compañero que pensaba entrar.
- id: enters
  en: His friend begged him to stay outside, but Thrór would not listen. Alone, he walked under the great archway and into the dark.
  es: Su amigo le rogó que se quedara fuera, pero Thrór no quiso escucharlo. Solo, cruzó el gran arco y se internó en la oscuridad.
- id: azog
  en: Moria was no longer empty. Orcs lived in its halls, and their chieftain, Azog, was waiting. He killed the old king at the gate.
  es: Moria ya no estaba vacía. Los orcos vivían en sus salas, y su jefe, Azog, esperaba. Mató al viejo rey junto a la puerta.
- id: contempt
  en: Azog flung the body out to the dwarf who waited outside, and tossed a few coins after it, as if paying a beggar. It was meant to show how little he thought of the dwarves.
  es: Azog arrojó el cuerpo al enano que esperaba fuera y le lanzó unas monedas, como quien paga a un mendigo. Era para mostrar lo poco que valían los enanos para él.
- id: news
  en: The faithful dwarf carried the news home, and soon every house of the dwarves had heard it. They would not let such an insult go unanswered.
  es: El fiel enano llevó la noticia a su pueblo, y pronto todas las casas de los enanos la supieron. No dejarían sin respuesta semejante afrenta.
