stage: diorama
duration: 36
set: kits/beorn/beorns-house.glb
# The light runs from the afternoon they arrive, through the supper and the night Beorn spends
# out as a bear, to the morning he sends them off with ponies and a warning.
light:
  - { t: 0, preset: day }
  - { t: 0.45, preset: day }
  - { t: 0.56, preset: evening }
  - { t: 0.64, preset: dusk }
  - { t: 0.7, preset: night }
  - { t: 0.8, preset: night }
  - { t: 0.87, preset: dawn }
  - { t: 0.93, preset: morning }
  - { t: 1, preset: morning }
# The hall opens as Gandalf goes in and shuts behind the company in the morning (DESIGN §9.4):
# the south wall first, because it is the one between the table and the eye, then the roof.
reveal:
  - { t: 0.1, cover: front, amount: 0 }
  - { t: 0.22, cover: front, amount: 1 }
  - { t: 0.13, cover: roof, amount: 0 }
  - { t: 0.26, cover: roof, amount: 1 }
  - { t: 0.9, cover: roof, amount: 1 }
  - { t: 0.97, cover: roof, amount: 0 }
  - { t: 0.92, cover: front, amount: 1 }
  - { t: 0.99, cover: front, amount: 0 }
# The shot (#28): the whole holding, then in on the hall as the pairs arrive, tight on the table
# for the supper, out again for the bear going round the house in the dark, and back to the court
# for the ponies and the road east.
camera:
  - { t: 0, x: -0.6, z: 0.6, width: 13 }
  - { t: 0.15, x: -0.4, z: -2.4, width: 9.4 }
  - { t: 0.33, x: 0.3, z: -3.9, width: 8.2 }
  - { t: 0.5, x: 0.5, z: -4, width: 8 }
  - { t: 0.67, x: -0.4, z: -3.4, width: 8.6 }
  - { t: 0.74, x: -0.5, z: 0, width: 13.4 }
  - { t: 0.88, x: -0.4, z: -0.6, width: 7.4 }
  - { t: 1, x: -0.9, z: 2.2, width: 10.4 }
# What the scene does, at the beat it does it (DESIGN §9.5). The hall's fire, the bees and the
# birds in the clover come from the place and the hour, not from here.
sound:
  # The wide gate in the thorn hedge, once for each knot of dwarves Gandalf lets in by twos.
  - { t: 0.172, cue: door, gain: 0.7 }
  - { t: 0.217, cue: door, gain: 0.7 }
  - { t: 0.262, cue: door, gain: 0.7 }
  - { t: 0.307, cue: door, gain: 0.7 }
  # Supper: bowls of honey and cream, and mead poured for fifteen.
  - { t: 0.48, cue: clatter }
  - { t: 0.52, cue: pour }
  - { t: 0.56, cue: clatter, gain: 0.8 }
  # The company files out at dawn and the gate swings shut behind them.
  - { t: 0.965, cue: door }
narration:
  beorn: 0
  tale: 0.17
  welcome: 0.33
  supper: 0.5
  night: 0.67
  gifts: 0.84
beats:
  pairs: 0.17
  feast: 0.5
  bear: 0.67
  ponies: 0.84
tracks:
  - characterId: beorn
    keyframes:
      - { t: 0, x: 3.25, z: -4.05, action: idle, thought: { en: "Visitors again. I like them better as stories.", es: "Otra vez visitas. Me gustan más como cuentos." } }
      - { t: 0.33, x: 3.25, z: -4.05, action: talk, thought: { en: "Tell me more. What came after the goblins?", es: "Cuéntame más. ¿Qué pasó tras los trasgos?" } }
      - { t: 0.5, x: 3.25, z: -4.05, action: talk }
      - { t: 0.56, x: 3.25, z: -4.05, action: idle }
      - { t: 0.6, x: 3.3, z: -2.5, action: walk }
      - { t: 0.64, x: 0, z: -1.6, action: walk }
      - { t: 0.68, x: -1.1, z: 2.2, action: run, thought: { en: "Goblins and wargs, they said. I will see for myself.", es: "Trasgos y huargos, dijeron. Lo veré con mis propios ojos." } }
      - { t: 0.72, x: -1.35, z: 6.4, action: run }
