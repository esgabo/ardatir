- id: beorn
  en: Gandalf led them to the house of Beorn, a skin-changer who could take the shape of a great black bear. He was not fond of visitors, so Gandalf had a plan.
  es: Gandalf los llevó a la casa de Beorn, un cambiapieles capaz de tomar la forma de un gran oso negro. No le gustaban las visitas, así que Gandalf tenía un plan.
- id: tale
  en: He went in first with Bilbo and began to tell the story of their adventures. Every few minutes, as arranged, another pair of dwarves appeared at the door.
  es: Entró primero con Bilbo y empezó a contar la historia de sus aventuras. Cada pocos minutos, tal como habían acordado, aparecía en la puerta otra pareja de enanos.
- id: welcome
  en: Beorn grew so eager to hear the end of the tale that he forgot to be cross. Soon the whole company was seated in his great wooden hall.
  es: Beorn tenía tantas ganas de oír el final de la historia que se olvidó de enfadarse. Pronto toda la compañía estaba sentada en su gran salón de madera.
- id: supper
  en: His animals served the supper, and there was honey, cream and bread for everyone. Then Beorn went out into the night.
  es: Sus animales sirvieron la cena, y hubo miel, nata y pan para todos. Después, Beorn salió a la noche.
- id: night
  en: In the dark, Bilbo heard something huge padding and growling around the house. Beorn was out as a bear, checking whether their story was true.
  es: En la oscuridad, Bilbo oyó algo enorme que rondaba la casa entre gruñidos. Beorn había salido convertido en oso, para comprobar si su historia era cierta.
- id: gifts
  en: It was. In the morning Beorn gave them ponies and food for the road, and a warning. Send the ponies back at the forest's edge, and in Mirkwood, never leave the path.
  es: Lo era. Por la mañana, Beorn les dio poneys y provisiones para el camino, y una advertencia. Que devolvieran los poneys en el linde del bosque y que, en el Bosque Negro, nunca abandonaran el sendero.
