id: gandalf-visits-bombadil
age: third-age
when:
  # Gandalf leaves the hobbits on 30 October (they leave Bree that day and reach the Bridge at
  # dark, Appendix B) and rides off toward Tom's country. When he gets there and how long the
  # talk lasts are not told, so we claim only October into November.
  start: { age: third-age, year: 3019, month: 10 }
  end: { age: third-age, year: 3019, month: 11 }
  precision: month
