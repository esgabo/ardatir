- id: road
  en: Leaving Bree, the travellers rode west along the East Road. At the place where Tom Bombadil had turned back a year before, at the edge of his own country, Gandalf stopped.
  es: Al salir de Bree, los viajeros cabalgaron hacia el oeste por el Camino del Este. En el lugar donde Tom Bombadil se había vuelto un año antes, en el límite de su propia tierra, Gandalf se detuvo.
- id: parting
  en: Here he would leave them. He was not coming to the Shire, he said. Whatever was wrong there, it was for the hobbits to put right, and they no longer needed his help.
  es: Allí los dejaría. No iba a ir a la Comarca, dijo. Fuera lo que fuera lo que andaba mal allí, les tocaba a los hobbits arreglarlo, y ya no necesitaban su ayuda.
- id: grown
  en: They had grown up on their travels, he told them, and could stand beside the great of the world. The hobbits felt both proud and a little afraid.
  es: Habían crecido en sus viajes, les dijo, y podían estar a la altura de los grandes del mundo. Los hobbits se sintieron orgullosos y un poco asustados a la vez.
- id: tom
  en: As for Gandalf, he meant to have a long talk with Tom. All his days he had wandered from place to place, while Tom had stayed in one country, and Gandalf thought they would have much to say to each other.
  es: En cuanto a Gandalf, pensaba tener una larga charla con Tom. Él había pasado todos sus días viajando de un lugar a otro, mientras que Tom se había quedado en una misma tierra, y Gandalf creía que tendrían mucho que decirse.
- id: away
  en: He turned Shadowfax off the road, and the great horse leapt the dike and was gone toward the Downs like a wind. What the two of them said to each other has never been told.
  es: Desvió a Sombragris del camino, y el gran caballo saltó el terraplén y se alejó como el viento hacia las Quebradas. Lo que se dijeron los dos nunca se ha contado.
