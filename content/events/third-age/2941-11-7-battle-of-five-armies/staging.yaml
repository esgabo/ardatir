stage: diorama
duration: 40
narration:
  wrath: 0
  brink: 0.13
  alliance: 0.27
  charge: 0.42
  eagles: 0.6
  beorn: 0.75
  cost: 0.88
beats:
  brink: 0.13
  alliance: 0.27
  charge: 0.42
  eagles: 0.6
  beorn: 0.75
  cost: 0.88
tracks:
  - characterId: thorin
    keyframes:
      - { t: 0, x: 3.9, z: -4.4, action: idle, thought: { en: "The Arkenstone, in the hands of a thief. Of my own thief.", es: "La Piedra del Arca, en manos de un ladrón. De mi propio ladrón." } }
      - { t: 0.06, x: 3.2, z: -3.7, action: fight }
      - { t: 0.13, x: 3.5, z: -5.2, action: idle, thought: { en: "Behind the gate I stay, whatever they bring.", es: "Tras la puerta me quedo, traigan lo que traigan." } }
      - { t: 0.38, x: 3.5, z: -5.2, action: idle, thought: { en: "Goblins at our door. The time for walls is over.", es: "Trasgos a nuestra puerta. Se acabó el tiempo de los muros." } }
      - { t: 0.44, x: 0.5, z: -3.4, action: run }
      - { t: 0.5, x: 0.5, z: -3.4, action: fight, thought: { en: "Back, you filth! This is Durin's house!", es: "¡Atrás, escoria! ¡Esta es la casa de Durin!" } }
      - { t: 0.75, x: 0.5, z: -3.4, action: fight }
      - { t: 0.88, x: 2.6, z: -4.2, action: hide, thought: { en: "I was carried... and I cannot feel my hands.", es: "Me han traído... y no siento las manos." } }
  - characterId: dain
    keyframes:
      - { t: 0, x: 6.3, z: 2.4, action: idle, thought: { en: "My cousin has shut himself in. I will not leave him alone.", es: "Mi primo se ha encerrado. No lo dejaré solo." } }
      - { t: 0.07, x: 6.3, z: 2.4, action: idle }
      - { t: 0.13, x: 3.6, z: 0.2, action: run }
      - { t: 0.2, x: 3.6, z: 0.2, action: talk, thought: { en: "Thorin is my kin. I stand with him against all comers.", es: "Thorin es mi pariente. Estoy con él contra quien sea." } }
      - { t: 0.27, x: 1.8, z: -1.2, action: walk }
      - { t: 0.35, x: 1.8, z: -1.2, action: idle, thought: { en: "Goblins instead of elves. Better.", es: "Trasgos en vez de elfos. Mejor así." } }
      - { t: 0.42, x: 0, z: -2.1, action: run }
      - { t: 0.5, x: 0, z: -2.1, action: fight }
      - { t: 0.75, x: 0, z: -2.1, action: fight }
      - { t: 0.88, x: 4.4, z: -2.9, action: idle, thought: { en: "Thorin, Fíli, Kíli... too high a price.", es: "Thorin, Fíli, Kíli... demasiado caro." } }
  - characterId: bard
    keyframes:
      - { t: 0, x: 0.5, z: -2.3, action: talk, thought: { en: "Here is your stone, Thorin. Now will you talk?", es: "Aquí tienes tu piedra, Thorin. ¿Hablarás ahora?" } }
      - { t: 0.13, x: -0.5, z: -1.6, action: idle }
      - { t: 0.27, x: -0.2, z: -0.2, action: idle, thought: { en: "Old quarrels are not worth our lives today.", es: "Las viejas disputas no valen hoy nuestras vidas." } }
      - { t: 0.42, x: -1.6, z: -1.5, action: fight }
      - { t: 0.75, x: -1.6, z: -1.5, action: fight }
      - { t: 0.88, x: -1.8, z: -0.6, action: idle, thought: { en: "We have won. But look at the field.", es: "Hemos ganado. Pero mirad el campo." } }
  - characterId: thranduil
    keyframes:
      - { t: 0, x: -1.2, z: -1, action: idle, thought: { en: "If the dwarf will not bargain, we will not retreat.", es: "Si el enano no negocia, no retrocederemos." } }
      - { t: 0.13, x: -1.4, z: -0.2, action: idle }
      - { t: 0.27, x: -0.7, z: -1.4, action: idle, thought: { en: "Enemies of the old days stand beside us now.", es: "Los enemigos de antaño están hoy a nuestro lado." } }
      - { t: 0.42, x: -2.4, z: -0.6, action: fight }
      - { t: 0.75, x: -2.4, z: -0.6, action: fight }
      - { t: 0.88, x: -2.6, z: -0.2, action: idle }
  - characterId: gandalf
    keyframes:
      - { t: 0, x: 2.2, z: -3.2, action: talk, thought: { en: "Enough, Thorin! Let the hobbit go.", es: "¡Basta, Thorin! Suelta al hobbit." } }
      - { t: 0.13, x: 1.4, z: -2.8, action: talk, thought: { en: "Look up! Goblins and wolves are coming. Put your quarrel aside!", es: "¡Mirad arriba! Vienen trasgos y lobos. ¡Dejad la disputa!" } }
      - { t: 0.27, x: 0.8, z: -2.8, action: talk }
      - { t: 0.42, x: 0.2, z: -2.7, action: fight }
      - { t: 0.75, x: 0.2, z: -2.7, action: fight }
      - { t: 0.88, x: 1.6, z: -3.4, action: idle, thought: { en: "Victory, and so many gone. I did not wish this.", es: "Victoria, y tantos caídos. Yo no quería esto." } }
  - characterId: bilbo
    keyframes:
      - { t: 0, x: 2.6, z: -3, action: idle, thought: { en: "He is furious. I may be thrown from the wall.", es: "Está furioso. Puede que me arrojen de la muralla." } }
      - { t: 0.1, x: 2.6, z: -3, action: idle }
      - { t: 0.27, x: -5.6, z: 2.2, action: walk, thought: { en: "Up on the hillside, out of everyone's way.", es: "Arriba, en la ladera, fuera del paso de todos." } }
      - { t: 0.6, x: -5.6, z: 2.2, action: idle, thought: { en: "Great shapes in the west. The eagles! They are coming!", es: "Grandes siluetas en el oeste. ¡Las águilas! ¡Vienen!" } }
      - { t: 0.67, x: -5.6, z: 2.2, action: idle }
      - { t: 0.69, x: -5.6, z: 2.2, action: hide, thought: { en: "Something hit me. All gone dark...", es: "Algo me ha golpeado. Todo se ha oscurecido..." } }
  - characterId: bolg
    keyframes:
      - { t: 0, x: -13, z: -13, action: idle }
      - { t: 0.08, x: -13, z: -13, action: idle }
      - { t: 0.17, x: -5.6, z: -5.6, action: run, thought: { en: "Fall on them! The Mountain is ours!", es: "¡A por ellos! ¡La Montaña será nuestra!" } }
      - { t: 0.27, x: -4.5, z: -4.5, action: walk }
      - { t: 0.42, x: -3, z: -3.4, action: fight, thought: { en: "Break their line!", es: "¡Romped su línea!" } }
      - { t: 0.7, x: -2.6, z: -3.2, action: fight }
      - { t: 0.78, x: -2.6, z: -3.2, action: hide, thought: { en: "A bear... a huge bear...", es: "Un oso... un oso enorme..." } }
  - characterId: beorn
    keyframes:
      - { t: 0, x: 12, z: -12, action: idle }
      - { t: 0.66, x: 12, z: -12, action: idle }
      - { t: 0.75, x: -1.8, z: -2.6, action: run, thought: { en: "The goblins will learn what a bear can do.", es: "Los trasgos van a saber lo que puede hacer un oso." } }
      - { t: 0.78, x: -1.8, z: -2.6, action: fight }
      - { t: 0.88, x: -1.8, z: -2.6, action: idle }
  - characterId: lord-of-the-eagles
    keyframes:
      - { t: 0, x: -12, z: -12, action: idle }
      - { t: 0.55, x: -12, z: -12, action: idle }
      - { t: 0.64, x: -5.8, z: -1.2, action: run, thought: { en: "We are not too late. Strike the goblin host from above.", es: "No llegamos tarde. Golpead a la hueste trasga desde el cielo." } }
      - { t: 0.75, x: -5.2, z: -1.8, action: fight }
      - { t: 0.88, x: -5.2, z: -1.8, action: idle }
  - characterId: balin
    keyframes:
      - { t: 0, x: 4.38, z: -6.45, action: idle, thought: { en: "Behind the gate again. Thorin is in no mood to listen.", es: "Tras la puerta otra vez. Thorin no está para escuchar." } }
      - { t: 0.35, x: 4.38, z: -6.45, action: idle }
      - { t: 0.42, x: 1.3, z: -3.95, action: run }
      - { t: 0.5, x: 1.3, z: -3.95, action: fight }
      - { t: 0.75, x: 1.3, z: -3.95, action: fight }
      - { t: 0.88, x: 4, z: -4.2, action: idle, thought: { en: "We held the field, but I would give it back to have them whole.", es: "Ganamos el campo, pero lo daría por tenerlos enteros." } }
  - characterId: dwalin
    keyframes:
      - { t: 0, x: 4.93, z: -6.45, action: idle }
      - { t: 0.35, x: 4.93, z: -6.45, action: idle }
      - { t: 0.42, x: 1.9, z: -3.95, action: run }
      - { t: 0.5, x: 1.9, z: -3.95, action: fight }
      - { t: 0.75, x: 1.9, z: -3.95, action: fight }
      - { t: 0.88, x: 3.81, z: -3.5, action: idle }
  - characterId: fili
    keyframes:
      - { t: 0, x: 5.48, z: -6.45, action: idle }
      - { t: 0.35, x: 5.48, z: -6.45, action: idle }
      - { t: 0.42, x: 2.5, z: -3.95, action: run, thought: { en: "For Thorin! Stay close to him!", es: "¡Por Thorin! ¡Quedaos cerca de él!" } }
      - { t: 0.5, x: 2.5, z: -3.95, action: fight }
      - { t: 0.75, x: 2.5, z: -3.95, action: fight }
      - { t: 0.88, x: 1, z: -5.2, action: hide }
  - characterId: kili
    keyframes:
      - { t: 0, x: 6.03, z: -6.45, action: idle }
      - { t: 0.35, x: 6.03, z: -6.45, action: idle }
      - { t: 0.42, x: 3.1, z: -3.95, action: run, thought: { en: "No one reaches my uncle while I stand.", es: "Nadie llegará a mi tío mientras yo siga en pie." } }
      - { t: 0.5, x: 3.1, z: -3.95, action: fight }
      - { t: 0.75, x: 3.1, z: -3.95, action: fight }
      - { t: 0.88, x: 1.8, z: -5.6, action: hide }
