- id: crossroads
  en: At the Cross-roads stood a great stone statue of an ancient king. Orcs had broken off its head, but a ray of sunset showed it lying nearby, crowned with small white and golden flowers.
  es: En la Encrucijada se alzaba una gran estatua de piedra de un antiguo rey. Los orcos le habían arrancado la cabeza, pero un rayo del ocaso la mostró caída allí cerca, coronada de florecillas blancas y doradas.
- id: vale
  en: Then the travellers climbed into the Morgul Vale, a valley of sickly pale flowers. At its head stood Minas Morgul, the Tower of Sorcery, glowing with a cold, dead light.
  es: Después los viajeros subieron al Valle de Morgul, un valle de flores pálidas y enfermizas. Al fondo se alzaba Minas Morgul, la Torre de la Hechicería, que brillaba con una luz fría y muerta.
- id: pull
  en: Frodo felt the road to its bridge pulling at him, and he began to walk toward it. Sam and Gollum had to drag him away to the hidden path in the rocks.
  es: Frodo sintió que el camino hacia su puente tiraba de él, y empezó a caminar hacia allí. Sam y Gollum tuvieron que arrastrarlo hasta la senda oculta entre las rocas.
- id: host
  en: Red light flashed above the tower, the ground shook, and the gates opened. A great black army marched out, and at its head rode the Lord of the Nazgûl, the Witch-king.
  es: Una luz roja estalló sobre la torre, el suelo tembló y las puertas se abrieron. Salió un gran ejército negro, y a su cabeza cabalgaba el Señor de los Nazgûl, el Rey Brujo.
- id: phial
  en: On the bridge he stopped and seemed to search for something. Frodo's hand crept toward the Ring, but found instead the Phial of Galadriel. Its touch steadied him.
  es: En el puente se detuvo y pareció buscar algo. La mano de Frodo se deslizó hacia el Anillo, pero encontró en su lugar el Frasco de Galadriel. Su contacto le devolvió la calma.
- id: war
  en: The Witch-king turned and rode on, and the host poured west toward Gondor. Frodo watched it go, afraid for his friends, and climbed on toward the mountains.
  es: El Rey Brujo se dio la vuelta y siguió adelante, y la hueste avanzó en tropel hacia el oeste, hacia Gondor. Frodo la vio partir, temiendo por sus amigos, y siguió subiendo hacia las montañas.
