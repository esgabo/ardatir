- id: hills
  en: Aragorn set his men on two low hills of slag and ash, in rings around their banners, and there they waited for the enemy to come.
  es: Aragorn dispuso a sus hombres en dos colinas bajas de escoria y ceniza, en anillos en torno a sus estandartes, y allí esperaron la llegada del enemigo.
- id: trolls
  en: The armies of Mordor surged around them like a sea. Great trolls came striding against the ranks of Gondor, and the fighting was terrible.
  es: Los ejércitos de Mordor los rodearon como un mar. Grandes trolls avanzaron a zancadas contra las filas de Gondor, y la lucha fue terrible.
- id: pippin
  en: Pippin stabbed a troll that was about to kill a friend, and it toppled on top of him. As darkness took him, he heard voices crying that the Eagles were coming, and thought of Bilbo's old story.
  es: Pippin apuñaló a un troll que estaba a punto de matar a un amigo, y el troll se le desplomó encima. Mientras la oscuridad se lo llevaba, oyó voces que gritaban que venían las Águilas, y pensó en la vieja historia de Bilbo.
- id: eagles
  en: Down from the north came the Eagles, led by Gwaihir, and they fell upon the Nazgûl. Then, suddenly, the Nazgûl turned and fled away toward the mountain of fire.
  es: Desde el norte llegaron las Águilas, guiadas por Gwaihir, y se lanzaron sobre los Nazgûl. Entonces, de repente, los Nazgûl dieron la vuelta y huyeron hacia la montaña de fuego.
- id: end
  en: The ground shook. The Black Gate and its towers crumbled. Far away, a vast dark shape rose into the sky, and was blown away by the wind. Gandalf cried out that the Ring-bearer had done it.
  es: La tierra tembló. La Puerta Negra y sus torres se derrumbaron. A lo lejos, una inmensa forma oscura se alzó en el cielo y el viento se la llevó. Gandalf gritó que el Portador del Anillo lo había logrado.
- id: rout
  en: The armies of Mordor lost all their will at once. Orcs scattered in every direction like leaves in a gale, and the men who had served Sauron fled or begged for mercy.
  es: Los ejércitos de Mordor perdieron de golpe toda su voluntad. Los orcos se dispersaron en todas direcciones como hojas en un vendaval, y los hombres que habían servido a Sauron huyeron o pidieron clemencia.
