- id: hill
  en: At last, more than a year after he had run out of his door, Bilbo saw his own Hill again. Gandalf looked at him and saw a hobbit greatly changed.
  es: Por fin, más de un año después de salir corriendo por su puerta, Bilbo volvió a ver su Colina. Gandalf lo miró y vio a un hobbit muy cambiado.
- id: auction
  en: But at Bag End there was a crowd, and a notice on the gate. Bilbo had been gone so long that everyone thought him dead, and his belongings were being sold at auction.
  es: Pero en Bolsón Cerrado había una multitud, y un cartel en la verja. Bilbo llevaba tanto tiempo fuera que todos lo daban por muerto, y sus pertenencias se estaban subastando.
- id: buy
  en: The sale was halfway through. To save time and trouble, Bilbo had to buy back many of his own chairs and tables, and some of his silver spoons were never seen again.
  es: La subasta iba ya por la mitad. Para ahorrarse tiempo y problemas, Bilbo tuvo que volver a comprar muchas de sus propias sillas y mesas, y algunas de sus cucharas de plata no volvieron a aparecer.
- id: cousins
  en: His cousins the Sackville-Bagginses, who had been measuring his rooms, were especially disappointed to see him alive.
  es: Sus primos los Sacovilla-Bolsón, que ya estaban midiendo sus habitaciones, se llevaron una especial decepción al verlo vivo.
- id: reputation
  en: He had lost something else, too. His neighbours never again thought him quite respectable, and called him odd.
  es: También había perdido otra cosa. Sus vecinos nunca volvieron a considerarlo del todo respetable, y lo tenían por raro.
- id: content
  en: Bilbo did not mind at all. His sword hung over the fireplace, elves and wizards came to visit, and he was happy in his hobbit-hole for the rest of his days.
  es: A Bilbo no le importó lo más mínimo. Su espada colgaba sobre la chimenea, elfos y magos venían a visitarlo, y fue feliz en su agujero-hobbit el resto de sus días.
