- id: siege
  en: In the North, men of Dale and dwarves of Erebor were still trapped inside the Lonely Mountain, surrounded by the Easterlings.
  es: En el Norte, hombres de Valle y enanos de Erebor seguían atrapados dentro de la Montaña Solitaria, rodeados por los Orientales.
- id: news
  en: Then word came of Sauron's fall. The Easterlings lost heart, and the besieged felt hope return.
  es: Entonces llegó la noticia de la caída de Sauron. Los Orientales se desanimaron, y los sitiados sintieron volver la esperanza.
- id: sally
  en: Bard, son of King Brand, and Thorin Stonehelm, son of King Dáin, led their people out of the Mountain together in a great charge.
  es: Bardo, hijo del rey Brand, y Thorin Yelmo de Piedra, hijo del rey Dáin, sacaron juntos a su gente de la Montaña en una gran carga.
- id: driven
  en: The Easterlings broke and fled, and Dale was free once more. The new kings mourned their fathers, who had died side by side at the Mountain's gate.
  es: Los Orientales se desbandaron y huyeron, y Valle volvió a ser libre. Los nuevos reyes lloraron a sus padres, que habían muerto codo con codo ante la puerta de la Montaña.
- id: friends
  en: Men and dwarves had held the North together, as their forefathers had in the days after the dragon. And they stayed friends for long years after.
  es: Hombres y enanos habían defendido juntos el Norte, como sus antepasados en los días que siguieron al dragón. Y siguieron siendo amigos durante muchos años.
