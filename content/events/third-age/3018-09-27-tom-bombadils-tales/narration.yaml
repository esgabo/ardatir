- id: rain
  en: "The next day it rained, Goldberry's washing day, so the hobbits stayed indoors and listened to Tom."
  es: "Al día siguiente llovió, pues era el día de colada de Baya de Oro, así que los hobbits se quedaron en casa escuchando a Tom."
- id: tales
  en: "He told of the forest and its old, bitter trees, of badgers and bees, and of the barrows on the downs, where kings had been laid to rest long ago with their gold."
  es: "Les habló del bosque y sus viejos árboles rencorosos, de tejones y abejas, y de los túmulos de las quebradas, donde hacía mucho se había dado sepultura a reyes con su oro."
- id: eldest
  en: "His stories went further and further back, to a time before Elves or Men. He had been here first, Tom said: he was the Eldest."
  es: "Sus historias se remontaban cada vez más atrás, a un tiempo anterior a los Elfos y a los Hombres. Él había estado allí primero, dijo Tom: era el Más Viejo."
- id: ring
  en: "That evening he asked to see the Ring. He slipped it on and did not vanish. He tossed it in the air, made it disappear, then laughed and gave it back."
  es: "Aquella tarde pidió ver el Anillo. Se lo puso y no desapareció. Lo lanzó al aire, lo hizo desaparecer, y luego se rio y lo devolvió."
- id: test
  en: "When Frodo put it on to test it, Tom could still see him, and laughed again. Before bed he taught them a rhyme to call him, if ever they needed help."
  es: "Cuando Frodo se lo puso para probarlo, Tom seguía viéndolo, y volvió a reírse. Antes de dormir les enseñó una canción para llamarlo si alguna vez necesitaban ayuda."
