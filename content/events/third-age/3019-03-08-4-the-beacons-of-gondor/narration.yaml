- id: ride
  en: Night after night, Shadowfax galloped south across Rohan, with Pippin bundled in front of Gandalf. The hobbit dozed and woke, and the land rushed by beneath the stars.
  es: Noche tras noche, Sombragris galopó hacia el sur a través de Rohan, con Pippin bien arropado delante de Gandalf. El hobbit se adormilaba y se despertaba, y la tierra pasaba veloz bajo las estrellas.
- id: fire
  en: Then Pippin saw a red light on a far mountain top, and then another beyond it. One by one, fires were blazing up on the hills along the mountains.
  es: Entonces Pippin vio una luz roja en la cima de una montaña lejana, y después otra más allá. Uno a uno, se encendían fuegos en las colinas a lo largo de las montañas.
- id: beacons
  en: Those are the beacons of Gondor, Gandalf told him. They were calling for help, and the fires were carrying the message west to Rohan.
  es: Son los fuegos de alarma de Gondor, le dijo Gandalf. Estaban pidiendo ayuda, y las hogueras llevaban el mensaje hacia el oeste, hasta Rohan.
- id: war
  en: War had come. Gandalf urged Shadowfax on, and the great horse ran faster still, toward Minas Tirith.
  es: La guerra había llegado. Gandalf apremió a Sombragris, y el gran caballo corrió aún más deprisa, rumbo a Minas Tirith.
