- id: wait
  en: Aragorn was king, but his heart was not at rest. He waited for a sign that the days of his waiting were nearly over.
  es: Aragorn era rey, pero su corazón no estaba en paz. Esperaba una señal de que sus días de espera estaban a punto de terminar.
- id: climb
  en: One night Gandalf led him up Mount Mindolluin, behind the city, by an old forgotten path, to a high place near the snows.
  es: Una noche, Gandalf lo condujo monte arriba por el Mindolluin, detrás de la ciudad, por un viejo sendero olvidado, hasta un lugar alto cerca de las nieves.
- id: sapling
  en: There, among the stones, grew a small young tree, no taller than a child, its long leaves silver underneath and dark on top.
  es: Allí, entre las piedras, crecía un arbolillo joven, no más alto que un niño, de hojas largas, plateadas por debajo y oscuras por encima.
- id: line
  en: It was a sapling of the White Tree, Gandalf said, of the line of the eldest of trees. Someone long ago must have hidden its seed there, to wait for a king.
  es: Era un retoño del Árbol Blanco, dijo Gandalf, del linaje del más antiguo de los árboles. Alguien, hacía mucho, debió de esconder allí su semilla, para que esperara a un rey.
- id: planted
  en: Aragorn carried it down with joy. The dead tree was laid to rest with honour, and the sapling was planted in the court of the fountain, where it grew and soon began to flower.
  es: Aragorn lo bajó lleno de alegría. El árbol muerto fue sepultado con honores, y el retoño se plantó en el patio de la fuente, donde creció y pronto empezó a florecer.
