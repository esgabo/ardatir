- id: hobbiton
  en: "After the battle, the four rode up to Hobbiton. It was hard to bear: old trees felled, homes dug up, and a new mill belching smoke into the stream."
  es: "Tras la batalla, los cuatro subieron a caballo a Hobbiton. Era difícil de soportar: árboles viejos talados, casas destrozadas y un molino nuevo que vomitaba humo sobre el arroyo."
- id: sharkey
  en: At Bag End, the mysterious boss called Sharkey was waiting at the door. It was Saruman. Having lost everything, he had come to spoil the hobbits' home out of spite.
  es: En Bolsón Cerrado, el misterioso jefe al que llamaban Zarquino esperaba en la puerta. Era Saruman. Tras perderlo todo, había venido a estropear el hogar de los hobbits por despecho.
- id: mercy
  en: The hobbits wanted to kill him, but Frodo would not allow it. Saruman struck at him with a knife, and the blade snapped on Frodo's hidden coat of mail. Still Frodo let him go.
  es: Los hobbits querían matarlo, pero Frodo no lo permitió. Saruman lo atacó con un cuchillo, y la hoja se partió contra la cota de malla oculta de Frodo. Aun así, Frodo lo dejó marchar.
- id: bitter
  en: Saruman looked at Frodo with wonder and hatred. The hobbit had grown, he said, and he hated him all the more for his mercy.
  es: Saruman miró a Frodo con asombro y con odio. El hobbit había crecido, dijo, y lo odiaba aún más por su compasión.
- id: grima
  en: Frodo offered Gríma a chance to stay and rest. But Saruman mocked his servant cruelly, until Gríma, pushed beyond bearing, sprang on his master and killed him. Hobbit archers shot Gríma as he fled.
  es: Frodo ofreció a Gríma la oportunidad de quedarse y descansar. Pero Saruman se burló cruelmente de su criado, hasta que Gríma, llevado más allá de lo soportable, se abalanzó sobre su amo y lo mató. Los arqueros hobbits abatieron a Gríma cuando huía.
- id: mist
  en: A grey mist rose from Saruman's body, like smoke from a fire. It turned toward the West, and a cold wind blew it away into nothing.
  es: Una niebla gris se elevó del cuerpo de Saruman, como el humo de una hoguera. Se volvió hacia el Oeste, y un viento frío la deshizo en la nada.
