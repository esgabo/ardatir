- id: muster
  en: "Two days after the Last Debate, the Host of the West gathered before the broken gate of Minas Tirith: seven thousand men, horse and foot."
  es: "Dos días después del último debate, la Hueste del Oeste se reunió ante la puerta rota de Minas Tirith: siete mil hombres, a caballo y a pie."
- id: captains
  en: At their head rode Aragorn under the banner of the White Tree, with Gandalf on Shadowfax, Éomer of Rohan, and Prince Imrahil of Dol Amroth.
  es: A su cabeza cabalgaba Aragorn bajo el estandarte del Árbol Blanco, con Gandalf a lomos de Sombragris, Éomer de Rohan y el príncipe Imrahil de Dol Amroth.
- id: pippin
  en: Pippin marched with the men of Gondor, wearing the black and silver of the Tower guard. Legolas and Gimli rode together on one horse, as they always did.
  es: Pippin marchaba con los hombres de Gondor, vestido con el negro y plata de la guardia de la Torre. Legolas y Gimli montaban juntos en un mismo caballo, como siempre.
- id: few
  en: It was a small army to send against the might of Mordor, and everyone knew it. But they did not march to win. They marched to give Frodo a chance.
  es: Era un ejército pequeño para enviarlo contra el poder de Mordor, y todos lo sabían. Pero no marchaban para vencer. Marchaban para darle una oportunidad a Frodo.
- id: road
  en: Trumpets sounded, and the Host set out east along the road, over the river at Osgiliath, toward the Black Gate.
  es: Sonaron las trompetas, y la Hueste partió hacia el este por el camino, cruzando el río en Osgiliath, rumbo a la Puerta Negra.
