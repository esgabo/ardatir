- id: ruin
  en: Théoden and Gandalf rode into Isengard and found it drowned. Water lay over everything, and Saruman's walls were heaps of broken stone.
  es: Théoden y Gandalf entraron a caballo en Isengard y la encontraron anegada. El agua lo cubría todo, y las murallas de Saruman eran montones de piedras rotas.
- id: hobbits
  en: At the ruined gate sat Merry and Pippin, comfortably smoking their pipes after a good meal. They welcomed the king to Isengard as if it were their own front door.
  es: En la puerta en ruinas estaban sentados Merry y Pippin, fumando en pipa muy a gusto tras una buena comida. Dieron la bienvenida al rey a Isengard como si fuera la puerta de su casa.
- id: voice
  en: Saruman came out on a balcony of Orthanc. His voice was soft and wise and hard to resist, and as he spoke, everyone who heard him began to doubt.
  es: Saruman salió a un balcón de Orthanc. Su voz era suave y sabia, difícil de resistir, y mientras hablaba, todos los que lo oían empezaban a dudar.
- id: refuse
  en: But Théoden would not be fooled again, and he answered Saruman with scorn. Saruman's mask slipped, and for a moment his anger showed.
  es: Pero Théoden no iba a dejarse engañar otra vez, y respondió a Saruman con desprecio. La máscara de Saruman cayó, y por un instante asomó su ira.
- id: staff
  en: Gandalf offered him a chance to come down and be free. Saruman refused. Then Gandalf cast him out of the order of wizards, and Saruman's staff split in his hand, its head falling at Gandalf's feet.
  es: Gandalf le ofreció la oportunidad de bajar y ser libre. Saruman se negó. Entonces Gandalf lo expulsó de la orden de los magos, y el bastón de Saruman se partió en su mano, y la punta cayó a los pies de Gandalf.
- id: stone
  en: "From a window above, something heavy came hurtling down. It just missed Gandalf and struck the steps: a dark ball of crystal. Pippin ran to pick it up."
  es: "Desde una ventana de lo alto cayó algo pesado. Pasó rozando a Gandalf y golpeó los escalones: una esfera oscura de cristal. Pippin corrió a recogerla."
