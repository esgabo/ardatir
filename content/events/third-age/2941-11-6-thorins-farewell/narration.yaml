- id: wake
  en: Bilbo woke on the cold stones of the hillside, with an aching head and an empty, quiet field below. The battle was over.
  es: Bilbo se despertó sobre las piedras frías de la ladera, con un fuerte dolor de cabeza y un campo vacío y silencioso a sus pies. La batalla había terminado.
- id: camp
  en: A searcher found him and carried him down to the camp at Dale. There Gandalf, his arm in a sling, was waiting, and took him to a tent where Thorin lay dying.
  es: Alguien que buscaba heridos lo encontró y lo llevó al campamento de Valle. Allí lo esperaba Gandalf, con el brazo en cabestrillo, que lo condujo a una tienda donde Thorin yacía moribundo.
- id: words
  en: Thorin was sorry, he said, for his angry words at the gate, and for what he had done. He did not want them to part as enemies, but as friends.
  es: Thorin le dijo que lamentaba sus palabras de ira junto a la puerta y lo que había hecho. No quería que se separaran como enemigos, sino como amigos.
- id: wisdom
  en: He told Bilbo that the simple ways of the Shire, its love of good food and laughter and home, held a wisdom he had understood too late.
  es: Le dijo a Bilbo que las costumbres sencillas de la Comarca, su amor por la buena comida, la risa y el hogar, encerraban una sabiduría que él había comprendido demasiado tarde.
- id: grief
  en: Then Thorin died. Bilbo sat alone for a long while and cried for his friend. Still, he was thankful that he had been there to say goodbye.
  es: Entonces Thorin murió. Bilbo se quedó solo largo rato, llorando por su amigo. Aun así, agradecía haber estado allí para despedirse.
