- id: road
  en: "Uneasy, Gandalf was riding near the borders of the Shire when he met Radagast the Brown, a wizard who loved birds and beasts. Radagast had been looking for him."
  es: "Inquieto, Gandalf cabalgaba cerca de las fronteras de la Comarca cuando se encontró con Radagast el Pardo, un mago que amaba a las aves y a las bestias. Radagast lo estaba buscando."
- id: nine
  en: "He brought grave news. The Ringwraiths had left Mordor in secret and were coming west, riding cloaked in black."
  es: "Traía noticias graves. Los Espectros del Anillo habían salido de Mordor en secreto y venían hacia el oeste, cabalgando envueltos en negro."
- id: summons
  en: "And he brought a message from Saruman, head of the White Council: if Gandalf needed help, he should come to Isengard at once."
  es: "Y traía un mensaje de Saruman, el jefe del Concilio Blanco: si Gandalf necesitaba ayuda, debía ir a Isengard de inmediato."
- id: birds
  en: "Gandalf asked Radagast to have his birds and beasts carry any news to him at Orthanc, Saruman's tower."
  es: "Gandalf le pidió a Radagast que sus aves y bestias le llevaran cualquier noticia a Orthanc, la torre de Saruman."
- id: letter
  en: "Then he wrote a letter telling Frodo to leave the Shire without delay, left it with the innkeeper at Bree to send on, and rode south for Isengard."
  es: "Luego escribió una carta en la que pedía a Frodo que dejara la Comarca sin demora, se la dejó al posadero de Bree para que la enviara, y cabalgó hacia el sur, rumbo a Isengard."
