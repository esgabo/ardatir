- id: mark
  en: "Days later, Strider and the hobbits climbed the same hill. On a stone Strider found Gandalf's mark: he had been there, three days before."
  es: "Días después, Trancos y los hobbits subieron a la misma colina. En una piedra Trancos encontró la marca de Gandalf: había estado allí tres días antes."
- id: dell
  en: "From the summit they saw black shapes on the road below. They hid in a dell under the hilltop, and as night came they built up their fire."
  es: "Desde la cumbre vieron unas formas negras en el camino, abajo. Se escondieron en una hondonada bajo la cima y, al llegar la noche, avivaron el fuego."
- id: tale
  en: "To keep their spirits up, Strider told them an old tale of love and loss: the story of Beren, a mortal man, and Lúthien, the fairest of the Elves."
  es: "Para darles ánimo, Trancos les contó una vieja historia de amor y de pérdida: la de Beren, un hombre mortal, y Lúthien, la más bella de los Elfos."
- id: ring
  en: "Then five shadows climbed toward them in the dark. Terror seized Frodo, and against his will he slipped on the Ring. Now he saw them clearly: tall kings, pale and cruel."
  es: "Entonces cinco sombras subieron hacia ellos en la oscuridad. El terror se apoderó de Frodo y, contra su voluntad, se puso el Anillo. Ahora los veía con claridad: reyes altos, pálidos y crueles."
- id: blade
  en: "The tallest stabbed at him with a cold blade. Frodo cried out the name of Elbereth and struck at the Rider's feet, and Strider leapt in with a burning branch in each hand."
  es: "El más alto lo apuñaló con una hoja fría. Frodo gritó el nombre de Elbereth y lanzó un golpe a los pies del Jinete, y Trancos se abalanzó con una rama ardiendo en cada mano."
- id: wound
  en: "The Riders fled, but Frodo's shoulder was as cold as ice. Strider knew the wound was very grave, and that they had to reach Rivendell as fast as they could."
  es: "Los Jinetes huyeron, pero el hombro de Frodo estaba frío como el hielo. Trancos sabía que la herida era muy grave, y que debían llegar a Rivendel cuanto antes."
