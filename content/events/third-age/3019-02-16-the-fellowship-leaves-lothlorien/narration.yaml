- id: boats
  en: "When the time came to go, the Elves gave the Company three light grey boats, waybread for the journey, and grey cloaks that blended with leaf and stone."
  es: "Cuando llegó la hora de partir, los Elfos dieron a la Compañía tres ligeras barcas grises, pan del camino para el viaje y capas grises que se confundían con las hojas y las piedras."
- id: gifts
  en: "Galadriel gave each of them a gift. Aragorn received a sheath for his sword and a green stone; Sam a little box of earth from her garden; Legolas a bow of the Galadhrim."
  es: "Galadriel les hizo un regalo a cada uno. Aragorn recibió una vaina para su espada y una piedra verde; Sam, una cajita con tierra de su jardín; Legolas, un arco de los Galadhrim."
- id: gimli
  en: "Gimli, asked what he wished for, dared to ask for a single hair of her golden head. She gave him three."
  es: "Gimli, cuando le preguntaron qué deseaba, se atrevió a pedir un solo cabello de su cabeza dorada. Ella le dio tres."
- id: phial
  en: "To Frodo she gave a small crystal phial holding the light of a star, a light he could carry where no other light could reach."
  es: "A Frodo le dio un pequeño frasco de cristal que guardaba la luz de una estrella, una luz que podría llevar adonde ninguna otra llegara."
- id: away
  en: "As they drifted down the river, the Lady stood on the shore and grew smaller and smaller, until she was gone. Gimli wept."
  es: "Mientras se alejaban río abajo, la Señora se quedó en la orilla, cada vez más pequeña, hasta que desapareció. Gimli lloró."
- id: gollum
  en: "Somewhere among the trees, a pair of pale eyes watched them go. Gollum was following."
  es: "En algún lugar entre los árboles, un par de ojos pálidos los vio partir. Gollum los seguía."
