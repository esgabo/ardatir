- id: rope
  en: At last the hobbits climbed down a sheer cliff on Sam's elvish rope, in wind and rain. At the bottom Sam gave the rope a sorry tug, and to his amazement it came loose and fell into his hands.
  es: Por fin los hobbits bajaron por un acantilado cortado a pico con la cuerda élfica de Sam, entre viento y lluvia. Abajo, Sam dio un tirón desconsolado a la cuerda y, para su asombro, se soltó y le cayó en las manos.
- id: spider
  en: That night, in the moonlight, they saw a thin dark shape creeping head first down the cliff face like a spider. It was Gollum, still hunting for his precious.
  es: Aquella noche, a la luz de la luna, vieron una figura flaca y oscura que bajaba de cabeza por la pared del acantilado como una araña. Era Gollum, que aún perseguía su tesoro.
- id: fight
  en: Near the bottom he slipped and fell. Sam leapt on him, and Gollum fought back with teeth and long cold fingers, until Frodo drew Sting and held it to his throat.
  es: Cerca del fondo resbaló y cayó. Sam se abalanzó sobre él, y Gollum se defendió con los dientes y con sus largos dedos fríos, hasta que Frodo desenvainó a Dardo y se lo puso en la garganta.
- id: pity
  en: Frodo remembered what Gandalf had said about pity, long ago in Bag End. Now that he saw the wretched creature for himself, he could not kill him.
  es: Frodo recordó lo que Gandalf le había dicho sobre la compasión, mucho tiempo atrás en Bolsón Cerrado. Ahora que veía con sus propios ojos a la desdichada criatura, no podía matarlo.
- id: leash
  en: They tied the elvish rope to Gollum's ankle, but it burned him like fire, and he wailed and wept. Frodo asked for a promise instead.
  es: Le ataron la cuerda élfica al tobillo, pero le quemaba como el fuego, y Gollum gemía y lloraba. Frodo le pidió entonces una promesa.
- id: oath
  en: Gollum swore on the Ring itself to serve its master and lead them to Mordor. Frodo warned him that the Ring would hold him to his word. Sam was not convinced at all.
  es: Gollum juró sobre el propio Anillo servir a su dueño y guiarlos hasta Mordor. Frodo le advirtió que el Anillo lo obligaría a cumplir su palabra. Sam no estaba nada convencido.
