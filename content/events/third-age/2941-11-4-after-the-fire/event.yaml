summary:
  en: "On the shore, the homeless people of Lake-town want Bard for their king, while the Master turns their anger on the dwarves. The Elvenking, marching for the Mountain, turns aside to help them, and elves and men set out together for the dragon's treasure."
  es: "En la orilla, la gente sin hogar de la Ciudad del Lago quiere a Bardo por rey, mientras el Gobernador vuelve su enfado contra los enanos. El Rey Elfo, que marchaba hacia la Montaña, se desvía para ayudarlos, y elfos y hombres parten juntos hacia el tesoro del dragón."
