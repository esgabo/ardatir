      - { t: 0.62, x: -11, z: 4, action: walk }
      - { t: 0.66, x: -3.4, z: 2.8, action: walk, thought: { en: The lake-men are our friends. The Mountain can wait a few days., es: Los hombres del lago son nuestros amigos. La Montaña puede esperar unos días. } }
      - { t: 0.82, x: -3, z: 2.6, action: talk }
      - { t: 1, x: -6.2, z: -4, action: walk, thought: { en: "Now, to the dragon's gold.", es: "Ahora, al oro del dragón." } }
