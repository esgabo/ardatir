- id: shore
  en: Morning over the Long Lake showed Lake-town in ruins. The survivors huddled on the shore, cold and hungry, and many of them had no home left at all.
  es: La mañana sobre el Lago Largo mostró la Ciudad del Lago en ruinas. Los supervivientes se apiñaban en la orilla, con frío y hambre, y muchos ya no tenían hogar alguno.
- id: king
  en: Word spread that Bard had killed the dragon, and the people began to shout that he should be their king, and not the Master, who had fled in his boat.
  es: Corrió la voz de que Bardo había matado al dragón, y la gente empezó a gritar que él debía ser su rey, y no el Gobernador, que había huido en su barca.
- id: master
  en: The Master, always quick with words, turned their anger on the dwarves. It was they, he said, who had woken the dragon. Bard stayed to lead the people, and for now the Master kept his seat.
  es: El Gobernador, siempre hábil con las palabras, volvió su enfado contra los enanos. Fueron ellos, dijo, quienes despertaron al dragón. Bardo se quedó a guiar al pueblo, y por el momento el Gobernador conservó su puesto.
- id: treasure
  en: Then the people remembered the treasure. With no dragon to guard it, the gold of the Mountain lay waiting, and some of it, they felt, was owed to them.
  es: Entonces la gente recordó el tesoro. Sin un dragón que lo guardara, el oro de la Montaña estaba allí esperando, y creían que una parte se les debía.
- id: elves
  en: News of the dragon's fall had reached the Elvenking too, and he was marching for the Mountain with a great host. When he heard of the lake-men's need, he turned aside to help them.
  es: La noticia de la caída del dragón había llegado también al Rey Elfo, que marchaba hacia la Montaña con una gran hueste. Cuando supo de la necesidad de los hombres del lago, se desvió para ayudarlos.
- id: march
  en: Elves and men worked side by side to shelter the people. Then, leaving many behind to rebuild, the two hosts set out north together, toward the Lonely Mountain.
  es: Elfos y hombres trabajaron codo con codo para dar refugio a la gente. Después, dejando a muchos atrás para reconstruir, las dos huestes partieron juntas hacia el norte, hacia la Montaña Solitaria.
