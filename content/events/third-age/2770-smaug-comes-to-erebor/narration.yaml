- id: kingdom
  en: Under the Lonely Mountain, the dwarves of King Thrór dug deep halls and grew rich, and the town of Dale in the valley below prospered from their trade.
  es: Bajo la Montaña Solitaria, los enanos del rey Thrór excavaron grandes estancias y se hicieron ricos, y la ciudad de Valle, en el llano a sus pies, prosperó gracias a su comercio.
- id: dragon
  en: But a hoard of gold and jewels that large does not stay secret from dragons. In the far North lived a dragon mightier and greedier than any other, and his name was Smaug.
  es: Pero un tesoro de oro y gemas tan grande no pasa desapercibido para los dragones. En el lejano Norte vivía un dragón más poderoso y codicioso que ningún otro, y se llamaba Smaug.
- id: attack
  en: He came out of the North in a storm of wind and flame. The pines on the mountainside caught fire, Dale was burned, and its warriors fell.
  es: Llegó desde el Norte entre un torbellino de viento y llamas. Los pinos de las laderas ardieron, Valle fue incendiada y sus guerreros cayeron.
- id: halls
  en: Then the dragon forced his way into the Mountain itself and hunted down every dwarf he could find, hall by hall.
  es: Entonces el dragón penetró en la propia Montaña y dio caza, estancia por estancia, a todos los enanos que encontró.
- id: escape
  en: Thrór and his son Thráin got away through a secret door. Young Thorin had been out wandering that day, and with the few others outside he hid, and watched, and wept.
  es: Thrór y su hijo Thráin escaparon por una puerta secreta. El joven Thorin andaba fuera aquel día, y con los pocos que también estaban fuera se escondió, miró y lloró.
- id: lost
  en: Smaug gathered all the treasure into one great heap in the deepest hall and lay down on it to sleep. The kingdom under the Mountain was lost.
  es: Smaug amontonó todo el tesoro en la estancia más profunda y se tumbó encima a dormir. El reino bajo la Montaña estaba perdido.
