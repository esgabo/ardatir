summary:
  en: "Drawn by the gold of the dwarves, the dragon Smaug falls on the Lonely Mountain and on Dale. Thrór and Thráin escape through a secret door, and young Thorin, out wandering, survives outside. The kingdom is lost."
  es: "Atraído por el oro de los enanos, el dragón Smaug cae sobre la Montaña Solitaria y sobre Valle. Thrór y Thráin escapan por una puerta secreta, y el joven Thorin, que andaba fuera, sobrevive. El reino se pierde."
