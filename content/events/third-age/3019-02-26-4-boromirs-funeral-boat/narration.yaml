- id: grief
  en: "Legolas and Gimli found Aragorn kneeling beside Boromir, weeping. There was no time to raise a mound or build a cairn, so they chose an older way: the river would carry him."
  es: "Legolas y Gimli encontraron a Aragorn arrodillado junto a Boromir, llorando. No había tiempo para alzar un túmulo ni un montón de piedras, así que eligieron un modo más antiguo: el río se lo llevaría."
- id: boat
  en: They laid him in one of the grey boats of Lórien, his head on a folded cloak, his golden belt about him. His broken sword lay on his lap, the two halves of his horn beside it, and the weapons of his enemies at his feet.
  es: Lo tendieron en una de las barcas grises de Lórien, con la cabeza sobre una capa doblada y el cinturón dorado ceñido a la cintura. La espada rota descansaba en su regazo, junto a las dos mitades de su cuerno, y las armas de sus enemigos a sus pies.
- id: river
  en: Aragorn and Legolas paddled the boat out and let it go. It slipped away down the swift water, dwindling to a dark speck on the glimmering river, toward the roaring falls of Rauros.
  es: Aragorn y Legolas sacaron la barca remando y la soltaron. Se alejó por la corriente veloz, hasta quedar en una mota oscura sobre el agua reluciente, hacia las cascadas rugientes de Rauros.
- id: falls
  en: The boat reached the edge and was gone. The river had taken Boromir, son of Denethor, and the three friends never saw him again.
  es: La barca llegó al borde y desapareció. El río se había llevado a Boromir, hijo de Denethor, y los tres amigos no volvieron a verlo.
- id: lament
  en: Standing on the shore, Aragorn and Legolas sang a lament for him, of the winds that blow toward his white city and find him gone. Gimli kept silent, his head bowed.
  es: De pie en la orilla, Aragorn y Legolas le cantaron un lamento, sobre los vientos que soplan hacia su ciudad blanca y no lo encuentran. Gimli guardaba silencio, con la cabeza inclinada.
