- id: tomb
  en: They carried Thorin deep under the Mountain he had won back, and laid him in a tomb of stone.
  es: Llevaron a Thorin a lo más hondo de la Montaña que había recuperado, y lo depositaron en una tumba de piedra.
- id: stone
  en: Bard placed the Arkenstone on Thorin's breast, to lie with him for as long as the Mountain stands.
  es: Bardo colocó la Piedra del Arca sobre el pecho de Thorin, para que reposara con él mientras la Montaña siguiera en pie.
- id: sword
  en: The Elvenking laid Orcrist upon the tomb, the elven blade taken from Thorin when he was a prisoner. From then on the blade would shine whenever foes came near, so no enemy could creep up on the dwarves unseen.
  es: El Rey Elfo dejó sobre la tumba a Orcrist, la espada élfica que le habían quitado a Thorin cuando era prisionero. Desde entonces, la hoja brillaría cada vez que se acercaran enemigos, y ninguno podría sorprender a los enanos sin ser visto.
- id: mourning
  en: They mourned Fíli and Kíli too, who had given their lives defending him.
  es: Lloraron también a Fíli y a Kíli, que habían dado la vida defendiéndolo.
- id: dain
  en: Dáin became King under the Mountain, and ruled wisely. He shared out the treasure fairly, and Bard had his share at last, to rebuild Dale.
  es: Dáin se convirtió en Rey bajo la Montaña y gobernó con sabiduría. Repartió el tesoro con justicia, y Bardo recibió por fin su parte, para reconstruir Valle.
- id: peace
  en: Where there had been a dragon, there was now a king again, and friendship between the Mountain and its neighbours.
  es: Donde antes había un dragón, ahora volvía a haber un rey, y amistad entre la Montaña y sus vecinos.
