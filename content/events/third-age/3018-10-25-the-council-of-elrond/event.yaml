summary:
  en: "Elves, Dwarves and Men gather to decide the fate of the Ring. Erestor asks whether Bombadil, whom it cannot touch, might keep it; Gandalf answers that Tom would not see why it mattered and would soon mislay it, and Glorfindel that the Enemy would come for it there in the end. Since it cannot be used or hidden, it must be destroyed in Mount Doom, and Frodo takes the task upon himself."
  es: "Elfos, Enanos y Hombres se reúnen para decidir el destino del Anillo. Erestor pregunta si Bombadil, sobre quien no tiene poder, podría guardarlo; Gandalf responde que Tom no entendería por qué importa y pronto lo perdería, y Glorfindel, que al final el Enemigo iría a buscarlo allí. Como no puede usarse ni esconderse, debe ser destruido en el Monte del Destino, y Frodo asume la tarea."
