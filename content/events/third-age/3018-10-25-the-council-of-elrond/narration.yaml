- id: gather
  en: "In the morning Elrond called his Council. Elves, Dwarves and Men sat together, each come for their own reasons, and Frodo was there with Bilbo."
  es: "Por la mañana Elrond reunió su Concilio. Elfos, Enanos y Hombres se sentaron juntos, cada uno venido por sus propios motivos, y Frodo estaba allí con Bilbo."
- id: news
  en: "Each told their news. Glóin spoke of a messenger from Mordor asking about a hobbit. Boromir told of his dream and of war in Gondor, and Aragorn showed him the broken sword of Isildur."
  es: "Cada uno contó sus noticias. Glóin habló de un mensajero de Mordor que preguntaba por un hobbit. Boromir habló de su sueño y de la guerra en Gondor, y Aragorn le mostró la espada rota de Isildur."
- id: ring
  en: "Frodo held up the Ring for all to see. Gandalf told how he had learned what it was, and how Saruman had betrayed them."
  es: "Frodo sostuvo en alto el Anillo para que todos lo vieran. Gandalf contó cómo había descubierto lo que era, y cómo Saruman los había traicionado."
- id: bombadil
  en: "What could they do with it? Erestor asked if Tom Bombadil, over whom it had no power, might keep it. Tom would not see why it mattered, Gandalf said, and would soon mislay it; and in the end, Glorfindel added, the Enemy would come for it there."
  es: "¿Qué podían hacer con él? Erestor preguntó si Tom Bombadil, sobre quien no tenía poder, podría guardarlo. Tom no entendería por qué importaba, dijo Gandalf, y pronto lo perdería; y al final, añadió Glorfindel, el Enemigo iría a buscarlo allí."
- id: destroy
  en: "Boromir wanted to use it against the Enemy, but Elrond explained that it would corrupt anyone who wielded it. It could not be hidden either. It had to be destroyed, in the fire where it was made, deep in Mordor."
  es: "Boromir quería usarlo contra el Enemigo, pero Elrond explicó que corrompería a quien lo empuñara. Tampoco podía esconderse. Había que destruirlo, en el fuego donde fue forjado, en lo más hondo de Mordor."
- id: frodo
  en: "A long silence fell. Then, in a small voice, Frodo offered to carry it himself."
  es: "Se hizo un largo silencio. Entonces, con un hilo de voz, Frodo se ofreció a llevarlo él mismo."
- id: sam
  en: "Sam, who had been hiding in a corner all along, jumped up. His master was not going without him."
  es: "Sam, que había estado escondido en un rincón todo el tiempo, se levantó de un salto. Su señor no iba a ir sin él."
