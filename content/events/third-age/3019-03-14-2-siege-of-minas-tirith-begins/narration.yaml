- id: ring
  en: The armies of Mordor swarmed over the fields and closed around Minas Tirith. Orcs dug long trenches and filled them with fire.
  es: Los ejércitos de Mordor invadieron los campos y cercaron Minas Tirith. Los orcos cavaron largas zanjas y las llenaron de fuego.
- id: engines
  en: Great engines began to hurl burning missiles over the walls, and fires broke out in the lower city. Worse still, they flung back the heads of the soldiers who had fallen, to break the defenders' hearts.
  es: Grandes máquinas empezaron a lanzar proyectiles ardientes por encima de las murallas, y estallaron incendios en la ciudad baja. Peor aún, arrojaron las cabezas de los soldados caídos, para quebrantar el ánimo de los defensores.
- id: fear
  en: Above the city the Nazgûl circled and cried, and their cries filled the hearts of men with dread. Many threw down their weapons and hid.
  es: Sobre la ciudad, los Nazgûl volaban en círculos y chillaban, y sus gritos llenaban de pavor el corazón de los hombres. Muchos arrojaban las armas y se escondían.
- id: denethor
  en: Denethor would not leave Faramir's side. Pippin stood by him in the tower room, while the Steward sat in despair and said that all was lost.
  es: Denethor no se apartaba del lado de Faramir. Pippin permanecía junto a él en la habitación de la torre, mientras el Senescal, desesperado, decía que todo estaba perdido.
- id: gandalf
  en: So Gandalf took up the defence of the city. Riding the walls on Shadowfax with Prince Imrahil, he gave the soldiers courage when their own lord could not.
  es: Así que Gandalf se hizo cargo de la defensa de la ciudad. Recorría las murallas a lomos de Sombragris con el príncipe Imrahil, y daba valor a los soldados cuando su propio señor no podía.
