- id: road
  en: For days the hobbits had crept along the road toward the Dark Tower. Now, as night fell, they left it and turned south, straight across the open plain toward Mount Doom.
  es: Durante días, los hobbits habían avanzado a escondidas por el camino hacia la Torre Oscura. Ahora, al caer la noche, lo dejaron y se volvieron hacia el sur, directos a través de la llanura abierta hacia el Monte del Destino.
- id: water
  en: Their water was almost gone, and there was little food left. Sam began to measure every drop and every crumb.
  es: El agua casi se les había acabado, y les quedaba poca comida. Sam empezó a medir cada gota y cada migaja.
- id: ring
  en: Frodo grew weaker every hour. The Ring dragged at him, and he said he could see a wheel of fire before his eyes, even awake.
  es: Frodo se debilitaba a cada hora. El Anillo tiraba de él, y decía que veía una rueda de fuego ante los ojos, incluso despierto.
- id: return
  en: Sam understood that even if they did their task, they would never have the strength or the food to come home again.
  es: Sam comprendió que, aunque cumplieran su misión, nunca tendrían fuerzas ni comida suficientes para volver a casa.
- id: will
  en: Yet instead of giving up, Sam felt a new stubbornness rise in him, as hard as stone. He would see his master to the mountain, whatever it took.
  es: Pero en lugar de rendirse, Sam sintió crecer en él una nueva terquedad, dura como la piedra. Llevaría a su amo hasta la montaña, costara lo que costase.
