      - { t: 0.5, x: 2.05, z: 2.78, action: talk }
      - { t: 0.72, x: 2.05, z: 2.78, action: idle }
      - { t: 0.86, x: 2.05, z: 2.78, action: idle, thought: { en: "There he is, out of breath. He came.", es: "Ahí está, sin aliento. Vino." } }
