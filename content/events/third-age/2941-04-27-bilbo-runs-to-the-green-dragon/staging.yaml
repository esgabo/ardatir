stage: diorama
duration: 38
set: kits/shire/green-dragon.glb
light:
  - { t: 0, preset: morning }
  - { t: 1, preset: day }
# The shot (#28): the inn with the company already waiting, then away west to Bag End for the
# empty house and the note on the mantelpiece, then east again at Bilbo's heels, so the last
# thing in frame is the road out of the Shire. The two halves of this scene are eleven tile
# units apart, which is why one wide shot could hold neither of them.
camera:
  - { t: 0, x: 2.50, z: 1.00, width: 9.5 }
  - { t: 0.17, x: -4.80, z: -1.40, width: 6.0 }
  - { t: 0.33, x: -5.00, z: -1.00, width: 5.5 }
  - { t: 0.5, x: -5.00, z: -0.90, width: 5.5 }
  - { t: 0.64, x: -3.00, z: 0.20, width: 9.0 }
  - { t: 0.84, x: 1.80, z: 1.60, width: 9.0 }
  - { t: 1, x: 4.60, z: 2.30, width: 8.0 }
# What the scene does, at the beat it does it (DESIGN §9.5).
sound:
  # All that is left of thirteen dwarves is the washing-up.
  - { t: 0.06, cue: clatter, gain: 0.6 }
  # Gandalf lets himself in and points at the mantelpiece.
  - { t: 0.3, cue: door }
  # The clock the note was lying under: eleven o'clock, and ten minutes to get there.
  - { t: 0.47, cue: chime, gain: 0.7 }
  # Out of the door with nothing, not even a handkerchief.
  - { t: 0.645, cue: door }
narration:
  morning: 0
  relief: 0.17
  note: 0.33
  eleven: 0.5
  run: 0.64
  away: 0.84
beats:
  quiet: 0
  note: 0.33
  dash: 0.64
  off: 0.86
tracks:
  - characterId: thorin
    keyframes:
      - { t: 0, x: 1.30, z: 2.75, action: idle, thought: { en: "He has had time to read my note.", es: "Ha tenido tiempo de leer mi nota." } }
      - { t: 0.5, x: 1.30, z: 2.75, action: talk }
      - { t: 0.72, x: 1.30, z: 2.75, action: idle }
      - { t: 0.86, x: 1.30, z: 2.75, action: idle }
      - { t: 0.93, x: 1.30, z: 2.75, action: walk }
      - { t: 1, x: 4.90, z: 2.75, action: walk }
  - characterId: balin
    keyframes:
