- id: morning
  en: Bilbo woke late the next morning to a very quiet house. The dwarves had gone, and all that was left of them was a mountain of dirty dishes.
  es: A la mañana siguiente, Bilbo se despertó tarde en una casa muy silenciosa. Los enanos se habían ido, y lo único que quedaba de ellos era una montaña de platos sucios.
- id: relief
  en: So it had all been some strange dream after all. He felt relieved, and, to his own surprise, a little sorry too.
  es: Así que todo había sido un sueño extraño, después de todo. Se sintió aliviado y, para su propia sorpresa, también un poco decepcionado.
- id: note
  en: He was just sitting down to a second breakfast when Gandalf strolled in and pointed at the mantelpiece. Under the clock lay a note from Thorin.
  es: Acababa de sentarse a tomar un segundo desayuno cuando Gandalf entró tranquilamente y señaló la repisa de la chimenea. Bajo el reloj había una nota de Thorin.
- id: eleven
  en: The dwarves thanked him for agreeing to be their burglar, and would wait for him at the Green Dragon in Bywater at eleven o'clock. It was already nearly a quarter to eleven.
  es: Los enanos le daban las gracias por aceptar ser su saqueador, y lo esperarían en el Dragón Verde, en Delagua, a las once en punto. Ya eran casi las once menos cuarto.
- id: run
  en: There was no time to think. Bilbo ran out of the door and down the lane, without a hat, a walking stick, any money, or even a pocket-handkerchief.
  es: No había tiempo para pensar. Bilbo salió por la puerta y corrió camino abajo, sin sombrero, sin bastón, sin dinero y sin un solo pañuelo.
- id: away
  en: At the inn the dwarves were waiting with their ponies. They lifted the breathless hobbit onto one, and the company rode out of the Shire. The adventure had begun.
  es: En la posada lo esperaban los enanos con sus poneys. Subieron al hobbit, sin aliento, a uno de ellos, y la compañía partió de la Comarca. La aventura había comenzado.
