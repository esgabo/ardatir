- id: morning
  en: Bilbo woke late the next morning to a very quiet house. The dwarves had gone, and all that was left of them was a mountain of dirty dishes.
  es: A la mañana siguiente, Bilbo se despertó tarde en una casa muy silenciosa. Los enanos se habían ido, y lo único que quedaba de ellos era una montaña de platos sucios.
- id: relief
  en: So it had all been some strange dream after all. He felt relieved, and, to his own surprise, a little sorry too.
  es: Así que todo había sido un sueño extraño, después de todo. Se sintió aliviado y, para su propia sorpresa, también un poco decepcionado.
- id: note
  en: Bilbo had barely started on his second breakfast when Gandalf came in and pointed at the mantelpiece, where a note from Thorin lay under the clock.
  es: Bilbo apenas había empezado su segundo desayuno cuando entró Gandalf y señaló la repisa de la chimenea, donde había una nota de Thorin bajo el reloj.
- id: eleven
  en: The dwarves thanked him for agreeing to be their burglar, and would wait for him at the Green Dragon in Bywater at eleven o'clock. He had barely ten minutes to get there.
  es: Los enanos le daban las gracias por aceptar ser su saqueador, y lo esperarían en el Dragón Verde, en Delagua, a las once en punto. A Bilbo le quedaban apenas diez minutos para llegar.
- id: run
  en: There was no time to think. Bilbo dashed out of the door and down the lane, leaving behind everything a hobbit takes on a walk, even his pocket-handkerchief.
  es: No había tiempo para pensar. Bilbo salió disparado por la puerta y camino abajo, dejándose todo lo que un hobbit lleva de paseo, hasta el pañuelo.
- id: away
  en: At the inn the dwarves were waiting with their ponies. They lifted the breathless hobbit onto one, and the company rode out of the Shire. The adventure had begun.
  es: En la posada lo esperaban los enanos con sus poneys. Subieron al hobbit, sin aliento, a uno de ellos, y la compañía partió de la Comarca. La aventura había comenzado.
