summary:
  en: "The dwarves avenge Thrór before the gates of Moria. Thorin fights with an oak branch for a shield and earns his name; Dáin slays Azog, but knowing what still waits in Moria, he will not let them enter."
  es: "Los enanos vengan a Thrór ante las puertas de Moria. Thorin lucha con una rama de roble como escudo y gana su nombre; Dáin mata a Azog, pero sabiendo lo que aún aguarda en Moria, no permite que entren."
