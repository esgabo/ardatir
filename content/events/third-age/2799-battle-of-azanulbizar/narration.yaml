- id: thror
  en: Years after the dragon came, old King Thrór went into the ancient dwarf-city of Moria, and the orc-chieftain Azog killed him there and dishonoured his body.
  es: Años después de la llegada del dragón, el viejo rey Thrór entró en Moria, la antigua ciudad de los enanos, y allí el cabecilla orco Azog lo mató y deshonró su cuerpo.
- id: war
  en: Every house of the dwarves rose up to avenge him. For years they hunted orcs through the mountains, until the war came to its end before the eastern gate of Moria, in the valley of Azanulbizar.
  es: Todas las casas de los enanos se alzaron para vengarlo. Durante años persiguieron a los orcos por las montañas, hasta que la guerra llegó a su fin ante la puerta oriental de Moria, en el valle de Azanulbizar.
- id: battle
  en: The orcs held the high ground and far outnumbered them, and the fighting was long and terrible. Thorin's brother Frerin fell, and many others with him.
  es: Los orcos dominaban el terreno alto y eran muchos más, y la lucha fue larga y terrible. Frerin, el hermano de Thorin, cayó, y con él muchos otros.
- id: oak
  en: When Thorin's shield was broken, he cut a branch from an oak tree and fought on with it, guarding himself with it and striking with it. From that day he was called Thorin Oakenshield.
  es: Cuando el escudo de Thorin se rompió, cortó una rama de roble y siguió luchando con ella, para protegerse y para golpear. Desde aquel día lo llamaron Thorin Escudo de Roble.
- id: dain
  en: At the gate, Azog struck down Náin. But Náin's son Dáin, still young, faced the orc in turn and killed him, and the orcs broke and fled.
  es: Ante la puerta, Azog abatió a Náin. Pero Dáin, el hijo de Náin, aún joven, se enfrentó al orco a su vez y lo mató, y los orcos huyeron en desbandada.
- id: moria
  en: Thráin wanted to march into Moria and take it back. Dáin refused. Something terrible still lurked in the deep, he said, and no dwarf could stand against it.
  es: Thráin quería entrar en Moria y recuperarla. Dáin se negó. Algo terrible acechaba aún en las profundidades, dijo, y ningún enano podría hacerle frente.
- id: after
  en: So the dwarves burned their many dead, which grieved them deeply, and went their separate ways. Thráin and Thorin wandered west, into exile.
  es: Así que los enanos quemaron a sus muchos muertos, lo que les causó un hondo pesar, y cada uno siguió su camino. Thráin y Thorin partieron hacia el oeste, al exilio.
