- id: dusk
  en: On a dark evening, Pippin and Beregond stood on the walls and saw riders racing across the fields toward the city. Above them, black winged shapes were swooping down.
  es: Una tarde oscura, Pippin y Beregond estaban en las murallas y vieron unos jinetes que corrían por los campos hacia la ciudad. Sobre ellos, unas negras figuras aladas se lanzaban en picado.
- id: nazgul
  en: The Nazgûl were hunting them. The riders' horses went mad with fear, and men were thrown to the ground.
  es: Los Nazgûl les daban caza. Los caballos enloquecieron de miedo, y los hombres cayeron a tierra.
- id: light
  en: Then a white rider shot out of the gate like a falling star. Gandalf raised his hand, and a shaft of white light leapt up. The Nazgûl gave a cry and fled.
  es: Entonces un jinete blanco salió por la puerta como una estrella fugaz. Gandalf alzó la mano, y un haz de luz blanca se elevó. Los Nazgûl lanzaron un grito y huyeron.
- id: faramir
  en: The last rider safely in was Faramir, Boromir's brother. Pippin saw at once that he was like Boromir in face, yet gentler, with a quiet wisdom in his eyes.
  es: El último jinete que llegó a salvo era Faramir, el hermano de Boromir. Pippin vio enseguida que se parecía a Boromir en el rostro, pero era más amable, con una serena sabiduría en la mirada.
- id: news
  en: Before his father, Faramir told of meeting two hobbits in Ithilien and letting them go on their way. Gandalf grew very grave when he heard their road led to Cirith Ungol.
  es: Ante su padre, Faramir contó que había encontrado a dos hobbits en Ithilien y los había dejado seguir su camino. Gandalf se puso muy serio al saber que su camino llevaba a Cirith Ungol.
- id: cold
  en: Denethor was cold with his son. He grieved for Boromir and wished aloud that the brothers' places had been exchanged. Faramir bowed his head and said nothing.
  es: Denethor se mostró frío con su hijo. Lloraba a Boromir y deseó en voz alta que los hermanos se hubieran cambiado el puesto. Faramir inclinó la cabeza y no dijo nada.
