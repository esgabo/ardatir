- id: march
  en: The Ents strode out of the forest toward Isengard, singing as they went, with Merry and Pippin riding on their shoulders. Behind them, the trees themselves seemed to follow.
  es: Los Ents salieron del bosque a grandes zancadas rumbo a Isengard, cantando por el camino, con Merry y Pippin a hombros. Tras ellos, los propios árboles parecían seguirlos.
- id: empty
  en: They came at nightfall. Saruman's great army had just marched out to war against Rohan, and only a small guard was left behind the walls.
  es: Llegaron al anochecer. El gran ejército de Saruman acababa de partir a la guerra contra Rohan, y tras las murallas solo quedaba una pequeña guardia.
- id: walls
  en: The Ents broke the gates as if they were twigs, and broke stone the way slow roots break rock, only far faster. Saruman's fires burned one of them, and their anger became terrible.
  es: Los Ents rompieron las puertas como si fueran ramitas, y partían la piedra como las raíces lentas parten la roca, solo que mucho más deprisa. Los fuegos de Saruman quemaron a uno de ellos, y su ira se volvió terrible.
- id: orthanc
  en: Saruman fled into his tower of Orthanc and locked himself in. Its black stone was too hard even for the Ents.
  es: Saruman huyó a su torre de Orthanc y se encerró en ella. Su piedra negra era demasiado dura incluso para los Ents.
- id: flood
  en: So Treebeard dammed the river Isen and turned it into Isengard. The water poured into the pits and furnaces with hissing steam, until the tower stood alone in a lake.
  es: Así que Bárbol represó el río Isen y lo desvió hacia Isengard. El agua inundó fosos y hornos entre siseos de vapor, hasta que la torre quedó sola en medio de un lago.
