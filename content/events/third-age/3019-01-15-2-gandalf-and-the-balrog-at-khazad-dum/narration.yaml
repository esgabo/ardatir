- id: flee
  en: "They fled down stairs and passages. Gandalf stayed behind to seal the door with a spell, but something terrible strove against him, and the door burst apart."
  es: "Huyeron por escaleras y pasadizos. Gandalf se quedó atrás para sellar la puerta con un conjuro, pero algo terrible luchó contra él, y la puerta saltó en pedazos."
- id: hall
  en: "In a vast hall split by a chasm of fire, they ran for a narrow bridge with no rail, while Orcs shot arrows from across the flames."
  es: "En una sala inmensa partida por un abismo de fuego, corrieron hacia un puente estrecho y sin baranda, mientras los orcos disparaban flechas desde el otro lado de las llamas."
- id: balrog
  en: "Then the Balrog came: a great shadow wrapped in smoke and flame, with a sword of fire and a many-thonged whip, a demon of the ancient world."
  es: "Entonces llegó el Balrog: una gran sombra envuelta en humo y llamas, con una espada de fuego y un látigo de muchas colas, un demonio del mundo antiguo."
- id: stand
  en: "Gandalf turned and stood alone in the middle of the bridge, leaning on his staff, barring its way. Fire met white light, and the Balrog's sword shattered."
  es: "Gandalf se volvió y se plantó solo en mitad del puente, apoyado en su bastón, cerrándole el paso. El fuego chocó con una luz blanca, y la espada del Balrog se hizo añicos."
- id: fall
  en: "He struck the bridge with his staff and it broke, and the Balrog fell. But as it fell, its whip curled around Gandalf's knees and dragged him down into the dark."
  es: "Golpeó el puente con su bastón y este se partió, y el Balrog cayó. Pero al caer, su látigo se enroscó en las rodillas de Gandalf y lo arrastró a la oscuridad."
- id: out
  en: "Aragorn led the stunned Company up through the Great Gates into the daylight. Only there, outside, did they let themselves weep."
  es: "Aragorn guio a la aturdida Compañía a través de las Grandes Puertas hasta la luz del día. Solo allí, fuera, se permitieron llorar."
