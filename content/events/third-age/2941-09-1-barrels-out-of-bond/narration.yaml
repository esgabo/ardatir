- id: cellars
  en: Beneath the palace, Bilbo found the cellars. Empty barrels were rolled through a trapdoor into the river, to float downstream to Lake-town.
  es: Bajo el palacio, Bilbo encontró las bodegas. Los barriles vacíos se arrojaban por una trampilla al río, para que flotaran corriente abajo hasta la Ciudad del Lago.
- id: wine
  en: One night of feasting, the king's butler and the captain of the guard shared a jug of strong wine, and both fell fast asleep. Bilbo slipped the keys from the captain's belt.
  es: Una noche de fiesta, el mayordomo del rey y el capitán de la guardia compartieron una jarra de vino fuerte, y los dos se quedaron profundamente dormidos. Bilbo le quitó las llaves del cinturón al capitán.
- id: barrels
  en: He let the dwarves out of their cells and packed them, grumbling and squashed, into barrels padded with straw, and closed the lids tight.
  es: Sacó a los enanos de sus celdas y los metió, refunfuñando y apretujados, en barriles acolchados con paja, y cerró bien las tapas.
- id: last
  en: The elves came down and tipped the barrels through the trapdoor. Only then did Bilbo realise that no one was left to pack him. He grabbed hold of the very last one as it fell.
  es: Los elfos bajaron y echaron los barriles por la trampilla. Solo entonces se dio cuenta Bilbo de que no quedaba nadie para meterlo a él. Se agarró al último justo cuando caía.
- id: river
  en: Out through the water-gate they went and down the river, Bilbo cold and soaked, clinging on as the barrels bobbed and spun through the night.
  es: Salieron por la puerta del agua y bajaron por el río, con Bilbo helado y empapado, agarrado con fuerza mientras los barriles se mecían y giraban en la noche.
- id: raft
  en: Further downstream, elves gathered the barrels and lashed them into a raft, and on they drifted toward the Long Lake, never guessing what they carried.
  es: Más abajo, unos elfos recogieron los barriles y los ataron formando una balsa, y siguieron a la deriva hacia el Lago Largo, sin sospechar lo que llevaban.
