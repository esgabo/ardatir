- id: quays
  en: "At Pelargir the long quays were quiet at last. The great ships of Umbar lay along them with their crews dead or fled, and the fleet Gondor had dreaded was Gondor's."
  es: "En Pelargir los largos muelles quedaron por fin en silencio. Las grandes naves de Umbar estaban amarradas a lo largo de ellos, con sus tripulaciones muertas o huidas, y la flota que Gondor temía era de Gondor."
- id: oars
  en: "The ships were rowed by slaves chained to the benches. Aragorn had their chains struck off, and almost all of them asked to stay at the oars and row north instead."
  es: "Las naves iban a remo, movidas por esclavos encadenados a los bancos. Aragorn hizo que les quitaran las cadenas, y casi todos pidieron quedarse en los remos y remar hacia el norte."
- id: host
  en: "With them came the fighting men of the southern fiefs, who had held the river crossings and now had a road to the war. The Dead were released; they had done what they came to do."
  es: "Con ellos vinieron los hombres de armas de los feudos del sur, que habían defendido los vados y ahora tenían un camino hacia la guerra. Los Muertos fueron liberados: habían hecho aquello por lo que habían venido."
- id: wind
  en: "They cast off and worked upstream against the current. Then a wind came up out of the sea behind them, and the black sails filled, and the fleet went north far faster than anyone could have hoped."
  es: "Soltaron amarras y remontaron la corriente a fuerza de remo. Entonces se levantó a sus espaldas un viento del mar, las velas negras se llenaron, y la flota subió hacia el norte mucho más rápido de lo que nadie podía esperar."
- id: dark
  en: "All through the night they passed the dark river-lands, and the people of them hid, because the black ships of the Corsairs had come up Anduin only to burn and to take."
  es: "Toda la noche pasaron junto a las tierras oscuras de la ribera, y sus habitantes se escondieron, porque las naves negras de los Corsarios solo habían remontado el Anduin para quemar y saquear."
- id: furled
  en: "At the masthead of the foremost ship a standard stayed furled. Arwen had made it and sent it to him, and Aragorn would not let it be opened until the hour it would mean something."
  es: "En el tope del palo de la nave delantera un estandarte seguía enrollado. Arwen lo había hecho y se lo había enviado, y Aragorn no permitió que se desplegara hasta la hora en que significara algo."
- id: north
  en: "Ahead of them, out of sight beyond the next bend and the next, a red light was growing on the clouds. It was the Pelennor burning, and they were still a day away."
  es: "Delante de ellos, fuera de la vista más allá de una curva y de la siguiente, una luz roja crecía en las nubes. Era el Pelennor en llamas, y aún estaban a un día de distancia."
