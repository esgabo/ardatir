- id: stay
  en: "The Company stayed a month in Lothlórien, though it felt like no time at all. They rested, and their grief began to heal."
  es: "La Compañía pasó un mes en Lothlórien, aunque les pareció que no había pasado el tiempo. Descansaron, y su pena empezó a sanar."
- id: basin
  en: "One evening Galadriel led Frodo and Sam to a hidden garden with a silver basin of water: her Mirror, which may show glimpses of the past, of the present, or of what could yet come to pass."
  es: "Una tarde Galadriel llevó a Frodo y a Sam a un jardín escondido donde había una pila de plata llena de agua: su Espejo, que puede mostrar destellos del pasado, del presente o de lo que aún podría llegar a ocurrir."
- id: sam
  en: "Sam saw the Shire with its trees cut down and a mill belching smoke, and wanted to rush home. But not every vision comes true, the Lady told him."
  es: "Sam vio la Comarca con los árboles talados y un molino echando humo, y quiso volver corriendo a casa. Pero no todas las visiones se cumplen, le dijo la Señora."
- id: eye
  en: "Frodo saw the sea and ships, and then a great Eye, rimmed with fire, searching for him. The Ring grew heavy on its chain."
  es: "Frodo vio el mar y unos barcos, y después un gran Ojo, rodeado de fuego, que lo buscaba. El Anillo se volvió pesado en su cadena."
- id: offer
  en: "Shaken, he offered the Ring to Galadriel. For a moment she imagined herself with it, a queen whom all would love and fear, and she shone with a terrible light."
  es: "Estremecido, le ofreció el Anillo a Galadriel. Por un instante ella se imaginó con él, una reina a la que todos amarían y temerían, y resplandeció con una luz terrible."
- id: refuse
  en: "Then she let the dream go and laughed softly. She would remain herself, she said, and let her power fade, and one day sail to the West."
  es: "Luego dejó ir aquel sueño y rio suavemente. Seguiría siendo ella misma, dijo, dejaría que su poder se apagara, y un día navegaría hacia el Oeste."
