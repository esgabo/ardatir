- id: stay
  en: "The Company stayed a month in Lothlórien, though it felt like no time at all. They rested, and their grief began to heal."
  es: "La Compañía pasó un mes en Lothlórien, aunque les pareció que no había pasado el tiempo. Descansaron, y su pena empezó a sanar."
- id: basin
  en: "One evening Galadriel led Frodo and Sam to a hidden garden with a silver basin of water: her Mirror, which could show things far off in place and time, not all of them sure."
  es: "Una tarde Galadriel llevó a Frodo y a Sam a un jardín escondido donde había una pila de plata llena de agua: su Espejo, que podía mostrar cosas lejanas en el espacio y en el tiempo, no todas seguras."
- id: sam
  en: "Sam saw the Shire with its trees cut down and a mill belching smoke, and wanted to rush home. But not every vision comes true, the Lady told him."
  es: "Sam vio la Comarca con los árboles talados y un molino echando humo, y quiso volver corriendo a casa. Pero no todas las visiones se cumplen, le dijo la Señora."
- id: eye
  en: "Frodo saw the sea and ships, and then a great burning Eye that searched for him. The Ring grew heavy on its chain."
  es: "Frodo vio el mar y unos barcos, y después un gran Ojo en llamas que lo buscaba. El Anillo se volvió pesado en su cadena."
- id: offer
  en: "Shaken, he offered the Ring to Galadriel. For a moment she let herself imagine the queen she could become with it, and a fearsome light shone from her."
  es: "Estremecido, le ofreció el Anillo a Galadriel. Por un instante ella se permitió imaginar la reina en que podría convertirse con él, y de ella brotó una luz temible."
- id: refuse
  en: "Then she let the dream go and laughed softly. She would not take it, she said; her time in Middle-earth was ending, and she accepted it."
  es: "Luego dejó ir aquel sueño y rio suavemente. No lo tomaría, dijo; su tiempo en la Tierra Media se acababa, y lo aceptaba."
