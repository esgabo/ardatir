- id: dale
  en: "They hurried down the long valley below the mountains, past the still lake where Durin had once seen a crown of stars, following the Silverlode toward the woods."
  es: "Bajaron deprisa por el largo valle al pie de las montañas, junto al lago quieto donde Durin vio una vez una corona de estrellas, siguiendo el Cauce de Plata hacia los bosques."
- id: nimrodel
  en: "At nightfall they reached the stream Nimrodel under the first trees of Lothlórien, and Legolas told of the Elf-maiden it was named after. Its cool water washed away their weariness."
  es: "Al caer la noche llegaron al arroyo Nimrodel, bajo los primeros árboles de Lothlórien, y Legolas les habló de la doncella élfica que le dio nombre. Su agua fresca les quitó el cansancio."
- id: trees
  en: "Fearing Orcs on the ground, they meant to sleep in the trees. High in the branches, voices spoke to them in the dark: Elves of the Galadhrim, the people of the wood."
  es: "Por miedo a los orcos, decidieron dormir en los árboles. En lo alto de las ramas, unas voces les hablaron en la oscuridad: Elfos de los Galadhrim, el pueblo del bosque."
- id: night
  en: "Their leader, Haldir, agreed to guide them. In the night Orcs passed below, and something else crept up the tree toward Frodo, then fled."
  es: "Su jefe, Haldir, aceptó guiarlos. Durante la noche pasaron orcos por debajo, y algo más trepó por el árbol hacia Frodo, y luego huyó."
- id: golden
  en: "Then they were led into the heart of the land, where golden leaves glowed in the winter sun. To Frodo it felt like stepping into a world that time had not touched."
  es: "Luego los llevaron al corazón de aquella tierra, donde las hojas doradas brillaban al sol de invierno. A Frodo le pareció entrar en un mundo que el tiempo no había tocado."
