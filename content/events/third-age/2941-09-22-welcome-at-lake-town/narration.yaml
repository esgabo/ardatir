- id: barrels
  en: When the raft was moored at last by the shore of the Long Lake, Bilbo pried the dwarves out of their barrels, stiff, bruised, and very cross. It was his birthday, though in all the excitement he forgot.
  es: Cuando por fin amarraron la balsa en la orilla del Lago Largo, Bilbo sacó a los enanos de sus barriles, entumecidos, magullados y de muy mal humor. Era su cumpleaños, aunque con tanto ajetreo lo olvidó.
- id: town
  en: Out on the water stood Lake-town, Esgaroth, built on wooden stilts and joined to the shore by a long bridge. And far to the north, the Lonely Mountain rose against the sky.
  es: Sobre el agua se alzaba la Ciudad del Lago, Esgaroth, construida sobre pilotes de madera y unida a la orilla por un largo puente. Y lejos, al norte, la Montaña Solitaria se recortaba contra el cielo.
- id: king
  en: Thorin marched across the bridge, past the startled guards, and announced himself. He was Thorin, son of Thráin, son of Thrór, King under the Mountain, come home.
  es: Thorin cruzó el puente, pasando junto a los guardias sorprendidos, y se presentó. Era Thorin, hijo de Thráin, hijo de Thrór, el Rey bajo la Montaña, que volvía a casa.
- id: songs
  en: The people of the lake remembered the old songs, which said that when the king returned, gold would flow down the rivers. Crowds filled the streets, singing.
  es: La gente del lago recordaba las viejas canciones, que decían que cuando el rey regresara, el oro correría por los ríos. Las calles se llenaron de gente que cantaba.
- id: feast
  en: The dwarves were feasted and given fine rooms, and after so long in the dark and the barrels, they grew strong and merry again.
  es: Los enanos fueron agasajados con banquetes y buenos aposentos, y después de tanto tiempo en la oscuridad y en los barriles, recobraron las fuerzas y la alegría.
- id: master
  en: Only the Master of the town was uneasy. He suspected they were not what they claimed, or would bring trouble, and was glad to give them all they needed to go on their way.
  es: Solo el Gobernador de la ciudad estaba inquieto. Sospechaba que no eran lo que decían, o que traerían problemas, y les dio con gusto todo lo que necesitaban para que siguieran su camino.
