- id: storm
  en: High in the Misty Mountains, a thunderstorm broke over the pass, and stone-giants hurled rocks at one another across the valleys. The company crept into a cave that seemed dry and empty.
  es: En lo alto de las Montañas Nubladas, una tormenta estalló sobre el paso, y los gigantes de piedra se arrojaban rocas de un lado a otro de los valles. La compañía se metió en una cueva que parecía seca y vacía.
- id: crack
  en: But in the night a crack opened in the back wall. Bilbo woke and cried out, and goblins poured from the dark and dragged away the dwarves, the hobbit and the ponies.
  es: Pero durante la noche se abrió una grieta en la pared del fondo. Bilbo se despertó y gritó, y de la oscuridad salieron trasgos que se llevaron a rastras a los enanos, al hobbit y a los poneys.
- id: flash
  en: Only Gandalf escaped them. There was a flash of light, a few goblins fell, and the wizard was gone.
  es: Solo Gandalf se les escapó. Hubo un destello de luz, algunos trasgos cayeron, y el mago desapareció.
- id: hall
  en: Down and down they were driven, into the great cavern of the Great Goblin. When he saw Thorin's sword Orcrist, a blade the goblins feared and hated, he flew into a rage.
  es: Los llevaron hacia abajo, cada vez más hondo, hasta la gran caverna del Gran Trasgo. Cuando este vio la espada de Thorin, Orcrist, una hoja que los trasgos temían y odiaban, montó en cólera.
- id: gandalf
  en: Suddenly every fire went out, a sword blazed in the dark, and the Great Goblin fell dead. Gandalf had come back for them.
  es: De pronto se apagaron todos los fuegos, una espada brilló en la oscuridad y el Gran Trasgo cayó muerto. Gandalf había vuelto a buscarlos.
- id: lost
  en: He led them running through the tunnels with the goblins hard behind. In a scramble in the dark, Bilbo slipped from Dori's back, struck his head on the rock, and was left behind without anyone noticing.
  es: Los guió a la carrera por los túneles, con los trasgos pisándoles los talones. En un tropiezo en la oscuridad, Bilbo resbaló de la espalda de Dori, se golpeó la cabeza contra la roca y se quedó atrás sin que nadie se diera cuenta.
