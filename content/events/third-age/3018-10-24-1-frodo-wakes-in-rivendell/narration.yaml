- id: wake
  en: "Frodo opened his eyes in a soft bed, and there was Gandalf, sitting by the window."
  es: "Frodo abrió los ojos en una cama mullida, y allí estaba Gandalf, sentado junto a la ventana."
- id: healed
  en: "He was in Rivendell, Gandalf told him. For days Elrond had tended him, and had drawn out a splinter of the Morgul-blade that was working its way toward his heart."
  es: "Estaba en Rivendel, le dijo Gandalf. Durante días Elrond lo había cuidado, y le había sacado una astilla de la hoja de Morgul que avanzaba hacia su corazón."
- id: sam
  en: "Sam, who had hardly left his bedside, came in beaming, so happy he could barely speak."
  es: "Sam, que apenas se había separado de su cama, entró radiante, tan feliz que casi no podía hablar."
- id: feast
  en: "That evening there was a feast in Elrond's hall, and Frodo sat beside Glóin the dwarf, one of Bilbo's companions on the road to the Lonely Mountain."
  es: "Aquella noche hubo un banquete en la sala de Elrond, y Frodo se sentó junto a Glóin el enano, uno de los compañeros de Bilbo en el camino a la Montaña Solitaria."
- id: bilbo
  en: "Afterwards, in the Hall of Fire, Frodo found a little old hobbit sitting by himself: Bilbo. They hugged and talked for hours, and Bilbo even sang a song of his own making to the Elves."
  es: "Después, en la Sala del Fuego, Frodo encontró a un hobbit viejecito sentado a solas: Bilbo. Se abrazaron y hablaron durante horas, y Bilbo incluso cantó a los Elfos una canción compuesta por él."
