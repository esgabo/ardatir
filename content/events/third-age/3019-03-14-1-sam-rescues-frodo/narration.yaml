- id: resolve
  en: Sam came to himself in the dark outside the tower, with the Ring on its chain around his neck. Whatever happened, he would find his master.
  es: Sam volvió en sí en la oscuridad, a las puertas de la torre, con el Anillo colgado de su cadena al cuello. Pasara lo que pasara, encontraría a su amo.
- id: gate
  en: At the gate sat two great stone Watchers with vulture faces, and their will held him back like a wall. Sam raised the Phial of Galadriel, and their power broke. He slipped through.
  es: En la puerta había dos grandes Vigilantes de piedra con cara de buitre, y su voluntad lo detenía como un muro. Sam alzó el Frasco de Galadriel, y su poder se quebró. Pasó al otro lado.
- id: dead
  en: Inside, Orcs lay dead everywhere. Shagrat's and Gorbag's soldiers had quarrelled over Frodo's mithril coat and killed each other almost to the last.
  es: Dentro, había orcos muertos por todas partes. Los soldados de Shagrat y de Gorbag se habían peleado por la cota de mithril de Frodo y se habían matado entre sí casi hasta el último.
- id: song
  en: Sam climbed the stairs and searched, but found nothing. At the top of the tower, worn out and hopeless, he began to sing softly to himself, a little song of his own about the sun in the West and the stars above.
  es: Sam subió las escaleras y buscó, pero no encontró nada. En lo alto de la torre, agotado y sin esperanza, empezó a cantar en voz baja para sí mismo una cancioncilla suya sobre el sol del Oeste y las estrellas en lo alto.
- id: answer
  en: And a faint voice answered him. Frodo! An Orc climbed up through a trapdoor with a whip, but Sam rushed at him with Sting, and the Orc fell back down the hole.
  es: Y una voz débil le respondió. ¡Frodo! Un orco subió por una trampilla con un látigo, pero Sam se abalanzó sobre él con Dardo, y el orco cayó de nuevo por el agujero.
- id: ring
  en: Sam found Frodo lying on a heap of rags, bruised but alive. When Sam gave back the Ring, Frodo snatched it and called him a thief. Then he saw his friend clearly, and wept, and begged his pardon.
  es: Sam encontró a Frodo tendido sobre un montón de harapos, magullado pero vivo. Cuando Sam le devolvió el Anillo, Frodo se lo arrebató y lo llamó ladrón. Luego vio a su amigo con claridad, lloró y le pidió perdón.
