- id: past
  en: Aragorn had first met Arwen long ago in Rivendell, when he was a young man, and loved her from that day.
  es: Aragorn había conocido a Arwen mucho tiempo atrás en Rivendel, cuando era joven, y la amó desde aquel día.
- id: promise
  en: "But Elrond had set a hard condition: his daughter would marry no one less than the king of both Gondor and Arnor. For many years Aragorn had laboured and waited."
  es: "Pero Elrond había puesto una dura condición: su hija no se casaría con nadie que no fuera rey de Gondor y de Arnor a la vez. Durante muchos años, Aragorn había luchado y esperado."
- id: wedding
  en: Now, on Mid-year's Day, in the city of the kings, Aragorn and Arwen were married at last, and the long tale of their love came to its fulfilment.
  es: Ahora, en el Día de la Mitad del Año, en la ciudad de los reyes, Aragorn y Arwen se casaron por fin, y la larga historia de su amor llegó a su cumplimiento.
- id: choice
  en: Arwen had made the same choice as Lúthien, her ancestor, long before. She would give up the life of the Elves and share the life of the man she loved.
  es: Arwen había tomado la misma decisión que Lúthien, su antepasada, mucho tiempo atrás. Renunciaría a la vida de los Elfos y compartiría la vida del hombre al que amaba.
- id: elrond
  en: For Elrond the joy was mixed with sorrow. When he sailed into the West, his daughter would not follow, and they would be parted beyond the ending of the world.
  es: Para Elrond, la alegría se mezclaba con la tristeza. Cuando él navegara hacia el Oeste, su hija no lo seguiría, y estarían separados más allá del fin del mundo.
