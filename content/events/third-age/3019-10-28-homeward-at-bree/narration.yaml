- id: rain
  en: On a wet, windy evening the four hobbits and Gandalf rode up to the gate of Bree. The gatekeeper peered at them suspiciously before he let them in.
  es: Una tarde húmeda y ventosa, los cuatro hobbits y Gandalf llegaron a caballo a la puerta de Bree. El guardián los miró con recelo antes de dejarlos entrar.
- id: pony
  en: At the Prancing Pony, Barliman Butterbur was overjoyed to see them alive, and bustled about with supper and beer. But the inn was quiet, and few guests sat by the fire.
  es: En el Poney Pisador, Cebadilla Mantecona se alegró muchísimo de verlos vivos, y se afanó en traerles cena y cerveza. Pero la posada estaba tranquila, y había pocos huéspedes junto al fuego.
- id: troubles
  en: Times were bad, Butterbur said. Ruffians had come up the roads from the south, and there had been fighting in Bree. People locked their doors at night now.
  es: Corrían malos tiempos, dijo Cebadilla. Habían llegado rufianes del sur por los caminos, y había habido peleas en Bree. Ahora la gente cerraba sus puertas por la noche.
- id: king
  en: When he learned that Strider, the ragged Ranger, was now the King, Butterbur could hardly believe it. Gandalf promised that the King would one day come north, and the roads would be safe again.
  es: Cuando supo que Trancos, el Montaraz harapiento, era ahora el Rey, Cebadilla apenas podía creerlo. Gandalf le prometió que algún día el Rey vendría al norte, y los caminos volverían a ser seguros.
- id: shire
  en: He had heard strange rumours from the Shire too. The hobbits looked at one another, worried, and longed to be home.
  es: También había oído rumores extraños de la Comarca. Los hobbits se miraron unos a otros, preocupados, y desearon estar ya en casa.
