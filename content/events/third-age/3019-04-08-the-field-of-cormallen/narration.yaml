- id: wake
  en: Sam woke in a soft bed in a green and sunny land. Gandalf was standing by him, robed in white, laughing. Sam felt as if every sorrow were melting away like a bad dream.
  es: Sam despertó en una cama blanda, en una tierra verde y soleada. Gandalf estaba junto a él, vestido de blanco, riéndose. Sam sintió que todas las penas se desvanecían como un mal sueño.
- id: ithilien
  en: They were in Ithilien, and they had slept for days while they healed. Frodo woke too, and Gandalf brought the two hobbits clothes, and food, and good news.
  es: Estaban en Ithilien, y habían dormido muchos días mientras sanaban. También Frodo despertó, y Gandalf les trajo ropa, comida y buenas noticias.
- id: host
  en: In a wide green field, the whole Host of the West had gathered. As the hobbits came, the men rose and cheered, and their praise rang out in many tongues.
  es: En un amplio campo verde se había reunido toda la Hueste del Oeste. Cuando llegaron los hobbits, los hombres se levantaron y los aclamaron, y sus alabanzas resonaron en muchas lenguas.
- id: strider
  en: On a high seat sat the King, and Sam saw with amazement that it was Strider. Aragorn rose, came to meet them, and led them to his own high seat.
  es: En un sitial elevado estaba sentado el Rey, y Sam vio con asombro que era Trancos. Aragorn se levantó, salió a su encuentro y los llevó a su propio sitial.
- id: song
  en: Then a minstrel sang the tale of Frodo of the Nine Fingers and the Ring of Doom. Sam had once wished to hear such a song, and now he laughed and wept with joy.
  es: Entonces un trovador cantó la historia de Frodo de los Nueve Dedos y el Anillo del Destino. Sam había deseado una vez oír una canción así, y ahora reía y lloraba de alegría.
- id: friends
  en: At the feast, Merry and Pippin, Legolas and Gimli were there too. The Fellowship was together again, all but those who had fallen.
  es: En el banquete estaban también Merry y Pippin, Legolas y Gimli. La Comunidad volvía a estar reunida, salvo los que habían caído.
