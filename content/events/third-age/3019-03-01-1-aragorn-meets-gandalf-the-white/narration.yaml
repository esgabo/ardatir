- id: trail
  en: At the edge of Fangorn, Aragorn found the hobbits' tracks leading into the trees. Merry and Pippin had escaped. The three companions followed them into the forest.
  es: En el linde de Fangorn, Aragorn encontró las huellas de los hobbits adentrándose en los árboles. Merry y Pippin habían escapado. Los tres compañeros las siguieron hacia el bosque.
- id: oldman
  en: On a rocky slope they saw an old man in grey rags, leaning on a staff. Fearing he was Saruman, Legolas bent his bow and Gimli raised his axe. Neither could move against him.
  es: En una ladera rocosa vieron a un anciano envuelto en harapos grises, apoyado en un bastón. Temiendo que fuera Saruman, Legolas tensó el arco y Gimli alzó el hacha. Ninguno pudo atacarlo.
- id: white
  en: Then the old man threw off his rags. Beneath them he was robed in white, shining, and his hair was white as snow. It was Gandalf.
  es: Entonces el anciano se quitó los harapos. Debajo vestía de blanco, resplandeciente, y su pelo era blanco como la nieve. Era Gandalf.
- id: return
  en: He told them he had fought the Balrog from the deeps of Moria to the peak of the mountain, and had passed through fire and death. He had been sent back, Gandalf the White.
  es: "Les contó que había luchado con el Balrog desde las profundidades de Moria hasta la cima de la montaña, y que había atravesado el fuego y la muerte. Había sido enviado de vuelta: Gandalf el Blanco."
- id: hobbits
  en: Merry and Pippin were safe, he said, and in good hands. Their coming had stirred something that would surprise Saruman. Now the three must ride with him to Edoras.
  es: Merry y Pippin estaban a salvo, dijo, y en buenas manos. Su llegada había despertado algo que sorprendería a Saruman. Ahora los tres debían cabalgar con él hasta Edoras.
- id: shadowfax
  en: He gave a long, clear whistle, and out of the plain came running a great silver-grey horse, Shadowfax, lord of horses, to carry him to the king.
  es: Lanzó un silbido largo y claro, y desde la llanura llegó al galope un gran caballo gris plateado, Sombragris, señor de los caballos, para llevarlo ante el rey.
