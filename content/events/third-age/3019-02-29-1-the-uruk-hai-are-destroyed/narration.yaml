- id: captives
  en: Bound and aching after days of being carried, Merry and Pippin lay among the Orcs in the dark. All around, the Riders of Rohan kept watch, and the Orcs were afraid.
  es: Atados y doloridos tras días de ser llevados a cuestas, Merry y Pippin yacían entre los orcos en la oscuridad. Alrededor, los Jinetes de Rohan vigilaban, y los orcos tenían miedo.
- id: grishnakh
  en: Grishnákh, an Orc from Mordor, crept to the hobbits and felt them over. He guessed they carried something precious, and hoped to steal it for himself.
  es: Grishnákh, un orco de Mordor, se acercó a los hobbits a rastras y los palpó. Sospechaba que llevaban algo valioso, y esperaba robarlo para él solo.
- id: trick
  en: The hobbits played along, and he dragged them out beyond the ring of Orcs. There a rider's spear found him, and the two hobbits were left lying in the grass, unseen.
  es: Los hobbits le siguieron el juego, y él los arrastró fuera del círculo de orcos. Allí lo alcanzó la lanza de un jinete, y los dos hobbits se quedaron tendidos en la hierba, sin que nadie los viera.
- id: free
  en: Pippin had already slipped his wrists free. He cut Merry's bonds, they ate a little waybread, and they crawled away toward the trees.
  es: Pippin ya se había soltado las muñecas. Cortó las cuerdas de Merry, comieron un poco de pan del camino y se alejaron a rastras hacia los árboles.
- id: dawn
  en: At dawn the Riders charged. Uglúk and his Uruk-hai were overwhelmed at the forest's edge, and none escaped. Éomer slew their captain himself.
  es: Al alba cargaron los Jinetes. Uglúk y sus Uruk-hai fueron arrollados en el linde del bosque, y ninguno escapó. El propio Éomer dio muerte a su capitán.
- id: forest
  en: By then the hobbits were already among the trees, following a stream into the old, dim forest. Behind them, the smoke of the battle rose over the plain.
  es: Para entonces los hobbits ya estaban entre los árboles, siguiendo un arroyo hacia el viejo y sombrío bosque. Tras ellos, el humo de la batalla se alzaba sobre la llanura.
