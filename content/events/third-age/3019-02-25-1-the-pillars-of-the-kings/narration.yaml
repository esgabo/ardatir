- id: portage
  en: "The Company carried the boats around the rapids and rowed on, into a deep gorge between steep cliffs."
  es: "La Compañía llevó las barcas a cuestas para rodear los rápidos y siguió remando, hasta entrar en un hondo desfiladero entre altos acantilados."
- id: kings
  en: "Ahead rose two enormous stone kings, carved long ago, each with a hand raised in warning: the Argonath, the Pillars of the Kings, at the old northern border of Gondor."
  es: "Delante se alzaban dos enormes reyes de piedra, tallados hacía mucho, cada uno con una mano levantada en señal de advertencia: los Argonath, los Pilares de los Reyes, en la antigua frontera norte de Gondor."
- id: aragorn
  en: "Frodo, cowering, looked back at Aragorn and hardly knew him. He stood tall and proud in the boat, like a king coming home."
  es: "Frodo, encogido, miró atrás hacia Aragorn y apenas lo reconoció. Se erguía alto y orgulloso en la barca, como un rey que vuelve a casa."
- id: lawn
  en: "Beyond, the river opened into a long lake. At its far end the great falls of Rauros roared, and they landed on the green lawn of Parth Galen."
  es: "Más allá, el río se abría en un largo lago. Al fondo rugían las grandes cataratas del Rauros, y desembarcaron en el prado verde de Parth Galen."
- id: choice
  en: "Here they would have to choose at last: east toward Mordor, or west with Boromir to Gondor."
  es: "Allí tendrían que elegir por fin: al este, hacia Mordor, o al oeste, con Boromir, hacia Gondor."
