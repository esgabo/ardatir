- id: tunnel
  en: It was time for the burglar to do his job. Bilbo went down the long tunnel alone, toward a red glow and a deep, rumbling sound, like a giant snoring.
  es: Había llegado la hora de que el saqueador hiciera su trabajo. Bilbo bajó solo por el largo túnel, hacia un resplandor rojizo y un sonido profundo y retumbante, como el ronquido de un gigante.
- id: courage
  en: His knees shook, and he nearly turned back. But he made himself keep walking.
  es: Le temblaban las rodillas, y estuvo a punto de dar la vuelta. Pero se obligó a seguir caminando.
- id: hoard
  en: Below him lay Smaug, asleep on a mountain of gold and jewels, smoke curling from his nostrils. Bilbo seized a great two-handled cup and crept back up the tunnel.
  es: Bajo él yacía Smaug, dormido sobre una montaña de oro y joyas, con humo saliéndole de los ollares. Bilbo agarró una gran copa de dos asas y volvió a hurtadillas por el túnel.
- id: rage
  en: When Smaug woke, he knew at once that the cup was gone. He burst out of the Mountain in fury, scorching the slopes, while the company hid inside the tunnel.
  es: Cuando Smaug despertó, supo enseguida que faltaba la copa. Salió de la Montaña enfurecido, abrasando las laderas, mientras la compañía se escondía dentro del túnel.
- id: talk
  en: Bilbo went down again, invisible. This time Smaug was only pretending to sleep, and spoke to him. Bilbo answered with riddles and flattery, never giving his real name, while the dragon tried to turn him against the dwarves.
  es: Bilbo bajó de nuevo, invisible. Esta vez Smaug solo fingía dormir, y le habló. Bilbo le respondió con acertijos y halagos, sin revelar nunca su verdadero nombre, mientras el dragón intentaba ponerlo en contra de los enanos.
- id: patch
  en: Vain and proud, Smaug rolled over to show off the jewels crusted on his belly. And Bilbo saw it, a bare patch on the left side of his chest.
  es: Vanidoso y orgulloso, Smaug se dio la vuelta para lucir las gemas incrustadas en su vientre. Y Bilbo lo vio, un hueco desnudo en el lado izquierdo de su pecho.
- id: thrush
  en: He fled with flames licking at his heels, and told the dwarves what he had seen. Nearby, an old thrush sat listening to every word.
  es: Huyó con las llamas lamiéndole los talones, y contó a los enanos lo que había visto. Cerca de allí, un viejo zorzal escuchaba cada palabra.
