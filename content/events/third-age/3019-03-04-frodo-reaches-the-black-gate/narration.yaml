- id: desolation
  en: Beyond the marshes lay a land of ash and slag where nothing lived. Ahead rose the mountains of Mordor, and in a gap between them stood the Black Gate.
  es: Más allá de las ciénagas había una tierra de ceniza y escoria donde nada vivía. Delante se alzaban las montañas de Mordor, y en un paso entre ellas se erguía la Puerta Negra.
- id: gate
  en: "Hidden in a hollow, the hobbits looked at the Morannon: great iron doors between two black towers, and the hills full of watchful eyes. A company of Men marched up, and the gate opened only to let them in."
  es: "Escondidos en una hondonada, los hobbits contemplaron el Morannon: grandes puertas de hierro entre dos torres negras, y colinas llenas de ojos vigilantes. Llegó marchando una compañía de Hombres, y la puerta se abrió solo para dejarlos entrar."
- id: resolve
  en: Frodo said he would go in that way, if there was no other. He had been sent to Mordor, and to Mordor he would go.
  es: Frodo dijo que entraría por allí si no había otro camino. Lo habían enviado a Mordor, y a Mordor iría.
- id: plea
  en: Gollum was terrified. He begged Frodo not to give the precious back to the Dark Lord. There was another way, he whispered, a secret path far to the south, up a long stair into the mountains.
  es: Gollum estaba aterrado. Suplicó a Frodo que no devolviera el tesoro al Señor Oscuro. Había otro camino, susurró, una senda secreta lejos al sur, por una larga escalera que subía a las montañas.
- id: oliphaunt
  en: While Frodo thought it over, Gollum mentioned the huge beasts of the south marching to war. Sam's eyes lit up. He had always wanted to see an oliphaunt.
  es: Mientras Frodo lo pensaba, Gollum mencionó las enormes bestias del sur que marchaban a la guerra. A Sam se le iluminaron los ojos. Siempre había querido ver un olifante.
- id: choice
  en: Frodo did not fully trust Gollum, but he trusted the gate even less. He chose the secret way, and that night the three turned south.
  es: Frodo no se fiaba del todo de Gollum, pero de la puerta se fiaba aún menos. Eligió el camino secreto, y aquella noche los tres se volvieron hacia el sur.
