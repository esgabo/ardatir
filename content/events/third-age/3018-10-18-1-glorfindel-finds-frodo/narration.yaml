- id: road
  en: "Slowly the travellers came down again to the Road. Frodo rode on the pony, in pain and growing fainter, with the world fading to grey around him."
  es: "Poco a poco los viajeros bajaron de nuevo al Camino. Frodo iba montado en el poney, dolorido y cada vez más débil, con el mundo volviéndose gris a su alrededor."
- id: bells
  en: "At dusk they heard hooves and the ringing of bells. A white horse came shining along the road, and its rider called out to Strider in the Elvish tongue."
  es: "Al anochecer oyeron cascos y un tintineo de cascabeles. Un caballo blanco apareció resplandeciente por el camino, y su jinete llamó a Trancos en lengua élfica."
- id: light
  en: "It was Glorfindel. To Frodo's failing eyes the Elf seemed to glow with a white light, as if he could see him through a veil."
  es: "Era Glorfindel. A los ojos debilitados de Frodo, el Elfo parecía brillar con una luz blanca, como si pudiera verlo a través de un velo."
- id: hurry
  en: "He had come to find them, he said. Riders were behind them and maybe ahead, and there was no time to rest."
  es: "Había venido a buscarlos, dijo. Había Jinetes a sus espaldas, y quizá también delante, y no había tiempo para descansar."
- id: horse
  en: "Glorfindel set Frodo on his own white horse, and the company pressed on through the night toward the Ford of Bruinen and Rivendell beyond."
  es: "Glorfindel subió a Frodo a su propio caballo blanco, y el grupo siguió adelante durante la noche hacia el Vado del Bruinen y, más allá, Rivendel."
