- id: disguise
  en: Frodo's clothes were gone, so the two dressed in Orc gear they found in the tower, with helmets and dark cloaks. They looked like two small, ragged Orcs.
  es: La ropa de Frodo había desaparecido, así que los dos se vistieron con prendas de orco que encontraron en la torre, con yelmos y capas oscuras. Parecían dos orcos pequeños y andrajosos.
- id: stairs
  en: Slowly they crept down through the tower, past the bodies of the dead guards, to the gate.
  es: Despacio, bajaron a hurtadillas por la torre, entre los cuerpos de los guardias muertos, hasta la puerta.
- id: watchers
  en: The Watchers' will stopped them like a wall again. Sam lifted the Phial, and the hobbits cried out a name of the Elves. The will snapped, and they ran through.
  es: La voluntad de los Vigilantes los detuvo de nuevo como un muro. Sam alzó el Frasco, y los hobbits gritaron un nombre de los Elfos. La voluntad se quebró, y pasaron corriendo.
- id: arch
  en: Behind them the Watchers let out a terrible shriek, and the arch above the gate cracked and crashed down. Far above, a winged Nazgûl answered with a cry.
  es: A sus espaldas, los Vigilantes lanzaron un chillido terrible, y el arco de la puerta se agrietó y se desplomó. En lo alto, un Nazgûl alado respondió con un grito.
- id: mordor
  en: The hobbits fled down the road into the dark. They were free, and they were inside Mordor.
  es: Los hobbits huyeron por el camino hacia la oscuridad. Eran libres, y estaban dentro de Mordor.
