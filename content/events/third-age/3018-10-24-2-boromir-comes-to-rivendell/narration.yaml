- id: arrive
  en: "That same night a weary traveller came to the gates of Rivendell: Boromir of Gondor. He had been on the road for more than a hundred days, alone."
  es: "Esa misma noche un viajero agotado llegó a las puertas de Rivendel: Boromir de Gondor. Llevaba más de cien días de camino, solo."
- id: horse
  en: "He had lost his horse crossing the Greyflood, where the old bridge had fallen, and had come the last part of the way on foot."
  es: "Había perdido su caballo al cruzar el río Aguada Gris, donde el viejo puente se había derrumbado, y había hecho a pie el último tramo."
- id: welcome
  en: "Elrond received him kindly. Boromir had come to understand a riddle, and he would not wait long: in the morning there would be a great Council."
  es: "Elrond lo recibió con amabilidad. Boromir había venido a desentrañar un enigma, y no tendría que esperar mucho: por la mañana se celebraría un gran Concilio."
- id: halfling
  en: "He did not know that the Halfling of his dream was asleep in that very house."
  es: "No sabía que el Mediano de su sueño dormía en aquella misma casa."
