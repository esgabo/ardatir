- id: late
  en: "Gandalf reached Bree that same night, hours after the hobbits had left it. Learning that the hobbits had left with Strider, he rode on east to Weathertop, hoping to find them there."
  es: "Gandalf llegó a Bree esa misma noche, horas después de que los hobbits se marcharan. Al saber que los hobbits se habían ido con Trancos, siguió cabalgando hacia el este, hasta la Cima de los Vientos, con la esperanza de encontrarlos allí."
- id: hill
  en: "On the bare hilltop lay the ruins of Amon Sûl, an ancient watchtower. Gandalf found no hobbits, but the Nine were closing in."
  es: "En la cumbre pelada estaban las ruinas de Amon Sûl, una antigua torre de vigilancia. Gandalf no encontró a ningún hobbit, pero los Nueve se acercaban."
- id: siege
  en: "When night fell they surrounded the hill. Gandalf held them off with fire and blazing light, flashes that could be seen from miles away."
  es: "Al caer la noche rodearon la colina. Gandalf los contuvo con fuego y luces deslumbrantes, destellos que se veían a muchas millas de distancia."
- id: away
  en: "At sunrise he broke out and rode north, drawing some of the Riders after him. On a stone at the summit he left a small mark for Strider to find."
  es: "Al amanecer se abrió paso y cabalgó hacia el norte, llevándose tras de sí a algunos de los Jinetes. En una piedra de la cumbre dejó una pequeña marca para que Trancos la encontrara."
