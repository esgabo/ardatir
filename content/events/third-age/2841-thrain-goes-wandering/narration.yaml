- id: exile
  en: For seventy years the dwarves of Durin's line had been exiles, and now they lived in the Blue Mountains, mining and smithing for the Men nearby. Thráin, once a king, had grown old and weary.
  es: Hacía setenta años que los enanos del linaje de Durin vivían en el exilio, y ahora moraban en las Montañas Azules, trabajando como mineros y herreros para los Hombres vecinos. Thráin, que había sido rey, se había vuelto viejo y cansado.
- id: restless
  en: But his heart could not rest. He kept dreaming of the Lonely Mountain, and one day he decided he had to see it once more.
  es: Pero su corazón no encontraba descanso. Seguía soñando con la Montaña Solitaria, y un día decidió que tenía que volver a verla.
- id: farewell
  en: He said goodbye to his son Thorin, who stayed behind to look after their people. Only a few friends, among them Balin and Dwalin, would not let their king go alone.
  es: Se despidió de su hijo Thorin, que se quedó para cuidar de su pueblo. Solo unos pocos amigos, entre ellos Balin y Dwalin, no quisieron dejar ir solo a su rey.
- id: road
  en: They took the long road east, across the wide lands and over the mountains, growing more tired with every day's march.
  es: Tomaron el largo camino hacia el este, por las tierras abiertas y sobre las montañas, cada vez más cansados a cada jornada.
- id: hunted
  en: But a shadow was following them. Servants of the Enemy had marked the old dwarf, and his road would not end at the Mountain.
  es: Pero una sombra los seguía. Los sirvientes del Enemigo habían reparado en el viejo enano, y su camino no acabaría en la Montaña.
