- id: dream
  en: "In Minas Tirith a dream had come to Faramir again and again, and once to Boromir: a voice spoke of a broken sword, of a place called Imladris, and of a Halfling."
  es: "En Minas Tirith un sueño había visitado a Faramir una y otra vez, y una vez a Boromir: una voz hablaba de una espada rota, de un lugar llamado Imladris y de un Mediano."
- id: puzzle
  en: "No one in the city could say what it meant. Their father, Denethor, knew only that Imladris was the Elvish name of a valley far to the north, where Elrond lived."
  es: "Nadie en la ciudad sabía qué significaba. Su padre, Denethor, solo sabía que Imladris era el nombre élfico de un valle lejano, en el norte, donde vivía Elrond."
- id: claim
  en: "Faramir wished to go and find out. But Boromir, the elder, claimed the journey for himself, since the road would be long and dangerous."
  es: "Faramir quería ir a averiguarlo. Pero Boromir, el mayor, reclamó el viaje para sí, pues el camino sería largo y peligroso."
- id: ride
  en: "Denethor let him go, though unwillingly. Boromir rode out alone, his great horn at his side, toward lands that few in Gondor still remembered."
  es: "Denethor lo dejó partir, aunque a regañadientes. Boromir salió a caballo, solo, con su gran cuerno al costado, hacia tierras que pocos en Gondor recordaban ya."
