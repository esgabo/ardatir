- id: valley
  en: After the wild lands and the trolls, the travellers came down into the hidden valley of Rivendell, to the house of Elrond, and rested there for two happy weeks.
  es: Tras las tierras salvajes y los trolls, los viajeros descendieron al valle oculto de Rivendel, a la casa de Elrond, y descansaron allí dos semanas felices.
- id: swords
  en: Elrond looked at the swords they had found in the trolls' cave and knew them at once. They were ancient elven blades, forged long ago in Gondolin.
  es: Elrond examinó las espadas que habían encontrado en la cueva de los trolls y las reconoció enseguida. Eran antiguas hojas élficas, forjadas hace mucho tiempo en Gondolin.
- id: map
  en: One evening Thorin showed him Thrór's map of the Mountain. Elrond held it up, and the light of a crescent moon shone through the parchment.
  es: Una tarde, Thorin le mostró el mapa de la Montaña que había sido de Thrór. Elrond lo sostuvo en alto, y la luz de una luna creciente atravesó el pergamino.
- id: letters
  en: Pale runes appeared that none of them had ever seen. These were moon-letters, which show only under a moon of the same shape and season as the night they were written, and by good fortune it was Midsummer's Eve again.
  es: Aparecieron unas runas pálidas que ninguno había visto nunca. Eran letras lunares, que solo se ven bajo una luna de la misma forma y estación que la noche en que se escribieron, y por suerte era de nuevo la víspera del solsticio de verano.
- id: message
  en: They spoke of a grey stone, a thrush knocking, and the last ray of the setting sun on Durin's Day. At that one moment, the keyhole of the secret door would be revealed.
  es: Hablaban de una piedra gris, de un zorzal que golpea y del último rayo del sol poniente en el Día de Durin. Solo en ese momento se revelaría la cerradura de la puerta secreta.
- id: durin
  en: Durin's Day, Thorin explained, is the dwarves' New Year, when the last moon of autumn and the sun share the sky. But when it would fall this year, no one could say.
  es: El Día de Durin, explicó Thorin, es el Año Nuevo de los enanos, cuando la última luna del otoño y el sol comparten el cielo. Pero nadie podía decir cuándo caería ese año.
