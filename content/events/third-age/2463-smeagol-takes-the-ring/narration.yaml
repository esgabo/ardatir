- id: river
  en: Long ago, by the Gladden Fields where the Great River runs slow among the reeds, lived a small people who loved the water. One day two friends, Sméagol and Déagol, went out fishing in a little boat.
  es: Hace mucho tiempo, junto a los Campos Gladios, donde el Río Grande corre lento entre los juncos, vivía un pueblo pequeño que amaba el agua. Un día, dos amigos, Sméagol y Déagol, salieron a pescar en una barca.
- id: find
  en: A great fish pulled Déagol overboard and down into the river. When he struggled up again, he held something in his fist, bright with the mud of the riverbed. It was a golden ring.
  es: Un pez enorme arrastró a Déagol fuera de la barca y hasta el fondo del río. Cuando logró salir a flote, apretaba algo en el puño, brillante entre el barro del lecho. Era un anillo de oro.
- id: murder
  en: Sméagol wanted it the moment he saw it. It was his birthday, he said, so the ring should be his present. When Déagol refused, Sméagol seized him by the throat and killed him, and hid the body.
  es: Sméagol lo quiso en cuanto lo vio. Era su cumpleaños, dijo, así que el anillo debía ser su regalo. Cuando Déagol se negó, Sméagol lo agarró por el cuello, lo mató y escondió el cuerpo.
- id: secrets
  en: The ring made its wearer invisible, and Sméagol used it to spy and to steal. He grew sly and spiteful, and his own family turned against him.
  es: El anillo volvía invisible a quien lo llevaba, y Sméagol lo usó para espiar y robar. Se volvió astuto y rencoroso, y su propia familia se puso en su contra.
- id: gollum
  en: People began to call him Gollum, after the ugly gulping noise he made in his throat. In the end his grandmother drove him out of the house.
  es: La gente empezó a llamarlo Gollum, por el feo ruido que hacía con la garganta al tragar. Al final, su abuela lo echó de casa.
- id: mountains
  en: Lonely and bitter, he crept away from the sun and found his way into caves under the Misty Mountains. There, in the dark, the ring kept him alive far longer than any life should last.
  es: Solo y amargado, huyó de la luz del sol y se metió en las cuevas bajo las Montañas Nubladas. Allí, en la oscuridad, el anillo lo mantuvo con vida mucho más tiempo del que debería durar una vida.
