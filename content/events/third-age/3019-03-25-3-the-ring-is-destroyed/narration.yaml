- id: climb
  en: At the foot of the mountain Frodo could no longer stand. So Sam lifted him onto his back and carried him up the long, burning slope. Frodo was lighter than he expected.
  es: Al pie de la montaña, Frodo ya no podía tenerse en pie. Así que Sam se lo cargó a la espalda y lo llevó por la larga ladera ardiente. Frodo pesaba menos de lo que esperaba.
- id: gollum
  en: Near the top, Gollum sprang on them out of nowhere and fought for the Ring. Frodo threw him off, and went on alone while Sam faced him, sword in hand.
  es: Cerca de la cima, Gollum saltó sobre ellos de la nada y luchó por el Anillo. Frodo se lo quitó de encima y siguió solo mientras Sam le hacía frente, espada en mano.
- id: mercy
  en: Sam could have killed Gollum then. But looking at that ruined, miserable creature, he could not do it, and let him go.
  es: Sam podría haber matado a Gollum en ese momento. Pero al mirar a aquella criatura arruinada y desdichada, no fue capaz, y lo dejó ir.
- id: claim
  en: Inside the mountain, Frodo stood at the edge of the fiery chasm, the Cracks of Doom. But there the Ring was too strong for him. In a clear, strange voice he refused to destroy it and claimed it for himself, put it on, and vanished.
  es: Dentro de la montaña, Frodo estaba al borde del abismo de fuego, las Grietas del Destino. Pero allí el Anillo pudo más que él. Con una voz clara y extraña se negó a destruirlo y lo reclamó para sí, se lo puso y desapareció.
- id: bite
  en: Gollum rushed past Sam and wrestled with the invisible hobbit. He bit off Frodo's finger, Ring and all.
  es: Gollum pasó corriendo junto a Sam y forcejeó con el hobbit invisible. Le arrancó a Frodo el dedo de un mordisco, con Anillo y todo.
- id: fall
  en: Mad with joy, Gollum danced with his precious held high, stepped too far, and toppled into the fire with a last wail. The Ring was gone.
  es: Loco de alegría, Gollum bailaba con su tesoro en alto, dio un paso de más y cayó al fuego con un último gemido. El Anillo había desaparecido.
- id: free
  en: Frodo lay pale, but his eyes were clear again. The burden was gone. Even Gollum, he said, had played his part, and now it was over.
  es: Frodo yacía pálido, pero sus ojos volvían a estar claros. La carga había desaparecido. Incluso Gollum, dijo, había cumplido su papel, y ya todo había terminado.
