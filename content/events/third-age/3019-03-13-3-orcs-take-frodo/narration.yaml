- id: despair
  en: Sam knelt beside his master. Frodo was cold and did not stir, and Sam believed he was dead.
  es: Sam se arrodilló junto a su amo. Frodo estaba frío y no se movía, y Sam creyó que había muerto.
- id: ring
  en: The quest could not end here. With a breaking heart, Sam took the Ring from Frodo's neck and set off alone to finish what they had begun.
  es: La misión no podía terminar allí. Con el corazón destrozado, Sam tomó el Anillo del cuello de Frodo y partió solo a terminar lo que habían empezado.
- id: orcs
  en: But Orcs came from the tower, and others from below. Sam slipped on the Ring and hid. The Orcs found Frodo and began to carry him away.
  es: Pero llegaron orcos de la torre, y otros desde abajo. Sam se puso el Anillo y se escondió. Los orcos encontraron a Frodo y empezaron a llevárselo.
- id: alive
  en: Following, Sam overheard their captains, Shagrat and Gorbag. Frodo was not dead at all, only stunned by the sting, and would wake in a few hours.
  es: Mientras los seguía, Sam oyó a sus capitanes, Shagrat y Gorbag. Frodo no estaba muerto en absoluto, solo paralizado por el aguijón, y despertaría en unas horas.
- id: shut
  en: Sam ran after them, but he was too late. The Orcs carried Frodo into the Tower of Cirith Ungol, and the great door slammed shut in Sam's face.
  es: Sam corrió tras ellos, pero llegó demasiado tarde. Los orcos metieron a Frodo en la Torre de Cirith Ungol, y la gran puerta se cerró de golpe ante sus narices.
- id: alone
  en: He had left his master behind. Sam fell senseless on the stone, alone in the dark outside the tower.
  es: Había abandonado a su amo. Sam cayó sin sentido sobre la piedra, solo en la oscuridad, a las puertas de la torre.
