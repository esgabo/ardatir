summary:
  en: "Smaug's rage shuts the company in the tunnel. When no sound comes from below, Bilbo leads them down to an empty hall, finds the Arkenstone and keeps it secretly; Thorin gives him a coat of mithril, and they come out by the Front Gate."
  es: "La furia de Smaug deja a la compañía encerrada en el túnel. Como de abajo no llega ningún ruido, Bilbo los guía hasta una sala vacía, encuentra la Piedra del Arca y se la guarda en secreto; Thorin le da una cota de mithril, y salen por la Puerta Principal."
