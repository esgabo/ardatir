- id: shut
  en: The dragon came out in a fury and struck the cliff where the secret door had been. Rocks crashed down across the doorway, and the company was shut inside the tunnel, in utter darkness.
  es: El dragón salió furioso y golpeó el risco donde había estado la puerta secreta. Las rocas se desplomaron sobre la entrada, y la compañía quedó encerrada en el túnel, en la oscuridad más completa.
- id: silence
  en: Hours went by, and no sound came from below. With no way out but down, Bilbo went first once more, and this time the great hall was dark and still. The dragon was not at home.
  es: Pasaron las horas, y de abajo no llegaba ningún ruido. Sin más salida que bajar, Bilbo volvió a ir delante, y esta vez la gran sala estaba oscura y en calma. El dragón no estaba en casa.
- id: stone
  en: Climbing over the heaped treasure, he saw a white light shining ahead of him. It was the Arkenstone, the Heart of the Mountain. Bilbo could not help himself. He lifted it, and slipped it into his pocket.
  es: Trepando por el tesoro amontonado, vio una luz blanca que brillaba delante de él. Era la Piedra del Arca, el Corazón de la Montaña. Bilbo no pudo contenerse. La levantó y se la guardó en el bolsillo.
- id: hoard
  en: The dwarves came down with torches, and at the sight of their fathers' treasure an old longing woke in their hearts. They ran their hands through the gold and armed themselves from the hoard. Bilbo said nothing of what he had found.
  es: Los enanos bajaron con antorchas, y al ver el tesoro de sus padres despertó en sus corazones un viejo anhelo. Hundieron las manos en el oro y se armaron con lo que había en el tesoro. Bilbo no dijo nada de lo que había encontrado.
- id: mithril
  en: Thorin gave Bilbo a small coat of mail, made of the silver-steel the elves call mithril. It was, he said, the first payment of his share.
  es: Thorin le dio a Bilbo una pequeña cota de malla, hecha del acero de plata que los elfos llaman mithril. Era, le dijo, el primer pago de su parte.
- id: gate
  en: Then Thorin led them up through the deep halls and out by the great Front Gate, into the light of day, still wondering where the dragon had gone.
  es: Luego Thorin los guió por las salas profundas y los sacó por la gran Puerta Principal a la luz del día, todavía preguntándose adónde habría ido el dragón.
