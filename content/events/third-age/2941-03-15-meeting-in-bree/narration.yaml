- id: worry
  en: Gandalf had a worry he could not shake. If Sauron ever turned his eyes to the North, the dragon Smaug would be a terrible weapon in his hands.
  es: Gandalf tenía una preocupación de la que no lograba librarse. Si Sauron llegaba a fijarse en el Norte, el dragón Smaug sería un arma terrible en sus manos.
- id: road
  en: On the road near Bree, a dwarf caught up with him and greeted him. It was Thorin Oakenshield, exiled heir of the Lonely Mountain, and he too had been brooding over Erebor and the dragon.
  es: En el camino cerca de Bree, un enano lo alcanzó y lo saludó. Era Thorin Escudo de Roble, heredero en el exilio de la Montaña Solitaria, que también llevaba tiempo pensando en Erebor y en el dragón.
- id: inn
  en: They went together to the Prancing Pony and talked late into the night. Thorin longed to win back his home and avenge his family; Gandalf saw a chance to rid the North of Smaug.
  es: Fueron juntos al Poney Pisador y hablaron hasta muy entrada la noche. Thorin anhelaba recuperar su hogar y vengar a los suyos; Gandalf vio la ocasión de librar al Norte de Smaug.
- id: plan
  en: Thorin dreamed of marching with an army. Gandalf thought stealth would serve them better, and someone whose smell the dragon had never known. A hobbit, perhaps.
  es: Thorin soñaba con marchar al frente de un ejército. Gandalf pensaba que el sigilo les serviría mejor, y alguien cuyo olor el dragón no conociera. Un hobbit, quizá.
- id: burglar
  en: And he already had one in mind, a very respectable hobbit of the Shire named Bilbo Baggins, who had more in him than anyone suspected, perhaps even Bilbo himself.
  es: Y ya tenía uno en mente, un hobbit muy respetable de la Comarca llamado Bilbo Bolsón, que llevaba dentro más de lo que nadie sospechaba, quizá ni el propio Bilbo.
