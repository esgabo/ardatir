title:
  en: An Unexpected Party
  es: Una tertulia inesperada
summary:
  en: Gandalf marks Bilbo's door, and thirteen dwarves arrive for tea, then ask him to join their quest to the Lonely Mountain.
  es: Gandalf marca la puerta de Bilbo, trece enanos llegan a tomar el té y luego le piden que se una a su búsqueda hacia la Montaña Solitaria.
