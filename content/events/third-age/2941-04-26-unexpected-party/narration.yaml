- id: morning
  en: One quiet morning in the Shire, Bilbo Baggins was smoking his pipe at his door when a tall old man with a staff came walking up the lane.
  es: Una mañana tranquila en la Comarca, Bilbo Bolsón fumaba su pipa en la puerta cuando un anciano alto con un bastón subió por el camino.
- id: mark
  en: It was Gandalf. Bilbo politely refused any talk of adventures, but before leaving, the wizard scratched a secret sign on the green round door.
  es: Era Gandalf. Bilbo rechazó con cortesía cualquier charla sobre aventuras, pero antes de irse, el mago grabó una señal secreta en la puerta verde y redonda.
- id: dwarves
  en: The next evening the doorbell kept ringing. Dwarf after dwarf arrived, hungry and cheerful, until thirteen of them filled the hobbit-hole.
  es: La tarde siguiente, el timbre no dejó de sonar. Llegó enano tras enano, hambrientos y alegres, hasta que trece de ellos llenaron la madriguera.
- id: quest
  en: Last came Thorin, their leader. They had come for a burglar, someone to help them win back their mountain and its treasure from a dragon.
  es: El último fue Thorin, su líder. Buscaban un saqueador, alguien que los ayudara a recuperar su montaña y su tesoro de manos de un dragón.
