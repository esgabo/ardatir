stage: diorama
duration: 36
# Bag End (assets/kits/shire/bag-end.glb, scripts/models/blender/shire.py): the morning at the
# round door, then the next evening inside, seen through the cut-away Hill.
#
# The company arrives in the knots the book gives them — Dwalin, then Balin, then Fili and Kili,
# then Dori, Nori and Ori, then the other five together, and Thorin last with Gandalf — and each
# knot goes in and takes its place, so by the time the quest is put to Bilbo the hole is full.
# They are spread across all three rooms because Bag End cannot hold fifteen figures in one of
# them: the parlour takes six round the table and the fire, the hall four, the pantry four, and
# Bombur gets as far as the step. Every place is checked by the build (crowding, #81).
set: kits/shire/bag-end.glb
light:
  - { t: 0, preset: morning }
  - { t: 0.34, preset: morning }
  - { t: 0.44, preset: evening }
  - { t: 0.72, preset: dusk }
# The shot (#28): wide on the Hill for the morning, in to the door for Gandalf's mark, inside as
# the dwarves fill the rooms, and close on the parlour for the quest. Without this the whole tile
# is always in frame, which is why the scene used to be played out on the lawn.
camera:
  - { t: 0, x: -0.2, z: 1.0, width: 13 }
  - { t: 0.18, x: -0.6, z: 0.4, width: 7 }
  - { t: 0.3, x: -1.0, z: -0.2, width: 5 }
  - { t: 0.4, x: -1.1, z: -2.1, width: 6 }
  - { t: 0.56, x: -1.2, z: -3.4, width: 7.6 }
  # With the lid off, the quest shot can hold the whole hole: the parlour round the table, the
  # hall behind it and the pantry at the end. It was tight on the parlour only because that was
  # all there was to see.
  - { t: 0.74, x: -1.2, z: -3.3, width: 6.4 }
  - { t: 1, x: -1.2, z: -3.3, width: 6.2 }

# The Hill's turf lifts away as the camera goes in after Bilbo, so the rooms can be seen from
# above. It stays on for the opening wide shot — the green Hill with its round door is the
# picture everyone comes for — and comes off between the mark on the door and the first knock.
reveal:
  - { t: 0.26, cover: hill, amount: 0 }
  - { t: 0.42, cover: hill, amount: 1 }
  # The vaults go a moment behind the turf, so the hole opens from the top down rather than all
  # at once: first the Hill, then the ceilings under it.
  - { t: 0.30, cover: vaults, amount: 0 }
  - { t: 0.48, cover: vaults, amount: 1 }
# What the scene does, at the beat it does it (DESIGN §9.5). The ambience of Bag End — the fire,
# the room, the birds in the garden — comes from the place and the hour and is not written here.
sound:
  # Gandalf scratches his mark on the green door and goes; the door shuts behind him.
  - { t: 0.315, cue: door }
  # "The doorbell kept ringing": each knot of dwarves at the bell-pull, in the order the book
  # brings them, with the door opened to each — Dwalin, Balin, Fili and Kili, the three who mind
  # the doilies, then the other five together.
  - { t: 0.4, cue: chime }
  - { t: 0.412, cue: door, gain: 0.8 }
  - { t: 0.44, cue: chime }
  - { t: 0.452, cue: door, gain: 0.8 }
  - { t: 0.478, cue: chime }
  - { t: 0.492, cue: door, gain: 0.8 }
  - { t: 0.516, cue: chime }
  - { t: 0.53, cue: door, gain: 0.8 }
  - { t: 0.552, cue: chime }
  - { t: 0.566, cue: door, gain: 0.8 }
  # Thorin comes last, and knocks: by now the door has hardly been shut.
  - { t: 0.6, cue: knock }
  - { t: 0.617, cue: door, gain: 0.8 }
  # The pantry emptied onto the table, and the beer with it.
  - { t: 0.63, cue: clatter }
  - { t: 0.662, cue: pour }
  - { t: 0.695, cue: clatter, gain: 0.8 }
narration:
  morning: 0
  mark: 0.26
  dwarves: 0.44
  quest: 0.72
