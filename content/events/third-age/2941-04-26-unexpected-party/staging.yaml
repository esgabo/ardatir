      - { t: 0.13, x: -1.1, z: -0.3, action: talk, thought: { en: "An adventure? Not for a Baggins, thank you.", es: "¿Una aventura? No para un Bolsón, gracias." } }
      - { t: 0.225, x: -1.1, z: -0.3, action: walk }
