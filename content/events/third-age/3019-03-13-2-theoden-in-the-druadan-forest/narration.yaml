- id: camp
  en: The Rohirrim had ridden for days, and now they camped in a dark forest of pines not far from Minas Tirith. The road ahead, they learned, was held by enemies.
  es: Los Rohirrim llevaban días cabalgando, y ahora acampaban en un oscuro bosque de pinos no lejos de Minas Tirith. El camino de delante, supieron, estaba en manos del enemigo.
- id: drums
  en: All night Merry heard drums in the woods. They belonged to the Wild Men, an old people who lived hidden in the forest and kept away from strangers.
  es: Toda la noche Merry oyó tambores en el bosque. Eran de los Hombres Salvajes, un pueblo antiguo que vivía escondido en el bosque y se mantenía lejos de los extraños.
- id: ghan
  en: "Their chieftain came to the king: a short, stout man with a knotted face, wearing little but grass. His name was Ghân-buri-Ghân, and he spoke in a strange, simple way."
  es: "Su jefe se presentó ante el rey: un hombre bajo y fornido, de rostro nudoso, que apenas llevaba más que hierba. Se llamaba Ghân-buri-Ghân, y hablaba de una manera extraña y sencilla."
- id: offer
  en: He offered to lead the Riders by a forgotten road through the hills, where no enemy was watching, so that they could reach the fields of Gondor unseen.
  es: Se ofreció a guiar a los Jinetes por un camino olvidado entre las colinas, donde ningún enemigo vigilaba, para que pudieran llegar sin ser vistos a los campos de Gondor.
- id: price
  en: "In return he asked only one thing: that the Riders leave his people in peace and stop hunting them like beasts. Théoden gave his word."
  es: "A cambio, solo pidió una cosa: que los Jinetes dejaran en paz a su pueblo y no los cazaran más como a bestias. Théoden le dio su palabra."
- id: wind
  en: Before leaving, Ghân-buri-Ghân sniffed the air and said something was changing. A new wind was coming.
  es: Antes de irse, Ghân-buri-Ghân olfateó el aire y dijo que algo estaba cambiando. Se acercaba un viento nuevo.
