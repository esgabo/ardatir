- id: return
  en: "Seventeen years after the party, on a spring evening, Gandalf knocked at the door of Bag End. He had been away for nine years, hunting for the truth about Bilbo's ring."
  es: "Diecisiete años después de la fiesta, una tarde de primavera, Gandalf llamó a la puerta de Bolsón Cerrado. Llevaba nueve años fuera, buscando la verdad sobre el anillo de Bilbo."
- id: fire
  en: "He asked for the ring and dropped it into the fire. When Frodo took it out with the tongs it was not even warm, and thin lines of fiery writing shone on it, in the tongue of Mordor."
  es: "Le pidió el anillo y lo arrojó al fuego. Cuando Frodo lo sacó con las tenazas, ni siquiera estaba caliente, y en él brillaban finas líneas de escritura de fuego, en la lengua de Mordor."
- id: one
  en: "This was the One Ring, Gandalf said, made long ago by Sauron, the Dark Lord, to rule all the other rings of power. He had lost it, and now he was searching for it with all his will."
  es: "Aquel era el Anillo Único, dijo Gandalf, forjado hace mucho por Sauron, el Señor Oscuro, para dominar todos los demás anillos de poder. Lo había perdido, y ahora lo buscaba con toda su voluntad."
- id: gollum
  en: "Gandalf told how Gollum had found it and kept it for centuries, and how, caught and tortured in Mordor, he had given the Enemy two words: Shire, and Baggins."
  es: "Gandalf contó cómo Gollum lo había encontrado y guardado durante siglos, y cómo, capturado y torturado en Mordor, había entregado al Enemigo dos palabras: Comarca y Bolsón."
- id: burden
  en: "Frodo wished it had never come to him. Gandalf was gentle: no one asks for such burdens, he said, but what matters is what we do with them."
  es: "Frodo deseó que nunca hubiera llegado a sus manos. Gandalf le habló con dulzura: nadie pide cargas así, dijo, pero lo que importa es qué hacemos con ellas."
- id: sam
  en: "Frodo decided to leave the Shire and draw the danger away from it. Just then Gandalf hauled Sam in through the window, where he had been listening, and gave him a task: to go with his master."
  es: "Frodo decidió dejar la Comarca para alejar de ella el peligro. En ese momento Gandalf metió a Sam por la ventana, bajo la que había estado escuchando, y le dio una tarea: acompañar a su señor."
