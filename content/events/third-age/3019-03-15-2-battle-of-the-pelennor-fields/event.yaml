summary:
  en: The Rohirrim arrive at dawn to break the siege of Minas Tirith. Théoden falls, Éowyn and Merry destroy the Witch-king, and the black ships on the river bring not enemies but Aragorn.
  es: Los Rohirrim llegan al alba para romper el asedio de Minas Tirith. Théoden cae, Éowyn y Merry destruyen al Rey Brujo, y las naves negras del río no traen enemigos, sino a Aragorn.
