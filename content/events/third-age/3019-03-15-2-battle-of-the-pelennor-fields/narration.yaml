- id: charge
  en: At dawn, as the wind changed and light broke in the east, King Théoden led the Riders of Rohan down onto the fields. Horns rang, and the enemy broke before them.
  es: Al alba, mientras el viento cambiaba y la luz rompía por el este, el rey Théoden condujo a los Jinetes de Rohan hacia los campos. Resonaron los cuernos, y el enemigo se deshizo ante ellos.
- id: fall
  en: "Then a great shadow fell from the sky: the Witch-king, on a winged beast. Théoden's horse, Snowmane, struck by a dart, reared and fell, and crushed the king beneath him."
  es: "Entonces una gran sombra cayó del cielo: el Rey Brujo, a lomos de una bestia alada. Crinblanca, el caballo de Théoden, alcanzado por un dardo, se encabritó y cayó, aplastando al rey bajo su peso."
- id: eowyn
  en: "Only the young rider Dernhelm stood firm. The Witch-king scorned the rider: no man could stop him, he said. But beneath the helm there was no man. Dernhelm was Éowyn, and she laughed at him."
  es: "Solo el joven jinete Dernhelm se mantuvo firme. El Rey Brujo se burló: ningún hombre podía detenerlo, dijo. Pero bajo el yelmo no había ningún hombre. Dernhelm era Éowyn, y se rio de él."
- id: merry
  en: Éowyn slew the beast, and the Witch-king's mace shattered her shield and her arm. But Merry crept behind him and stabbed him with his blade from the Barrow-downs, forged long ago against this very enemy.
  es: Éowyn mató a la bestia, y la maza del Rey Brujo le destrozó el escudo y el brazo. Pero Merry se deslizó tras él y lo apuñaló con su hoja de las Quebradas de los Túmulos, forjada mucho tiempo atrás contra aquel mismo enemigo.
- id: destroyed
  en: The Witch-king stumbled, and Éowyn drove her sword between his crown and his mantle. With a long wail he vanished, leaving only empty armour on the ground.
  es: El Rey Brujo se tambaleó, y Éowyn le hundió la espada entre la corona y el manto. Con un largo alarido desapareció, y en el suelo quedó solo una armadura vacía.
- id: theoden
  en: Théoden lived long enough to say farewell to Merry and to name Éomer king after him. Then he died, and Éomer, finding his sister lying as if dead, rode into battle in wild grief.
  es: Théoden vivió lo suficiente para despedirse de Merry y nombrar rey a Éomer en su lugar. Entonces murió, y Éomer, al encontrar a su hermana tendida como muerta, se lanzó a la batalla con una pena salvaje.
- id: ships
  en: Black ships came sailing up the river, and the defenders despaired. But on the first ship a banner broke out, with a white tree, seven stars and a crown. It was Aragorn, with Legolas and Gimli, and by sunset the field was won.
  es: Unas naves negras remontaban el río, y los defensores se desesperaron. Pero en la primera nave se desplegó un estandarte con un árbol blanco, siete estrellas y una corona. Era Aragorn, con Legolas y Gimli, y al ponerse el sol la batalla estaba ganada.
