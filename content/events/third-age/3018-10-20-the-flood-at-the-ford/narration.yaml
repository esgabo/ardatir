- id: chase
  en: "Near the Ford of Bruinen the Nine burst from the trees. Glorfindel cried out to his horse, and the white horse flew down the road with Frodo on its back."
  es: "Cerca del Vado del Bruinen, los Nueve salieron de entre los árboles. Glorfindel gritó a su caballo, y el caballo blanco voló camino abajo con Frodo a lomos."
- id: cross
  en: "Frodo splashed across the river and turned on the far bank. The Riders halted at the water's edge, and called to him to come back."
  es: "Frodo cruzó el río chapoteando y se volvió en la otra orilla. Los Jinetes se detuvieron al borde del agua, y le ordenaron que volviera."
- id: defy
  en: "Half-fainting, Frodo drew his sword and told them to go back to Mordor. Their leader only laughed, and they rode into the river."
  es: "Medio desmayado, Frodo desenvainó la espada y les dijo que volvieran a Mordor. Su jefe solo se rio, y entraron en el río."
- id: flood
  en: "Then the river rose with a roar. Elrond had called up the flood, and Gandalf had added waves like great white horses, plumed with foam."
  es: "Entonces el río creció con un rugido. Elrond había alzado la crecida, y Gandalf le había añadido olas como grandes caballos blancos con crines de espuma."
- id: swept
  en: "The Riders were swept away, and those still on the bank were driven into the water by Glorfindel and Strider with burning brands. Frodo fell, and knew no more."
  es: "Los Jinetes fueron arrastrados, y a los que seguían en la orilla Glorfindel y Trancos los empujaron al agua con teas encendidas. Frodo cayó, y ya no supo nada más."
