id: lindorie
name: { en: "Lindórië", es: "Lindórië" }
kind: man
summary:
  en: "Inzilbêth's mother, of the kindred of the Lords of Andúnië and sister of the Lord Eärendur; through her the Faithful came into the royal house."
  es: "Madre de Inzilbêth, del linaje de los Señores de Andúnië y hermana del Señor Eärendur; por ella entraron los Fieles en la casa real."
pronounce: { en: lin-DOR-ee-eh, es: lin-DÓ-ri-e }
