id: celebrimbor
name: { en: "Celebrimbor", es: "Celebrimbor" }
kind: elf
summary:
  en: "Grandson of Fëanor and master smith of Eregion, maker of the Three Rings."
  es: "Nieto de Fëanor y maestro herrero de Eregion, forjador de los Tres Anillos."
color: "#5a7a9a"
scale: 1.85
pronounce: { en: keh-leh-BRIM-bor, es: ke-le-BRIM-bor }   # how to say it: syllables, the stressed one in capitals
# The published Silmarillion makes him Curufin's son, and that is the version we tell; a late
# note (1968) instead made him a Telerin craftsman of Aman with no descent from Fëanor at all.
parents: [ curufin ]
