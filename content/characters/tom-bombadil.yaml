id: tom-bombadil
name: { en: "Tom Bombadil", es: "Tom Bombadil" }
kind: other
summary:
  en: "The merry, ancient master of the woods and waters between the Old Forest and the Barrow-downs, who calls himself Eldest: he was there before the river and the trees. The Elves name him Iarwain Ben-adar, oldest and fatherless; the Dwarves call him Forn, and the Men of the North Orald. The Ring has no hold on him, and he has no wish for it."
  es: "El alegre y antiquísimo señor de los bosques y las aguas entre el Bosque Viejo y las Quebradas de los Túmulos, que se llama a sí mismo el Más Viejo: estaba allí antes que el río y los árboles. Los Elfos lo llaman Iarwain Ben-adar, el más antiguo y sin padre; los Enanos, Forn, y los Hombres del Norte, Orald. El Anillo no tiene poder sobre él, ni él lo desea."
color: "#c0a030"
scale: 1.2
kin:
  - { id: goldberry, as: wife }
