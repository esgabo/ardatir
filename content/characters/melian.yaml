id: melian
name: { en: "Melian", es: "Melian" }
kind: ainu
summary:
  en: "A Maia of Valinor who wed Thingol and wove the Girdle that guards Doriath."
  es: "Una maia de Valinor que se casó con Thingol y tejió la Cintura que protege Doriath."
color: "#c8c0a8"
scale: 2
pronounce: { en: MEL-ee-an, es: ME-li-an }   # how to say it: syllables, the stressed one in capitals
fate:
  en: "She did not die: when Thingol was slain she left her body and returned to Valinor, and her Girdle fell with her."
  es: "No murió: cuando Thingol fue muerto abandonó su cuerpo y regresó a Valinor, y su Cintura cayó con ella."
