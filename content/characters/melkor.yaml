id: melkor
name: { en: Melkor, es: Melkor }
kind: ainu
summary:
  en: The mightiest of the Ainur, who sought to bend the Music and the world to his own will. Later called Morgoth.
  es: El más poderoso de los Ainur, que quiso doblegar la Música y el mundo a su propia voluntad. Más tarde llamado Morgoth.
