id: iluvatar
name: { en: Ilúvatar, es: Ilúvatar }
kind: the-one
summary:
  en: Eru, the One, from whose thought the Ainur came and whose word gave the world being.
  es: Eru, el Único, de cuyo pensamiento nacieron los Ainur y cuya palabra dio existencia al mundo.
pronounce: { en: ee-LOO-va-tar, es: i-LÚ-va-tar }   # how to say it: syllables, the stressed one in capitals
