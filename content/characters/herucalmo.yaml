id: herucalmo
name: { en: "Herucalmo", es: "Herucalmo" }
kind: man
summary:
  en: "Tar-Vanimeldë's husband, who seized the sceptre at her death and held it until he died, taking the name Tar-Anducal; the rolls of the kings do not count him."
  es: "Esposo de Tar-Vanimeldë, que se apoderó del cetro a su muerte y lo retuvo hasta morir, tomando el nombre de Tar-Anducal; las listas de los reyes no lo cuentan."
