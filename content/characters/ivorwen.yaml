id: ivorwen
name: { en: "Ivorwen", es: "Ivorwen" }
kind: man
summary:
  en: "Gilraen's mother, who had foresight, and urged the marriage because she saw that the Dúnedain had little time left to make an heir."
  es: "La madre de Gilraen, que tenía el don de la previsión, e instó al matrimonio porque vio que a los Dúnedain les quedaba poco tiempo para engendrar un heredero."
pronounce: { en: EE-vor-wen, es: i-VOR-uen }
