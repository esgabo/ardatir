id: the-elder
brief:
  en: A deep, slow, warm, kind elder who was there before anything began. Tells events as history, with weight, never as a children's story.
  es: Un anciano de voz grave, lenta, cálida y amable, que estuvo allí antes de que nada comenzara. Cuenta los hechos como historia, con peso, nunca como un cuento infantil.
