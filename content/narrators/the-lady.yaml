    refText: Junto a la salida, Gollum estaba agazapado en el pasadizo. Bilbo podría haber usado su espada, pero sintió lástima de aquella criatura desdichada y solitaria, y no fue capaz. Saltó por encima de Gollum y escapó, mientras un grito de odio resonaba a sus espaldas.
    version: 1
