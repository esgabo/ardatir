# The Third Age narrator: audition candidate B (en) and M (es), chosen 2026-11-12 and 2026-11-13. See README.md here.
id: the-lady
brief:
  en: A calm, middle-aged woman who seems far older than she looks, gentle, clear and unhurried, with quiet authority and warmth. Tells the Third Age as history she watched unfold, with grace and gravity, never as a children's story.
  es: Una mujer serena de mediana edad que parece mucho más antigua de lo que aparenta, amable, clara y sin prisa, con autoridad tranquila y calidez. Cuenta la Tercera Edad como una historia que vio suceder, con gracia y gravedad, nunca como un cuento infantil.
voices:
  en:
    engine: omnivoice
    engineVersion: 0.5.6
    instruct: "female, middle-aged, moderate pitch, british accent"
    seed: 101
    speed: 0.9
    reference: the-lady.en.flac
    referenceHash: sha256:47958f6082d452153dddd2ddc0c231413a6afbaece1ad46b32b2e7e48260ecf4
    refText: At the way out, Gollum crouched in the passage. Bilbo could have used his sword, but he felt sorry for the wretched, lonely creature and could not do it. He leapt over Gollum and escaped, with a wail of hatred echoing behind him.
    version: 1
